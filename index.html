<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Range / Desk — local</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

:root{
  --bg:#081913; --sidebar:#071712; --card:#0c2119; --panel:#0d241b; --panel2:#10271f;
  --border:#1d3b31; --border2:#244538; --border3:#25483a; --border4:#27513f; --border5:#234536; --border6:#214235;
  --gold:#d5a850; --gold2:#e4b65e; --gold3:#e5bd67; --gold4:#f0c46f; --gold5:#eecb79; --gold6:#e6ba63; --gold7:#e8bc62;
  --cream:#f3e9ce; --cream2:#f5e9c9; --cream3:#f4e8ca; --cream4:#eee1c2; --cream5:#d2dfce; --cream6:#e0e5d5;
  --muted:#8ea699; --muted2:#8da89a; --muted3:#718e7f; --muted4:#829d8d; --muted5:#90a99b; --muted6:#668475; --muted7:#5e7e6e; --muted8:#759386; --muted9:#799687; --muted10:#91a99c; --muted11:#a8b9a5;
  --red:#d87561; --red2:#e69b8e; --green:#7fae8d;
  --shadow:0 18px 45px rgba(1,12,9,.24);
  --font-sans:'DM Sans', sans-serif; --font-mono:'Space Mono', monospace;
}
*{box-sizing:border-box;}
html{background:var(--bg);}
body{
  margin:0;min-width:320px;
  background:
    radial-gradient(circle at 78% -10%, rgba(199,156,72,.10), transparent 26rem),
    radial-gradient(circle at 15% 92%, rgba(42,122,91,.10), transparent 30rem),
    var(--bg);
  color:var(--cream); font-family:var(--font-sans); -webkit-font-smoothing:antialiased;
}
button,a,input,select{font:inherit;}
button{cursor:pointer;background:none;border:none;color:inherit;}
.mono{font-family:var(--font-mono);letter-spacing:-.03em;}
@keyframes rise-in{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.animate-rise{animation:rise-in .42s ease both;}
.felt-grid{background-image:linear-gradient(rgba(210,176,94,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(210,176,94,.045) 1px, transparent 1px); background-size:22px 22px;}
.noise::after{content:'';position:fixed;inset:0;pointer-events:none;opacity:.025;z-index:50;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.65'/%3E%3C/svg%3E");}

/* layout */
.sidebar{position:fixed;inset:0 auto 0 0;z-index:40;width:258px;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--sidebar);padding:20px 16px;transition:transform .3s;transform:translateX(-100%);}
.sidebar.open{transform:translateX(0);}
@media(min-width:1024px){.sidebar{transform:translateX(0);}}
.icon-mark{display:flex;height:40px;width:40px;align-items:center;justify-content:center;border-radius:12px;border:1px solid rgba(201,155,72,.4);background:rgba(201,155,72,.1);color:var(--gold2);}
.brand-row{display:flex;align-items:center;gap:12px;padding:0 8px;}
.brand-title{font-weight:600;letter-spacing:-.03em;color:var(--cream2);margin:0;}
.brand-sub{margin:2px 0 0;font-size:9px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted4);}
.nav-section{margin-top:44px;padding:0 8px;}
.nav-label{margin-bottom:12px;font-size:10px;text-transform:uppercase;letter-spacing:.2em;color:var(--muted7);}
.nav-link{display:flex;align-items:center;gap:12px;border-radius:8px;padding:12px;font-size:14px;color:var(--muted10);text-decoration:none;margin-bottom:4px;}
.nav-link:hover{background:var(--panel2);color:var(--cream2);}
.nav-link.active{background:rgba(201,155,72,.12);color:var(--gold4);}
.nav-link .dot{margin-left:auto;height:6px;width:6px;border-radius:50%;background:#d9aa56;}
.sidebar-footer{margin-top:auto;border-radius:12px;border:1px solid var(--border);background:var(--card);padding:16px;}
.sidebar-footer-title{display:flex;align-items:center;gap:8px;color:var(--gold);margin-bottom:10px;font-size:10px;text-transform:uppercase;letter-spacing:.16em;}
.sidebar-footer p{font-size:12px;line-height:1.5;color:var(--muted2);margin:0;}
.sidebar-version{padding:20px 8px 0;font-size:9px;text-transform:uppercase;letter-spacing:.18em;color:#46675a;}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(2,11,7,.7);}
@media(min-width:1024px){.overlay{display:none;}}

.topbar{position:sticky;top:0;z-index:20;display:flex;height:72px;align-items:center;justify-content:space-between;border-bottom:1px solid #1b372c;background:rgba(8,25,19,.9);backdrop-filter:blur(8px);padding:0 16px;}
@media(min-width:1024px){.topbar{margin-left:258px;padding:0 40px;}}
.menu-btn{padding:8px;border-radius:8px;color:var(--muted10);}
@media(min-width:1024px){.menu-btn{display:none;}}
.topbar-eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#678476;margin:0;}
.topbar-title{margin:2px 0 0;font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--cream3);}
.topbar-actions{display:flex;align-items:center;gap:8px;}
.tb-btn{display:flex;align-items:center;gap:8px;border-radius:8px;border:1px solid var(--border3);padding:8px 12px;font-size:12px;color:var(--muted2);}
.tb-btn:hover{border-color:rgba(201,155,72,.6);color:var(--gold4);}
@media(max-width:480px){.hide-sm{display:none;}}
.postflop-grid{display:grid;gap:24px;grid-template-columns:1fr;}
@media(min-width:1024px){.postflop-grid{grid-template-columns:1fr 1.1fr;align-items:start;}}

main{min-height:calc(100dvh - 72px);}
@media(min-width:1024px){main{margin-left:258px;}}
.page{max-width:1280px;margin:0 auto;padding:24px 16px 40px;}
@media(min-width:640px){.page{padding:36px 28px;}}
@media(min-width:1024px){.page{padding:36px 40px;}}
.page-header{margin-bottom:32px;display:flex;flex-direction:column;justify-content:space-between;gap:20px;}
@media(min-width:640px){.page-header{flex-direction:row;align-items:flex-end;}}
.eyebrow{margin:0 0 8px;font-size:10px;text-transform:uppercase;letter-spacing:.25em;color:var(--gold);}
.page-h2{margin:0;font-size:34px;font-weight:600;line-height:1.05;letter-spacing:-.07em;color:var(--cream);}
@media(min-width:640px){.page-h2{font-size:44px;}}
.page-h2 .accent{color:var(--gold);}
.page-lede{margin-top:16px;max-width:32rem;font-size:14px;line-height:1.6;color:var(--muted);}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
.seg{display:flex;align-items:center;gap:4px;border-radius:8px;border:1px solid var(--border2);background:var(--panel2);padding:4px;}
.seg button{border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted4);}
.seg button.active{background:var(--gold);color:#132118;}
.diff-select{display:flex;align-items:center;gap:8px;border-radius:8px;border:1px solid var(--border2);background:var(--panel2);padding:8px 12px;font-size:12px;color:#9bb09f;}
.diff-select select{background:transparent;border:none;color:#d8dfcf;outline:none;font-size:12px;}
.link-pill{display:flex;align-items:center;gap:8px;border-radius:8px;border:1px solid var(--border2);padding:8px 12px;font-size:12px;color:var(--muted2);text-decoration:none;width:fit-content;}
.link-pill:hover{border-color:rgba(213,168,80,.6);color:var(--gold4);}

.stats-grid{margin-bottom:28px;display:grid;gap:12px;grid-template-columns:1fr;}
@media(min-width:640px){.stats-grid{grid-template-columns:repeat(2,1fr);}}
@media(min-width:1024px){.stats-grid{grid-template-columns:repeat(4,1fr);}}
.stats-grid.trainer{grid-template-columns:repeat(3,1fr);}
.stat-card{border-radius:12px;border:1px solid var(--border);background:var(--card);padding:16px;}
.stat-top{margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted6);}
.stat-value{font-size:20px;color:var(--gold5);margin:0;}
.stat-value .cap{font-size:12px;color:#718e7f;}
.stat-caption{margin-top:4px;font-size:11px;color:#718e7f;}

.progress-row{margin-bottom:28px;display:flex;align-items:center;gap:12px;}
.progress-track{height:4px;flex:1;overflow:hidden;border-radius:99px;background:#173126;}
.progress-fill{height:100%;border-radius:99px;background:var(--gold);transition:width .5s;}
.progress-note{font-size:10px;color:#708d7e;white-space:nowrap;}

.grid-main{display:grid;gap:24px;}
@media(min-width:1280px){.grid-main{grid-template-columns:minmax(0,1fr) 320px;}}
.felt-card{border-radius:16px;border:1px solid var(--border4);background:var(--panel);padding:16px;box-shadow:var(--shadow);}
@media(min-width:640px){.felt-card{padding:28px;}}
.felt-head{margin-bottom:28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border5);padding-bottom:16px;}
.felt-head-left{display:flex;align-items:center;gap:8px;}
.phase-dot{height:8px;width:8px;border-radius:50%;}
.felt-head .cat{font-size:10px;color:#5d796c;}

.pill-gold{display:inline-flex;border:1px solid rgba(201,155,72,.3);background:rgba(201,155,72,.1);border-radius:4px;padding:4px 8px;font-size:10px;font-weight:700;letter-spacing:.15em;color:var(--gold6);}
.pill-outline{display:inline-flex;border:1px solid var(--border4);background:var(--panel2);border-radius:4px;padding:4px 8px;font-size:10px;letter-spacing:.12em;color:#91aa9c;}

.hole-row{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0 20px;}
.cards-row{display:flex;align-items:center;gap:8px;}
.card{display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid rgba(215,189,131,.5);background:#f3ecd9;font-weight:600;letter-spacing:-.08em;box-shadow:3px 4px 0 rgba(197,153,69,.28);}
.card.large{height:76px;width:56px;font-size:22px;}
@media(min-width:640px){.card.large{height:92px;width:68px;font-size:28px;}}
.card.small{height:44px;width:36px;font-size:14px;}
.card.back-card{background:repeating-linear-gradient(135deg,#173026,#173026 6px,#0f2119 6px,#0f2119 12px);border:1px solid #2a4e3e;color:#4c6a5a;box-shadow:none;font-weight:700;}

.action-grid{margin-top:32px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
@media(min-width:640px){.action-grid{grid-template-columns:repeat(3,1fr);}}
.act-btn{border-radius:12px;border:1px solid;padding:16px 12px;font-size:14px;font-weight:700;letter-spacing:.06em;text-align:left;transition:transform .15s;}
.act-btn:hover{transform:translateY(-3px);}
.act-btn:disabled{opacity:.7;cursor:default;transform:none;}
.act-btn .big{display:block;font-size:17px;letter-spacing:-.04em;}
.act-btn .small{display:block;margin-top:4px;font-size:10px;font-weight:400;opacity:.7;}
.act-btn.primary{border-color:rgba(213,168,80,.6);background:var(--gold);color:#162218;}
.act-btn.call{border-color:rgba(127,174,141,.5);background:#193b2b;color:#d6e7d5;}
.act-btn.plain{border-color:#476756;background:#112a20;color:#d6e1d4;}
.act-btn.plain:hover{border-color:rgba(216,117,97,.7);}

.feedback{border-radius:16px;border:1px solid;padding:16px;}
@media(min-width:640px){.feedback{padding:24px;}}
.feedback.ok{border-color:rgba(201,155,72,.45);background:#13291e;}
.feedback.bad{border-color:rgba(216,117,97,.45);background:#2a1a17;}
.feedback.mix{border-color:rgba(224,149,74,.5);background:#2a2114;}
.fb-head{display:flex;align-items:flex-start;gap:12px;}
.fb-icon{margin-top:2px;flex-shrink:0;display:flex;height:32px;width:32px;align-items:center;justify-content:center;border-radius:50%;font-weight:700;}
.fb-icon.ok{background:var(--gold);color:#182419;}
.fb-icon.bad{background:var(--red);color:#2a1714;}
.fb-icon.mix{background:#e0954a;color:#271807;}
.fb-title{margin:0;font-size:16px;font-weight:600;color:var(--cream3);}
.fb-text{margin:4px 0 0;font-size:14px;line-height:1.4;color:var(--muted11);}
.fb-tag{border-radius:4px;padding:4px 8px;font-size:10px;font-weight:700;white-space:nowrap;}
.fb-tag.ok{background:rgba(213,168,80,.15);color:var(--gold3);}
.fb-tag.bad{background:rgba(216,117,97,.15);color:var(--red2);}
.fb-tag.mix{background:rgba(224,149,74,.18);color:#f0ad6b;}
.fb-body{margin:20px 0;display:grid;gap:16px;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08);padding:16px 0;}
@media(min-width:640px){.fb-body{grid-template-columns:1fr 1.25fr;}}
.fb-solution .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted8);}
.fb-solution .val{margin:8px 0 0;font-size:24px;font-weight:600;letter-spacing:-.05em;color:#f3dfaa;}
.fb-solution .val .u{font-size:14px;font-weight:400;color:#8aa394;}
.fb-solution .caption{margin:4px 0 0;font-size:12px;color:#8ca396;}
.fb-actions{display:flex;flex-direction:column;gap:8px;justify-content:flex-end;}
@media(min-width:640px){.fb-actions{flex-direction:row;}}
.fb-details{margin-top:20px;border-top:1px solid rgba(255,255,255,.08);padding-top:16px;}
.spot-context{font-size:16px;line-height:1.5;color:var(--cream3);margin:0;}
.spot-context b{color:var(--gold4);font-weight:700;}
.action-feed{margin-top:14px;display:flex;flex-direction:column;gap:4px;max-width:340px;margin-left:auto;margin-right:auto;}
.action-feed-empty{font-size:12px;color:#718e7f;text-align:center;margin:0;}
.action-feed-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:6px;padding:6px 12px;font-family:var(--font-mono);font-size:12px;background:#0c2119;border:1px solid #1d3b31;}
.action-feed-row .pos{color:#8ea699;font-weight:700;}
.action-feed-row .verb{color:#8ea699;}
.action-feed-row.fold{opacity:.55;}
.action-feed-row.fold .verb{color:#6b8577;}
.action-feed-row.raise{border-color:rgba(224,149,74,.5);background:#241c12;}
.action-feed-row.raise .pos,.action-feed-row.raise .verb{color:#f0c98a;}
.action-feed-row.hero{border-color:rgba(213,168,80,.6);background:#1d2a1c;}
.action-feed-row.hero .pos,.action-feed-row.hero .verb{color:var(--gold4);}
.action-feed-row.now{border-color:rgba(213,168,80,.9);background:rgba(213,168,80,.14);}
.action-feed-row.now .pos,.action-feed-row.now .verb{color:var(--gold5);font-weight:700;}
.btn-gold{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;background:var(--gold);padding:10px 16px;font-size:14px;font-weight:600;color:#142117;}
.btn-outline{border-radius:8px;border:1px solid #3a5d4b;padding:10px 16px;font-size:14px;font-weight:600;color:#d3dfd0;}
.btn-outline:hover{background:#1b382b;}

.matrix-wrap .m-head{margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.m-title{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted8);}
.m-legend{display:flex;gap:12px;font-size:10px;color:#839b8e;}
.m-legend i{margin-right:4px;display:inline-block;height:8px;width:8px;border-radius:2px;}
.matrix{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px;border-radius:6px;border:1px solid #25483a;background:#081913;padding:6px;}
.matrix .cell{display:flex;aspect-ratio:1;align-items:center;justify-content:center;border-radius:2px;font-family:var(--font-mono);font-size:7px;}
@media(min-width:640px){.matrix .cell{font-size:8px;}}
.matrix .cell.current{box-shadow:0 0 0 2px #f5e6bd;}
.matrix-foot{margin-top:8px;display:flex;justify-content:space-between;font-size:9px;color:#5e7b6d;}

.odds-panel{border-radius:12px;border:1px solid #315846;background:rgba(16,39,31,.8);padding:20px;}
.odds-panel.compact{padding:16px;}
.odds-head{margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
.odds-head-l{display:flex;align-items:center;gap:8px;color:#e5bd67;}
.odds-head-l p{font-size:10px;text-transform:uppercase;letter-spacing:.17em;margin:0;}
.odds-head-r{font-size:9px;color:#6d8b7d;}
.odds-empty{font-size:12px;line-height:1.4;color:#829d8d;}
.odds-stat{border-radius:8px;border:1px solid #244538;background:#0c2119;padding:12px;margin-bottom:12px;}
.odds-stat:last-child{margin-bottom:0;}
.odds-stat-top{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.odds-stat-top .name{font-size:14px;font-weight:600;color:#e8ddbd;margin:0;}
.odds-stat-top .outs{font-family:var(--font-mono);font-size:12px;color:#e4b65e;}
.odds-stat-grid{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.odds-stat-grid .l{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#6e8b7d;margin:0;}
.odds-stat-grid .v{font-family:var(--font-mono);margin:4px 0 0;font-size:16px;color:#d9aa56;}
.odds-stat .detail{margin:8px 0 0;font-size:11px;line-height:1.4;color:#799687;}
.odds-footnote{margin-top:16px;border-top:1px solid #214235;padding-top:12px;font-size:11px;line-height:1.4;color:#6f8d7e;}

.aside-card{border-radius:16px;border:1px solid var(--border);background:var(--card);padding:20px;}
.aside-card + .aside-card{margin-top:16px;}
.aside-title{display:flex;align-items:center;gap:8px;color:#e5bd67;margin-bottom:16px;}
.aside-title p{font-size:10px;text-transform:uppercase;letter-spacing:.18em;margin:0;}
.aside-text{font-size:14px;line-height:1.55;color:#a5b8a5;margin:0;}
.aside-hr{margin-top:16px;border-top:1px solid #214235;padding-top:16px;}
.aside-hr p{font-size:12px;line-height:1.4;color:#718e7f;margin:0;}
.history-empty{font-size:12px;line-height:1.4;color:#718e7f;}
.history-item{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1a382c;padding-bottom:8px;font-size:12px;margin-bottom:8px;}
.history-item:last-child{border:none;padding-bottom:0;margin-bottom:0;}
.history-item .h{color:#d2dfce;}
.history-item .h i{font-style:normal;color:#779688;}
.history-item .res.ok{color:#d6b05f;}
.history-item .res.mix{color:#e0954a;}
.history-item .res.bad{color:#d87561;}
.tier-breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.tier-cell{border-radius:10px;border:1px solid #244538;background:#0c2119;padding:14px;text-align:center;}
.tier-cell .n{font-family:var(--font-mono);font-size:22px;margin:0;}
.tier-cell .l{margin:4px 0 0;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#829d8d;}
.tier-cell.ok .n{color:var(--gold4);}
.tier-cell.mix .n{color:#e0954a;}
.tier-cell.bad .n{color:#e6a093;}
.tier-note{margin:12px 0 0;font-size:11px;line-height:1.5;color:#718e7f;}

.empty-state{margin-top:24px;border-radius:16px;border:1px dashed #315643;background:var(--card);padding:64px 24px;text-align:center;}
.empty-state .circ{margin:0 auto;display:flex;height:48px;width:48px;align-items:center;justify-content:center;border-radius:50%;border:1px solid rgba(201,155,72,.3);background:rgba(201,155,72,.1);color:var(--gold);}
.empty-state h3{margin-top:20px;font-size:18px;font-weight:600;color:var(--cream4);}
.empty-state p{margin:8px auto 0;max-width:24rem;font-size:14px;line-height:1.5;color:#829d8d;}

.stats-cols{margin-top:24px;display:grid;gap:24px;}
@media(min-width:1024px){.stats-cols{grid-template-columns:1.05fr .95fr;}}
.section-card{border-radius:16px;border:1px solid var(--border);background:var(--card);padding:20px;}
@media(min-width:640px){.section-card{padding:24px;}}
.section-head{margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;}
.section-head h3{margin:4px 0 0;font-size:18px;font-weight:600;color:var(--cream4);}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.bar-row .lbl{font-family:var(--font-mono);width:56px;font-size:10px;color:#799687;}
.bar-track{height:8px;flex:1;overflow:hidden;border-radius:99px;background:#183326;}
.bar-fill{height:100%;border-radius:99px;}
.bar-fill.zero{background:#315b46;}
.bar-fill.some{background:#d87561;}

function cardLabel(card){ return `${card.rank}${card.suit}`; }
function cardColor(card){ return (card.suit==='♠'||card.suit==='♣') ? '#183329' : '#ae4c46'; }
function parseCard(label){ return { rank: label.slice(0,-1), suit: label.slice(-1) }; }
function cardKey(card){ return `${card.rank}${card.suit}`; }
function deck(){ return RANKS.flatMap(rank => SUITS.map(suit => ({rank,suit}))); }
function shuffle(values){ const copy=[...values]; for(let i=copy.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [copy[i],copy[j]]=[copy[j],copy[i]]; } return copy; }
function cardsRemaining(excluded){ const blocked=new Set(excluded.map(cardKey)); return deck().filter(c=>!blocked.has(cardKey(c))); }
function chooseHole(handClass, excluded){
  const rank1=handClass[0], rank2=handClass[1], suffix=handClass[2];
  const available = cardsRemaining(excluded);
  if(rank1===rank2){ const choices=available.filter(c=>c.rank===rank1); return shuffle(choices).slice(0,2); }
  if(suffix==='s'){
    const suit = shuffle(SUITS.filter(candidate => available.some(c=>c.rank===rank1 && c.suit===candidate) && available.some(c=>c.rank===rank2 && c.suit===candidate)))[0] ?? '♠';
    return [{rank:rank1,suit},{rank:rank2,suit}];
  }
  const combos = shuffle(available.filter(c=>c.rank===rank1).flatMap(first => available.filter(c=>c.rank===rank2 && c.suit!==first.suit).map(second=>[first,second])));
  return combos[0] ?? [{rank:rank1,suit:'♠'},{rank:rank2,suit:'♥'}];
}
function rangeToClass(hole){
  const [first,second] = [...hole].sort((a,b)=>RANKS.indexOf(b.rank)-RANKS.indexOf(a.rank));
  if(first.rank===second.rank) return `${first.rank}${second.rank}`;
  return `${first.rank}${second.rank}${first.suit===second.suit?'s':'o'}`;
}
function handLabel(hole){ return rangeToClass(hole); }

// Générateur dédié au module Probabilités : une main + un runout 100% aléatoires,
// sans AUCUN contexte de décision (catégorie, ligne d'action, stack, pot...).
// Volontairement découplé de `templates`/`pickSpot`, qui appartiennent au moteur
// d'entraînement préflop/postflop et n'ont rien à faire dans un outil de calcul pur.
function randomProbaHand(){
  const shuffled = shuffle(deck());
  const hole = shuffled.slice(0,2);
  const runout = shuffled.slice(2,7); // flop(3) + turn(1) + river(1)
  return { hole, runout, handClass: rangeToClass(hole) };
}
function trainerCategoryWeights(){
  const recent = state.history.slice(-40);
  const byCat = {};
  recent.forEach(item => {
    if(!byCat[item.category]) byCat[item.category] = { correct:0, total:0 };
    byCat[item.category].total++;
    if(item.correct) byCat[item.category].correct++;
  });
  return byCat;
}
function pickSpot(table, current, difficulty){
  difficulty = difficulty || 'Tous';
  const allowed = table===6 ? SIX_MAX : NINE_MAX;
  const maxDifficulty = difficulty==='Débutant'?1 : difficulty==='Intermédiaire'?2 : difficulty==='Avancé'?3 : 3;
  const pool = templates.filter(t => allowed.includes(t.heroPosition) && t.difficulty<=maxDifficulty && t.id!==current);
  let template = pool[0] ?? templates[0];
  if(pool.length){
    // Répétition intelligente : les catégories où l'utilisateur s'est récemment trompé
    // reviennent plus souvent, sans jamais exclure complètement les autres catégories.
    const weights = trainerCategoryWeights();
    const weighted = pool.map(t => {
      const w = weights[t.category];
      if(!w || w.total<2) return 2; // pas assez de données récentes -> poids neutre
      const acc = w.correct/w.total;
      return Math.max(0.6, 2.6*(1-acc)+0.4); // moins précis sur ce thème -> poids plus élevé
    });
    const totalW = weighted.reduce((a,b)=>a+b,0);
    let r = Math.random()*totalW;
    for(let i=0;i<pool.length;i++){ r -= weighted[i]; if(r<=0){ template = pool[i]; break; } }
  }
  const flop = template.flop.map(parseCard);
  const hole = chooseHole(template.handClass, flop);
  const future = shuffle(cardsRemaining([...flop, ...hole])).slice(0,2);
  return { ...template, table, hole, runout: [...flop, ...future] };
}
const MATRIX_LABELS = Array.from({length:169}, (_,index)=>{
  const row = Math.floor(index/13), column = index%13;
  const high = RANKS[12 - Math.min(row,column)];
  const low = RANKS[12 - Math.max(row,column)];
  if(row===column) return `${high}${low}`;
  return row<column ? `${high}${low}s` : `${high}${low}o`;
});
function combinations(n,k){ if(k===0) return 1; if(k>n) return 0; let result=1; for(let i=1;i<=k;i++) result=(result*(n-k+i))/i; return result; }
function hasFlush(cards){ return SUITS.some(suit => cards.filter(c=>c.suit===suit).length>=5); }
function hasTrips(cards){ return RANKS.some(rank => cards.filter(c=>c.rank===rank).length>=3); }
function hasStraight(cards){
  const unique = new Set(cards.map(c=>c.rank));
  if(unique.has('A')) unique.add('1');
  // 9 fenêtres valides de 5 rangs consécutifs : 2-3-4-5-6 … T-J-Q-K-A (RANKS a 13 éléments, indices 0..12).
  // BUG CORRIGÉ : la borne était `start<=9`, ce qui produisait une 10e fenêtre tronquée à 4 cartes
  // (J-Q-K-A, indices 9..12) et déclenchait un faux positif dès que ces 4 rangs étaient présents,
  // même sans le 10 pour compléter la quinte.
  for(let start=0; start<=8; start++){ const window=RANKS.slice(start,start+5); if(window.every(r=>unique.has(r))) return true; }
  const wheel=['A','2','3','4','5'];
  return wheel.every(r=>unique.has(r));
}
function drawProbability(hole, board, target){
  const visible=[...hole,...board];
  const remaining = cardsRemaining(visible);
  const current = target(visible);
  const oneCardHits = remaining.filter(card => target([...visible,card])).length;
  const oneCardChance = current ? 100 : (oneCardHits/remaining.length)*100;
  const cardsToCome = Math.max(0, 5-board.length);
  let byRiver = oneCardChance;
  if(!current && cardsToCome>=2){
    let hits=0;
    for(let i=0;i<remaining.length;i++) for(let j=i+1;j<remaining.length;j++) if(target([...visible,remaining[i],remaining[j]])) hits++;
    byRiver = (hits/combinations(remaining.length,2))*100;
  }
  return { outs: current?0:oneCardHits, next: oneCardChance, river: current?100:byRiver };
}
function hasFullHouseOrBetter(cards){
  const counts = Object.values(rankCounts(cards));
  if(counts.some(c=>c>=4)) return true; // carré
  return counts.some(c=>c>=3) && counts.filter(c=>c>=2).length>=2; // brelan + une autre paire = full
}
function numericRank(r){ return RANKS.indexOf(r)+2; } // '2'->2 ... 'A'->14
function hasFourConsecutiveRanks(numSet){
  const nums = new Set(numSet);
  if(nums.has(14)) nums.add(1); // l'As peut aussi jouer bas (roue)
  for(let start=1; start<=10; start++){
    let ok=true;
    for(let k=0;k<4;k++){ if(!nums.has(start+k)){ ok=false; break; } }
    if(ok) return true;
  }
  return false;
}
// BUG CORRIGÉ : la classification se faisait uniquement sur le NOMBRE d'outs (8 = OESD, 4 = gutshot),
// ce qui confond un vrai OESD avec une double quinte ventrale (double gutshot) — les deux ont 8 outs
// mais sont des structures différentes. On analyse maintenant les rangs qui complètent réellement la
// quinte et on vérifie s'ils forment les deux extrémités d'une suite de 4 cartes déjà consécutives.
function classifyStraightDraw(hole, board){
  const cards=[...hole,...board];
  if(hasStraight(cards)) return null;
  const remaining = cardsRemaining(cards);
  const connectingRanks = new Set();
  remaining.forEach(c => { if(hasStraight([...cards, c])) connectingRanks.add(c.rank); });
  if(connectingRanks.size===0) return null;
  const knownNums = new Set(cards.map(c=>numericRank(c.rank)));
  const openEnded = connectingRanks.size>=2 && hasFourConsecutiveRanks(knownNums);
  if(connectingRanks.size===1){
    return { label:'Quinte par un bout (gutshot)', detail:'Une seule carte complète la quinte : un tirage ventral classique.' };
  }
  if(openEnded){
    return { label:'Quinte par les deux bouts', detail:'Quatre rangs déjà consécutifs : les deux extrémités complètent la quinte.' };
  }
  return { label:'Double quinte ventrale (double gutshot)', detail:'Deux tirages ventraux distincts en même temps : deux rangs différents complètent chacun une quinte, sans suite de 4 cartes déjà formée.' };
}
function calculateDrawStats(hole, board){
  const cards=[...hole,...board];
  const stats=[];
  const suitCount = Math.max(...SUITS.map(suit => cards.filter(c=>c.suit===suit).length));
  if(suitCount>=3 && !hasFlush(cards)){
    const result = drawProbability(hole,board,hasFlush);
    const backdoor = suitCount===3;
    stats.push({name: backdoor ? 'Couleur (backdoor)' : 'Couleur', ...result, detail: backdoor ? '3 cartes de la même couleur seulement : il faut toucher deux fois d\u2019ici la river (runner-runner), pas un tirage classique.' : '4 cartes de la même couleur : 9 outs classiques.'});
  }
  // BUG CORRIGÉ : l'ancienne version déclenchait « Brelan / set » dès qu'une paire existait
  // N'IMPORTE OÙ dans les cartes combinées (y compris une simple top paire, ex. A♠K♦ sur A♥7♣2♠,
  // qui n'est PAS un tirage de set). On ne calcule ce tirage que pour une VRAIE paire servie en main.
  const heroPocketPair = hole.length===2 && hole[0].rank===hole[1].rank;
  if(heroPocketPair && !hasTrips(cards)){
    const pairRank = hole[0].rank;
    const result = drawProbability(hole, board, visible => visible.filter(c=>c.rank===pairRank).length>=3);
    stats.push({name:'Brelan / set', ...result, detail:'Ta paire servie peut retomber sur l\u2019un de ses 2 outs restants pour former un brelan (set).'});
  }
  // Nouveau : deux paires (ou brelan + paire) qui cherchent un full house / carré.
  const pairRanks = RANKS.filter(rank => cards.filter(c=>c.rank===rank).length>=2);
  const heroContributesPair = hole.some(hc => cards.filter(c=>c.rank===hc.rank).length>=2);
  if(heroContributesPair && pairRanks.length>=2 && !hasFullHouseOrBetter(cards)){
    const result = drawProbability(hole, board, hasFullHouseOrBetter);
    if(result.river>0){
      stats.push({name:'Full house ou mieux', ...result, detail:'Deux paires (ou un brelan + une paire) deviennent full house si l\u2019un des rangs pairés retouche — ou carré si c\u2019est ton brelan qui retouche.'});
    }
  }
  if(!hasStraight(cards)){
    const result = drawProbability(hole,board,hasStraight);
    if(result.river>0){
      if(result.outs===0){
        stats.push({name:'Quinte (backdoor)', ...result, detail:'Pas de tirage direct : il faut deux cartes précises d\u2019affilée (runner-runner) pour compléter la quinte.'});
      } else {
        const classification = classifyStraightDraw(hole, board);
        stats.push({name: classification ? classification.label : 'Tirage quinte', ...result, detail: classification ? classification.detail : 'Les cartes manquantes sont comptées sans doublon.'});
      }
    }
  }
  return stats;
}
function visibleBoard(spot, street){ return spot.runout.slice(0, street==='FLOP'?3 : street==='TURN'?4:5); }
function formatPercent(value){ if(value===0) return '0%'; if(value>=99.95) return '100%'; return `${value.toFixed(value<10?1:0)}%`; }

// -- Probabilité exacte « flop from scratch » : on énumère les C(50,3) flops
// possibles (cartes restantes après les 2 cartes en main) et on compte ceux
// qui vérifient la cible. C'est lent à l'échelle d'un moteur temps réel mais
// instantané pour générer UNE question (≈19 600 combinaisons).
function enumerateFlops(hole){
  const remaining = cardsRemaining(hole);
  const combos = [];
  for(let i=0;i<remaining.length;i++)
    for(let j=i+1;j<remaining.length;j++)
      for(let k=j+1;k<remaining.length;k++)
        combos.push([remaining[i],remaining[j],remaining[k]]);
  return combos;
}
function flopProbability(hole, targetFn){
  const combos = enumerateFlops(hole);
  let hits = 0;
  for(const flop of combos){ if(targetFn(hole, flop)) hits++; }
  return (hits/combos.length)*100;
}
function rankCounts(cards){ const c={}; cards.forEach(card=>{ c[card.rank]=(c[card.rank]||0)+1; }); return c; }

function shuffle2(arr){ return shuffle(arr); }
function buildOptions(correctLabel, distractorLabels){
  const seen = new Set([correctLabel]);
  const uniques = [];
  for(const label of distractorLabels){ if(!seen.has(label)){ seen.add(label); uniques.push(label); } }
  const opts = [{label:correctLabel, isCorrect:true}, ...uniques.slice(0,3).map(l=>({label:l, isCorrect:false}))];
  return shuffle(opts);
}
function makeMcqPercent(correctPct){
  const fmt = v => formatPercent(Math.max(0,v));
  const correctLabel = fmt(correctPct);
  // Écart minimal entre deux options pour éviter des distracteurs trop proches ou identiques après arrondi.
  const minGap = Math.max(1.5, correctPct*0.18);
  const usedValues = [correctPct];
  const distractors = [];
  const baseFactors = shuffle([0.35,0.5,1.6,1.9,2.3,2.7,3.2,0.2]);
  let idx = 0, guard = 0;
  while(distractors.length<3 && guard<60){
    guard++;
    const f = baseFactors[idx % baseFactors.length]; idx++;
    const jitter = 1 + (Math.random()*0.3-0.15);
    const candidate = Math.max(0.1, correctPct*f*jitter);
    const label = fmt(candidate);
    const tooClose = usedValues.some(v => Math.abs(v-candidate) < minGap) || label===correctLabel;
    if(!tooClose){ distractors.push(label); usedValues.push(candidate); }
  }
  // Filet de sécurité (cas extrêmes, ex. probabilité très proche de 0 ou de 100) :
  // on force un écart croissant si le tirage aléatoire n'a pas suffi.
  let step = 1;
  while(distractors.length<3){
    const candidate = Math.max(0.1, Math.min(100, correctPct + step*minGap*(distractors.length%2===0?1:-1)));
    const label = fmt(candidate);
    if(label!==correctLabel && !distractors.includes(label)) distractors.push(label);
    step++;
    if(step>20) break;
  }
  return buildOptions(correctLabel, distractors);
}
function makeMcqInt(correctInt, poolCandidates){
  const correctLabel = String(correctInt);
  let candidates = (poolCandidates||[]).filter(v=>v!==correctInt && v>0);
  if(candidates.length<3){
    const deltas = shuffle([-4,-3,-2,2,3,4,5,-5]);
    for(const d of deltas){ const v=correctInt+d; if(v>0 && !candidates.includes(v)) candidates.push(v); if(candidates.length>=5) break; }
  }
  const distractors = shuffle(candidates).slice(0,3).map(String);
  return buildOptions(correctLabel, distractors);
}

function pickWeightedGenerator(pool, statsStore){
  if(pool.length===0) return null;
  const weights = pool.map(g => {
    const s = statsStore[g.category];
    if(!s || s.total<3) return 3;
    const acc = s.correct/s.total;
    return Math.max(0.6, 3*(1-acc)+0.4);
  });
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for(let i=0;i<pool.length;i++){ r -= weights[i]; if(r<=0) return pool[i]; }
  return pool[pool.length-1];
}
function qcmState(mod){ return mod==='proba' ? state.qcmProba : state.qcmCote; }
function qcmGenerators(mod){ return mod==='proba' ? PROBA_GENERATORS : COTE_GENERATORS; }
function qcmStorageKey(mod){ return mod==='proba' ? QCM_PROBA_KEY : QCM_COTE_KEY; }
function newQcmQuestion(mod){
  const st = qcmState(mod);
  const pool = qcmGenerators(mod).filter(g => g.level<=levelNumFromLabel(st.level));
  const chosen = pickWeightedGenerator(pool.length?pool:qcmGenerators(mod), st.stats);
  const q = chosen.generate();
  q.category = chosen.category; q.categoryLabel = chosen.categoryLabel; q.level = chosen.level;
  st.question = q; st.selected = null; st.freeInput = ''; st.revealed = false; st.lastFreeCorrect = false;
}
function recordQcmAnswer(mod, correct){
  const st = qcmState(mod);
  const cat = st.question.category;
  if(!st.stats[cat]) st.stats[cat] = { correct:0, total:0, label:st.question.categoryLabel };
  st.stats[cat].total++; if(correct) st.stats[cat].correct++;
  st.stats[cat].label = st.question.categoryLabel;
  saveQcmStats(qcmStorageKey(mod), st.stats);
  st.totalCount++; if(correct) st.correctCount++;
}
function answerQcmOption(mod, idx){
  const st = qcmState(mod);
  if(st.revealed) return;
  st.selected = idx; st.revealed = true;
  recordQcmAnswer(mod, !!st.question.options[idx].isCorrect);
  render();
}
function answerQcmFree(mod){
  const st = qcmState(mod);
  if(st.revealed || st.question.freeAnswer===null) return;
  const val = parseFloat(String(st.freeInput).replace(',','.'));
  if(Number.isNaN(val)) return;
  const tol = st.question.tolerance ?? 1;
  const correct = Math.abs(val - st.question.freeAnswer) <= tol;
  st.revealed = true; st.lastFreeCorrect = correct;
  recordQcmAnswer(mod, correct);
  render();
}

const memoryStore = {};
const storage = (() => {
  try{
    const testKey='__poker_storage_test__';
    localStorage.setItem(testKey,'1');
    localStorage.removeItem(testKey);
    return localStorage;
  }catch(e){
    // Stockage indisponible (fichier local sur certains navigateurs mobiles) :
    // on retombe sur une mémoire en RAM pour que rien ne plante, sans persistance entre sessions.
    return {
      getItem:k => Object.prototype.hasOwnProperty.call(memoryStore,k) ? memoryStore[k] : null,
      setItem:(k,v) => { memoryStore[k]=String(v); },
      removeItem:k => { delete memoryStore[k]; },
    };
  }
})();

    banner = document.createElement('div');

    banner.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#3a1512;color:#f3c9c0;font:11px "Space Mono",monospace;padding:10px 14px;z-index:999;max-height:35vh;overflow:auto;white-space:pre-wrap;border-top:2px solid #d87561;';
    document.body.appendChild(banner);
  }

}

}
function saveHistory(history){ storage.setItem(STORAGE_KEY, JSON.stringify(history.slice(-400))); }
function difficultyName(level){ return level===1?'Débutant':level===2?'Intermédiaire':'Avancé'; }
function actionName(action){

// Résumé texte court de la situation, pour l'historique (ex. "BTN open 2.3 bb").
function situationSummary(spot){
  if(spot.villainPosition==='—') return 'Premier à parler';
  const lastAct = (spot.actions||[]).slice(-1)[0];
  return lastAct ? `${spot.villainPosition} ${actionPhrase(lastAct.action, lastAct.amount)}` : `Face à ${spot.villainPosition}`;
}
function log(decision, recommended, tier, currentStreet){
  const item = {
    id:`${Date.now()}-${Math.random()}`, hand:handLabel(state.spot.hole), position:state.spot.heroPosition,
    street:currentStreet, tier, correct: tier!=='error', decision, recommended, category:state.spot.category,
    situation: situationSummary(state.spot),
    difficulty:state.spot.difficulty, stack:state.spot.effectiveStack, timestamp:Date.now(),
  };
  state.history.push(item);
  try{ saveHistory(state.history); }catch(e){ console.error('Sauvegarde historique impossible :', e); }
  state.streak = tier!=='error' ? state.streak+1 : 0;
}
function nextHand(){
  state.spot = pickSpot(state.table, state.spot.id, state.difficulty);
  state.phase='preflop'; state.selected=null; state.postAction=null; state.street='FLOP';
  render();
}
function choosePreflop(action){
  state.selected = action;
  log(action, state.spot.preflop.action, preflopTier(state.spot, action), 'Préflop');
  render();
}
function choosePostflop(action){
  if(action==='NEXT'){
    if(state.street==='FLOP') state.street='TURN';
    else if(state.street==='TURN') state.street='RIVER';
    else { nextHand(); return; }
    state.postAction=null; render(); return;
  }
  state.postAction = action;
  log(action, state.spot.post[state.street].action, postflopTier(state.spot.post[state.street], action), state.street);

}

function esc(s){ return String(s).replace(/</g,'&lt;'); }

function PlayingCard(card, large){
  return `<div class="card ${large?'large':'small'}" style="color:${cardColor(card)}">${cardLabel(card)}</div>`;
}
function HoleCards(cards){ return `<div class="cards-row">${cards.map(c=>PlayingCard(c,true)).join('')}</div>`; }
function Board(cards){ return `<div class="cards-row">${cards.map(c=>PlayingCard(c,false)).join('')}</div>`; }
function BoardBacks(n){ return `<div class="cards-row">${Array.from({length:n}).map(()=>`<div class="card small back-card">?</div>`).join('')}</div>`; }

function ellipsePoint(cx,cy,rx,ry,angleDeg){
  const rad = angleDeg*Math.PI/180;
  return { x: cx + rx*Math.cos(rad), y: cy + ry*Math.sin(rad) };
}
const ACTION_VERBS = { open:'Open', '3bet':'3-bet', '4bet':'4-bet', fold:'Fold', call:'Call', limp:'Limp' };
function actionVerb(action){ return ACTION_VERBS[action] || action; }

// Construit la séquence d'action complète (qui a foldé, qui a ouvert/relancé, avec quel montant)
// à partir de la liste compacte spot.actions, en tenant compte du VRAI nombre de sièges
// (6-max ou 9-max) : les positions qui n'existent qu'en 9-max (UTG+1/MP/LJ) sont donc
// correctement insérées comme "fold" quand elles se trouvent avant l'action concernée.
function buildActionLog(spot, tableSize){
  const order = tableSize===6 ? SIX_MAX : NINE_MAX;
  if(!order.includes(spot.heroPosition)) return null;
  const actions = spot.actions || [];
  const heroIdx = order.indexOf(spot.heroPosition);
  if(actions.length===0){
    return Array.from({length:heroIdx}, (_,i)=>({pos:order[i], action:'fold'}));
  }
  const log = [];
  const resolved = new Set();
  const fillFoldsBetween = (fromIdx, toIdx) => {
    for(let i=fromIdx; i<toIdx; i++){
      if(order[i]===spot.heroPosition || resolved.has(i)) continue;
      resolved.add(i);
      log.push({ pos:order[i], action:'fold' });
    }
  };
  let cursor = 0;
  for(const act of actions){
    const idx = order.indexOf(act.pos);
    if(idx<0) continue; // position absente à cette taille de table (garde-fou)
    fillFoldsBetween(cursor, idx);
    resolved.add(idx);
    log.push({ pos:act.pos, action:act.action, amount:act.amount, isHero: act.pos===spot.heroPosition });
    cursor = Math.max(cursor, idx+1);
  }
  const lastIdx = order.indexOf(actions[actions.length-1].pos);
  if(heroIdx > lastIdx) fillFoldsBetween(cursor, heroIdx);
  else fillFoldsBetween(cursor, order.length);
  return log;
}
function actionPhrase(action, amount){
  const amt = amount ? ` à ${amount} bb` : '';
  if(action==='open') return `open${amt}`;
  if(action==='3bet') return `3-bet${amt}`;
  if(action==='4bet') return `4-bet${amt}`;
  if(action==='call') return `suit${amt}`;
  if(action==='limp') return `limp${amt}`;
  return action;
}
// Décrit la situation en clair, SANS jamais révéler la fréquence/solution avant la décision du joueur.
function positionContextText(spot){
  if(spot.villainPosition==='—'){
    return `Vous êtes <b>${spot.heroPosition}</b>. Personne n\u2019a encore parlé : c\u2019est à vous d\u2019ouvrir ou de vous coucher.`;
  }
  const lastAct = (spot.actions||[]).slice(-1)[0];
  const phrase = lastAct ? actionPhrase(lastAct.action, lastAct.amount) : 'a parlé';
  const priorHero = (spot.actions||[]).find(a=>a.pos===spot.heroPosition);
  const recap = priorHero ? ` Vous aviez ${actionPhrase(priorHero.action, priorHero.amount)}.` : '';
  return `Vous êtes <b>${spot.heroPosition}</b>, face à <b>${spot.villainPosition}</b> qui ${phrase}.${recap}`;
}
function ActionFeed(log, heroPosition){
  if(log===null) return '';
  if(log.length===0){
    return `<div class="action-feed"><p class="action-feed-empty">Personne n\u2019a encore parlé — vous êtes le premier à agir.</p></div>`;
  }
  const rows = log.map(step => {
    const isFold = step.action==='fold';
    const cls = isFold ? 'fold' : (step.isHero ? 'hero' : 'raise');
    const amountTxt = step.amount ? ` ${step.amount} bb` : '';
    return `<div class="action-feed-row ${cls}"><span class="pos">${step.pos}${step.isHero?' (vous)':''}</span><span class="verb">${actionVerb(step.action)}${amountTxt}</span></div>`;
  }).join('');
  return `<div class="action-feed">${rows}<div class="action-feed-row now"><span class="pos">${heroPosition} (vous)</span><span class="verb">À vous de jouer</span></div></div>`;
}
function TableViz(spot, tableSize){
  const order = tableSize===6 ? SIX_MAX : NINE_MAX;
  const n = order.length;
  const heroIdx = order.indexOf(spot.heroPosition);
  if(heroIdx===-1) return '';
  const log = buildActionLog(spot, tableSize);
  const stateByPos = {};
  (log||[]).forEach(step => { stateByPos[step.pos] = step; });
  // Le dernier relanceur (open/3bet/4bet) le plus récent, hors héros, est celui que l'on affronte.
  const lastAggressor = (log||[]).filter(s=>s.action!=='fold' && !s.isHero).slice(-1)[0];

  // On repart de la position du héros pour que VOUS soyez toujours en bas, au centre.
  const rotated = order.slice(heroIdx).concat(order.slice(0, heroIdx));
  const cx=160, cy=104, rx=120, ry=70;
  const seats = rotated.map((pos, i) => {
    const angle = 90 + i*(360/n); // siège 0 (héros) = 90° = bas centre, puis on tourne autour de la table
    const pt = ellipsePoint(cx,cy,rx,ry,angle);
    const step = stateByPos[pos];
    return {
      pos, x:pt.x, y:pt.y,
      isHero: pos===spot.heroPosition,
      isFacing: !!lastAggressor && pos===lastAggressor.pos,
      isFolded: !!step && step.action==='fold',
      hasActed: !!step && step.action!=='fold',
      amount: step && step.amount,
      isBTN: pos==='BTN', isSB: pos==='SB', isBB: pos==='BB',
    };
  });

  const felt = `<ellipse cx="${cx}" cy="${cy}" rx="${rx+32}" ry="${ry+28}" fill="#0d2a1f" stroke="#2a4e3e" stroke-width="2"/><ellipse cx="${cx}" cy="${cy}" rx="${rx-4}" ry="${ry-4}" fill="none" stroke="#1d3b31" stroke-width="1" stroke-dasharray="3 5"/>`;

  const seatsHtml = seats.map(s => {
    const r = s.isHero ? 25 : 19;
    let fill = '#132118', stroke = '#3a5d4b', textColor = '#cfe0d5', opacity = 1;
    if(s.isHero){ fill='#d5a850'; stroke='#f0c46f'; textColor='#182419'; }
    else if(s.isFacing){ fill='#c96a54'; stroke='#e69b8e'; textColor='#2a1310'; }
    else if(s.isFolded){ fill='#0f1f18'; stroke='#25392f'; textColor='#4c6459'; opacity=0.55; }
    else if(s.hasActed){ fill='#2a2114'; stroke='#e0954a'; textColor='#f0c98a'; }
    const label = s.isHero ? 'VOUS' : s.pos;
    const fontSize = s.isHero ? 10.5 : (s.pos.length>=4 ? 8 : 10);
    const amountTag = (s.hasActed && s.amount) ? `<rect x="${s.x-19}" y="${s.y+r+2}" width="38" height="15" rx="7" fill="#0d2a1f" stroke="#e0954a" stroke-width="1"/><text x="${s.x}" y="${s.y+r+12.5}" text-anchor="middle" font-family="'Space Mono',monospace" font-size="10" font-weight="700" fill="#f0c98a">${s.amount}bb</text>` : '';
    const foldTag = (s.isFolded) ? `<text x="${s.x}" y="${s.y+r+13}" text-anchor="middle" font-family="'Space Mono',monospace" font-size="8" letter-spacing="1" fill="#4c6459">FOLD</text>` : '';
    return `<g opacity="${opacity}">
      <circle cx="${s.x}" cy="${s.y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>
      <text x="${s.x}" y="${s.y+3.6}" text-anchor="middle" font-family="'Space Mono',monospace" font-size="${fontSize}" font-weight="700" fill="${textColor}">${label}</text>
      ${amountTag}${foldTag}
    </g>`;
  }).join('');

  // jeton distributeur (D) en avant du siège BTN, vers le centre de la table
  const chipTowardCenter = (seat, r, label, fill, stroke, textFill) => {
    if(!seat) return '';
    const dx = cx - seat.x, dy = cy - seat.y;
    const dist = Math.hypot(dx,dy) || 1;
    const ox = seat.x + dx/dist*30, oy = seat.y + dy/dist*30;
    return `<circle cx="${ox}" cy="${oy}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/><text x="${ox}" y="${oy+3.2}" text-anchor="middle" font-family="'Space Mono',monospace" font-size="8" font-weight="700" fill="${textFill}">${label}</text>`;
  };
  const btnSeat = seats.find(s=>s.isBTN);
  const sbSeat = seats.find(s=>s.isSB);
  const bbSeat = seats.find(s=>s.isBB);
  const markers = [
    chipTowardCenter(btnSeat, 10, 'D', '#f3e9ce', '#c99b48', '#8a6a28'),
    chipTowardCenter(sbSeat, 9, 'SB', '#3f6152', 'rgba(255,255,255,.35)', '#e6f0ea'),
    chipTowardCenter(bbSeat, 9, 'BB', '#345847', 'rgba(255,255,255,.35)', '#e6f0ea'),
  ].join('');

  return `<div style="margin:16px 0;">
    <svg viewBox="0 0 320 226" style="width:100%;max-width:340px;height:auto;display:block;margin:0 auto;">${felt}${seatsHtml}${markers}</svg>
    ${ActionFeed(log, spot.heroPosition)}
  </div>`;
}

function RangeMatrix(spot){
  const range = OPEN_RANGES[spot.heroPosition] || [];
  const freq = spot.preflop.frequency;
  const cells = MATRIX_LABELS.map(cell => {
    const active = range.includes(cell);
    const current = cell === spot.handClass;
    const mixed = current && !active && freq > 0 && freq < 100;
    let bg, color;
    if(mixed){ bg='rgba(213,168,80,.4)'; color='#f1e2b8'; }
    else if(active){ bg='rgba(213,168,80,.86)'; color='#182419'; }
    else { bg='rgba(117,147,134,.12)'; color='#6d8b7d'; }
    return `<div class="cell ${current?'current':''}" title="${cell}" style="background:${bg};color:${color}">${cell}</div>`;
  }).join('');
  return `<div class="matrix-wrap">
    <div class="m-head"><span class="m-title">Range de référence · ${spot.heroPosition}</span>
      <div class="m-legend"><span><i style="background:#d5a850"></i>Action</span><span><i style="background:rgba(213,168,80,.4)"></i>Mixte</span><span><i style="background:#315846"></i>Hors range</span></div>
    </div>
    <div class="matrix">${cells}</div>
    <div class="matrix-foot"><span>${spot.preflop.rangeLabel}</span><span>169 combinaisons · lecture simplifiée</span></div>
  </div>`;
}
function RangeNote(spot){
  return `<div class="matrix-wrap">
    <div class="m-head"><span class="m-title">Contexte du spot</span></div>
    <p style="font-size:13px;line-height:1.55;color:#a5b8a5;margin:0;">
      Face à l'action de ${spot.villainPosition} (${spot.line}), la bonne décision dépend aussi de la range d'ouverture ou de 3-bet adverse, pas seulement de la vôtre —
      un tableau 169 cases par position n'a de sens que pour une décision d'ouverture "first in". Ici, la fréquence cible (${spot.preflop.frequency}%) est la donnée qui compte.
    </p>
  </div>`;
}

function OddsPanel(hole, board, compact){

  </div>`;

function preflopTier(spot, selected){
  if(selected === spot.preflop.action) return 'top';
  const mix = spot.preflop.mix;
  if(mix){
    const entry = mix.find(m=>m.action===selected);
    if(entry && entry.freq>=15) return 'mixed';
  }
  return 'error';
}
// Postflop : pas de données de fréquence par sizing (contrairement au préflop), donc on reste honnête
// et pragmatique plutôt que d'inventer des pourcentages. Règle simple et défendable : un sizing DIRECTEMENT
// ADJACENT à la recommandation (ex. BET 25% au lieu de BET 33%) est une variation de sizing acceptable, pas
// une erreur — direction opposée (CHECK/FOLD vs BET, ou l'inverse) reste tranchée en JUSTE/ERREUR.
const POST_BET_ORDER = ['BET 25%','BET 33%','BET 50%','BET 75%','BET 125%'];
function postflopTier(solution, selected){
  if(selected === solution.action) return 'top';
  const si = POST_BET_ORDER.indexOf(solution.action);
  const ci = POST_BET_ORDER.indexOf(selected);
  if(si!==-1 && ci!==-1 && Math.abs(si-ci)===1) return 'mixed';
  return 'error';
}
function FeedbackPreflop(spot, selected){
  const tier = preflopTier(spot, selected);
  const canContinue = selected !== 'FOLD';
  const tierMeta = {
    top:   { cls:'ok',  icon:'✓', title:'Bonne lecture du spot.',        tag:'JUSTE' },
    mixed: { cls:'mix', icon:'≈', title:'Ligne alternative défendable.', tag:'MIX' },
    error: { cls:'bad', icon:'✕', title:'Décision à revoir.',            tag:'ERREUR' },
  }[tier];
  const mixEntry = (tier==='mixed' && spot.preflop.mix) ? spot.preflop.mix.find(m=>m.action===selected) : null;
  const mixNote = mixEntry ? `<p class="fb-text" style="margin-top:8px;">Le solveur joue aussi ${actionName(selected)} une partie du temps (~${mixEntry.freq}%) sur ce spot : ce n\u2019est pas la ligne la plus fréquente, mais ce n\u2019est pas une erreur.</p>` : '';
  const mixBreakdown = spot.preflop.mix ? `<p class="caption" style="margin-top:6px;">Répartition complète : ${spot.preflop.mix.map(m=>`${m.freq}% ${actionName(m.action)}`).join(' · ')}</p>` : '';
  return `<section class="feedback animate-rise ${tierMeta.cls}">
    <div class="fb-head">
      <div class="fb-icon ${tierMeta.cls}">${tierMeta.icon}</div>
      <div style="flex:1;min-width:0;">
        <p class="fb-title">${tierMeta.title}</p>
      </div>
      <span class="fb-tag ${tierMeta.cls}">${tierMeta.tag}</span>
    </div>
    <div class="fb-actions">
      ${canContinue ? `<button class="btn-gold" id="btnContinuePost">Jouer le postflop &#8250;</button>` : ''}
      <button class="btn-outline" id="btnNextHand">${canContinue?'Passer la main':'Main suivante'}</button>
    </div>
    <div class="fb-details">
      <p class="fb-text">${spot.preflop.explanation}</p>
      ${mixNote}
      <div class="fb-body">
        <div class="fb-solution">
          <p class="lbl">Solution</p>
          <p class="val">${spot.preflop.frequency}% <span class="u">${actionName(spot.preflop.action)}</span></p>
          <p class="caption">Fréquence cible · ${spot.preflop.rangeLabel}</p>
          ${mixBreakdown}
          <p class="caption" style="margin-top:10px;">Ta réponse : <b style="color:${tier==='top'?'var(--gold4)':tier==='mixed'?'#f0c98a':'#e6a093'};">${actionName(selected)}</b> → ${tierMeta.tag}</p>
        </div>
        ${spot.villainPosition==='—' ? RangeMatrix(spot) : RangeNote(spot)}
      </div>
    </div>
  </section>`;
}

const actionLabels = { CHECK:'Checker', FOLD:'Abandonner', CALL:'Payer', RAISE:'Relancer' };
function postActionLabel(action){ return actionLabels[action] || `Miser ${action.replace('BET ','')}`; }

function PostflopPanel(spot, street, actionTaken){

    const mixNote = tier==='mixed' ? `<p class="fb-text" style="margin-top:8px;">${postActionLabel(actionTaken)} est un sizing voisin de la recommandation (${postActionLabel(solution.action)}) : on considère ça comme une variation acceptable, pas une erreur.</p>` : '';
    return `<div class="feedback animate-rise ${tierMeta.cls}">
      <div class="fb-head">
        <div class="fb-icon ${tierMeta.cls}">${tierMeta.icon}</div>

        </div>

      <div style="display:flex;justify-content:flex-end;">

            <p class="caption">${solution.sizing}</p>
            <p class="caption" style="margin-top:10px;">Ta réponse : <b style="color:${tier==='top'?'var(--gold4)':tier==='mixed'?'#f0c98a':'#e6a093'};">${postActionLabel(actionTaken)}</b> → ${tierMeta.tag}</p>
          </div>

  }
  return `<div class="animate-rise">

function bestStreakFromHistory(history){
  let best=0, cur=0;
  history.forEach(item => { if(item.correct){ cur++; best=Math.max(best,cur); } else cur=0; });
  return best;
}
function statsComputed(){
  const s = state;
  const history = s.history;
  const total = history.length;
  const correct = history.filter(i=>i.correct).length;
  const accuracy = total ? Math.round((correct/total)*100) : 0;
  const topCount = history.filter(i=>i.tier==='top').length;
  const mixedCount = history.filter(i=>i.tier==='mixed').length;
  const errorCount = history.filter(i=>i.tier==='error').length;
  const preflop = history.filter(i=>i.street==='Préflop');
  const postflop = history.filter(i=>i.street!=='Préflop');
  const streetList = ['Préflop','FLOP','TURN','RIVER'];
  const streetStats = streetList.map(street => {
    const items = history.filter(i=>i.street===street);
    const ok = items.filter(i=>i.correct).length;
    return { street, total:items.length, correct:ok, mistakes:items.length-ok, accuracy: items.length? Math.round((ok/items.length)*100) : null };
  });
  const positions = Array.from(new Set(history.map(i=>i.position)));
  const positionStats = (positions.length?positions:SIX_MAX).map(pos => {
    const items = history.filter(i=>i.position===pos);
    const ok = items.filter(i=>i.correct).length;
    return { position:pos, total:items.length, correct:ok, mistakes:items.length-ok, accuracy: items.length? Math.round((ok/items.length)*100) : null };
  });
  const categories = Array.from(new Set(history.map(i=>i.category)));
  const playedStreets = streetStats.filter(x=>x.total>0);
  const playedPositions = positionStats.filter(x=>x.total>0);
  const worstStreet = playedStreets.length ? playedStreets.reduce((a,b)=> b.accuracy<a.accuracy ? b : a) : null;
  const bestStreet = playedStreets.length ? playedStreets.reduce((a,b)=> b.accuracy>a.accuracy ? b : a) : null;
  const worstPosition = playedPositions.length ? playedPositions.reduce((a,b)=> b.accuracy<a.accuracy ? b : a) : null;
  const streak = bestStreakFromHistory(history);
  return { total, correct, accuracy, topCount, mixedCount, errorCount, preflop, postflop, streetStats, positionStats, categories, worstStreet, bestStreet, worstPosition, streak };
}

function renderQcmPanel(mod){

  const effectiveMode = (st.mode==='free' && q.freeAnswer!==null) ? 'free' : 'qcm';
  const catEntries = Object.entries(st.stats).sort((a,b)=>b[1].total-a[1].total).slice(0,6);
  const bodyHtml = effectiveMode==='qcm' ? `
    <div class="qcm-options">
      ${q.options.map((o,i)=>{
        let cls='qcm-opt';
        if(st.revealed){ if(o.isCorrect) cls+=' correct'; else if(i===st.selected) cls+=' wrong'; }

  ` : (effectiveMode==='free' ? '' : '');

    <div class="qcm-shell">
      <div class="qcm-topline">

            </select>
          </label>
          <div class="mode-toggle" id="qcmModeToggle-${mod}">
            <button data-qcmmode="qcm" class="${effectiveMode==='qcm'?'active':''}">QCM</button>
            <button data-qcmmode="free" class="${effectiveMode==='free'?'active':''}">Réponse libre</button>
          </div>

      <div class="qcm-scorebar"><span class="qcm-score">Session : <b>${st.correctCount}/${st.totalCount}</b>${st.totalCount?` (${accPct}%)`:''}</span></div>
      <div class="qcm-question">
        <p class="qcm-prompt">${q.promptHtml}</p>
        ${q.cardsHtml || ''}
        ${bodyHtml}
        ${explainHtml}

      ${catEntries.length ? `
      <section class="section-card">
        <div class="section-head"><div><p class="m-title">Progression par thème</p><h3 style="font-size:14px;">Où tu progresses</h3></div></div>
        <div class="qcm-cat-grid">
          ${catEntries.map(([key,val])=>`<div class="qcm-cat-row"><span class="name">${esc(val.label||key)}</span><span class="pct">${val.total? Math.round((val.correct/val.total)*100):0}% · ${val.total}</span></div>`).join('')}

function renderCoteCalculator(){
  const { pot, bet } = state.coteCalc;
  const call = bet;
  const potFinal = pot + bet + call;
  const potAfterBet = pot + bet;
  const equity = potFinal>0 ? (call/potFinal)*100 : 0;
  const ratio = call>0 ? potAfterBet/call : 0;
  const ratioLabel = ratio ? `${ratio<10 ? (Math.round(ratio*10)/10) : Math.round(ratio)}:1` : '—';
  return `
    <div class="felt-card felt-grid">
      <div class="felt-head"><div class="felt-head-left"><span class="phase-dot" style="background:#d5a850"></span><span class="stat-label">Calculateur de cote (pot odds)</span></div><span class="cat">COTES</span></div>
      <div class="cote-calc">
        <div class="cote-field"><label>Pot avant la mise adverse (bb)</label><input type="number" min="0" step="0.5" id="coteCalcPot" value="${pot}"></div>
        <div class="cote-field"><label>Mise de l\u2019adversaire (bb)</label><input type="number" min="0" step="0.5" id="coteCalcBet" value="${bet}"></div>
      </div>
      <div class="cote-result">
        <div class="row"><span>Montant à payer (call)</span><b>${call.toFixed(1)} bb</b></div>
        <div class="row"><span>Pot final si tu payes</span><b>${potFinal.toFixed(1)} bb</b></div>
        <div class="row"><span>Cote directe (ratio pot : call)</span><b>${ratioLabel}</b></div>
        <div class="row"><span>Equity minimale nécessaire</span><b>${formatPercent(equity)}</b></div>
      </div>
      <div class="link-note">Ce seuil d\u2019equity indique le minimum pour que le call soit rentable sur cette seule street, en supposant plus aucune action derrière. Il ne remplace pas un vrai calcul d\u2019equity contre une range, ni la prise en compte des implied et reverse implied odds — le module Probabilités calcule tes outs, celui-ci calcule le prix demandé ; à toi de relier les deux.</div>
    </div>
  `;
}

// ============================================================
// TESTS INTERNES — audit automatique de la logique poker/maths.
// N'affecte jamais le rendu normal : résultats en console + petit
// panneau développeur désactivable (lien "tests" dans la sidebar).
// ============================================================
function runPokerTests(){
  const results = [];
  const assert = (name, cond) => results.push({ name, pass: !!cond });

  const d = deck();
  assert('Deck = 52 cartes', d.length===52);
  assert('Aucune carte dupliquée dans le deck', new Set(d.map(cardKey)).size===52);

  const hole2 = [d[0], d[1]];
  assert('50 cartes restantes après 2 cartes en main', cardsRemaining(hole2).length===50);
  const flop3 = [d[2],d[3],d[4]];
  assert('47 cartes restantes au flop', cardsRemaining([...hole2,...flop3]).length===47);
  const turnCard = [d[5]];
  assert('46 cartes restantes au turn', cardsRemaining([...hole2,...flop3,...turnCard]).length===46);
  const riverCard = [d[6]];
  assert('45 cartes restantes à la river', cardsRemaining([...hole2,...flop3,...turnCard,...riverCard]).length===45);

  assert('C(50,3) = 19 600', combinations(50,3)===19600);
  assert('C(47,2) = 1 081', combinations(47,2)===1081);

  // Regression : bug d'off-by-one dans hasStraight (corrigé) — J-Q-K-A sans 10 n'est PAS une quinte.
  assert('J-Q-K-A sans le 10 n\u2019est PAS une quinte (régression off-by-one)', hasStraight([{rank:'K'},{rank:'Q'},{rank:'J'},{rank:'A'},{rank:'2'}])===false);
  assert('T-J-Q-K-A EST une quinte', hasStraight([{rank:'T'},{rank:'J'},{rank:'Q'},{rank:'K'},{rank:'A'}])===true);
  assert('A-2-3-4-5 (wheel) EST une quinte', hasStraight([{rank:'A'},{rank:'2'},{rank:'3'},{rank:'4'},{rank:'5'}])===true);

  {
    const hole=[{rank:'A',suit:'♠'},{rank:'K',suit:'♠'}], board=[{rank:'Q',suit:'♠'},{rank:'7',suit:'♠'},{rank:'2',suit:'♦'}];
    const s = calculateDrawStats(hole,board).find(x=>x.name==='Couleur');
    assert('Tirage couleur classique (4 cartes) = 9 outs', !!s && s.outs===9);
  }
  {
    const hole=[{rank:'9',suit:'♣'},{rank:'8',suit:'♦'}], board=[{rank:'7',suit:'♠'},{rank:'6',suit:'♥'},{rank:'2',suit:'♦'}];
    const s = calculateDrawStats(hole,board).find(x=>x.name==='Quinte par les deux bouts');
    assert('Open-ended (OESD) = 8 outs', !!s && s.outs===8);
  }
  {
    const hole=[{rank:'J',suit:'♣'},{rank:'T',suit:'♦'}], board=[{rank:'9',suit:'♠'},{rank:'7',suit:'♥'},{rank:'2',suit:'♦'}];
    const s = calculateDrawStats(hole,board).find(x=>x.name.includes('bout') && !x.name.includes('deux'));
    assert('Gutshot = 4 outs', !!s && s.outs===4);
  }
  {
    const hole=[{rank:'8',suit:'♠'},{rank:'8',suit:'♦'}], board=[{rank:'A',suit:'♣'},{rank:'7',suit:'♥'},{rank:'2',suit:'♠'}];
    const s = calculateDrawStats(hole,board).find(x=>x.name==='Brelan / set');
    assert('Paire servie → brelan/set = 2 outs', !!s && s.outs===2);
  }
  {
    // Régression : une TOP PAIRE (pas une paire servie) ne doit jamais déclencher "Brelan / set".
    const hole=[{rank:'A',suit:'♠'},{rank:'K',suit:'♦'}], board=[{rank:'A',suit:'♥'},{rank:'7',suit:'♣'},{rank:'2',suit:'♠'}];
    const s = calculateDrawStats(hole,board).find(x=>x.name==='Brelan / set');
    assert('Top paire (non paire servie) ne déclenche pas "Brelan / set" (régression)', !s);
  }

  {
    const pot=20, bet=10, potFinal=pot+bet+bet;
    assert('Pot odds 20/10 → 25% d\u2019equity', Math.abs((bet/potFinal)*100 - 25) < 0.01);
    assert('Cote 30:10 = 3:1', Math.abs(((pot+bet)/bet) - 3) < 0.01);
  }

  {
    const sixMaxHasForbidden = ['UTG+1','MP','LJ'].some(p => templates.some(t=>t.heroPosition===p && SIX_MAX.includes(p)));
    assert('6-max ne référence jamais UTG+1 / MP / LJ', !sixMaxHasForbidden);
    assert('9-max dispose d\u2019au moins un spot pour chaque position', NINE_MAX.every(p => templates.some(t=>t.heroPosition===p)));
  }

  {
    let ok = true;
    for(let i=0;i<12 && ok;i++){
      for(const gen of [...PROBA_GENERATORS, ...COTE_GENERATORS]){
        const q = gen.generate();
        const correctCount = q.options.filter(o=>o.isCorrect).length;
        const labels = q.options.map(o=>o.label);
        if(correctCount!==1 || new Set(labels).size!==labels.length || labels.length<2){ ok=false; break; }
      }
    }
    assert('QCM : toujours exactement 1 bonne réponse, options uniques (12 tirages × chaque générateur)', ok);
  }

  // --- V2.2 : système MIX à 3 états (JUSTE / ACCEPTABLE / INCORRECT) ---
  {
    const spot = templates.find(t=>t.id==='btn-flat-aqs'); // CALL 58% / 3BET 40% / FOLD 2%
    assert('MIX préflop : action principale = top', preflopTier(spot,'CALL')==='top');
    assert('MIX préflop : alternative mixée (≥15%) = mixed, pas error', preflopTier(spot,'3BET')==='mixed');
    assert('MIX préflop : action quasi nulle = error', preflopTier(spot,'FOLD')==='error');
  }
  {
    const solution = { action:'BET 33%' };
    assert('MIX postflop : action recommandée = top', postflopTier(solution,'BET 33%')==='top');
    assert('MIX postflop : sizing adjacent = mixed, pas error', postflopTier(solution,'BET 25%')==='mixed');
    assert('MIX postflop : direction opposée (CHECK) = error', postflopTier(solution,'CHECK')==='error');
  }
  {
    // Une réponse MIX ne doit pas casser la série ni compter comme une erreur dans les stats.
    const fakeHistory = [
      { correct:true, tier:'top' }, { correct:true, tier:'mixed' }, { correct:false, tier:'error' },
    ];
    const topAndMixedCountAsOk = fakeHistory.slice(0,2).every(i=>i.correct===true);
    assert('Une réponse MIX est comptée comme correcte (pas une erreur) dans les stats', topAndMixedCountAsOk);
  }

  // --- Boutons cohérents avec le contexte ---
  {
    const firstIn = templates.find(t=>t.villainPosition==='—' && (t.actions||[]).length===0);
    assert('Spot first-in : ne propose pas CALL inutilement', !!firstIn && !firstIn.preflop.options.includes('CALL'));
    const facingOpen = templates.find(t=>t.id==='bb-call-q9s');
    assert('Spot face à un open : propose FOLD/CALL/3BET', ['FOLD','CALL','3BET'].every(a=>facingOpen.preflop.options.includes(a)));
  }

  // --- Multiway : positions et séquence d'action affichées correctement ---
  {
    const spot = templates.find(t=>t.id==='co-4bet-qq'); // CO open puis BTN 3-bet
    const log6 = buildActionLog(spot, 6);
    const hasCorrectSequence = log6.some(s=>s.pos==='CO' && s.action==='open') && log6.some(s=>s.pos==='BTN' && s.action==='3bet');
    assert('Séquence d\u2019action multiway : ouvreur et relanceur bien identifiés', hasCorrectSequence);
    const log9 = buildActionLog(spot, 9);
    assert('Séquence d\u2019action 9-max : les positions supplémentaires (UTG+1/MP/LJ) sont bien foldées avant l\u2019action', log9.some(s=>s.pos==='UTG+1'&&s.action==='fold') && log9.some(s=>s.pos==='LJ'&&s.action==='fold'));
  }

  // --- Historique : contient bien main, position, contexte, action, résultat ---
  {
    const sampleItem = { hand:'AQs', position:'BTN', situation:'CO open 2.3 bb', decision:'CALL', tier:'top' };
    const hasAllFields = ['hand','position','situation','decision','tier'].every(k=>sampleItem[k]!==undefined);
    assert('Historique : contient main, position, contexte, action et résultat', hasAllFields);
  }

  // --- Classification structurelle des tirages quinte (pas uniquement par nombre d'outs) ---
  {
    // OESD réel : 9-8-7-6 en main+board, ouvert des deux côtés (5 ou T)
    const hole=[{rank:'9',suit:'♣'},{rank:'8',suit:'♦'}], board=[{rank:'7',suit:'♠'},{rank:'6',suit:'♥'},{rank:'2',suit:'♦'}];
    const c = classifyStraightDraw(hole, board);
    assert('OESD structurel correctement identifié (pas double gutshot)', !!c && c.label==='Quinte par les deux bouts');
  }
  {
    // Double quinte ventrale réelle : Q8 sur T-9-6 (rangs connectants 7 et J, sans suite de 4 déjà formée)
    const hole=[{rank:'Q',suit:'♠'},{rank:'8',suit:'♦'}], board=[{rank:'T',suit:'♣'},{rank:'9',suit:'♥'},{rank:'6',suit:'♠'}];
    const c = classifyStraightDraw(hole, board);
    assert('Double gutshot distingué structurellement d\u2019un OESD (même 8 outs, structure différente)', !!c && c.label.includes('Double quinte ventrale'));
  }
  {
    const hole=[{rank:'J',suit:'♣'},{rank:'T',suit:'♦'}], board=[{rank:'9',suit:'♠'},{rank:'7',suit:'♥'},{rank:'2',suit:'♦'}];
    const c = classifyStraightDraw(hole, board);
    assert('Gutshot simple toujours correctement identifié', !!c && c.label.includes('gutshot') && !c.label.includes('Double'));
  }

  // --- Barre de progression : ne doit jamais afficher 0% juste après avoir complété un bloc de 10 ---
  {
    const sessionPosAt10 = ((10-1) % 10) + 1;
    const sessionPosAt11 = ((11-1) % 10) + 1;
    assert('Progression : 10 décisions → position 10/10 (pas 0%)', sessionPosAt10===10);
    assert('Progression : 11 décisions → repart à 1/10, pas une fausse valeur', sessionPosAt11===1);
  }

  return results;
}
function showTestPanel(){
  const results = runPokerTests();
  const passed = results.filter(r=>r.pass).length;
  let panel = document.getElementById('devTestPanel');
  if(!panel){
    panel = document.createElement('div');
    panel.id = 'devTestPanel';
    panel.style.cssText = 'position:fixed;inset:0;z-index:999;background:rgba(2,11,7,.88);display:flex;align-items:center;justify-content:center;padding:20px;';
    document.body.appendChild(panel);
  }
  panel.innerHTML = `
    <div style="max-width:480px;width:100%;max-height:80vh;overflow:auto;background:#0c2119;border:1px solid #244538;border-radius:16px;padding:20px;font-family:'Space Mono',monospace;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;">
        <strong style="color:#e4b65e;font-size:13px;">Tests internes — ${passed}/${results.length} OK</strong>
        <button id="closeTestPanel" style="all:unset;cursor:pointer;color:#d87561;font-size:16px;">✕</button>
      </div>
      ${results.map(r=>`<div style="padding:6px 0;border-bottom:1px solid #1a382c;font-size:11px;color:${r.pass?'#d5a850':'#e69b8e'}">${r.pass?'✓':'✕'} ${esc(r.name)}</div>`).join('')}
    </div>`;
  document.getElementById('closeTestPanel').onclick = () => panel.remove();
}
document.getElementById('devTestTrigger').onclick = showTestPanel;
try{
  const bootResults = runPokerTests();
  const bootFailed = bootResults.filter(r=>!r.pass);
  if(bootFailed.length){ console.warn(`[poker-tests] ${bootFailed.length}/${bootResults.length} test(s) en échec :`, bootFailed.map(r=>r.name)); }
  else { console.log(`[poker-tests] ${bootResults.length}/${bootResults.length} tests OK`); }
}catch(e){ console.error('[poker-tests] erreur pendant l\u2019exécution des tests', e); }

render();
</script>
