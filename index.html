// Synthèse "coach" sur l'ensemble de la main — pas juste une addition de verdicts street par street.
// Objectif : donner UN fil rouge exploitable plutôt qu'une liste de faits, en identifiant la street
// qui mérite vraiment le travail (l'erreur la plus tardive, puisqu'elle pèse le plus sur le résultat
// et révèle souvent que le plan du flop n'a pas été remis en question quand la texture a changé).
// ============================================================
// COACHING FINAL — version étude
// Une seule conclusion principale, puis les décisions détaillées.
// Le moteur poker reste inchangé : cette couche ne fait que présenter ses résultats.
// ============================================================
function buildEndHandAnalysis(spot, s){
  const graded=(s.handLog||[]).filter(i=>i.tier);
  if(!graded.length) return {mistakes:[],mixes:[],strengths:[],timeline:[],focus:null,situation:''};
  const mistakes=graded.filter(i=>isMistakeTier(i.tier));
  const mixes=graded.filter(i=>i.tier==='acceptable');
  const strengths=graded.filter(i=>i.tier==='optimal'||i.tier==='good');
  const phaseOrder=['Préflop','FLOP','TURN','RIVER'];
  const timeline=phaseOrder.map(phase=>graded.find(i=>i.phase===phase)).filter(Boolean);
  // On choisit la première erreur importante dans l'ordre de la main.
  // Si aucune erreur n'existe, on met en avant un mix à affiner, puis un vrai point fort.
  const focus=mistakes[0]||mixes[0]||strengths[0]||null;
  const situationParts=[];
  if(spot.heroPosition) situationParts.push(spot.heroPosition);
  if(spot.villainPosition && spot.villainPosition!=='—') situationParts.push(`vs ${spot.villainPosition}`);
  if(spot.effectiveStack!=null) situationParts.push(`${spot.effectiveStack} BB`);
  return {mistakes,mixes,strengths,timeline,focus,situation:situationParts.join(' · ')};
}
function phaseLabel(p){
  return ({'Préflop':'Préflop','FLOP':'Flop','TURN':'Turn','RIVER':'River'})[p]||p;
}
function coachingVerdict(item, spot){
  if(!item) return {icon:'•',tag:'',cls:'neutral'};
  const label=String(item.label||'').toLowerCase();
  if(item.tier==='optimal'){
    const trivialFold=item.phase==='Préflop' && label.includes('se coucher') &&
      ['Open first in','Facing 3-bet','Facing 4-bet','Flat / 3-bet'].includes(spot.category||'');
    const automaticCheck=item.phase!=='Préflop' && label.includes('check') && !label.includes('raise');
    if(trivialFold || automaticCheck) return {icon:'⚪',tag:'STANDARD',cls:'neutral'};
    return {icon:'🟢',tag:'BON CHOIX',cls:'ok'};
  }
  if(item.tier==='good') return {icon:'🟢',tag:'TRÈS BON',cls:'ok'};
  if(item.tier==='acceptable') return {icon:'🟡',tag:'À AFFINER',cls:'mix'};
  if(item.tier==='bigerror') return {icon:'🔴',tag:'GROSSE ERREUR',cls:'bad'};
  return {icon:'🟠',tag:'ERREUR',cls:'bad'};
}

function recommendedActionForItem(item){
  if(!item) return null;
  if(item.recommended) return String(item.recommended);
  const m=String(item.solution||'').match(/^\s*\d+(?:\.\d+)?%\s*(.+)$/);
  return m ? m[1].trim() : null;
}
function openRangeMistake(spot, item){
  if(!item || item.phase!=='Préflop' || !isMistakeTier(item.tier)) return false;
  const label=String(item.label||'').toLowerCase();
  if(!label.includes('se coucher')) return false;
  if(spot.category!=='Open first in' || !spot.heroPosition || spot.heroPosition==='BB') return false;
  try{
    return getEffectiveRange({position:spot.heroPosition,effectiveStack:spot.effectiveStack}).includes(spot.handClass);
  }catch(e){ return false; }
}
function preflopCoachingExplanation(item, spot){
  if(!item || item.phase!=='Préflop') return '';
  const action=recommendedActionForItem(item);
  const hero=spot.handClass || 'Cette main';
  const pos=spot.heroPosition || '';
  const stack=spot.effectiveStack!=null ? String(spot.effectiveStack)+' BB' : '';
  if(spot.category==='Open first in'){
    const inRange=(()=>{ try { return !!pos && pos!=='BB' && getEffectiveRange({position:pos,effectiveStack:spot.effectiveStack}).includes(hero); } catch(e){ return false; } })();
    if(inRange && (action||'').toUpperCase()==='OPEN') return `${hero} est dans ta range d’open depuis ${pos}${stack?' à '+stack:''}. Personne n’a parlé avant toi : tu dois ouvrir.`;
    if((action||'').toUpperCase()==='FOLD') return `${hero} est une main à coucher dans ce contexte d’open depuis ${pos}. Personne n’a parlé avant toi, mais cette main ne rentre pas dans ta range.`;
    if(action) return `Ici, personne n’a parlé avant toi depuis ${pos} : la décision se joue sur ta range d’open. La ligne recommandée est ${action}.`;
  }
  if(spot.category==='BB defend'){
    const opener=spot.villainPosition && spot.villainPosition!=='—' ? spot.villainPosition : 'la position adverse';
    if((action||'').toUpperCase()==='CALL') return `Tu es en BB face à un open de ${opener} : ${hero} fait partie de ta défense. Tu peux suivre ici.`;
    if((action||'').toUpperCase()==='FOLD') return `Tu es en BB face à un open de ${opener} : ${hero} est trop faible pour défendre ici. Tu dois te coucher.`;
    if((action||'').toUpperCase()==='3BET') return `Tu es en BB face à un open de ${opener} : ${hero} se défend mieux en 3-bet qu’en simple call ici.`;
    if(action) return `Tu es en BB face à un open de ${opener}. La décision préflop recommandée est ${action}.`;
  }
  if(spot.category==='Facing 3-bet'){
    return `Tu as ouvert puis reçu une 3-bet : ici, la décision porte sur la façon dont ${hero} réagit à cette relance, pas sur le flop à venir. La ligne recommandée est ${action||'celle indiquée'}.`;
  }
  if(spot.category==='Facing 4-bet'){
    return `Tu as reçu une 4-bet : ${hero} doit être évaluée contre cette relance préflop. La ligne recommandée est ${action||'celle indiquée'}.`;
  }
  if(spot.category==='Flat / 3-bet'){
    return `Face à l’open adverse, la décision préflop est de choisir entre défendre en call et 3-bet avec ${hero}. Ici, la ligne recommandée est ${action||'celle indiquée'}.`;
  }
  if(action) return `La décision se joue d’abord sur l’action préflop et ta range. Ici, la ligne recommandée est ${action}.`;
  return '';
}

function coachingConcept(item, spot){
  const text=String((item&&item.explanation)||'').toLowerCase();
  if(item && item.phase==='Préflop'){
    if(spot.category==='Open first in') return 'Range d’open';
    if(spot.category==='BB defend') return 'Défense de blindes';
    if(spot.category==='Facing 3-bet') return 'Réponse à une 3-bet';
    if(spot.category==='Facing 4-bet') return 'Réponse à une 4-bet';
    if(spot.category==='Flat / 3-bet') return 'Call ou 3-bet';
    if(text.includes('position')) return 'Position';
    return 'Décision préflop';
  }
  if(text.includes('range')) return 'Avantage de range';
  if(text.includes('tirage') || text.includes('draw')) return 'Équité et tirages';
  if(text.includes('value')) return 'Value';
  if(text.includes('bluff')) return 'Bluff';
  if(text.includes('board') || text.includes('texture')) return 'Lecture du board';
  if(item && item.phase==='RIVER') return 'Décision river';
  if(item && item.phase==='TURN') return 'Adaptation turn';
  return 'Décision postflop';
}
function conciseExplanation(text){
  let t=String(text||'').trim();
  // Évite les phrases qui décrivent le moteur plutôt que le poker.
  t=t.replace(/Décision issue de données réellement solvées[^:]*:\s*/i,'');
  t=t.replace(/Le jeu de données ne fournit[^.]*\.?\s*/i,'');
  t=t.replace(/selon le solveur/gi,'');
  t=t.replace(/PokerBench[^:]*\.?\s*/gi,'');
  t=t.replace(/traité ici comme une référence forte[^.]*\.?/gi,'');
  t=t.replace(/\s{2,}/g,' ').trim();
  return t;
}
function coachActionLabel(action){
  const raw=String(action||'').trim();
  if(!raw) return '';
  const key=raw.toUpperCase().replace(/\s+/g,'');
  const map={
    'FOLD':'Se coucher','CHECK':'Checker','CALL':'Suivre','OPEN':'Ouvrir','LIMP':'Limp',
    'SHOVE':'Tapis','ALLIN':'Tapis','3BET':'3-bet','4BET':'4-bet','5BET':'5-bet'
  };
  if(map[key]) return map[key];
  let m=raw.match(/^bet\s*(\d+(?:\.\d+)?)%?$/i);
  if(m){
    const n=Number(m[1]);
    if(typeof sizingVocabLabel==='function') return 'Miser '+sizingVocabLabel(n);
    return 'Miser '+n+'% du pot';
  }
  return raw.replace(/\bBET\s+([1-9]\d*)%?\b/gi,(m,n)=>coachActionLabel('BET'+n));
}

function coachText(text){
  return String(text||'').replace(/\bbet\s*([1-9]\d*)\b/gi,(m,n)=>coachActionLabel('BET'+n));
}

function buildEndHandCoachingHtml(spot, s){
  const a=buildEndHandAnalysis(spot,s);
  if(!a.timeline.length) return '';
  const mistakes=[...a.mistakes].sort((x,y)=>{
    const rank={bigerror:0,error:1,acceptable:2,good:3,optimal:4};
    return (rank[x.tier]??9)-(rank[y.tier]??9);
  });
  const mixes=a.mixes;
  // Une erreur préflop de type open first-in doit toujours passer avant une erreur postflop :
  // c'est la décision qui a déterminé si le coup devait même être joué.
  const preflopOpenMistake=mistakes.find(i=>openRangeMistake(spot,i));
  const focus=preflopOpenMistake||mistakes[0]||mixes[0]||null;
  const openMistake=!!preflopOpenMistake;

  let mainLesson='';
  if(openMistake){
    mainLesson=`<div class="coach-main coach-main-error">
      <div class="coach-main-title">Leçon principale</div>
      <div class="coach-main-text"><b>Révise tes ranges d’open !</b> ${esc(spot.handClass)} est dans la range d’open de ${esc(spot.heroPosition)} à ${esc(String(spot.effectiveStack))} BB. Personne n’a parlé avant toi : ici, tu dois ouvrir. Le fold est l’erreur à corriger.</div>
    </div>`;
  }else if(focus){
    const action=recommendedActionForItem(focus);
    let explanation=conciseExplanation(focus.explanation||'');
    // Les templates génériques ne doivent jamais masquer la vraie raison de la décision.
    if(focus.phase==='Préflop'){
      explanation=preflopCoachingExplanation(focus,spot)||explanation;
    }else if(/^Décision préflop standard pour ce contexte/i.test(explanation)){
      explanation='';
    }
    const concept=coachingConcept(focus,spot);
    const verdict=coachingVerdict(focus,spot);
    mainLesson=`<div class="coach-main coach-main-error">
      <div class="coach-main-title">Leçon principale</div>
      <div class="coach-main-text"><b>${esc(phaseLabel(focus.phase))} — ${esc(verdict.tag)}</b>${action ? ` → <b>${esc(action)}</b>` : ''}. ${esc(explanation || 'Cette décision mérite d’être retravaillée.')}</div>
      <div class="coach-main-concept">À travailler : <b>${esc(concept)}</b></div>
    </div>`;
  }else{
    mainLesson=`<div class="coach-main coach-ok">
      <div class="coach-main-title">Leçon principale</div>
      <div class="coach-main-text">Aucune erreur importante. Garde surtout en tête les décisions qui étaient réellement proches ; les folds automatiques ne demandent pas de mémorisation supplémentaire.</div>
    </div>`;
  }

  const otherMistakes=mistakes.filter(i=>i!==focus).slice(0,2);
  const otherHtml=otherMistakes.length ? `<div class="coach-section">
    <div class="coach-section-title">Autres points à corriger</div>
    ${otherMistakes.map(item=>{
      const v=coachingVerdict(item,spot); const act=recommendedActionForItem(item); let exp=conciseExplanation(item.explanation||''); if(item.phase==='Préflop') exp=preflopCoachingExplanation(item,spot)||exp;
      return `<div class="coach-item"><div class="coach-item-head"><span>${esc(phaseLabel(item.phase))}</span><span class="coach-tag ${v.cls}">${v.icon} ${v.tag}</span></div><div class="coach-item-label">${esc(item.label||'Décision')}</div><div class="coach-item-text">${esc(exp)}${act?` <b>À faire : ${esc(act)}.</b>`:''}</div></div>`;
    }).join('')}
  </div>` : '';

  const mixHtml=mixes.length && !mistakes.length ? `<div class="coach-section coach-mix-section">
    <div class="coach-section-title">À affiner</div>
    ${mixes.slice(0,2).map(item=>{
      let exp=conciseExplanation(item.explanation||''); if(item.phase==='Préflop') exp=preflopCoachingExplanation(item,spot)||exp; const act=recommendedActionForItem(item);
      return `<div class="coach-item"><div class="coach-item-head"><span>${esc(phaseLabel(item.phase))}</span><span class="coach-tag mix">🟡 À AFFINER</span></div><div class="coach-item-label">${esc(item.label||'Décision')}</div><div class="coach-item-text">${esc(exp)}${act?` <b>Référence : ${esc(act)}.</b>`:''}</div></div>`;
    }).join('')}
  </div>` : '';

  const timelineHtml=a.timeline.map(item=>{
    const v=coachingVerdict(item,spot);
    const act=recommendedActionForItem(item);
    let exp=conciseExplanation(item.explanation||'');
    if(item.phase==='Préflop'){
      exp=preflopCoachingExplanation(item,spot)||exp;
    }
    const correction=(isMistakeTier(item.tier) && act && String(item.label||'').toLowerCase()!==act.toLowerCase()) ? ` <span class="coach-correction">À faire : ${esc(act)}</span>` : '';
    return `<div class="coach-timeline-row"><div class="coach-timeline-phase">${esc(phaseLabel(item.phase))}</div><div class="coach-timeline-verdict ${v.cls}">${v.icon}</div><div><div class="coach-timeline-label">${esc(item.label||'—')} <span class="coach-small-tag ${v.cls}">${v.tag}</span></div><div class="coach-timeline-text">${esc(exp)}${correction}</div></div></div>`;
  }).join('');

  const counts={
    error:mistakes.filter(i=>isMistakeTier(i.tier)).length,
    mix:mixes.length,
    standard:a.timeline.filter(i=>coachingVerdict(i,spot).tag==='STANDARD').length,
    good:a.timeline.filter(i=>['BON CHOIX','TRÈS BON'].includes(coachingVerdict(i,spot).tag)).length
  };
  const recapParts=[];
  if(counts.error) recapParts.push(`${counts.error} erreur${counts.error>1?'s':''}`);
  if(counts.mix) recapParts.push(`${counts.mix} à affiner`);
  if(counts.good) recapParts.push(`${counts.good} bon${counts.good>1?'s':''} choix`);
  if(counts.standard) recapParts.push(`${counts.standard} standard${counts.standard>1?'s':''}`);
  const recap=recapParts.join(' · ') || 'Aucune décision notée';

  return `<div class="coach-analysis">
    <div class="coach-header"><div><div class="coach-kicker">Analyse de la main</div><div class="coach-recap">${esc(recap)}</div></div>${a.situation?`<div class="coach-situation">${esc(a.situation)}</div>`:''}</div>
    ${mainLesson}
    ${otherHtml}
    ${mixHtml}
    <details class="coach-details"><summary>Voir le détail street par street</summary><div class="coach-timeline">${timelineHtml}</div></details>
  </div>`;
}

function HandSummaryScreen(spot, s){
 // MAIN ADVERSAIRE RÉVÉLÉE — extension demandée : uniquement quand le coup va au bout SANS que
 // personne ne se couche (sinon il n'y a rien à révéler, l'adversaire a mucké). On vérifie tous les
 // points de sortie possibles (fold préflop du héros, fold préflop de l'adversaire, fold face à une
 // relance surprise dans un sens ou l'autre, fold postflop de l'adversaire) plutôt que de supposer.
 const anyoneFolded = s.selected==='FOLD' || s.preflopOutcome==='fold'
 || (s.facingPreflopRaise && s.facingPreflopRaise.response==='FOLD')
 || s.postflopOutcome==='fold'
 || (s.facingSurprise && s.facingSurprise.response==='FOLD');
 const reachedShowdown = !anyoneFolded && spot.villainPosition!=='—' && s.phase==='postflop';
 let villainRevealHtml = '';
 if(reachedShowdown){
 const board = spot.runout.slice(0,5);
 const aggro = villainAggressionStreets(s.streetLog);
 // Réutilise la même fonction partagée que l'affichage sur la table (voir goToPostflop) : si la main
 // a déjà été révélée plus tôt (tapis préflop), on retrouve exactement la même, jamais une nouvelle.
 const vh = ensureVillainHandRevealed(spot, board, aggro);
 const profileLabel = VILLAIN_PROFILES[spot.villainProfile||'reg'].name;
 const aggroNote = aggro>=2 ? ', choisie pour rester cohérente avec son agressivité pendant la main' : '';
 villainRevealHtml = `<div class="profile-note" style="margin-bottom:16px;">

 // Refonte "coach", pas "tableau de stats" : on retire la ligne brute "Référence : 58% Checker" et on

// ÉLÉMENTS PORTÉS DEPUIS L'ANCIEN CODE MORT (FeedbackPreflop / PostflopPanel) VERS LE VRAI FLUX
// (renderTrainer → situation-panel). Restent volontairement des lignes courtes et conditionnelles
// (jamais un paragraphe), pour respecter l'esprit de la refonte : le détail complet reste réservé à
// HandSummaryScreen, l'écran de jeu en direct ne montre qu'un fil très court.
// ============================================================
// Rationale courte affichée juste après une décision NOTÉE (pré ou postflop), tant que le joueur n'a
// pas cliqué "Continuer" — jamais pendant un runout tapis (aucune décision n'est prise à ce moment-là).
function decisionRationaleLine(s){
 if(s.allInRunout) return null;
 const entry = s.handLog[s.handLog.length-1];
 if(!entry || !entry.tier) return null;
 const meta = TIER_META[entry.tier] || TIER_META.error;
 const firstSentence = (entry.explanation||'').split(/(?<=[.!?])\s+/)[0] || '';
 return { text: `${meta.icon} ${meta.tag}${firstSentence ? ` — ${firstSentence}` : ''}`, color: meta.color };
}
// Lecture/avantage de range, seulement quand elle est pertinente (board qui favorise clairement l'une
// des deux ranges, ou lecture spécifique d'une range resserrée identifiée) — jamais affichée sur un
// board neutre pour ne pas surcharger l'écran d'une phrase qui ne dit rien.
function decisionRangeNote(spot, street){
 const board = visibleBoard(spot, street);
 if(board.length<3) return null;
 const aggressorPos = preflopAggressorPosition(spot);
 const heroIsAggressor = aggressorPos===spot.heroPosition;
 const villainTier = !heroIsAggressor ? villainPreflopRangeTier(spot) : null;
 if(villainTier && villainTier.tier==='TIGHT'){
 const coherence = villainRangeCoherenceNote(villainTier, board);
 if(coherence) return `Lecture de sa range : ${coherence}`;
 }
 const adv = classifyRangeAdvantage(board);
 if(adv.favors==='NEUTRAL') return null;
 const who = adv.favors==='AGGRESSOR'
 ? (heroIsAggressor ? 'vous' : aggressorPos)
 : (heroIsAggressor ? 'votre adversaire' : 'vous');
 return `Avantage de range : ce board favorise ${adv.label} (${who}).`;
}
// Question de réflexion, seulement quand la nouvelle carte (turn/river) change vraiment quelque chose
// à la texture du board — jamais au flop (pas de street précédente à comparer), jamais sur une carte
// neutre qui ne modifie rien.
function decisionReflectionPrompt(spot, street){
 if(street==='FLOP') return null;
 const flopCards = spot.runout.slice(0,3);
 if(street==='TURN'){
 return describeNewCard(spot.runout[3], flopCards).length ? 'Cette carte change la texture du board : votre plan du flop tient-il toujours ?' : null;
 }
 if(street==='RIVER'){
 return describeNewCard(spot.runout[4], [...flopCards, spot.runout[3]]).length ? 'La river a changé le board : que raconte réellement votre main, au-delà de l\u2019élan de la turn ?' : null;
 }
 return null;
}

const STATS_TABS = [
 { key:'resume', icon:'&#128202;', label:'Vue d\u2019ensemble' },

function bestStreakFromHistory(history){
 let best=0, cur=0;
 history.forEach(item => { if(item.correct){ cur++; best=Math.max(best,cur); } else cur=0; });
 return best;
}
function statsComputed(){
 const s = state;
 const history = s.history;
 const total = history.length;
 const correct = history.reduce((s,i)=>s+i.correct,0);
 const accuracy = total ? Math.round((correct/total)*100) : 0;
 const topCount = history.filter(i=>i.tier==='optimal' || i.tier==='good').length;
 const mixedCount = history.filter(i=>i.tier==='acceptable').length;
 const errorCount = history.filter(i=>isMistakeTier(i.tier)).length;
 const preflop = history.filter(i=>i.street==='Préflop');
 const postflop = history.filter(i=>i.street!=='Préflop');
 const streetList = ['Préflop','FLOP','TURN','RIVER'];
 const streetStats = streetList.map(street => {
 const items = history.filter(i=>i.street===street);
 const ok = items.reduce((s,i)=>s+i.correct,0);
 return { street, total:items.length, correct:ok, mistakes:items.length-ok, accuracy: items.length? Math.round((ok/items.length)*100) : null };
 });
 const positions = Array.from(new Set(history.map(i=>i.position)));
 const positionStats = (positions.length?positions:SIX_MAX).map(pos => {
 const items = history.filter(i=>i.position===pos);
 const ok = items.reduce((s,i)=>s+i.correct,0);
 return { position:pos, total:items.length, correct:ok, mistakes:items.length-ok, accuracy: items.length? Math.round((ok/items.length)*100) : null };
 });
 const categories = Array.from(new Set(history.map(i=>i.category)));
 const playedStreets = streetStats.filter(x=>x.total>0);
 const playedPositions = positionStats.filter(x=>x.total>0);
 const worstStreet = playedStreets.length ? playedStreets.reduce((a,b)=> b.accuracy<a.accuracy ? b : a) : null;
 const bestStreet = playedStreets.length ? playedStreets.reduce((a,b)=> b.accuracy>a.accuracy ? b : a) : null;
 const worstPosition = playedPositions.length ? playedPositions.reduce((a,b)=> b.accuracy<a.accuracy ? b : a) : null;
 const streak = bestStreakFromHistory(history);
 return { total, correct, accuracy, topCount, mixedCount, errorCount, preflop, postflop, streetStats, positionStats, categories, worstStreet, bestStreet, worstPosition, streak };
}

function timeAgoLabel(ts){

function spotSignatureStats(history, item){

 return { total: matches.length, errors: errors.length, lastErrorAgo: lastError ? timeAgoLabel(lastError.timestamp) : null };
}

 let correct = 0, missed = 0, wrong = 0;
 const cells = MATRIX_LABELS.map(label => {
 const picked = !!rt.picks[label];
 const shouldOpen = refSet.has(label);
 let bg = 'rgba(117,147,134,.12)', color = '#6d8b7d', border = '';
 if(rt.submitted){
 if(picked && shouldOpen){ bg='rgba(213,168,80,.86)'; color='#182419'; correct++; }

 bg='rgba(213,168,80,.86)'; color='#182419';

 return `<button class="cell rt-cell" data-cell="${label}" style="background:${bg};color:${color};${border}" ${rt.submitted?'disabled':''}>${label}</button>`;

 </div>
 ${rt.submitted ? `
 <div class="stats-grid">
 <div class="stat-card"><div class="stat-top"><span class="stat-label">Score</span></div><p class="stat-value">${scorePct}%</p></div>
 <div class="stat-card"><div class="stat-top"><span class="stat-label">Manquées</span></div><p class="stat-value" style="color:var(--gold3)">${missed}</p></div>

 <div class="matrix-wrap">

function renderCoteCalculator(){
 const { pot, bet } = state.coteCalc;
 const call = bet;
 const potFinal = pot + bet + call;
 const potAfterBet = pot + bet;
 const equity = potFinal>0 ? (call/potFinal)*100 : 0;
 const ratio = call>0 ? potAfterBet/call : 0;
 const ratioLabel = ratio ? `${ratio<10 ? (Math.round(ratio*10)/10) : Math.round(ratio)}:1` : '—';
 return `
 <div class="felt-card felt-grid">
 <div class="felt-head"><div class="felt-head-left"><span class="phase-dot" style="background:#d5a850"></span><span class="stat-label">Calculateur de cote (pot odds)</span></div><span class="cat">COTES</span></div>
 <div class="cote-calc">
 <div class="cote-field"><label>Pot avant la mise adverse (bb)</label><input type="number" min="0" step="0.5" id="coteCalcPot" value="${pot}"></div>
 <div class="cote-field"><label>Mise de l\u2019adversaire (bb)</label><input type="number" min="0" step="0.5" id="coteCalcBet" value="${bet}"></div>
 </div>
 <div class="cote-result">
 <div class="row"><span>Montant à payer (call)</span><b>${call.toFixed(1)} bb</b></div>
 <div class="row"><span>Pot final si tu payes</span><b>${potFinal.toFixed(1)} bb</b></div>
 <div class="row"><span>Cote directe (ratio pot : call)</span><b>${ratioLabel}</b></div>

 // classifyPostflopHand/heroBenefitsFromCard (point 1), textures indépendantes (point 3), niveaux de
 // scare cards (point 4), et la hiérarchie force réelle > texture dans les décisions (point 6).
 // --- Main Hero : classifyPostflopHand sur K72 (cas pièges demandés) ---
 {
 const c = (r,s) => ({rank:r, suit:s});
 const board = [c('K','♠'),c('7','♦'),c('2','♣')];
 const kq = classifyPostflopHand([c('K','♦'),c('Q','♠')], board);
 assert('classifyPostflopHand : KQ sur K72 -> TOP_PAIR', kq.madeHand==='TOP_PAIR');
 const k7 = classifyPostflopHand([c('K','♦'),c('7','♠')], board);
 assert('classifyPostflopHand : K7 sur K72 -> TWO_PAIR', k7.madeHand==='TWO_PAIR');
 const pair2 = classifyPostflopHand([c('2','♦'),c('2','♠')], board);
 assert('classifyPostflopHand : 22 sur K72 -> SET', pair2.madeHand==='SET');
 const turnBoard = [...board, c('7','♣')];
 const kqTurn = classifyPostflopHand([c('K','♦'),c('Q','♠')], turnBoard);
 assert('classifyPostflopHand : KQ sur K72, turn 7 -> TWO_PAIR (bug trouvé : le board fournit sa propre 2e paire, même sans carte de Hero dessus)', kqTurn.madeHand==='TWO_PAIR');
 }

 // --- Unification point 1 : heroBenefitsFromCard ne doit jamais contredire classifyPostflopHand ---
 {
 const c = (r,s) => ({rank:r, suit:s});
 const priorBoard = [c('K','♠'),c('7','♦'),c('2','♣')];
 // top paire -> deux paires via la propre paire du board (le 7 n'est pas dans la main de Hero)
 const info1 = heroBenefitsFromCard([c('K','♦'),c('Q','♠')], priorBoard, c('7','♣'));
 assert('heroBenefitsFromCard : top paire -> deux paires via le board seul -> madeHandUpgraded', info1.madeHandUpgraded===true && info1.improved===true);
 assert('heroBenefitsFromCard : la carte qui améliore n\u2019est pas dans la main de Hero (heroPairsUp=false)', info1.heroPairsUp===false);
 // set -> full via une paire du board sur un rang totalement étranger à la main de Hero
 const infoSet = heroBenefitsFromCard([c('2','♦'),c('2','♥')], priorBoard, c('K','♦'));
 assert('heroBenefitsFromCard : set -> full via le board seul -> madeHandUpgraded', infoSet.madeHandUpgraded===true);
 assert('heroBenefitsFromCard : idem, carte absente de la main de Hero', infoSet.heroPairsUp===false);
 // contre-exemple : une main totalement déconnectée du board n'est jamais "améliorée" par une paire
 // du board qui ne la concerne pas.
 const infoAir = heroBenefitsFromCard([c('A','♥'),c('Q','♦')], priorBoard, c('7','♠'));
 assert('heroBenefitsFromCard : main déconnectée + paire du board hors sujet -> pas amélioré', infoAir.improved===false);
 }

 // --- Textures indépendantes (point 3) ---
 {
 const c = (r,s) => ({rank:r, suit:s});
 const t1 = computeBoardTexture([c('K','♠'),c('K','♦'),c('2','♣')]);
 assert('computeBoardTexture : KK2 rainbow -> paired=true, drawHeavy=false', t1.paired===true && t1.drawHeavy===false);
 const t2 = computeBoardTexture([c('K','♠'),c('K','♦'),c('2','♠')]);
 assert('computeBoardTexture : KK2 avec deux piques -> paired=true, flushHeavy=true', t2.paired===true && t2.flushHeavy===true);
 const t3 = computeBoardTexture([c('8','♠'),c('7','♠'),c('6','♦')]);
 assert('computeBoardTexture : 876 two-tone -> paired=false, drawHeavy/straightHeavy/flushHeavy=true', t3.paired===false && t3.drawHeavy===true && t3.straightHeavy===true && t3.flushHeavy===true);
 const t4 = computeBoardTexture([c('8','♠'),c('7','♦'),c('6','♣')]);
 assert('computeBoardTexture : 876 rainbow -> straightHeavy=true, flushHeavy=false (propriétés indépendantes)', t4.straightHeavy===true && t4.flushHeavy===false);
 const t5 = computeBoardTexture([c('A','♠'),c('7','♦'),c('2','♣')]);
 assert('computeBoardTexture : A72 rainbow -> dry=true', t5.dry===true);
 const t6 = computeBoardTexture([c('A','♠'),c('K','♦'),c('7','♣')]);
 assert('computeBoardTexture : AK7 rainbow -> dry=true', t6.dry===true);
 const t7 = computeBoardTexture([c('8','♠'),c('7','♠'),c('6','♦'),c('T','♥')]);
 assert('computeBoardTexture : 876T -> straightHeavy reste vrai', t7.straightHeavy===true);
 }

 // --- Scary cards (point 4) : une carte plus haute n'est pas automatiquement une scare card ---
 {
 const c = (r,s) => ({rank:r, suit:s});
 const flop = [c('A','♠'),c('7','♦'),c('2','♣')];
 const dK = assessCardDanger(c('K','♥'), flop);
 assert('assessCardDanger : Roi sur A72 (turn) n\u2019est PAS important/majeur (juste une carte plus haute)', dK.level!=='IMPORTANT' && dK.level!=='MAJOR');
 const twoTone = [c('K','♠'),c('9','♠'),c('4','♦')];
 const dFlush = assessCardDanger(c('2','♠'), twoTone);
 assert('assessCardDanger : 3e pique sur un board two-tone -> couleur faite pour un tirage -> MAJOR', dFlush.level==='MAJOR' && dFlush.flushMade===true);
 const dPair = assessCardDanger(c('7','♥'), flop);
 assert('assessCardDanger : le board qui se paire (A72 -> A772) -> IMPORTANT (ranges affectées, pas majeur)', dPair.level==='IMPORTANT' && dPair.boardPaired===true);
 const wetFlop = [c('8','♠'),c('7','♠'),c('6','♦')];
 const dMajor = assessCardDanger(c('T','♠'), wetFlop);
 assert('assessCardDanger : 8s7s6d -> Ts (3e pique sur un board déjà très connecté) -> MAJOR', dMajor.level==='MAJOR');
 const dStraightMade = assessCardDanger(c('5','♥'), [c('8','♦'),c('7','♣'),c('6','♠'),c('9','♥')]);
 assert('assessCardDanger : 876T -> 5 complète réellement une quinte au board -> MAJOR', dStraightMade.level==='MAJOR' && dStraightMade.straightCompleted===true);
 }

 // --- Décisions : la hiérarchie (force réelle > texture) doit primer (point 6) ---
 {
 const c = (r,s) => ({rank:r, suit:s});
 // Main très forte (set) + board sec : mise pour la value sur toutes les streets.
 const spotStrongDry = { hole:[c('2','♦'),c('2','♥')], runout:[c('2','♠'),c('9','♦'),c('4','♣'),c('K','♥'),c('3','♦')], post:{ FLOP:{action:'BET 50%'} } };
 const rDry = computeDynamicStreetPost(spotStrongDry);
 assert('computeDynamicStreetPost : set + board sec -> mise sur turn et river', rDry.TURN.action.startsWith('BET') && rDry.RIVER.action.startsWith('BET'));
 // Main très forte + board draw-heavy : reste value (mise plus gros), la texture ne fait jamais
 // checker une main qui reste top de range.
 const spotStrongWet = { hole:[c('2','♦'),c('2','♥')], runout:[c('2','♠'),c('9','♠'),c('4','♠'),c('K','♥'),c('3','♦')], post:{ FLOP:{action:'BET 50%'} } };
 const rWet = computeDynamicStreetPost(spotStrongWet);
 assert('computeDynamicStreetPost : set + board draw-heavy -> continue de miser (plus gros)', rWet.TURN.action==='BET 75%' && rWet.RIVER.action==='BET 75%');
 // Main moyenne/faible (underpair) qui ne touche pas le rang qui paire : scare card réelle sans
 // amélioration -> check, pas de value bet à l\u2019aveugle.
 const spotUnderpairScare = { hole:[c('8','♦'),c('8','♥')], runout:[c('K','♠'),c('9','♦'),c('4','♣'),c('9','♠'),c('3','♦')], post:{ FLOP:{action:'BET 50%'} } };
 const rUnderpair = computeDynamicStreetPost(spotUnderpairScare);
 assert('computeDynamicStreetPost : underpair + board qui se paire sans l\u2019améliorer -> check turn et river', rUnderpair.TURN.action==='CHECK' && rUnderpair.RIVER.action==='CHECK');
 // Bluff avec tirage couleur raté : initiative prise au flop (semi-bluff), tirage manqué, runout
 // neutre ensuite -> le plan de bluff continue plutôt que de s\u2019arrêter par réflexe.
 const spotBluffMissed = { hole:[c('K','♠'),c('Q','♠')], runout:[c('9','♠'),c('5','♠'),c('2','♦'),c('J','♥'),c('A','♦')], post:{ FLOP:{action:'BET 50%'} } };
 const rBluff = computeDynamicStreetPost(spotBluffMissed);
 assert('computeDynamicStreetPost : tirage couleur raté avec initiative + runout neutre -> continue de miser', rBluff.TURN.action.startsWith('BET') && rBluff.RIVER.action.startsWith('BET'));
 // Bluff catcher river : main moyenne sans initiative sur un runout calme -> check jusqu'au bout,
 // pas de sur-classification en "scare" pour des cartes qui ne changent rien réellement.
 const spotBluffCatcher = { hole:[c('9','♦'),c('9','♣')], runout:[c('K','♠'),c('7','♦'),c('2','♣'),c('4','♥'),c('J','♦')], post:{ FLOP:{action:'CHECK'} } };
 const rCatcher = computeDynamicStreetPost(spotBluffCatcher);
 assert('computeDynamicStreetPost : bluff catcher sur runout calme sans initiative -> check jusqu\u2019au bout', rCatcher.TURN.action==='CHECK' && rCatcher.RIVER.action==='CHECK');
 }

 return results;
}
function showTestPanel(){
 const results = runPokerTests();
 const passed = results.filter(r=>r.pass).length;
 let panel = document.getElementById('devTestPanel');
 if(!panel){
 panel = document.createElement('div');
 panel.id = 'devTestPanel';
 panel.style.cssText = 'position:fixed;inset:0;z-index:999;background:rgba(2,11,7,.88);display:flex;align-items:center;justify-content:center;padding:20px;';
 document.body.appendChild(panel);
 }
 panel.innerHTML = `
 <div style="max-width:480px;width:100%;max-height:80vh;overflow:auto;background:#0c2119;border:1px solid #244538;border-radius:16px;padding:20px;font-family:'Space Mono',monospace;">
 <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;">
 <strong style="color:#e4b65e;font-size:13px;">Tests internes — ${passed}/${results.length} OK</strong>
 <button id="closeTestPanel" style="all:unset;cursor:pointer;color:#d87561;font-size:16px;">✕</button>
 </div>
 ${results.map(r=>`<div style="padding:6px 0;border-bottom:1px solid #1a382c;font-size:11px;color:${r.pass?'#d5a850':'#e69b8e'}">${r.pass?'✓':'✕'} ${esc(r.name)}</div>`).join('')}
 </div>`;
 document.getElementById('closeTestPanel').onclick = () => panel.remove();
}
document.getElementById('devTestTrigger').onclick = showTestPanel;

function showChangelogPanel(){
 let panel = document.getElementById('changelogPanel');
 if(!panel){

 panel.style.cssText = 'position:fixed;inset:0;z-index:999;background:rgba(2,11,7,.88);display:flex;align-items:center;justify-content:center;padding:20px;';
 document.body.appendChild(panel);
 }

 <div style="max-width:480px;width:100%;max-height:80vh;overflow:auto;background:#0c2119;border:1px solid #244538;border-radius:16px;padding:20px;">
 <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;">
 <strong style="color:#e4b65e;font-size:14px;">&#128220; Changelog</strong>

 </div>
 ${CHANGELOG.map(v => `
 <div style="margin-bottom:18px;">
  <p style="margin:0 0 8px;font-family:'Space Mono',monospace;font-size:12px;color:#d5a850;">${v.version}</p>
  ${v.items.map(it=>`<p style="margin:0 0 6px;font-size:12px;line-height:1.5;color:#a5b8a5;">• ${it}</p>`).join('')}
 </div>`).join('')}
 </div>`;
 document.getElementById('closeChangelogPanel').onclick = () => panel.remove();
}
document.getElementById('changelogTrigger').onclick = showChangelogPanel;

 else { console.log(`[poker-tests] ${bootResults.length}/${bootResults.length} tests OK`); }
}catch(e){ console.error('[poker-tests] erreur pendant l\u2019exécution des tests', e); }

render();
