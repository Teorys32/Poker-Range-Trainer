<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Range / Desk — local</title>
<style>
/* BUG CORRIGÉ (LOT 2 #14) : "aucune connexion requise" (cf. sidebar) était faux tant que cet @import
 vers Google Fonts était présent — hors ligne, la requête échoue (silencieusement, mais elle échoue :
 c'est le 403/timeout qu'on voit dans la console), et selon le navigateur ça peut retarder le premier
 rendu (le temps que le CSS externe échoue) avant de retomber sur le fallback. Remplacé par une pile de
 polices SYSTÈME uniquement (aucune requête réseau, jamais) : DM Sans est une géométrique sans-serif —
 rapprochée ici de system-ui/Segoe UI/Roboto, déjà présentes sur la quasi-totalité des appareils ; Space
 Mono est une monospace à chasse fixe — rapprochée de ui-monospace/SFMono/Menlo/Consolas. L'app garde un
 style cohérent partout, juste avec les polices déjà installées sur l'appareil plutôt que téléchargées. */

:root{
 --bg:#081913; --sidebar:#071712; --card:#0c2119; --panel:#0d241b; --panel2:#10271f;
 --border:#1d3b31; --border2:#244538; --border3:#25483a; --border4:#27513f; --border5:#234536; --border6:#214235;
 --gold:#d5a850; --gold2:#e4b65e; --gold3:#e5bd67; --gold4:#f0c46f; --gold5:#eecb79; --gold6:#e6ba63; --gold7:#e8bc62;
 --cream:#f3e9ce; --cream2:#f5e9c9; --cream3:#f4e8ca; --cream4:#eee1c2; --cream5:#d2dfce; --cream6:#e0e5d5;
 --muted:#8ea699; --muted2:#8da89a; --muted3:#718e7f; --muted4:#829d8d; --muted5:#90a99b; --muted6:#668475; --muted7:#5e7e6e; --muted8:#759386; --muted9:#799687; --muted10:#91a99c; --muted11:#a8b9a5;
 --red:#d87561; --red2:#e69b8e; --green:#7fae8d;
 --shadow:0 18px 45px rgba(1,12,9,.24);
 --font-sans:-apple-system,system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
 --font-mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;
}
*{box-sizing:border-box;}
html{background:var(--bg);}
body{
 margin:0;min-width:320px;
 background:
 radial-gradient(circle at 78% -10%, rgba(199,156,72,.10), transparent 26rem),
 radial-gradient(circle at 15% 92%, rgba(42,122,91,.10), transparent 30rem),
 var(--bg);
 color:var(--cream); font-family:var(--font-sans); -webkit-font-smoothing:antialiased;
}
button,a,input,select{font:inherit;}
button{cursor:pointer;background:none;border:none;color:inherit;}
.mono{font-family:var(--font-mono);letter-spacing:-.03em;}
@keyframes rise-in{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.animate-rise{animation:rise-in.42s ease both;}
/* BUG CORRIGÉ (LOT 1 #9) : réglage d'animations (off/rapide/normal, via .anim-off/.anim-fast sur
 .table-stage) + accessibilité (prefers-reduced-motion, indépendant du réglage manuel). Portée
 volontairement limitée aux animations SVG de TableFX (jetons, folds, pot, cartes) : n'affecte pas
 le rise-in d'entrée de la table elle-même ni le reste de l'interface. */
.table-stage.anim-fast svg *, .table-stage.anim-fast svg *::before, .table-stage.anim-fast svg *::after{animation-duration:90ms!important;animation-delay:0ms!important;}
.table-stage.anim-off svg *, .table-stage.anim-off svg *::before, .table-stage.anim-off svg *::after{animation:none!important;}
@media (prefers-reduced-motion: reduce){
 .table-stage svg *, .table-stage svg *::before, .table-stage svg *::after{animation:none!important;}
}
.felt-grid{background-image:linear-gradient(rgba(210,176,94,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(210,176,94,.045) 1px, transparent 1px); background-size:22px 22px;}
/* LOT 4 — la table (SVG) restait plafonnée à 380px de large même sur un écran large où le reste de
 l'interface (.page) monte jusqu'à 1280px : sur desktop, elle apparaissait toute petite au milieu d'un
 espace largement inutilisé. Grandit par palier avec la largeur de viewport ; le viewBox interne du SVG
 (voir TableViz) ne change pas, donc tout ce qui est dessiné dedans (sièges, jetons, cartes) reste aux
 mêmes proportions relatives, juste affiché plus grand. */
.table-svg{width:100%;max-width:380px;height:auto;display:block;margin:0 auto;}
@media(min-width:640px){.table-svg{max-width:480px;}}
@media(min-width:1000px){.table-svg{max-width:560px;}}
.noise::after{content:'';position:fixed;inset:0;pointer-events:none;opacity:.025;z-index:50;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.65'/%3E%3C/svg%3E");}

/* layout */
.sidebar{position:fixed;inset:0 auto 0 0;z-index:40;width:258px;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--sidebar);padding:20px 16px;transition:transform.3s;transform:translateX(-100%);}
.sidebar.open{transform:translateX(0);}
@media(min-width:1024px){.sidebar{transform:translateX(0);}}
.icon-mark{display:flex;height:40px;width:40px;align-items:center;justify-content:center;border-radius:12px;border:1px solid rgba(201,155,72,.4);background:rgba(201,155,72,.1);color:var(--gold2);}
.brand-row{display:flex;align-items:center;gap:12px;padding:0 8px;}
.brand-title{font-weight:600;letter-spacing:-.03em;color:var(--cream2);margin:0;}
.brand-sub{margin:2px 0 0;font-size:9px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted4);}
.nav-section{margin-top:44px;padding:0 8px;}
.nav-label{margin-bottom:12px;font-size:10px;text-transform:uppercase;letter-spacing:.2em;color:var(--muted7);}
.nav-link{display:flex;align-items:center;gap:12px;border-radius:8px;padding:12px;font-size:14px;color:var(--muted10);text-decoration:none;margin-bottom:4px;}
.nav-link:hover{background:var(--panel2);color:var(--cream2);}
.nav-link.active{background:rgba(201,155,72,.12);color:var(--gold4);}
.nav-link.dot{margin-left:auto;height:6px;width:6px;border-radius:50%;background:#d9aa56;}
.sidebar-footer{margin-top:auto;border-radius:12px;border:1px solid var(--border);background:var(--card);padding:16px;}
.sidebar-footer-title{display:flex;align-items:center;gap:8px;color:var(--gold);margin-bottom:10px;font-size:10px;text-transform:uppercase;letter-spacing:.16em;}
.sidebar-footer p{font-size:12px;line-height:1.5;color:var(--muted2);margin:0;}
.sidebar-version{padding:20px 8px 0;font-size:9px;text-transform:uppercase;letter-spacing:.18em;color:#46675a;}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(2,11,7,.7);}
@media(min-width:1024px){.overlay{display:none;}}

.topbar{position:sticky;top:0;z-index:20;display:flex;height:72px;align-items:center;justify-content:space-between;border-bottom:1px solid #1b372c;background:rgba(8,25,19,.9);backdrop-filter:blur(8px);padding:0 16px;}
@media(min-width:1024px){.topbar{margin-left:258px;padding:0 40px;}}
.menu-btn{padding:8px;border-radius:8px;color:var(--muted10);}
@media(min-width:1024px){.menu-btn{display:none;}}
.topbar-eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#678476;margin:0;}
.topbar-title{margin:2px 0 0;font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--cream3);}
.topbar-actions{display:flex;align-items:center;gap:8px;}
.tb-btn{display:flex;align-items:center;gap:8px;border-radius:8px;border:1px solid var(--border3);padding:8px 12px;font-size:12px;color:var(--muted2);}
.tb-btn:hover{border-color:rgba(201,155,72,.6);color:var(--gold4);}
@media(max-width:480px){.hide-sm{display:none;}}

main{min-height:calc(100dvh - 72px);}
@media(min-width:1024px){main{margin-left:258px;}}
.page{max-width:1280px;margin:0 auto;padding:24px 16px 40px;}
@media(min-width:640px){.page{padding:36px 28px;}}
@media(min-width:1024px){.page{padding:36px 40px;}}
.page-header{margin-bottom:32px;display:flex;flex-direction:column;justify-content:space-between;gap:20px;}
@media(min-width:640px){.page-header{flex-direction:row;align-items:flex-end;}}
.eyebrow{margin:0 0 8px;font-size:10px;text-transform:uppercase;letter-spacing:.25em;color:var(--gold);}
.page-h2{margin:0;font-size:34px;font-weight:600;line-height:1.05;letter-spacing:-.07em;color:var(--cream);}
@media(min-width:640px){.page-h2{font-size:44px;}}
.page-h2.accent{color:var(--gold);}
.page-lede{margin-top:16px;max-width:32rem;font-size:14px;line-height:1.6;color:var(--muted);}
.seg{display:flex;align-items:center;gap:4px;border-radius:8px;border:1px solid var(--border2);background:var(--panel2);padding:4px;}
.seg button{border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted4);}
.seg button.active{background:var(--gold);color:#132118;}
.diff-select{display:flex;align-items:center;gap:8px;border-radius:8px;border:1px solid var(--border2);background:var(--panel2);padding:8px 12px;font-size:12px;color:#9bb09f;}
.diff-select select{background:transparent;border:none;color:#d8dfcf;outline:none;font-size:12px;}
.link-pill{display:flex;align-items:center;gap:8px;border-radius:8px;border:1px solid var(--border2);padding:8px 12px;font-size:12px;color:var(--muted2);text-decoration:none;width:fit-content;}
.link-pill:hover{border-color:rgba(213,168,80,.6);color:var(--gold4);}

.stats-grid{margin-bottom:28px;display:grid;gap:12px;grid-template-columns:1fr;}
@media(min-width:640px){.stats-grid{grid-template-columns:repeat(2,1fr);}}
@media(min-width:1024px){.stats-grid{grid-template-columns:repeat(4,1fr);}}
.stats-grid.trainer{grid-template-columns:repeat(3,1fr);}
.stat-card{border-radius:12px;border:1px solid var(--border);background:var(--card);padding:16px;}
.stat-top{margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted6);}
.stat-value{font-size:20px;color:var(--gold5);margin:0;}
.stat-value.cap{font-size:12px;color:#718e7f;}
.stat-caption{margin-top:4px;font-size:11px;color:#718e7f;}

.progress-row{margin-bottom:28px;display:flex;align-items:center;gap:12px;}
.progress-track{height:4px;flex:1;overflow:hidden;border-radius:99px;background:#173126;}
.progress-fill{height:100%;border-radius:99px;background:var(--gold);transition:width.5s;}
.progress-note{font-size:10px;color:#708d7e;white-space:nowrap;}

.felt-card{border-radius:16px;border:1px solid var(--border4);background:var(--panel);padding:16px;box-shadow:var(--shadow);}
@media(min-width:640px){.felt-card{padding:28px;}}
.felt-head{margin-bottom:28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border5);padding-bottom:16px;}
.felt-head-left{display:flex;align-items:center;gap:8px;}
.phase-dot{height:8px;width:8px;border-radius:50%;}
.felt-head.cat{font-size:10px;color:#5d796c;}

.pill-gold{display:inline-flex;border:1px solid rgba(201,155,72,.3);background:rgba(201,155,72,.1);border-radius:4px;padding:4px 8px;font-size:10px;font-weight:700;letter-spacing:.15em;color:var(--gold6);}
.pill-outline{display:inline-flex;border:1px solid var(--border4);background:var(--panel2);border-radius:4px;padding:4px 8px;font-size:10px;letter-spacing:.12em;color:#91aa9c;}

.cards-row{display:flex;align-items:center;gap:8px;}
.card{display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid rgba(215,189,131,.5);background:#f3ecd9;font-weight:600;letter-spacing:-.08em;box-shadow:3px 4px 0 rgba(197,153,69,.28);}
.card.large{height:76px;width:56px;font-size:22px;}
@media(min-width:640px){.card.large{height:92px;width:68px;font-size:28px;}}
.card.small{height:44px;width:36px;font-size:14px;}
.card.back-card{background:repeating-linear-gradient(135deg,#173026,#173026 6px,#0f2119 6px,#0f2119 12px);border:1px solid #2a4e3e;color:#4c6a5a;box-shadow:none;font-weight:700;}

.table-stage{padding-bottom:8px;}
.situation-panel{margin-top:10px;border-radius:10px;border:1px solid #244538;background:#0c2119;padding:10px 14px;}
.situation-panel.sp-context{margin:0;font-size:13px;line-height:1.4;color:#e4b65e;font-weight:600;}
.fixed-action-bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:linear-gradient(to top, rgba(8,25,19,.98) 65%, rgba(8,25,19,.9));backdrop-filter:blur(6px);padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #1d3b31;}
@media(min-width:1024px){.fixed-action-bar{left:258px;}}
.fixed-action-bar-inner{max-width:900px;margin:0 auto;}
.fixed-action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.fixed-action-grid.cols-4{grid-template-columns:repeat(4,1fr);}
.fixed-action-wrap{display:flex;flex-wrap:wrap;gap:8px;}
.fixed-action-wrap.fab-btn{flex:1 1 28%;min-width:64px;}
.fab-btn{border-radius:10px;padding:12px 8px;font-size:13px;font-weight:700;text-align:center;border:1px solid;}
.fab-btn.primary{border-color:rgba(213,168,80,.6);background:var(--gold);color:#162218;}
.fab-btn.call{border-color:rgba(127,174,141,.5);background:#193b2b;color:#d6e7d5;}
.fab-btn.plain{border-color:#476756;background:#112a20;color:#d6e1d4;}
.fab-btn.continue{border-color:rgba(213,168,80,.6);background:var(--gold);color:#162218;grid-column:1/-1;}
.fab-note{margin:0 0 8px;text-align:center;font-size:11px;color:#6e8b7d;}
.hand-summary-item{border-radius:10px;border:1px solid var(--border);background:var(--card);padding:12px 14px;margin-bottom:8px;}
.hand-summary-item.hs-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;}
.hand-summary-item.hs-phase{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#7fae8d;}
.hand-summary-item.hs-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;}
.hand-summary-item.hs-tag.ok{background:rgba(213,168,80,.18);color:var(--gold3);}
.hand-summary-item.hs-tag.mix{background:rgba(213,168,80,.1);color:#f0c98a;}
.hand-summary-item.hs-tag.bad{background:rgba(216,117,97,.15);color:var(--red2);}
.hand-summary-item.hs-tag.neutral{background:rgba(142,166,153,.12);color:#8ea699;}
.hand-summary-item.hs-label{font-size:14px;font-weight:600;color:var(--cream3);margin:0 0 4px;}
.hand-summary-item.hs-text{font-size:12px;line-height:1.6;color:#a5b8a5;margin:0;white-space:pre-line;}

.feedback{border-radius:16px;border:1px solid;padding:16px;}
@media(min-width:640px){.feedback{padding:24px;}}
.feedback.ok{border-color:rgba(201,155,72,.45);background:#13291e;}
.feedback.bad{border-color:rgba(216,117,97,.45);background:#2a1a17;}
.feedback.mix{border-color:rgba(224,149,74,.5);background:#2a2114;}
.profile-note{margin-top:16px;border-radius:10px;border:1px solid #3a5d4b;background:rgba(16,39,31,.6);padding:12px 14px;}
.profile-note-head{margin:0;font-size:12px;font-weight:600;color:#cfe0d5;}
.profile-note-head b{color:var(--gold4);}
.profile-tag{margin-left:6px;border-radius:4px;background:rgba(213,168,80,.14);color:var(--gold3);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 6px;}
.profile-note-text{margin:6px 0 0;font-size:12px;line-height:1.5;color:#9bb09f;}
/* CODE MORT SUPPRIMÉ (audit, sur demande) — .action-feed* stylait ActionFeed(), supprimée ci-dessus. */
.btn-gold{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;background:var(--gold);padding:10px 16px;font-size:14px;font-weight:600;color:#142117;}
.btn-outline{border-radius:8px;border:1px solid #3a5d4b;padding:10px 16px;font-size:14px;font-weight:600;color:#d3dfd0;}
.btn-outline:hover{background:#1b382b;}

.matrix-wrap.m-head{margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.m-title{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted8);}
.m-legend{display:flex;gap:12px;font-size:10px;color:#839b8e;}
.m-legend i{margin-right:4px;display:inline-block;height:8px;width:8px;border-radius:2px;}
.matrix{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px;border-radius:6px;border:1px solid #25483a;background:#081913;padding:6px;}
.matrix.cell{display:flex;aspect-ratio:1;align-items:center;justify-content:center;border-radius:2px;font-family:var(--font-mono);font-size:7px;}
@media(min-width:640px){.matrix.cell{font-size:8px;}}
.matrix.cell.current{box-shadow:0 0 0 2px #f5e6bd;}

.odds-panel{border-radius:12px;border:1px solid #315846;background:rgba(16,39,31,.8);padding:20px;}
.odds-panel.compact{padding:16px;}
.odds-head{margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
.odds-head-l{display:flex;align-items:center;gap:8px;color:#e5bd67;}
.odds-head-l p{font-size:10px;text-transform:uppercase;letter-spacing:.17em;margin:0;}
.odds-head-r{font-size:9px;color:#6d8b7d;}
.odds-empty{font-size:12px;line-height:1.4;color:#829d8d;}
.odds-stat{border-radius:8px;border:1px solid #244538;background:#0c2119;padding:12px;margin-bottom:12px;}
.odds-stat:last-child{margin-bottom:0;}

.odds-stat-top.name{font-size:14px;font-weight:600;color:#e8ddbd;margin:0;}
.odds-stat-top.outs{font-family:var(--font-mono);font-size:12px;color:#e4b65e;}
.odds-stat-grid{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}

.odds-stat.detail{margin:8px 0 0;font-size:11px;line-height:1.4;color:#799687;}
.odds-footnote{margin-top:16px;border-top:1px solid #214235;padding-top:12px;font-size:11px;line-height:1.4;color:#6f8d7e;}

.aside-card{border-radius:16px;border:1px solid var(--border);background:var(--card);padding:20px;}
.aside-card +.aside-card{margin-top:16px;}
.aside-title{display:flex;align-items:center;gap:8px;color:#e5bd67;margin-bottom:16px;}
.aside-title p{font-size:10px;text-transform:uppercase;letter-spacing:.18em;margin:0;}
.aside-text{font-size:14px;line-height:1.55;color:#a5b8a5;margin:0;}
.history-empty{font-size:12px;line-height:1.4;color:#718e7f;}
.tier-breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.tier-cell{border-radius:10px;border:1px solid #244538;background:#0c2119;padding:14px;text-align:center;}
.tier-cell.n{font-family:var(--font-mono);font-size:22px;margin:0;}
.tier-cell.l{margin:4px 0 0;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#829d8d;}
.tier-cell.ok.n{color:var(--gold4);}
.tier-cell.mix.n{color:#e0954a;}
.tier-cell.bad.n{color:#e6a093;}
.tier-note{margin:12px 0 0;font-size:11px;line-height:1.5;color:#718e7f;}

.empty-state{margin-top:24px;border-radius:16px;border:1px dashed #315643;background:var(--card);padding:64px 24px;text-align:center;}
.empty-state.circ{margin:0 auto;display:flex;height:48px;width:48px;align-items:center;justify-content:center;border-radius:50%;border:1px solid rgba(201,155,72,.3);background:rgba(201,155,72,.1);color:var(--gold);}
.empty-state h3{margin-top:20px;font-size:18px;font-weight:600;color:var(--cream4);}
.empty-state p{margin:8px auto 0;max-width:24rem;font-size:14px;line-height:1.5;color:#829d8d;}

.section-card{border-radius:16px;border:1px solid var(--border);background:var(--card);padding:20px;}
@media(min-width:640px){.section-card{padding:24px;}}
.section-head{margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;}
.section-head h3{margin:4px 0 0;font-size:18px;font-weight:600;color:var(--cream4);}
.bar-track{height:8px;flex:1;overflow:hidden;border-radius:99px;background:#183326;}
.bar-fill{height:100%;border-radius:99px;}
/* CODE MORT SUPPRIMÉ (audit) — .bar-fill.zero / .bar-fill.some : les deux usages réels de .bar-fill
 (stats par position/décision) fixent la couleur en ligne (style="...background:...") plutôt que via ces

.filters-row{margin-bottom:20px;display:flex;flex-wrap:wrap;gap:8px;}

ckground:#091a13}.coach-details summary{cursor:pointer;padding:11px 2px;font-size:11px;color:#9ab0a2}.coach-timeline-row{display:grid;grid-template-columns:66px 22px 1fr;gap:8px;align-items:start;padding:9px 0;border-top:1px solid rgba(65,91,79,.35)}.coach-timeline-phase{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#718e7f;padding-top:2px}.coach-timeline-verdict{font-size:12px}.coach-timeline-verdict.ok{color:#8fd19e}.coach-timeline-verdict.mix{color:#f0c98a}.coach-timeline-verdict.bad{color:#e6a093}.coach-timeline-verdict.neutral{color:#9ab0a2}.coach-timeline-label{font-size:12px;color:var(--cream);font-weight:600}.coach-small-tag{margin-left:6px}.coach-timeline-text{font-size:11px;line-height:1.45;color:#9ab0a2;margin-top:3px;white-space:pre-line}.coach-correction{display:block;color:#d5a850;margin-top:3px}

// BUG CORRIGÉ (retour d'usage — "la bonne mise ici est 80% frérot, j'ai seulement le bouton 1/3 2/3
// pot") : les boutons de mise proposés au flop/turn/river étaient une liste FIXE (33/50/75, +125% à la
// river), sans aucun rapport avec la taille réellement recommandée par le spot. Dès qu'un spot demandait
// une taille hors de cette liste (trouvé : 19%, 40%, 66%, 80% sur 5 fiches au total, dont un QQ en CO à
// 80% pot), la bonne réponse n'apparaissait tout simplement PAS parmi les boutons — impossible à
// sélectionner, quoi que fasse le joueur. ensureBetOption() garantit maintenant que l'action recommandée
// fait toujours partie des options, en l'insérant à sa place (ordre croissant) si elle manque.
// DEMANDE UTILISATEUR (suite) — plutôt que de ne rajouter un bouton qu'au coup par coup pour LA fiche
// concernée, 25% et 80% rejoignent la liste standard proposée partout (flop/turn/river), en plus des
// tailles déjà là. ensureBetOption() reste en filet de sécurité pour les rares tailles encore plus
// inhabituelles (19%, 40%, 66%) qui ne méritent pas un bouton permanent.
function ensureBetOption(options, action){
 const m = String(action).match(/^BET\s*(\d+)%?$/i);
 if(!m) return options;
 const label = `BET ${m[1]}%`;
 if(options.includes(label)) return options;
 const bets = options.filter(o=>/^BET/.test(o)).concat([label])
   .sort((a,b)=>parseInt(a.match(/\d+/)[0],10)-parseInt(b.match(/\d+/)[0],10));
 const result = [];
 if(options.includes('CHECK')) result.push('CHECK');
 result.push(...bets);
 if(options.includes('FOLD')) result.push('FOLD');
 return result;
}
const STANDARD_BET_OPTIONS = ['CHECK','BET 25%','BET 33%','BET 50%','BET 75%','BET 80%'];
function basePost(flopAction, flopFrequency, flopReason, flopSizing) {
 return {
 FLOP: { action: flopAction, frequency: flopFrequency, reason: flopReason, sizing: flopSizing, options: ensureBetOption(STANDARD_BET_OPTIONS, flopAction) },
 TURN: { action: 'CHECK', frequency: 58, reason: 'La turn demande de contrôler la taille du pot lorsque la carte ne renforce pas clairement votre avantage.', sizing: 'Check', options: [...STANDARD_BET_OPTIONS,'FOLD'] },

 };
}

function cardLabel(card){ return `${card.rank}${card.suit}`; }
function cardColor(card){ return (card.suit==='♠'||card.suit==='♣') ? '#183329' : '#ae4c46'; }
function parseCard(label){ return { rank: label.slice(0,-1), suit: label.slice(-1) }; }
function cardKey(card){ return `${card.rank}${card.suit}`; }
function deck(){ return RANKS.flatMap(rank => SUITS.map(suit => ({rank,suit}))); }
function shuffle(values){ const copy=[...values]; for(let i=copy.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [copy[i],copy[j]]=[copy[j],copy[i]]; } return copy; }
function cardsRemaining(excluded){ const blocked=new Set(excluded.map(cardKey)); return deck().filter(c=>!blocked.has(cardKey(c))); }
function chooseHole(handClass, excluded){
 const rank1=handClass[0], rank2=handClass[1], suffix=handClass[2];
 const available = cardsRemaining(excluded);
 if(rank1===rank2){ const choices=available.filter(c=>c.rank===rank1); return shuffle(choices).slice(0,2); }
 if(suffix==='s'){
 const validSuits = SUITS.filter(candidate => available.some(c=>c.rank===rank1 && c.suit===candidate) && available.some(c=>c.rank===rank2 && c.suit===candidate));
 // BUG CORRIGÉ (trouvé en investiguant plus loin, pas signalé par l'utilisateur) : le choix de la
 // couleur d'une main assortie ('s') était totalement indépendant des couleurs réellement présentes
 // au board — un texte annonçant "tirage couleur" (FLUSH_DRAW, NUT_FLUSH_DRAW, COMBO_DRAW, et
 // plusieurs fiches classiques) n'avait donc qu'une chance sur ~3-4 d'être vraiment vrai à la table,
 // le reste du temps Hero se retrouvait avec deux cartes assorties qui ne partagent la couleur
 // d'AUCUNE carte du board. On préfère maintenant la couleur la plus représentée au board parmi
 // celles encore disponibles pour Hero : garantit le tirage sur un board two-tone (2 cartes de même
 // couleur), sans aucun effet sur un board rainbow (aucune couleur majoritaire de toute façon, donc
 // choix aléatoire comme avant).
 const boardSuitCounts = {};
 excluded.forEach(c => { if(c && c.suit) boardSuitCounts[c.suit] = (boardSuitCounts[c.suit]||0) + 1; });
 const maxCount = validSuits.length ? Math.max(...validSuits.map(s => boardSuitCounts[s]||0)) : 0;
 const preferred = validSuits.filter(s => (boardSuitCounts[s]||0) === maxCount);
 const suit = shuffle(preferred.length ? preferred : validSuits)[0] ?? '♠';
 return [{rank:rank1,suit},{rank:rank2,suit}];
 }
 // BUG CORRIGÉ (même famille que le correctif 's' ci-dessus, trouvé en vérifiant les fiches
 // MISSED_FLUSH_DRAW : ex. A9o — offsuit — sur un board monotone, sans aucune garantie que Hero
 // possède ne serait-ce qu'UNE carte de la couleur du board, rendant "tirage couleur raté" absurde
 // la plupart du temps) : même logique de préférence, adaptée à une main offsuit — on privilégie une
 // combinaison où au moins une des deux cartes partage la couleur la plus représentée au board,
 // plutôt qu'un appariement 100% indifférent aux couleurs réelles de la table.
 const boardSuitCounts2 = {};
 excluded.forEach(c => { if(c && c.suit) boardSuitCounts2[c.suit] = (boardSuitCounts2[c.suit]||0) + 1; });
 const dominantSuit = Object.keys(boardSuitCounts2).sort((a,b)=>(boardSuitCounts2[b]||0)-(boardSuitCounts2[a]||0))[0];
 const allCombos = available.filter(c=>c.rank===rank1).flatMap(first => available.filter(c=>c.rank===rank2 && c.suit!==first.suit).map(second=>[first,second]));
 const preferredCombos = dominantSuit ? allCombos.filter(([a,b]) => a.suit===dominantSuit || b.suit===dominantSuit) : [];
 const combos = shuffle(preferredCombos.length ? preferredCombos : allCombos);
 return combos[0] ?? [{rank:rank1,suit:'♠'},{rank:rank2,suit:'♥'}];
}
function rangeToClass(hole){
 const [first,second] = [...hole].sort((a,b)=>RANKS.indexOf(b.rank)-RANKS.indexOf(a.rank));
 if(first.rank===second.rank) return `${first.rank}${second.rank}`;
 return `${first.rank}${second.rank}${first.suit===second.suit?'s':'o'}`;
}
function handLabel(hole){ return rangeToClass(hole); }

// Générateur dédié au module Probabilités : une main + un runout 100% aléatoires,
// sans AUCUN contexte de décision (catégorie, ligne d'action, stack, pot...).
// Volontairement découplé de `templates`/`pickSpot`, qui appartiennent au moteur
// d'entraînement préflop/postflop et n'ont rien à faire dans un outil de calcul pur.
function randomProbaHand(){
 const shuffled = shuffle(deck());
 const hole = shuffled.slice(0,2);
 const runout = shuffled.slice(2,7); // flop(3) + turn(1) + river(1)
 return { hole, runout, handClass: rangeToClass(hole) };
}
function trainerCategoryWeights(){
 const recent = state.history.slice(-40);
 const byCat = {};
 recent.forEach(item => {
 if(!byCat[item.category]) byCat[item.category] = { correct:0, total:0 };
 byCat[item.category].total++;
 byCat[item.category].correct += item.correct;
 });
 return byCat;
}
// BUG/MANQUE CORRIGÉ : le tirage des mains ne tenait compte que des catégories de spot en échec, jamais
// des POSITIONS en échec (ex. le rapport de coach peut dire "SB est votre point faible" sans que ça
// n'influence jamais le tirage des mains suivantes). Même logique que trainerCategoryWeights, appliquée
// à la position — les deux se combinent pour que le diagnostic du coach se traduise vraiment en pratique.
function trainerPositionWeights(){
 const recent = state.history.slice(-40);
 const byPos = {};
 recent.forEach(item => {
 if(!byPos[item.position]) byPos[item.position] = { correct:0, total:0 };
 byPos[item.position].total++;
 byPos[item.position].correct += item.correct;
 });
 return byPos;
}

// cohérent avec l'affichage BET 33%/50%/75% déjà utilisé partout ailleurs dans l'app.
// CODE MORT SUPPRIMÉ (audit) — SURPRISE_SIZE_BY_PROFILE et pickSurpriseSize() servaient à choisir la
// taille d'une mise "surprise" (adversaire qui mène/relance) AVANT le moteur contextuel getVillainReaction
// (plus bas dans ce fichier). Depuis son introduction, chaque appelant est passé à pickContextualSize()

// Taille plausible d'une 4-bet en retour sur un 3-bet dynamique (pas scriptée dans le spot) : dérivée
// de l'open déjà présent dans spot.actions, avec un multiple cohérent avec nos propres spots scriptés
// (ex. open 2.3 → 3-bet 9 → 4-bet 20, soit environ 8-9x l'open).
function estimatePreflopReraiseSize(spot){
 const openAmount = (spot.actions||[]).find(a=>a.action==='open')?.amount;
 if(!openAmount) return null;
 const mult = 7.5 + Math.random()*2;
 return Math.round(openAmount*mult*2)/2;

function computeRemainingStackBB(spot){

// avant, seules les blindes mortes SB/BB étaient comptées, ce qui ratait l'argent déjà misé par un
// joueur qui a ouvert/callé puis s'est couché à la relance suivante (cet argent reste dans le pot).

 if(['open','3bet','4bet','5bet','shove'].includes(a.action) && a.amount!=null){

 committed[a.pos] = a.amount;
 } else if(a.action==='call'){
 committed[a.pos] = runningRaise;
 }
 // fold : ne retire rien de ce que cette position avait déjà engagé plus tôt dans la même ligne —

function computeCallPot(heroAmount, villainAmount, heroPos, villainPos, priorActionsOrActorsSet, tableOrder, ante){

 // au lieu de planter, le temps que tous les appels migrent.
 const isActionsArray = Array.isArray(priorActionsOrActorsSet);

 if(isActionsArray){

 const actorsAlready = isActionsArray ? new Set(priorActionsOrActorsSet.map(a=>a.pos)) : priorActionsOrActorsSet;

 if(!exclude.has(p) && !actorsAlready.has(p) && tableOrder.includes(p)) otherCommitted += blindCost[p];

// POIDS PÉDAGOGIQUE PAR CATÉGORIE — V3.0, point 4 de l'audit. Référence approximative de fréquence
// "normale" par thème (avant tout ajustement lié aux erreurs du joueur) : les catégories très
// fondamentales (open first-in, défense BB, face à un open) reviennent le plus souvent, les
// situations rares (limp/iso, facing check-raise scriptée) beaucoup moins. Ce poids se MULTIPLIE avec
// la pondération adaptative existante (erreurs, position, anti-répétition) — il ne la remplace pas :
// une catégorie où le joueur se trompe continue de revenir plus souvent, ce tableau fixe juste le
// point de départ avant erreurs.
const CATEGORY_PEDAGOGICAL_WEIGHT = {
 'Open first in': 5,
 'BB defend': 5,
 'BB vs SB steal': 5,
 'BB vs min-raise': 5,
 'Flat / 3-bet': 5,
 '3-bet value': 4,
 '3-bet bluff': 4,
 'Resteal': 4,
 'Facing 3-bet': 4,
 'Short stack open': 4,
 'Short stack resteal': 4,
 'Push / reshove': 4,
 'Facing 4-bet': 3,
 'Short stack 4-bet': 3,
 'Squeeze': 3,
 'Squeeze multiway': 3,
 'Facing squeeze': 3,
 'Iso-raise heads-up': 2,
 'Iso-raise multiway': 2,
 'Facing iso-raise': 2,
 'Facing aggression': 1,
 'Facing check-raise': 1,
 'Facing donk bet': 1,
};
function categoryPedagogicalWeight(category){
 return CATEGORY_PEDAGOGICAL_WEIGHT[category] ?? 3; // catégorie non listée -> poids neutre
}
// PLAFOND ANTI-MONOPOLE PAR CATÉGORIE — V3.0, point 5 de l'audit : une catégorie ne doit pas
// représenter plus d'environ 30-35% des tirages sur une fenêtre récente, même si le joueur y fait
// beaucoup d'erreurs. Même mécanique que recentPositionCounts/posPenalty ci-dessus (pow décroissant),
// appliquée à la catégorie plutôt qu'à la position, sur une fenêtre un peu plus large (10 mains) pour
// que "30-35%" ait un sens (3 occurrences sur 10).
function recentCategoryCounts(){
 const recentHands = state.history.filter(i=>i.street==='Préflop').slice(-10);
 const counts = {};
 recentHands.forEach(item => { counts[item.category] = (counts[item.category]||0)+1; });
 return counts;
}
// RETOUR D'USAGE DIRECT — "j'ai enchaîné 5 mains poubelle, c'était très désagréable" / "je pense qu'il
// ne faut pas pouvoir enchaîner plus de 2-3 fois le même type de spot". Le catPenalty ci-dessus est une
// pénalité SOUPLE (le poids diminue mais n'atteint jamais zéro) : sur un malheureux tirage, la même
// catégorie — ou une main poubelle — peut donc quand même sortir plusieurs fois de suite. Ces deux
// fonctions posent une limite DURE, vérifiée dans pickSpot juste avant le tirage pondéré : au-delà du
// seuil, la catégorie / les mains poubelles sont carrément RETIRÉES du pool, pas seulement moins probables.
function lastNCategoriesAllSame(n){
 const recent = state.history.filter(i=>i.street==='Préflop').slice(-n);
 if(recent.length<n) return null;
 const cat = recent[0].category;
 return recent.every(i=>i.category===cat) ? cat : null;
}
function lastDrawWasJunkExample(){
 const recent = state.history.filter(i=>i.street==='Préflop').slice(-1);
 return recent.length>0 && !!recent[0].junkExample;
}
// ============================================================
// TURN / RIVER DYNAMIQUES — avant cette refonte, TOUTES les mains partageaient exactement le même
// verdict générique (toujours "check turn", toujours "bet 50% river"), peu importe la carte qui
// tombait vraiment. C'était le bug pédagogique le plus grave du trainer : la correction ne dépendait
// jamais du runout réel. Ce qui suit reste une heuristique volontairement simple (pas un solveur),
// mais elle regarde vraiment la carte tombée et adapte l'action + l'explication en conséquence.
// ============================================================
function boardTextureBefore(cards){
 const suitMax = Math.max(0,...SUITS.map(suit => cards.filter(c=>c.suit===suit).length));
 const rankCounts = {};
 cards.forEach(c => { rankCounts[c.rank] = (rankCounts[c.rank]||0)+1; });
 const maxRankCount = Math.max(0,...Object.values(rankCounts));
 const straightPossible = hasStraight(cards);
 const topRankIdx = cards.length ? Math.max(...cards.map(c=>RANKS.indexOf(c.rank))) : -1;
 return { suitMax, maxRankCount, straightPossible, topRankIdx };
}
// ============================================================
// POINT 3 DE LA DEMANDE — TEXTURE DU BOARD EN CATÉGORIES INDÉPENDANTES : jusqu'ici tout reposait sur une
// seule notion générique de "board humide" (le `wet` calculé localement dans pickBetSizeLabel/
// sizingRationale, volontairement PAS touché ici — ce travail est déjà en cours ailleurs). Le problème
// pour le reste du moteur (scare cards, cohérence de main) est qu'un simple booléen ne dit jamais
// POURQUOI un board est dangereux. Ces catégories peuvent se cumuler (ex. un board pairé peut aussi être
// flushHeavy) — volontairement une heuristique de texture simple, pas un calcul d'équité de range.
function computeBoardTexture(board){
 const cards = board || [];
 const counts = rankCounts(cards);
 const maxRankCount = Math.max(0,...Object.values(counts));
 const paired = maxRankCount>=2;
 const suitCounts = {};
 cards.forEach(c => { suitCounts[c.suit] = (suitCounts[c.suit]||0)+1; });
 const suitMax = Math.max(0,...Object.values(suitCounts));
 // flushHeavy : au moins 2 cartes de la même couleur au board -> un adversaire assorti a déjà un tirage.
 const flushHeavy = suitMax>=2;
 // straightHeavy : au moins 3 rangs du board tiennent dans une fenêtre de 5 rangs consécutifs -> une
 // seule carte peut compléter une quinte pour beaucoup de mains adverses (ex. 8-7-6).
 const nums = [...new Set(cards.map(c=>numericRank(c.rank)))].sort((a,b)=>a-b);
 let straightHeavy = false;
 for(let i=0; i+2<nums.length; i++){ if(nums[i+2]-nums[i]<=4){ straightHeavy = true; break; } }
 const straightMade = hasStraight(cards);
 // dry : aucun tirage couleur/quinte évident. Indépendant de `paired` (un board pairé rainbow reste sec).
 const dry = !flushHeavy && !straightHeavy;
 return { paired, drawHeavy: flushHeavy || straightHeavy, flushHeavy, straightHeavy, dry, suitMax, maxRankCount, straightMade };
}
function describeNewCard(newCard, priorBoard){
 const before = boardTextureBefore(priorBoard);
 const after = boardTextureBefore([...priorBoard, newCard]);
 const notes = [];
 if(after.suitMax>=4 && before.suitMax<4) notes.push(`${cardLabel(newCard)} amène une quatrième carte de la couleur : une couleur est désormais très probable.`);
 else if(after.suitMax>=3 && before.suitMax<3) notes.push(`${cardLabel(newCard)} amène une troisième carte de la couleur : un adversaire avec deux cartes assorties a maintenant une couleur faite.`);
 if(after.maxRankCount>=4 && before.maxRankCount<4) notes.push(`${cardLabel(newCard)} amène un carré au board : n\u2019importe quelle carte assortie donne un full à tout le monde.`);
 else if(after.maxRankCount>=3 && before.maxRankCount<3) notes.push(`${cardLabel(newCard)} amène un brelan au board : le full devient possible pour beaucoup plus de mains.`);
 else if(after.maxRankCount>=2 && before.maxRankCount<2) notes.push(`${cardLabel(newCard)} pair le board : brelans et full deviennent possibles.`);
 if(after.straightPossible && !before.straightPossible) notes.push(`${cardLabel(newCard)} complète une possibilité de quinte sur le board.`);
 if(before.topRankIdx>=0 && RANKS.indexOf(newCard.rank) > before.topRankIdx) notes.push(`${cardLabel(newCard)} est une carte plus haute que tout ce qui était présent avant.`);
 return notes;
}
// ============================================================
// POINT 4 DE LA DEMANDE — NIVEAU DE DANGER RÉEL D'UNE NOUVELLE CARTE : avant ce correctif, une carte
// était traitée comme "scare" (turnScare/riverScare dans computeDynamicStreetPost) dès que
// describeNewCard() renvoyait la moindre note — y compris la note "carte plus haute que tout ce qui
// était présent avant", qui ne dit RIEN sur un changement stratégique réel (ex. un Roi sur A♠7♦2♣
// n'est pas plus haut que l'As déjà présent, et même quand une carte est réellement plus haute que tout
// le board, ça ne complète ni couleur ni quinte ni ne paire quoi que ce soit). Cette fonction remplace
// ce booléen brut par un niveau à 4 paliers basé sur ce que la carte CHANGE RÉELLEMENT dans la texture
// (computeBoardTexture avant/après), avec une hiérarchie simple plutôt qu'une accumulation de règles :
// 1) une carte qui complète réellement une main (couleur, quinte, brelan au board) est toujours majeure ;
// 2) deux menaces qui apparaissent EN MÊME TEMPS (ex. tirage couleur qui apparaît sur un board déjà
// resserré) sont aussi un changement majeur ;
// 3) une seule nouvelle menace (tirage couleur, board qui se paire, board qui se resserre) est un
// changement important mais pas automatiquement majeur ;
// 4) tout le reste (y compris une simple carte plus haute que le board) est un changement léger — ou
// aucun changement si rien n'a bougé et que la carte n'est même pas plus haute que le board.
// Reste une heuristique pédagogique volontairement simple, pas un solveur GTO.
function assessCardDanger(newCard, priorBoard){
 const boardAfter = [...priorBoard, newCard];
 const before = computeBoardTexture(priorBoard);
 const after = computeBoardTexture(boardAfter);
 const simpleBefore = boardTextureBefore(priorBoard);
 const isOvercard = simpleBefore.topRankIdx>=0 && RANKS.indexOf(newCard.rank) > simpleBefore.topRankIdx;
 const changes = {
 // Franchir le seuil de 3 (ou 4) cartes de la même couleur au board = une partie réelle de la range
 // adverse a maintenant une couleur FAITE (2 cartes assorties + 3 au board, ou 1 carte assortie + 4
 // au board) — pas juste un tirage qui pourrait se compléter. Mêmes seuils que describeNewCard plus
 // haut, pas réinventés.
 flushMade: (before.suitMax<3 && after.suitMax>=3) || (before.suitMax<4 && after.suitMax>=4),
 straightCompleted: after.straightMade && !before.straightMade,
 boardTripped: after.maxRankCount>=3 && before.maxRankCount<3,
 boardPaired: after.paired && !before.paired,
 straightHeavyAppeared: after.straightHeavy && !before.straightHeavy,
 };
 const textureUnchanged = before.suitMax===after.suitMax && before.straightHeavy===after.straightHeavy && before.paired===after.paired;
 let level;
 if(changes.flushMade || changes.straightCompleted || changes.boardTripped){
 level = 'MAJOR'; // une main faite (couleur/quinte/brelan au board) devient réellement possible
 } else if(changes.boardPaired || changes.straightHeavyAppeared){
 level = 'IMPORTANT'; // une seule menace nouvelle, mais pas encore une main faite pour l'adversaire
 } else if(textureUnchanged){
 level = isOvercard ? 'MILD' : 'NONE';
 } else {
 level = 'MILD';
 }
 return { level, isOvercard,...changes };
}
// Texte de repli utilisé UNIQUEMENT quand assessCardDanger juge la carte IMPORTANT/MAJOR mais que
// describeNewCard() (fonction séparée, non modifiée ici) n'a produit aucune note pour ce cas précis —
// seul le cas straightHeavyAppeared seul (board qui se resserre sans pairer ni compléter de couleur)
// n'a pas d'équivalent dans describeNewCard. N'ajoute rien à describeNewCard lui-même pour ne pas
// toucher son usage ailleurs.
function dangerFallbackNote(danger, newCard){
 if(danger.straightHeavyAppeared) return `${cardLabel(newCard)} resserre fortement les rangs du board : une quinte devient possible pour beaucoup de mains adverses avec une carte de plus.`;
 return `${cardLabel(newCard)} change la texture du board de façon notable.`;
}
// ============================================================
// POINT 9 DE L'AUDIT — le board peut sembler dangereux en apparence (describeNewCard ci-dessus) sans
// que ça dise quoi que ce soit sur LA MAIN DE HERO en particulier : une carte qui "pair le board" ou
// "amène une 3e carte de couleur" peut très bien être en train d'améliorer Hero lui-même plutôt que de
// le menacer. Avant ce correctif, computeDynamicStreetPost ignorait complètement la main de Hero et se
// basait uniquement sur la texture du board + le fait d'avoir misé ou non au flop, ce qui produisait
// exactement la règle simpliste à éviter ("board dangereux = check"/"board neutre = bet") — la même
// carte donnait TOUJOURS le même verdict, quelle que soit la main de Hero. Ici, on vérifie si LA carte
// qui vient de tomber améliore spécifiquement la main de Hero (pas juste l'aspect du board) : hero se
// pair avec cette carte (brelan/deux paires), hero complète sa propre couleur (au moins une carte de
// cette couleur vient de SA main), ou hero complète sa propre quinte (elle disparaît si on retire ses
// cartes). Toujours une heuristique pédagogique, pas un solveur : on ne calcule pas l'equity exacte,
// seulement si la carte est structurellement bonne ou neutre pour CETTE main précise.
function heroBenefitsFromCard(hole, priorBoard, newCard){
 const boardAfter = [...priorBoard, newCard];
 const allAfter = [...hole,...boardAfter];
 const heroPairsUp = hole.some(c => c.rank===newCard.rank);
 const suitCounts = {};
 allAfter.forEach(c => { suitCounts[c.suit] = (suitCounts[c.suit]||0)+1; });
 const heroFlush = Object.entries(suitCounts).some(([suit,count]) => count>=5 && hole.some(c=>c.suit===suit));
 const heroStraight = hasStraight(allAfter) && !hasStraight(boardAfter);
 // POINT 1 DE LA DEMANDE (unification) — classifyPostflopHand() est la référence pour la force RÉELLE
 // de la main de Hero ; cette fonction ne doit jamais la contredire. Avant ce correctif, une carte qui
 // transformait réellement la main de Hero SANS être elle-même une carte de sa main (ex. le board se
 // paire alors que Hero a déjà deux paires -> full potentiel ; le board apporte un brelan alors que Hero
 // a une paire du board -> plus grand full) n'était jamais détectée ici, alors que classifyPostflopHand
 // la reconnaît bien via madeHand. On compare donc le rang MADE_HAND_RANK avant/après avec
 // classifyPostflopHand plutôt que de dupliquer une détection séparée.
 const beforeClass = classifyPostflopHand(hole, priorBoard);
 const afterClass = classifyPostflopHand(hole, boardAfter);
 const madeHandUpgraded = (MADE_HAND_RANK[afterClass.madeHand] ?? 0) > (MADE_HAND_RANK[beforeClass.madeHand] ?? 0);
 return { heroPairsUp, heroFlush, heroStraight, madeHandUpgraded, improved: heroPairsUp || heroFlush || heroStraight || madeHandUpgraded };
}
// CODE MORT SUPPRIMÉ (audit, sur demande) — heroFacingBetContextNote() (et le bloc de commentaire "SUITE
// DU POINT 9" qui l'introduisait) construisait une note de contexte pour la sous-décision fold/call face
// à une mise surprise ; jamais affichée nulle part (ni écran de jeu, ni résumé de fin de main). Ses 3
// tests dédiés sont retirés avec elle, plus bas dans ce fichier.
// SECTION 3 DE LA DEMANDE (RÉVISÉE — retour d'usage : "1/3 2/3 etc je trouve pas ça très clair, comment
// font les autres sites") — retour au pourcentage brut (33%, 50%, 75%, 125%), le standard utilisé par
// les autres trainers (GTOWizard, etc.), plutôt que le vocabulaire en fractions introduit précédemment
// qui s'est révélé plus confus qu'utile. Les codes internes ('BET 25%', 'BET 33%', ...) ne changent
// pas, seul l'affichage change.
function sizingVocabLabel(pct){
 return `${pct}% pot`;
}
function sizingLabelFor(action){
 if(action==='CHECK') return 'Check';
 const m = String(action).match(/BET (\d+)%/);
 return m ? sizingVocabLabel(parseInt(m[1],10)) : action;
}
// RETOUR D'USAGE DIRECT — "j'ai l'impression que 100% du temps la bonne réponse est miser 33% flop/
// turn et 50% river, comment ça se fait que miser 25% par exemple pour pot-control ou protéger contre
// un tirage couleur". Confirmé en auditant le code : TOUTES les branches "BET" de computeDynamicStreetPost
// utilisaient le même 'BET 50%' fixe, peu importe la force de la main ou la texture du board. Cette
// fonction fait varier la taille selon la force réelle ET l'humidité du board (réutilise
// boardTextureBefore déjà existant) — une main très forte sur un board humide mise plus gros (protection
// contre les tirages), une main moyenne/thin value sur un board sec mise plus petit (pot control). Reste
// une heuristique à quelques paliers, pas un calcul de sizing GTO exact.
function pickBetSizeLabel(strength, board){
 const tex = boardTextureBefore(board);
 const wet = tex.suitMax>=3 || tex.straightPossible || tex.maxRankCount>=2;
 if(strength==='VERY_STRONG') return wet ? 'BET 75%' : 'BET 50%';
 if(strength==='STRONG') return wet ? 'BET 50%' : 'BET 50%';
 return wet ? 'BET 33%' : 'BET 25%'; // main moyenne/thin value : pot control, encore plus petit sur board sec
}
function sizingRationale(strength, board){
 const tex = boardTextureBefore(board);
 const wet = tex.suitMax>=3 || tex.straightPossible || tex.maxRankCount>=2;
 if(strength==='VERY_STRONG' && wet) return ' Board humide (tirages possibles) : une mise plus grosse protège votre main et fait payer cher un tirage qui voudrait vous rattraper.';
 if((strength==='MEDIUM'||strength==='WEAK') && !wet) return ' Board sec, main pas premium : une mise plus petite suffit pour le pot-control, pas besoin de faire grossir le pot inutilement.';
 return '';
}
function computeDynamicStreetPost(spot){
 const flopCards = spot.runout.slice(0,3);
 const turnCard = spot.runout[3];
 const riverCard = spot.runout[4];
 const flopAggressive = String(spot.post.FLOP.action).startsWith('BET');
 const turnNotes = describeNewCard(turnCard, flopCards);
 const riverNotes = describeNewCard(riverCard, [...flopCards, turnCard]);
 // POINT 4/6 DE LA DEMANDE — "scare" ne doit plus être "describeNewCard a produit au moins une note"
 // (ce qui incluait à tort une simple carte plus haute que le board, cf. assessCardDanger ci-dessus) :
 // seul un changement de niveau IMPORTANT ou MAJOR déclenche réellement la prudence dans les branches
 // ci-dessous. Les textes explicatifs (turnNotes/riverNotes) restent affichés tels quels quand c'est le
 // cas — describeNewCard produit toujours une note pour chacun de ces déclencheurs.
 const turnDanger = assessCardDanger(turnCard, flopCards);
 const riverDanger = assessCardDanger(riverCard, [...flopCards, turnCard]);
 const isScareLevel = lvl => lvl==='IMPORTANT' || lvl==='MAJOR';
 const turnScare = isScareLevel(turnDanger.level), riverScare = isScareLevel(riverDanger.level);
 // describeNewCard() ne couvre pas encore le cas "board qui se resserre sans pairer ni compléter de
 // couleur" (straightHeavyAppeared seul) : texte de repli pour ce cas précis uniquement, jamais utilisé
 // quand describeNewCard a déjà quelque chose à dire.
 const turnNotesForDisplay = turnNotes.length ? turnNotes : (turnScare ? [dangerFallbackNote(turnDanger, turnCard)] : turnNotes);
 const riverNotesForDisplay = riverNotes.length ? riverNotes : (riverScare ? [dangerFallbackNote(riverDanger, riverCard)] : riverNotes);
 const heroOnTurn = heroBenefitsFromCard(spot.hole, flopCards, turnCard);
 const heroOnRiver = heroBenefitsFromCard(spot.hole, [...flopCards, turnCard], riverCard);
 const heroImprovedByRiver = heroOnTurn.improved || heroOnRiver.improved;
 // ÉTAPE 3 DE LA DEMANDE — classifyPostflopHand() vient compléter heroBenefitsFromCard (qui ne regarde
 // que "la dernière carte a-t-elle aidé Hero ?") par la force RÉELLE ET SOUTENUE de la main sur le
 // board actuel : un set ou une quinte formés au flop restent très forts au turn même si aucune
 // nouvelle carte ne "change" rien depuis. Sans ça, une main déjà très forte mais silencieuse depuis le
 // flop tombait dans les branches par défaut (souvent un check), ce qui est exactement le problème
 // signalé (K♠Q♠ sur K♦7♣2♥ doit rester identifié comme une vraie top paire, pas traité au cas par cas
 // selon la seule dernière carte).
 const heroFlopClass = classifyPostflopHand(spot.hole, flopCards);
 const heroTurnClass = classifyPostflopHand(spot.hole, [...flopCards, turnCard], heroFlopClass.draw);
 const heroRiverClass = classifyPostflopHand(spot.hole, [...flopCards, turnCard, riverCard], heroTurnClass.draw);

 let TURN;
 const turnBoardFull = [...flopCards, turnCard];
 if(heroTurnClass.strength==='VERY_STRONG'){
 const sz = pickBetSizeLabel('VERY_STRONG', turnBoardFull);
 TURN = { action:sz, frequency:74, sizing:sizingLabelFor(sz), reason:`Votre main est très forte sur cette texture (${heroTurnClass.madeHand.toLowerCase().replace('_',' ')}) : c\u2019est le moment de construire le pot pour la value, peu importe l\u2019aspect du board.${sizingRationale('VERY_STRONG', turnBoardFull)}` };
 } else if(heroOnTurn.improved){
 // La carte améliore Hero spécifiquement (pas juste l'aspect du board) : ça reste une raison de
 // miser pour la value, même si la texture a l'air dangereuse pour une main qui n'aurait pas cette
 // carte-là. C'est le cas qui manquait : jusqu'ici, "board scare" menait TOUJOURS à check.
 const scareNote = turnScare ? ` Le board peut sembler dangereux en apparence (${turnNotesForDisplay.join(' ')}), mais c\u2019est justement cette carte qui améliore votre main : ne vous laissez pas impressionner par la texture seule.` : '';
 const sz = pickBetSizeLabel(heroTurnClass.strength, turnBoardFull);
 TURN = { action:sz, frequency:68, sizing:sizingLabelFor(sz), reason:`${cardLabel(turnCard)} améliore directement votre main, pas seulement l\u2019aspect du board : c\u2019est le moment de miser pour la value.${scareNote}${sizingRationale(heroTurnClass.strength, turnBoardFull)}` };
 } else if(flopAggressive && !turnScare){
 const sz = pickBetSizeLabel(heroTurnClass.strength, turnBoardFull);
 TURN = { action:sz, frequency:64, sizing:sizingLabelFor(sz), reason:`${cardLabel(turnCard)} est une carte neutre qui ne change pas la texture du flop : on continue de représenter l\u2019avantage pris avec un second barrel.${sizingRationale(heroTurnClass.strength, turnBoardFull)}` };
 } else if(flopAggressive && turnScare){
 // BUG CORRIGÉ (retour d'usage) : cette branche parlait TOUJOURS comme si Hero n'avait rien
 // (« cette carte ne vous améliore pas personnellement »), même quand heroTurnClass montrait une
 // vraie main faite (ex. top paire) qui n'a simplement pas progressé sur cette carte précise. Ne pas
 // améliorer ≠ ne rien avoir : on distingue maintenant explicitement les deux, pour ne jamais nier une
 // main réelle (rank MEDIUM+ dans MADE_HAND_RANK) auprès du joueur.
 const stillHasHand = ['MEDIUM','STRONG'].includes(heroTurnClass.strength);
 const handNote = stillHasHand
 ? ` Vous gardez ${heroTurnClass.madeHand.toLowerCase().replace('_',' ')} depuis le flop, mais cette carte ne l\u2019améliore pas et rend la texture beaucoup plus dangereuse pour une main qui reste modeste : mieux vaut ranger le pot et checker plutôt que de continuer à l\u2019aveugle.`
 : ` Cette carte ne vous améliore pas, et vous n\u2019aviez déjà rien de construit avant elle : mieux vaut ranger le pot et checker plutôt que de continuer à l\u2019aveugle.`;
 TURN = { action:'CHECK', frequency:58, sizing:'Check', reason:`${turnNotesForDisplay.join(' ')}${handNote}` };
 } else if(!flopAggressive && !turnScare){
 TURN = { action:'CHECK', frequency:60, sizing:'Check', reason:`${cardLabel(turnCard)} ne change rien à la situation : sans avantage clair pris au flop ni amélioration de votre main, toujours pas de raison de prendre l\u2019initiative.` };
 } else {
 // Même correctif que ci-dessus : la texture est dangereuse, mais « dangereuse » ne veut pas dire que
 // Hero n'a rien — on vérifie la vraie force de sa main avant d'affirmer qu'il n'a rien construit.
 const stillHasHand = ['MEDIUM','STRONG'].includes(heroTurnClass.strength);
 const handNote = stillHasHand
 ? ` Vous gardez ${heroTurnClass.madeHand.toLowerCase().replace('_',' ')}, mais cette carte ne l\u2019améliore pas non plus : sur une texture aussi dangereuse, mieux vaut contrôler la taille du pot que de miser avec une main qui reste modeste.`
 : ` Cette carte ne vous améliore pas non plus : encore moins de raison de miser sur une texture aussi dangereuse pour votre range de check.`;
 TURN = { action:'CHECK', frequency:66, sizing:'Check', reason:`${turnNotesForDisplay.join(' ')}${handNote}` };
 }
 // SECTION 1/2/4 DE LA DEMANDE — enrichissement du verdict déjà déterminé ci-dessus (l'action elle-même
 // ne change pas : la hiérarchie force réelle > texture > évolution > action précédente, déjà câblée
 // dans les branches ci-dessus, reste seule maîtresse de la décision, comme demandé). On ajoute ici les
 // deux facteurs de priorité plus basse explicitement demandés (avantage de range, objectif implicite)
 // et on restructure le texte en DÉCISION / Pourquoi ? / POINT À RETENIR plutôt qu'un seul paragraphe.
 {
 const turnRangeAdv = classifyRangeAdvantage(turnBoardFull);
 const turnObjective = determineHeroObjective(heroTurnClass, turnBoardFull, { facingBet:false, wasAggressor: flopAggressive });
 TURN.objective = turnObjective;
 TURN.rangeAdvantage = turnRangeAdv.favors;
 const isBet = String(TURN.action).startsWith('BET');

 const sz = pickBetSizeLabel(heroRiverClass.strength, riverBoardFull);
 RIVER = { action:sz, frequency:62, sizing:sizingLabelFor(sz), reason:`${which} a amélioré directement votre main : c\u2019est une river à valoriser plutôt qu\u2019à checker par réflexe sur la texture.${scareNote}${sizingRationale(heroRiverClass.strength, riverBoardFull)}` };

 // BUG CORRIGÉ (retour d'usage, même correctif que sur la turn) : « sans amélioration de votre main »

 ? { action:'CHECK', frequency:55, sizing:'Check', reason: stillHasHand

  ? `${texts} Vous gardez ${handWord}, mais sans avantage pris plus tôt dans la main ni amélioration ici, cette river dangereuse ne donne aucune raison de s\u2019engager avec une main qui reste modeste.`

 // Le danger date de la turn (déjà pris en compte à cette street-là) : la river elle-même est neutre,

 const texts = turnNotesForDisplay.join(' ');
 RIVER = flopAggressive
 ? { action:'CHECK', frequency:53, sizing:'Check', reason:`${texts} C\u2019était déjà le cas depuis la turn : ${cardLabel(riverCard)} ne change rien de plus, on garde la même prudence.` }
 : { action:'CHECK', frequency:52, sizing:'Check', reason:`${texts} C\u2019était déjà le cas depuis la turn : ${cardLabel(riverCard)} ne change rien, toujours pas de raison de s\u2019engager.` };
 } else if(flopAggressive){

 // j'ai misé à chaque street, y'a aucun check de l'adversaire") : ce texte supposait à tort que
 // l'adversaire avait checké (vocabulaire de "range de check"), alors que flopAggressive signifie
 // seulement que VOUS avez pris l'initiative — l'adversaire, lui, a pu suivre à chaque street sans

 } else {
 // BUG CORRIGÉ (retour d'usage) : « toujours pas de main construite depuis le flop » était affiché
 // même quand Hero tenait une vraie paire (ex. top paire) depuis le flop — juste jamais misée. On
 // vérifie maintenant la force réelle avant d'affirmer qu'il n'y a aucune main.
 const stillHasHand = ['MEDIUM','STRONG'].includes(heroRiverClass.strength);
 RIVER = { action:'CHECK', frequency:54, sizing:'Check', reason: stillHasHand
 ? `Runout neutre (${cardLabel(turnCard)} puis ${cardLabel(riverCard)}) : vous gardez ${heroRiverClass.madeHand.toLowerCase().replace('_',' ')} depuis le flop, mais rien ne justifie de faire grossir le pot avec une main pas premium — on continue de contrôler sa taille.`
 : `Runout neutre (${cardLabel(turnCard)} puis ${cardLabel(riverCard)}), mais toujours pas de main construite depuis le flop : on continue de contrôler la taille du pot.` };
 }
 {
 const riverRangeAdv = classifyRangeAdvantage(riverBoardFull);
 const riverObjective = determineHeroObjective(heroRiverClass, riverBoardFull, { facingBet:false, wasAggressor: flopAggressive || String(TURN.action).startsWith('BET') });
 RIVER.objective = riverObjective;
 RIVER.rangeAdvantage = riverRangeAdv.favors;
 const isBet = String(RIVER.action).startsWith('BET');
 RIVER.sizingFree = isBet && heroRiverClass.strength==='MEDIUM';
 // SIMPLIFIÉ (retour d'usage répété — "ça fait beaucoup non ?", "pour m'expliquer qu'il faut checker
 // à cause de la deuxième paire") : même principe qu'à la turn — une phrase concise plutôt qu'une
 // liste numérotée. Les deux takeaways génériques de pure réassurance ("checker n'est pas une
 // faiblesse...") sont retirés : ils n'apprenaient rien de nouveau au joueur, juste du volume. On garde
 // uniquement les points réellement actionnables (bluff-catcher, sizing libre).
 const rangeClause = `${riverRangeAdv.label}${riverRangeAdv.notes.length ? ` (${riverRangeAdv.notes.join(', ')})` : ''}.`;
 RIVER.reason = `${RIVER.reason} ${rangeClause}`;
 if(riverObjective==='BLUFF_CATCHER'){
 RIVER.reason += ' Une main de bluff-catcher ne se couche pas automatiquement face à une grosse mise : la question est de savoir si l\u2019adversaire a encore assez de bluffs dans sa ligne.';
 } else if(isBet && RIVER.sizingFree){
 RIVER.reason += ' Plusieurs tailles sont défendables ici selon l\u2019objectif recherché.';
 } else if(isBet){
 RIVER.reason += ' Le sizing dépend surtout de la quantité de mains moins bonnes capables de payer.';
 }
 }
 RIVER.options = ensureBetOption([...STANDARD_BET_OPTIONS,'BET 125%'], RIVER.action);

 return { TURN, RIVER };
}

// VARIÉTÉ DE BOARD — jusqu'ici chaque template avait EXACTEMENT le même flop, carte pour carte,
// à chaque tirage : un joueur assidu pouvait mémoriser "AJo en UTG -> A♠7♦2♣" plutôt que le
// raisonnement. On tire maintenant, à chaque main, entre le rang de flop d'origine et un rang
// alternatif (même catégorie de texture, en conservant toute carte dont le texte d'explication a
// explicitement besoin — ex. le 4 du backdoor à la roue, le 2 qui fait la paire basse), PUIS on
// distribue des couleurs fraîches en respectant le même schéma (rainbow/two-tone/mono) que l'original.
function suitPatternOf(flopCards){
 const counts = {};
 flopCards.forEach(c => { counts[c.suit] = (counts[c.suit]||0)+1; });
 const max = Math.max(...Object.values(counts));
 if(max>=3) return 'mono';
 if(max===2) return 'two-tone';
 return 'rainbow';
}
function randomSuitsForPattern(pattern){
 const pool = shuffle(SUITS);
 if(pattern==='mono') return [pool[0], pool[0], pool[0]];
 if(pattern==='two-tone'){
 const suits = [pool[0], pool[0], pool[0]];
 suits[Math.floor(Math.random()*3)] = pool[1];
 return suits;
 }
 return [pool[0], pool[1], pool[2]];
}
// Génère des variantes de rangs SUPPLÉMENTAIRES sans les écrire à la main : on repère les positions
// déjà "libres" entre flop et flopAlt (celles qui diffèrent), on garde les autres verrouillées (elles
// portent le raisonnement — ex. le 4 du backdoor à la roue), et on tire de nouvelles valeurs sûres pour
// les positions libres (pas déjà utilisées, pas adjacentes aux rangs verrouillés pour ne pas créer une
// connectivité de quinte non prévue).
function extraFlopVariants(template, count){
 const base = template.flop.map(c=>c.slice(0,-1));
 const alt = template.flopAlt;
 if(!alt) return [];
 const freeIdx = [], lockedRanks = [];
 base.forEach((r,i) => { if(r!==alt[i]) freeIdx.push(i); else lockedRanks.push(r); });
 if(!freeIdx.length) return [];
 const lockedIdx = lockedRanks.map(r=>RANKS.indexOf(r));
 // BUG CORRIGÉ (trouvé en re-vérifiant mes propres correctifs précédents sur ce même mécanisme) : même
 // après avoir verrouillé flop/flopAlt sur la position qui compte pour la main du héros, cette fonction
 // pouvait encore piocher le RANG DE LA MAIN DU HÉROS sur une AUTRE position "libre" (une carte censée
 // rester cosmétique) — recréant accidentellement un brelan/une paire non prévue par le texte, ailleurs
 // sur le board. `usedRanks` n'excluait que les rangs déjà présents dans flop/flopAlt, jamais la main de
 // Hero elle-même. On l'exclut maintenant explicitement de toute position encore libre — y compris pour
 // les paires d'entrée (ex. TT) : si le brelan est voulu, le rang concerné est déjà verrouillé (identique
 // entre flop et flopAlt), donc hors de `freeIdx` de toute façon ; cette exclusion ne protège que les
 // positions restées libres, là où un brelan accidentel et non commenté n'a jamais sa place.
 const heroRanks = template.handClass ? template.handClass.slice(0,2).split('').filter(ch=>RANKS.includes(ch)) : [];
 const usedRanks = new Set([...base, ...alt, ...heroRanks]);
 const safe = RANKS.filter((r,idx) => !lockedRanks.includes(r) && !usedRanks.has(r) && lockedIdx.every(li=>Math.abs(li-idx)>1));
 const variants = [];
 for(let v=0; v<count && safe.length; v++){
 const arr = [...base];
 freeIdx.forEach(i => { arr[i] = safe[Math.floor(Math.random()*safe.length)]; });
 variants.push(arr);
 }
 return variants;
}
function buildRuntimeFlop(template){
 const rankSets = [template.flop.map(c => c.slice(0,-1))];
 if(template.flopAlt){ rankSets.push(template.flopAlt); rankSets.push(...extraFlopVariants(template, 2)); }
 const ranks = rankSets[Math.floor(Math.random()*rankSets.length)];
 const pattern = suitPatternOf(template.flop.map(parseCard));
 const suits = randomSuitsForPattern(pattern);
 return ranks.map((r,i) => `${r}${suits[i]}`);
}
// ============================================================
// STACK ALÉATOIRE — jusqu'ici chaque spot avait un stack figé (100, 40, 25 ou 20 BB) : en tournoi
// personne n'a jamais exactement 100bb ou 20bb à chaque main. On fait varier le stack effectif à
// chaque tirage, dans une fourchette qui reste cohérente avec le PALIER visé par le spot (profond,
// short stack resteal, short stack 4-bet, short stack push/fold) pour que le raisonnement stratégique
// affiché reste valable : sous la barre des 20 BB, la théorie push/fold s'applique par exemple, donc ce
// palier précis reste toujours ≤ 20 BB plutôt que de déraper vers un stack "normal".
function jitterStack(base){
 let lo, hi;
 // V3.1 : la bande unique "base<=20" mélangeait deux réalités très différentes (un template écrit
 // pour 10bb finissait tiré à 15-20bb, aussi loin de son intitulé que possible). Scindée en deux pour
 // que "10bb" et "15-20bb" restent deux paliers réellement distincts, sans prétendre à une précision
 // solveur pour autant (toujours une fourchette, jamais un chiffre unique figé).
 if(base<=12){ lo=8; hi=12; }  // push/fold pur (~10 BB)
 else if(base<=20){ lo=13; hi=20; } // push/fold élargi / resteal court (~15-20 BB)
 else if(base<=25){ lo=21; hi=30; } // short stack 4-bet / defend
 else if(base<=40){ lo=32; hi=48; } // short stack resteal
 else { lo=Math.round(base*0.75); hi=Math.round(base*1.4); } // stack profond : belle variété réaliste
 return Math.round(lo + Math.random()*(hi-lo));
}
// Palier de stack (short/mid/deep) calculé UNE SEULE FOIS à partir du stack réellement tiré (post-jitter),
// jamais à partir de template.effectiveStack. V2.3 : avant ce correctif, le drill "profondeur de stack"
// filtrait sur le stack du template puis un stack différent était tiré ensuite — un spot marqué "deep"
// pouvait finir avec un stack effectif "mid" une fois jitterStack() appliqué.
function stackTier(bb){
 return bb<=25 ? 'short' : bb<60 ? 'mid' : 'deep';
}
// PALIER STRATÉGIQUE À 4 NIVEAUX — V2.4, point 5 de l'audit : la théorie push/fold pure (shove ou fold,
// rien entre les deux) ne s'applique franchement qu'en dessous de ~10bb. Entre 10 et 20bb, le tapis
// reste la référence la plus fréquente mais une relance resteal/open classique n'est plus une erreur
// pure. Au-delà, on retrouve une stratégie intermédiaire puis profonde standard. Utilisé uniquement
// pour la notation du sizing (gradeOpenSizing/gradeRaiseSizing) et l'ajustement de fréquence
// (contextRangeAdjustment) — ne remplace pas stackTier(), qui sert au filtre de drill (3 paliers).
function stackStrategyTier(bb){
 return bb<=10 ? 'pushfold' : bb<=20 ? 'short' : bb<=40 ? 'mid' : 'deep';
}
// FORMAT/ANTE — V2.3 : l'ancienne version activait l'ante à 100% des mains en MTT (un commentaire
// obsolète parlait à tort d'"une main sur deux") et ne proposait aucun réglage. L'ante est maintenant
// une règle de STRUCTURE choisie une fois dans les réglages (Sans ante / BBA 1bb), jamais un tirage
// aléatoire par main — comme dans un vrai tournoi où la structure ne change pas à chaque main.
function resolveAnte(state){
 if(state.anteMode!=='mtt') return 0; // cash game : jamais d'ante
 return state.mttAnteMode==='none' ? 0 : 1;
}
// STACK MANUEL — si l'utilisateur a choisi un palier de stack fixe dans les réglages (au lieu de
// "Aléatoire"), ce stack remplace le stack aléatoire/templaté pour CETTE main. Le reste du moteur
// (sizing, push/fold, SPR) lit déjà spot.effectiveStack dynamiquement, donc rien d'autre à changer
// pour que la cohérence stack -> décisions (all-in, sizing, etc.) reste valable.
function resolveEffectiveStack(template, stackMode){
 if(stackMode && stackMode!=='auto'){
 const fixed = parseInt(stackMode, 10);
 if(!Number.isNaN(fixed)) return fixed;
 }
 return jitterStack(template.effectiveStack);
}
// RANGES CONTEXTUELLES — V2.3, étape 4. Les templates encodent une fréquence "de référence" calibrée
// pour leur effectiveStack d'origine, sans solveur derrière : c'est un trainer pédagogique, pas un
// GTO solver. On applique ici un ajustement directionnel simple et assumé, uniquement sur les spots
// qui ont déjà un `mix` (donc une vraie zone grise stratégique) — on ne touche jamais les opens/folds
// à 100%, qui restent la référence stable de l'app :
// - Format MTT + stack court (<=25bb) : on pousse vers les extrêmes (plus d'action agressive/continue,
// moins de fold pur) car sous 25bb la théorie push/fold réduit l'espace pour les tailles moyennes.
// - Ante actif : élargit légèrement les fréquences de continuation (call/3-bet/open), l'ante rendant
// le prix pour voir un flop plus favorable pour tout le monde — cohérent avec la théorie standard.
// - Format Cash (jamais d'ICM, stacks profonds par défaut) : léger resserrement vers la ligne stable
// (pas de pression de bulle/ICM qui pousserait à des fréquences extrêmes).
// Les ajustements sont volontairement petits (±3 à ±6 points) : le but est de rendre Cash/MTT/stack
// réellement différents, pas de prétendre à une précision de solveur.
// ÉTAPE 10 DE LA DEMANDE — l'ajustement d'ante utilisait un simple `if(anteOn) shift += 3` fixe, sans
// tenir compte du nombre de joueurs déjà engagés dans la main. Avec des callers déjà présents (squeeze,
// multiway), l'ante mise en jeu est partagée entre plus de joueurs et pèse proportionnellement moins
// dans la décision de Hero qu'en heads-up pur — le shift diminue donc avec le nombre de callers déjà
// dans le coup, plutôt que de rester une constante. Toujours une heuristique assumée (voir le
// commentaire au-dessus de la fonction), jamais un calcul ICM exact.
function contextRangeAdjustment(preflop, effectiveStack, format, anteOn, numCallers){
 if(!preflop || !preflop.mix || preflop.mix.length<2) return preflop; // rien à ajuster hors zone mixte
 const strat = stackStrategyTier(effectiveStack);
 let shift = 0;
 if(format==='mtt'){
 if(strat==='pushfold') shift += 9; // <=10bb : quasi plus de zone grise, on engage ou on jette
 else if(strat==='short') shift += 5; // 10-20bb : push/fold domine, moins de fold pur
 if(anteOn){
 const callers = Math.max(0, numCallers||0);
 shift += Math.round(3/(1+callers*0.5)); // ante partagée entre plus de joueurs déjà engagés -> pèse moins
 }
 }
 if(format==='cash') shift -= 2;   // pas d'ICM : on reste plus proche de la ligne standard
 if(shift===0) return preflop;
 const foldLikeActions = new Set(['FOLD']);
 const continueActions = preflop.mix.filter(m=>!foldLikeActions.has(m.action));
 const foldEntries = preflop.mix.filter(m=>foldLikeActions.has(m.action));
 if(!continueActions.length || !foldEntries.length) return preflop;
 const totalFold = foldEntries.reduce((a,m)=>a+m.freq,0);
 // delta>0 = on déplace de la masse FOLD vers CONTINUE (élargissement) : on ne peut jamais déplacer
 // plus que ce que FOLD contient. delta<0 = l'inverse (resserrement) : borné par CONTINUE. L'ancien
 // clamp (borné par 100-totalFold) autorisait un delta positif supérieur à totalFold quand le fold de
 // départ était faible (ex. 2%), ce qui ajoutait plus à CONTINUE que ce qui était réellement retiré à
 // FOLD une fois celui-ci plafonné à 0 — et faisait dépasser 100% au total (bug trouvé par fuzz-test).
 const delta = shift>=0 ? Math.min(shift, totalFold) : Math.max(shift, -(100-totalFold));
 if(delta===0) return preflop;
 const totalContinue = continueActions.reduce((a,m)=>a+m.freq,0) || 1;
 const newMix = preflop.mix.map(m=>{
 if(foldLikeActions.has(m.action)){
 const share = m.freq/totalFold;
 return {...m, freq: Math.max(0, Math.round(m.freq - delta*share))};
 }
 const share = m.freq/totalContinue;
 return {...m, freq: Math.round(m.freq + delta*share)};
 });
 const mainEntry = newMix.reduce((a,b)=> b.freq>a.freq ? b : a, newMix[0]);
 return {...preflop, mix: newMix, action: mainEntry.action, frequency: mainEntry.freq };
}
// ============================================================
// RANGES RÉELLEMENT DÉPENDANTES DU STACK — VERSION COMPLÈTE (V2.6). Les versions précédentes ne
// couvraient que les ~9 handClass déjà présentes dans les templates de 5 positions. Pour couvrir les
// 169 mains × 8 positions × 4 paliers sans inventer une fausse précision de solveur, on classe les 169
// mains avec le score de Chen — une heuristique de force de main preflop publique et bien connue,
// volontairement simple (elle ne "résout" rien, elle ordonne) — puis on prend le "top K" de ce
// classement pour chaque palier. K en stack profond reste calé EXACTEMENT sur OPEN_RANGES (la
// référence déjà utilisée partout ailleurs dans l'app : Range Trainer, textes, etc.) ; K se réduit en
// 20-40bb/10-20bb (les mains spéculatives perdent de la valeur en raise-fold, cf. commentaire plus
// bas) puis remonte largement en dessous de 10bb (théorie push/fold : le fold equity seul justifie des
// ranges beaucoup plus larges).
const MATRIX_LABELS = Array.from({length:169}, (_,index)=>{
 const row = Math.floor(index/13), column = index%13;
 const high = RANKS[12 - Math.min(row,column)];
 const low = RANKS[12 - Math.max(row,column)];
 if(row===column) return `${high}${low}`;
 return row<column ? `${high}${low}s` : `${high}${low}o`;
});
function chenScore(label){
 const rankVal = r => r==='A'?10 : r==='K'?8 : r==='Q'?7 : r==='J'?6 : r==='T'?5 : (RANKS.indexOf(r)+2)/2;
 if(label.length===2 && label[0]===label[1]) return Math.max(rankVal(label[0])*2, 5); // paire
 const suited = label.endsWith('s');
 const hi = label[0], lo = label[1];
 let score = rankVal(hi);
 if(suited) score += 2;
 const gap = RANKS.indexOf(hi) - RANKS.indexOf(lo) - 1; // cartes manquantes entre les deux rangs
 score -= gap<=0 ? 0 : gap===1 ? 1 : gap===2 ? 2 : gap===3 ? 4 : 5;
 if(gap<=1 && hi!=='A' && hi!=='K') score += 1; // bonus quinte (connectées/1-gap, hors carte haute A/K)
 return Math.max(0, Math.round(score*2)/2);
}
const CHEN_RANKED_HANDS = [...MATRIX_LABELS].sort((a,b)=> chenScore(b)-chenScore(a));
// POINT 2 DE L'AUDIT — un seul et même facteur d'élargissement/resserrement par palier de stack,
// PARTAGÉ entre la construction des ranges d'ouverture ci-dessous et applyDefenseTierRange plus bas
// (avant cette passe, les deux blocs dupliquaient indépendamment les mêmes idées avec des nombres
// écrits en dur à deux endroits différents — 0.8/0.6/1.5 ici, exactement les mêmes valeurs recopiées
// plus bas — avec le risque qu'ils divergent un jour sans que ce soit voulu). Ces facteurs restent ce
// qu'ils ont toujours été : un ordre de grandeur pédagogique assumé, jamais une fréquence de solveur.
// Le score de Chen n'est qu'un ORDRE (quelle main est généralement plus solide qu'une autre), jamais
// une probabilité ni une fréquence GTO — voir chenScore() ci-dessus. Ne jamais afficher au joueur une
// main "hors range" ou "dans la range" à un palier donné comme une vérité absolue : c'est une
// estimation par heuristique de classement, présentée comme telle dans les textes ci-dessous.
const TIER_WIDTH_MULTIPLIER = { pushfold:1.5, short:0.6, mid:0.8, deep:1 };
// Le "sourire" des ranges d'ouverture en tournoi : large en profond (le jeu postflop complet donne de
// la valeur aux mains spéculatives), plus resserré en 20-40bb puis 10-20bb (une main qui a besoin de
// plusieurs rues pour réaliser son équité vaut moins en raise-fold, quand on ne peut plus se permettre
// de perdre le pot preflop sans rien voir), puis à nouveau très large en dessous de 10bb (un tapis n'a
// plus besoin de jouabilité postflop : seul le fold equity compte). BB n'a pas d'entrée : OPEN_RANGES.BB

const OPEN_TIER_RANGE_BY_POSITION = {};
Object.keys(OPEN_RANGES).forEach(pos => {
 const deepList = OPEN_RANGES[pos] || [];
 const K = deepList.length;
 if(K===0) return;
 const topK = k => CHEN_RANKED_HANDS.slice(0, Math.min(169, Math.max(1, Math.round(k))));
 OPEN_TIER_RANGE_BY_POSITION[pos] = {
 deep: deepList,  // référence existante, inchangée — la seule des quatre qui soit une vraie range curée, pas une extrapolation
 mid: topK(K*TIER_WIDTH_MULTIPLIER.mid),
 short: topK(K*TIER_WIDTH_MULTIPLIER.short),
 pushfold: topK(K*TIER_WIDTH_MULTIPLIER.pushfold),
 };
});
const STACK_TIER_LABELS = { pushfold:'≤10bb', short:'10-20bb', mid:'20-40bb', deep:'40bb+' };
// Vue "Range Trainer" : reprend directement la table ci-dessus (son palier "deep" EST OPEN_RANGES),
// pour que la matrice ne soit plus figée sur une seule référence 100bb.
function rangeTrainerReferenceSet(position, tier){
