<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Range / Desk — local</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

:root{
  --bg:#081913; --sidebar:#071712; --card:#0c2119; --panel:#0d241b; --panel2:#10271f;
  --border:#1d3b31; --border2:#244538; --border3:#25483a; --border4:#27513f; --border5:#234536; --border6:#214235;
  --gold:#d5a850; --gold2:#e4b65e; --gold3:#e5bd67; --gold4:#f0c46f; --gold5:#eecb79; --gold6:#e6ba63; --gold7:#e8bc62;
  --cream:#f3e9ce; --cream2:#f5e9c9; --cream3:#f4e8ca; --cream4:#eee1c2; --cream5:#d2dfce; --cream6:#e0e5d5;
  --muted:#8ea699; --muted2:#8da89a; --muted3:#718e7f; --muted4:#829d8d; --muted5:#90a99b; --muted6:#668475; --muted7:#5e7e6e; --muted8:#759386; --muted9:#799687; --muted10:#91a99c; --muted11:#a8b9a5;
  --red:#d87561; --red2:#e69b8e; --green:#7fae8d;
  --shadow:0 18px 45px rgba(1,12,9,.24);
  --font-sans:'DM Sans', sans-serif; --font-mono:'Space Mono', monospace;
}
*{box-sizing:border-box;}
html{background:var(--bg);}
body{
  margin:0;min-width:320px;
  background:
    radial-gradient(circle at 78% -10%, rgba(199,156,72,.10), transparent 26rem),
    radial-gradient(circle at 15% 92%, rgba(42,122,91,.10), transparent 30rem),
    var(--bg);
  color:var(--cream); font-family:var(--font-sans); -webkit-font-smoothing:antialiased;
}
button,a,input,select{font:inherit;}
button{cursor:pointer;background:none;border:none;color:inherit;}
.mono{font-family:var(--font-mono);letter-spacing:-.03em;}
@keyframes rise-in{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.animate-rise{animation:rise-in .42s ease both;}
.felt-grid{background-image:linear-gradient(rgba(210,176,94,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(210,176,94,.045) 1px, transparent 1px); background-size:22px 22px;}
.noise::after{content:'';position:fixed;inset:0;pointer-events:none;opacity:.025;z-index:50;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.65'/%3E%3C/svg%3E");}

/* layout */
.sidebar{position:fixed;inset:0 auto 0 0;z-index:40;width:258px;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--sidebar);padding:20px 16px;transition:transform .3s;transform:translateX(-100%);}
.sidebar.open{transform:translateX(0);}
@media(min-width:1024px){.sidebar{transform:translateX(0);}}
.icon-mark{display:flex;height:40px;width:40px;align-items:center;justify-content:center;border-radius:12px;border:1px solid rgba(201,155,72,.4);background:rgba(201,155,72,.1);color:var(--gold2);}
.brand-row{display:flex;align-items:center;gap:12px;padding:0 8px;}
.brand-title{font-weight:600;letter-spacing:-.03em;color:var(--cream2);margin:0;}
.brand-sub{margin:2px 0 0;font-size:9px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted4);}
.nav-section{margin-top:44px;padding:0 8px;}
.nav-label{margin-bottom:12px;font-size:10px;text-transform:uppercase;letter-spacing:.2em;color:var(--muted7);}
.nav-link{display:flex;align-items:center;gap:12px;border-radius:8px;padding:12px;font-size:14px;color:var(--muted10);text-decoration:none;margin-bottom:4px;}
.nav-link:hover{background:var(--panel2);color:var(--cream2);}
.nav-link.active{background:rgba(201,155,72,.12);color:var(--gold4);}
.nav-link .dot{margin-left:auto;height:6px;width:6px;border-radius:50%;background:#d9aa56;}
.sidebar-footer{margin-top:auto;border-radius:12px;border:1px solid var(--border);background:var(--card);padding:16px;}
.sidebar-footer-title{display:flex;align-items:center;gap:8px;color:var(--gold);margin-bottom:10px;font-size:10px;text-transform:uppercase;letter-spacing:.16em;}
.sidebar-footer p{font-size:12px;line-height:1.5;color:var(--muted2);margin:0;}
.sidebar-version{padding:20px 8px 0;font-size:9px;text-transform:uppercase;letter-spacing:.18em;color:#46675a;}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(2,11,7,.7);}
@media(min-width:1024px){.overlay{display:none;}}

.topbar{position:sticky;top:0;z-index:20;display:flex;height:72px;align-items:center;justify-content:space-between;border-bottom:1px solid #1b372c;background:rgba(8,25,19,.9);backdrop-filter:blur(8px);padding:0 16px;}
@media(min-width:1024px){.topbar{margin-left:258px;padding:0 40px;}}
.menu-btn{padding:8px;border-radius:8px;color:var(--muted10);}
@media(min-width:1024px){.menu-btn{display:none;}}
.topbar-eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:#678476;margin:0;}
.topbar-title{margin:2px 0 0;font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--cream3);}
.topbar-actions{display:flex;align-items:center;gap:8px;}
.tb-btn{display:flex;align-items:center;gap:8px;border-radius:8px;border:1px solid var(--border3);padding:8px 12px;font-size:12px;color:var(--muted2);}
.tb-btn:hover{border-color:rgba(201,155,72,.6);color:var(--gold4);}
@media(max-width:480px){.hide-sm{display:none;}}
.postflop-grid{display:grid;gap:24px;grid-template-columns:1fr;}
@media(min-width:1024px){.postflop-grid{grid-template-columns:1fr 1.1fr;align-items:start;}}

main{min-height:calc(100dvh - 72px);}
@media(min-width:1024px){main{margin-left:258px;}}
.page{max-width:1280px;margin:0 auto;padding:24px 16px 40px;}
@media(min-width:640px){.page{padding:36px 28px;}}
@media(min-width:1024px){.page{padding:36px 40px;}}
.page-header{margin-bottom:32px;display:flex;flex-direction:column;justify-content:space-between;gap:20px;}
@media(min-width:640px){.page-header{flex-direction:row;align-items:flex-end;}}
.eyebrow{margin:0 0 8px;font-size:10px;text-transform:uppercase;letter-spacing:.25em;color:var(--gold);}
.page-h2{margin:0;font-size:34px;font-weight:600;line-height:1.05;letter-spacing:-.07em;color:var(--cream);}
@media(min-width:640px){.page-h2{font-size:44px;}}
.page-h2 .accent{color:var(--gold);}
.page-lede{margin-top:16px;max-width:32rem;font-size:14px;line-height:1.6;color:var(--muted);}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
.seg{display:flex;align-items:center;gap:4px;border-radius:8px;border:1px solid var(--border2);background:var(--panel2);padding:4px;}
.seg button{border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted4);}
.seg button.active{background:var(--gold);color:#132118;}
.diff-select{display:flex;align-items:center;gap:8px;border-radius:8px;border:1px solid var(--border2);background:var(--panel2);padding:8px 12px;font-size:12px;color:#9bb09f;}
.diff-select select{background:transparent;border:none;color:#d8dfcf;outline:none;font-size:12px;}
.link-pill{display:flex;align-items:center;gap:8px;border-radius:8px;border:1px solid var(--border2);padding:8px 12px;font-size:12px;color:var(--muted2);text-decoration:none;width:fit-content;}
.link-pill:hover{border-color:rgba(213,168,80,.6);color:var(--gold4);}

.stats-grid{margin-bottom:28px;display:grid;gap:12px;grid-template-columns:1fr;}
@media(min-width:640px){.stats-grid{grid-template-columns:repeat(2,1fr);}}
@media(min-width:1024px){.stats-grid{grid-template-columns:repeat(4,1fr);}}
.stats-grid.trainer{grid-template-columns:repeat(3,1fr);}
.stat-card{border-radius:12px;border:1px solid var(--border);background:var(--card);padding:16px;}
.stat-top{margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted6);}
.stat-value{font-size:20px;color:var(--gold5);margin:0;}
.stat-value .cap{font-size:12px;color:#718e7f;}
.stat-caption{margin-top:4px;font-size:11px;color:#718e7f;}

.progress-row{margin-bottom:28px;display:flex;align-items:center;gap:12px;}
.progress-track{height:4px;flex:1;overflow:hidden;border-radius:99px;background:#173126;}
.progress-fill{height:100%;border-radius:99px;background:var(--gold);transition:width .5s;}
.progress-note{font-size:10px;color:#708d7e;white-space:nowrap;}

.grid-main{display:grid;gap:24px;}
@media(min-width:1280px){.grid-main{grid-template-columns:minmax(0,1fr) 320px;}}
.felt-card{border-radius:16px;border:1px solid var(--border4);background:var(--panel);padding:16px;box-shadow:var(--shadow);}
@media(min-width:640px){.felt-card{padding:28px;}}
.felt-head{margin-bottom:28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border5);padding-bottom:16px;}
.felt-head-left{display:flex;align-items:center;gap:8px;}
.phase-dot{height:8px;width:8px;border-radius:50%;}
.felt-head .cat{font-size:10px;color:#5d796c;}

.pill-gold{display:inline-flex;border:1px solid rgba(201,155,72,.3);background:rgba(201,155,72,.1);border-radius:4px;padding:4px 8px;font-size:10px;font-weight:700;letter-spacing:.15em;color:var(--gold6);}
.pill-outline{display:inline-flex;border:1px solid var(--border4);background:var(--panel2);border-radius:4px;padding:4px 8px;font-size:10px;letter-spacing:.12em;color:#91aa9c;}

.hole-row{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0 20px;}
.cards-row{display:flex;align-items:center;gap:8px;}
.card{display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid rgba(215,189,131,.5);background:#f3ecd9;font-weight:600;letter-spacing:-.08em;box-shadow:3px 4px 0 rgba(197,153,69,.28);}
.card.large{height:76px;width:56px;font-size:22px;}
@media(min-width:640px){.card.large{height:92px;width:68px;font-size:28px;}}
.card.small{height:44px;width:36px;font-size:14px;}
.card.back-card{background:repeating-linear-gradient(135deg,#173026,#173026 6px,#0f2119 6px,#0f2119 12px);border:1px solid #2a4e3e;color:#4c6a5a;box-shadow:none;font-weight:700;}

.action-grid{margin-top:32px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
@media(min-width:640px){.action-grid{grid-template-columns:repeat(3,1fr);}}
.table-stage{padding-bottom:8px;}
.table-status-line{margin:4px 0 0;text-align:center;font-size:13px;color:#a8b9a5;min-height:18px;}
.fixed-action-bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:linear-gradient(to top, rgba(8,25,19,.98) 65%, rgba(8,25,19,.9));backdrop-filter:blur(6px);padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #1d3b31;}
@media(min-width:1024px){.fixed-action-bar{left:258px;}}
.fixed-action-bar-inner{max-width:900px;margin:0 auto;}
.fixed-action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.fixed-action-grid.cols-3{grid-template-columns:repeat(3,1fr);}
.fixed-action-grid.cols-4{grid-template-columns:repeat(4,1fr);}
.fixed-action-wrap{display:flex;flex-wrap:wrap;gap:8px;}
.fixed-action-wrap .fab-btn{flex:1 1 28%;min-width:64px;}
.fab-btn{border-radius:10px;padding:12px 8px;font-size:13px;font-weight:700;text-align:center;border:1px solid;}
.fab-btn.primary{border-color:rgba(213,168,80,.6);background:var(--gold);color:#162218;}
.fab-btn.call{border-color:rgba(127,174,141,.5);background:#193b2b;color:#d6e7d5;}
.fab-btn.plain{border-color:#476756;background:#112a20;color:#d6e1d4;}
.fab-btn.continue{border-color:rgba(213,168,80,.6);background:var(--gold);color:#162218;grid-column:1/-1;}
.fab-note{margin:0 0 8px;text-align:center;font-size:11px;color:#6e8b7d;}
.hand-summary-item{border-radius:10px;border:1px solid var(--border);background:var(--card);padding:12px 14px;margin-bottom:8px;}
.hand-summary-item .hs-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;}
.hand-summary-item .hs-phase{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#7fae8d;}
.hand-summary-item .hs-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;}
.hand-summary-item .hs-tag.ok{background:rgba(213,168,80,.18);color:var(--gold3);}
.hand-summary-item .hs-tag.mix{background:rgba(213,168,80,.1);color:#f0c98a;}
.hand-summary-item .hs-tag.bad{background:rgba(216,117,97,.15);color:var(--red2);}
.hand-summary-item .hs-tag.neutral{background:rgba(142,166,153,.12);color:#8ea699;}
.hand-summary-item .hs-label{font-size:14px;font-weight:600;color:var(--cream3);margin:0 0 4px;}
.hand-summary-item .hs-text{font-size:12px;line-height:1.5;color:#a5b8a5;margin:0;}
.act-btn{border-radius:12px;border:1px solid;padding:16px 12px;font-size:14px;font-weight:700;letter-spacing:.06em;text-align:left;transition:transform .15s;}
.act-btn:hover{transform:translateY(-3px);}
.act-btn:disabled{opacity:.7;cursor:default;transform:none;}
.act-btn .big{display:block;font-size:17px;letter-spacing:-.04em;}
.act-btn .small{display:block;margin-top:4px;font-size:10px;font-weight:400;opacity:.7;}
.act-btn.primary{border-color:rgba(213,168,80,.6);background:var(--gold);color:#162218;}
.act-btn.call{border-color:rgba(127,174,141,.5);background:#193b2b;color:#d6e7d5;}
.act-btn.plain{border-color:#476756;background:#112a20;color:#d6e1d4;}
.act-btn.plain:hover{border-color:rgba(216,117,97,.7);}

.feedback{border-radius:16px;border:1px solid;padding:16px;}
@media(min-width:640px){.feedback{padding:24px;}}
.feedback.ok{border-color:rgba(201,155,72,.45);background:#13291e;}
.feedback.bad{border-color:rgba(216,117,97,.45);background:#2a1a17;}
.feedback.mix{border-color:rgba(224,149,74,.5);background:#2a2114;}
.fb-head{display:flex;align-items:flex-start;gap:12px;}
.fb-icon{margin-top:2px;flex-shrink:0;display:flex;height:32px;width:32px;align-items:center;justify-content:center;border-radius:50%;font-weight:700;}
.fb-icon.ok{background:var(--gold);color:#182419;}
.fb-icon.bad{background:var(--red);color:#2a1714;}
.fb-icon.mix{background:#e0954a;color:#271807;}
.fb-title{margin:0;font-size:16px;font-weight:600;color:var(--cream3);}
.fb-text{margin:4px 0 0;font-size:14px;line-height:1.4;color:var(--muted11);}
.fb-tag{border-radius:4px;padding:4px 8px;font-size:10px;font-weight:700;white-space:nowrap;}
.fb-tag.ok{background:rgba(213,168,80,.15);color:var(--gold3);}
.fb-tag.bad{background:rgba(216,117,97,.15);color:var(--red2);}
.fb-tag.mix{background:rgba(224,149,74,.18);color:#f0ad6b;}
.fb-body{margin:20px 0;display:grid;gap:16px;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08);padding:16px 0;}
@media(min-width:640px){.fb-body{grid-template-columns:1fr 1.25fr;}}
.fb-solution .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted8);}
.fb-solution .val{margin:8px 0 0;font-size:24px;font-weight:600;letter-spacing:-.05em;color:#f3dfaa;}
.fb-solution .val .u{font-size:14px;font-weight:400;color:#8aa394;}
.fb-solution .caption{margin:4px 0 0;font-size:12px;color:#8ca396;}
.fb-actions{display:flex;flex-direction:column;gap:8px;justify-content:flex-end;}
@media(min-width:640px){.fb-actions{flex-direction:row;}}
.fb-details{margin-top:20px;border-top:1px solid rgba(255,255,255,.08);padding-top:16px;}
.profile-note{margin-top:16px;border-radius:10px;border:1px solid #3a5d4b;background:rgba(16,39,31,.6);padding:12px 14px;}
.profile-note-head{margin:0;font-size:12px;font-weight:600;color:#cfe0d5;}
.profile-note-head b{color:var(--gold4);}
.profile-tag{margin-left:6px;border-radius:4px;background:rgba(213,168,80,.14);color:var(--gold3);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 6px;}
.profile-note-text{margin:6px 0 0;font-size:12px;line-height:1.5;color:#9bb09f;}
.spot-context{font-size:16px;line-height:1.5;color:var(--cream3);margin:0;}
.spot-context b{color:var(--gold4);font-weight:700;}
.action-feed{margin-top:14px;display:flex;flex-direction:column;gap:4px;max-width:340px;margin-left:auto;margin-right:auto;}
.action-feed-empty{font-size:12px;color:#718e7f;text-align:center;margin:0;}
.action-feed-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:6px;padding:6px 12px;font-family:var(--font-mono);font-size:12px;background:#0c2119;border:1px solid #1d3b31;}
.action-feed-row .pos{color:#8ea699;font-weight:700;}
.action-feed-row .verb{color:#8ea699;}
.action-feed-row.fold{opacity:.55;}
.action-feed-row.fold .verb{color:#6b8577;}
.action-feed-row.raise{border-color:rgba(224,149,74,.5);background:#241c12;}
.action-feed-row.raise .pos,.action-feed-row.raise .verb{color:#f0c98a;}
.action-feed-row.hero{border-color:rgba(213,168,80,.6);background:#1d2a1c;}
.action-feed-row.hero .pos,.action-feed-row.hero .verb{color:var(--gold4);}
.action-feed-row.now{border-color:rgba(213,168,80,.9);background:rgba(213,168,80,.14);}
.action-feed-row.now .pos,.action-feed-row.now .verb{color:var(--gold5);font-weight:700;}
.btn-gold{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;background:var(--gold);padding:10px 16px;font-size:14px;font-weight:600;color:#142117;}
.btn-outline{border-radius:8px;border:1px solid #3a5d4b;padding:10px 16px;font-size:14px;font-weight:600;color:#d3dfd0;}
.btn-outline:hover{background:#1b382b;}

.matrix-wrap .m-head{margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.m-title{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted8);}
.m-legend{display:flex;gap:12px;font-size:10px;color:#839b8e;}
.m-legend i{margin-right:4px;display:inline-block;height:8px;width:8px;border-radius:2px;}
.matrix{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px;border-radius:6px;border:1px solid #25483a;background:#081913;padding:6px;}
.matrix .cell{display:flex;aspect-ratio:1;align-items:center;justify-content:center;border-radius:2px;font-family:var(--font-mono);font-size:7px;}
@media(min-width:640px){.matrix .cell{font-size:8px;}}
.matrix .cell.current{box-shadow:0 0 0 2px #f5e6bd;}
.matrix-foot{margin-top:8px;display:flex;justify-content:space-between;font-size:9px;color:#5e7b6d;}

.odds-panel{border-radius:12px;border:1px solid #315846;background:rgba(16,39,31,.8);padding:20px;}
.odds-panel.compact{padding:16px;}
.odds-head{margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
.odds-head-l{display:flex;align-items:center;gap:8px;color:#e5bd67;}
.odds-head-l p{font-size:10px;text-transform:uppercase;letter-spacing:.17em;margin:0;}
.odds-head-r{font-size:9px;color:#6d8b7d;}
.odds-empty{font-size:12px;line-height:1.4;color:#829d8d;}
.odds-stat{border-radius:8px;border:1px solid #244538;background:#0c2119;padding:12px;margin-bottom:12px;}
.odds-stat:last-child{margin-bottom:0;}
.odds-stat-top{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.odds-stat-top .name{font-size:14px;font-weight:600;color:#e8ddbd;margin:0;}
.odds-stat-top .outs{font-family:var(--font-mono);font-size:12px;color:#e4b65e;}
.odds-stat-grid{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.odds-stat-grid .l{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#6e8b7d;margin:0;}
.odds-stat-grid .v{font-family:var(--font-mono);margin:4px 0 0;font-size:16px;color:#d9aa56;}
.odds-stat .detail{margin:8px 0 0;font-size:11px;line-height:1.4;color:#799687;}
.odds-footnote{margin-top:16px;border-top:1px solid #214235;padding-top:12px;font-size:11px;line-height:1.4;color:#6f8d7e;}

.aside-card{border-radius:16px;border:1px solid var(--border);background:var(--card);padding:20px;}

function cardLabel(card){ return `${card.rank}${card.suit}`; }
function cardColor(card){ return (card.suit==='♠'||card.suit==='♣') ? '#183329' : '#ae4c46'; }
function parseCard(label){ return { rank: label.slice(0,-1), suit: label.slice(-1) }; }
function cardKey(card){ return `${card.rank}${card.suit}`; }
function deck(){ return RANKS.flatMap(rank => SUITS.map(suit => ({rank,suit}))); }
function shuffle(values){ const copy=[...values]; for(let i=copy.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [copy[i],copy[j]]=[copy[j],copy[i]]; } return copy; }
function cardsRemaining(excluded){ const blocked=new Set(excluded.map(cardKey)); return deck().filter(c=>!blocked.has(cardKey(c))); }
function chooseHole(handClass, excluded){
  const rank1=handClass[0], rank2=handClass[1], suffix=handClass[2];
  const available = cardsRemaining(excluded);
  if(rank1===rank2){ const choices=available.filter(c=>c.rank===rank1); return shuffle(choices).slice(0,2); }
  if(suffix==='s'){
    const suit = shuffle(SUITS.filter(candidate => available.some(c=>c.rank===rank1 && c.suit===candidate) && available.some(c=>c.rank===rank2 && c.suit===candidate)))[0] ?? '♠';
    return [{rank:rank1,suit},{rank:rank2,suit}];
  }
  const combos = shuffle(available.filter(c=>c.rank===rank1).flatMap(first => available.filter(c=>c.rank===rank2 && c.suit!==first.suit).map(second=>[first,second])));
  return combos[0] ?? [{rank:rank1,suit:'♠'},{rank:rank2,suit:'♥'}];
}
function rangeToClass(hole){
  const [first,second] = [...hole].sort((a,b)=>RANKS.indexOf(b.rank)-RANKS.indexOf(a.rank));
  if(first.rank===second.rank) return `${first.rank}${second.rank}`;
  return `${first.rank}${second.rank}${first.suit===second.suit?'s':'o'}`;
}
function handLabel(hole){ return rangeToClass(hole); }

// Générateur dédié au module Probabilités : une main + un runout 100% aléatoires,
// sans AUCUN contexte de décision (catégorie, ligne d'action, stack, pot...).
// Volontairement découplé de `templates`/`pickSpot`, qui appartiennent au moteur
// d'entraînement préflop/postflop et n'ont rien à faire dans un outil de calcul pur.
function randomProbaHand(){
  const shuffled = shuffle(deck());
  const hole = shuffled.slice(0,2);
  const runout = shuffled.slice(2,7); // flop(3) + turn(1) + river(1)
  return { hole, runout, handClass: rangeToClass(hole) };
}
function trainerCategoryWeights(){
  const recent = state.history.slice(-40);
  const byCat = {};
  recent.forEach(item => {
    if(!byCat[item.category]) byCat[item.category] = { correct:0, total:0 };
    byCat[item.category].total++;
    if(item.correct) byCat[item.category].correct++;
  });
  return byCat;
}

const VILLAIN_PROFILE_KEYS = ['reg','nit','lag','fish'];
// ============================================================
// RÉACTION DE L'ADVERSAIRE — pour que chaque main ressemble à une vraie table.
// Volontairement borné : pas d'arbre de relances infini. Quand l'adversaire relance à son tour,
// on présente une SEULE sous-décision simple (fold/call), non notée JUSTE/MIX/ERREUR — ce n'est pas
// un nouveau spot théorique, juste une complication réaliste pour terminer la main proprement.
// Les probabilités ET LES TAILLES sont des heuristiques pédagogiques par profil, pas des fréquences
// de solveur — mais on affiche toujours un chiffre plausible plutôt qu'un simple "Bet"/"Raise" sans
// contexte, pour rester cohérent avec le reste de l'app qui est très orienté chiffres.
const PREFLOP_FOLD_TO_RAISE = { nit:0.60, reg:0.45, lag:0.25, fish:0.15 };
// Face à un 3-bet spécifiquement, l'ouvreur original peut aussi 4-bet en retour (pas juste fold/call) —
// borné à 3BET : un 4-bet/shove ne peut pas se faire re-relancer dans ce moteur.
const PREFLOP_3BET_REACTION = {
  nit:  { fold:0.55, raise:0.08 },
  reg:  { fold:0.42, raise:0.12 },
  lag:  { fold:0.22, raise:0.22 },
  fish: { fold:0.15, raise:0.08 },
};
const POSTFLOP_BET_REACTION = {
  nit:  { fold:0.35, raise:0.06 },
  reg:  { fold:0.25, raise:0.10 },
  lag:  { fold:0.15, raise:0.18 },
  fish: { fold:0.10, raise:0.05 },
};
const POSTFLOP_CHECK_BET_PROB = { nit:0.20, reg:0.30, lag:0.50, fish:0.35 };
// Sizing des mises/relances "surprises", exprimé en % pot (mise) ou en multiple (relance), pour rester
// cohérent avec l'affichage BET 33%/50%/75% déjà utilisé partout ailleurs dans l'app.
const SURPRISE_SIZE_BY_PROFILE = {
  nit:  { bet:['33%','50%'],  raise:['2.2x','2.5x'] },
  lag:  { bet:['75%','100%'], raise:['3x','4x'] },
  reg:  { bet:['50%','66%'],  raise:['2.5x','3x'] },
  fish: { bet:['50%','125%'], raise:['2x','5x'] }, // imprévisible, comme son profil
};
function pickSurpriseSize(profileKey, kind){
  const table = SURPRISE_SIZE_BY_PROFILE[profileKey] ?? SURPRISE_SIZE_BY_PROFILE.reg;
  const options = table[kind];
  return options[Math.floor(Math.random()*options.length)];
}
// Taille plausible d'une 4-bet en retour sur un 3-bet dynamique (pas scriptée dans le spot) : dérivée
// de l'open déjà présent dans spot.actions, avec un multiple cohérent avec nos propres spots scriptés
// (ex. open 2.3 → 3-bet 9 → 4-bet 20, soit environ 8-9x l'open).
function estimatePreflopReraiseSize(spot){
  const openAmount = (spot.actions||[]).find(a=>a.action==='open')?.amount;
  if(!openAmount) return null;
  const mult = 7.5 + Math.random()*2;
  return Math.round(openAmount*mult*2)/2;
}
// Combien de BB il reste réellement à jouer postflop, d'après le dernier montant engagé au préflop —
// pour détecter les situations où on est déjà, dans les faits, quasiment tapis (ex. call d'une 4-bet
// qui représente 80%+ du stack effectif), où proposer un menu de sizing complet n'a plus de sens.
function computeRemainingStackBB(spot){
  const acts = spot.actions || [];
  const raises = acts.filter(a => a.amount && ['open','3bet','4bet','5bet'].includes(a.action));
  const committed = raises.length ? Math.max(...raises.map(a=>a.amount)) : 0;
  return Math.max(0, spot.effectiveStack - committed);
}
function simulatePreflopRaiseReaction(profileKey, actionType){
  if(actionType==='3BET'){
    const t = PREFLOP_3BET_REACTION[profileKey] ?? PREFLOP_3BET_REACTION.reg;
    const r = Math.random();
    if(r < t.fold) return 'fold';
    if(r < t.fold + t.raise) return 'raise';
    return 'call';
  }
  const p = PREFLOP_FOLD_TO_RAISE[profileKey] ?? PREFLOP_FOLD_TO_RAISE.reg;
  return Math.random() < p ? 'fold' : 'call';
}
function simulatePostflopBetReaction(profileKey){
  const t = POSTFLOP_BET_REACTION[profileKey] ?? POSTFLOP_BET_REACTION.reg;
  const r = Math.random();
  if(r < t.fold) return 'fold';
  if(r < t.fold + t.raise) return 'raise';
  return 'call';
}
function simulatePostflopCheckReaction(profileKey){
  const p = POSTFLOP_CHECK_BET_PROB[profileKey] ?? POSTFLOP_CHECK_BET_PROB.reg;
  return Math.random() < p ? 'bet' : 'check';
}

// "Testez votre profil" : lecture des propres tendances de héros à partir de son historique réel
// (pas de nouvelle donnée inventée). Nécessite un minimum de mains pour éviter un verdict prématuré.
function normalizeDecisionLabel(decision){
  if(['CALL','FOLD','3BET','4BET','OPEN','SHOVE'].includes(decision)) return actionName(decision);
  if(decision==='CHECK') return 'Check';
  if(String(decision).startsWith('BET')) return 'Mises postflop';
  return decision;
}
function computeHeroProfile(){
  const total = state.history.length;
  if(total<15) return { ready:false, total, needed:15 };
  const folds = state.history.filter(i=>i.decision==='FOLD').length;
  const foldRate = Math.round((folds/total)*100);
  const aggroCount = state.history.filter(i=> ['3BET','4BET','OPEN'].includes(i.decision) || String(i.decision).startsWith('BET')).length;
  const aggroRate = Math.round((aggroCount/total)*100);
  const accuracy = Math.round((state.history.filter(i=>i.correct).length/total)*100);
  // Précision PAR TYPE DE DÉCISION (call, 3-bet, 4-bet, fold, mises postflop...) — c'est ce qui permet
  // de dire "tes calls sont bons mais tes 4-bets te posent problème" au lieu d'un verdict global flou.
  const groups = {};
  state.history.forEach(item => {
    const label = normalizeDecisionLabel(item.decision);
    if(!groups[label]) groups[label] = { correct:0, total:0 };
    groups[label].total++;
    if(item.correct) groups[label].correct++;
  });
  const byDecision = Object.entries(groups)
    .filter(([,v]) => v.total>=3) // échantillon minimum pour éviter un verdict sur 1 seule main
    .map(([label,v]) => ({ label, total:v.total, accuracy:Math.round((v.correct/v.total)*100) }))
    .sort((a,b) => a.accuracy-b.accuracy);
  const weakest = byDecision.length ? byDecision[0] : null;
  const strongest = byDecision.length ? byDecision[byDecision.length-1] : null;
  let archetype, strengths, improve;
  if(foldRate>=50){
    archetype = 'Plutôt serré (Nit)';
    strengths = ['Bonne discipline : peu de mains marginales jouées.', 'Difficile à bluffer massivement.'];
    improve = ['Vous foldez peut-être trop face aux relances larges (agressifs, débutants) : essayez de continuer plus large contre eux.', 'Travaillez le squeeze et le 3-bet pour rester moins lisible.'];
  } else if(aggroRate>=40 && foldRate<25){
    archetype = 'Plutôt agressif (LAG)';
    strengths = ['Vous mettez de la pression et gagnez des pots sans showdown.', 'Difficile à jouer pour un adversaire passif.'];
    improve = ['Gardez un bon équilibre value/bluff : le surplus de volume coûte cher face à un joueur qui ne fold jamais.', 'Surveillez votre taux d\u2019erreurs sur les spots de 3-bet/4-bet.'];
  } else if(accuracy>=75){
    archetype = 'Régulier équilibré (TAG)';
    strengths = ['Bon équilibre entre fold, call et relance.', `${accuracy}% de décisions justes ou acceptables : bonne lecture des ranges.`];
    improve = ['Continuez à varier tables et profils d\u2019adversaires pour rester affûté.'];
  } else {
    archetype = 'Profil encore en construction';
    strengths = ['Vous explorez un peu toutes les lignes : normal en phase d\u2019apprentissage.'];
    improve = [`Précision actuelle : ${accuracy}%. Concentrez-vous sur une seule catégorie à la fois (voir Par street / Par position).`];
  }
  if(weakest) improve.unshift(`Votre point le plus faible : <b>${weakest.label}</b> (${weakest.accuracy}% de réussite sur ${weakest.total} décisions). C\u2019est la catégorie à retravailler en priorité.`);
  if(strongest && strongest.label!==(weakest&&weakest.label)) strengths.unshift(`Votre point le plus solide : <b>${strongest.label}</b> (${strongest.accuracy}% de réussite sur ${strongest.total} décisions).`);
  return { ready:true, total, foldRate, aggroRate, accuracy, archetype, strengths, improve, byDecision };
}
function pickVillainProfileKey(mode){
  if(!mode || mode==='reg') return 'reg';
  if(mode!=='random') return mode;
  // Population de tournoi réaliste : surtout des réguliers, avec un peu de tout le reste.
  const r = Math.random();
  if(r<0.4) return 'reg';
  if(r<0.65) return 'nit';
  if(r<0.85) return 'lag';
  return 'fish';
}
// Applique le profil : ne touche QUE le sizing des actions de l'ADVERSAIRE (jamais celles de héros,
// dont la fréquence/l'action correcte reste celle du spot d'origine), et recalcule le pot en conséquence.
// Pour un open "first in" (pas de villain scripté), quelqu'un doit tout de même payer pour voir le
// flop. On assigne une position plausible (les blindes défendent plus souvent qu'un joueur au hasard
// plus loin) au lieu de dire vaguement "l'action a été payée" sans jamais dire par qui.
function pickImpliedCaller(heroPosition, tableSize){
  const order = tableSize===6 ? SIX_MAX : NINE_MAX;
  const heroIdx = order.indexOf(heroPosition);
  if(heroIdx===-1) return null;
  const after = order.slice(heroIdx+1);
  if(after.length===0) return null;
  if(after.includes('BB') && Math.random()<0.55) return 'BB';
  if(after.includes('SB') && Math.random()<0.35) return 'SB';
  return after[Math.floor(Math.random()*after.length)];
}
function applyVillainProfile(spot, profileMode){
  if(spot.villainPosition==='—') return { ...spot, villainProfile:null, villainStack:null, impliedCaller: pickImpliedCaller(spot.heroPosition, spot.table) };
  const key = pickVillainProfileKey(profileMode);
  const profile = VILLAIN_PROFILES[key];
  const scaledActions = (spot.actions||[]).map(a => {
    if(a.pos===spot.heroPosition || !a.amount || a.action==='limp') return a; // un limp coûte toujours exactement 1 bb, jamais mis à l'échelle
    return { ...a, amount: Math.round(a.amount*profile.sizeMult*10)/10 };
  });
  const scaledPot = Math.round(spot.pot*profile.sizeMult*10)/10;
  // "Stack à table" de l'adversaire, pour la sensation de vraie table : toujours ≥ au stack effectif
  // de la main (qui reste, par définition, le plus petit des deux stacks et gouverne seul le SPR/les
  // calculs). Ce chiffre est donc une info de contexte, jamais une valeur qui contredit la main jouée.
  const villainStack = spot.effectiveStack + Math.round(Math.random()*60);
  return { ...spot, actions:scaledActions, pot:scaledPot, villainProfile:key, villainStack };
}
function recentPositionCounts(){
  const recentHands = state.history.filter(i=>i.street==='Préflop').slice(-6);
  const counts = {};
  recentHands.forEach(item => { counts[item.position] = (counts[item.position]||0)+1; });
  return counts;
}
function pickSpot(table, current, difficulty, villainProfileMode){
  difficulty = difficulty || 'Tous';
  const allowed = table===6 ? SIX_MAX : NINE_MAX;
  const maxDifficulty = difficulty==='Débutant'?1 : difficulty==='Intermédiaire'?2 : difficulty==='Avancé'?3 : 3;
  const pool = templates.filter(t => allowed.includes(t.heroPosition) && t.difficulty<=maxDifficulty && t.id!==current);
  let template = pool[0] ?? templates[0];
  if(pool.length){
    // Répétition intelligente : les catégories où l'utilisateur s'est récemment trompé reviennent plus
    // souvent, MAIS sans jamais pouvoir faire tourner en boucle une seule position — chaque répétition
    // récente de la même position réduit son poids (BUG CORRIGÉ : la pondération par catégorie seule
    // pouvait, dans les faits, coincer le tirage sur une position quasi tout le temps).
    const weights = trainerCategoryWeights();
    const posCounts = recentPositionCounts();
    const weighted = pool.map(t => {
      const w = weights[t.category];
      let catWeight = 2; // pas assez de données récentes -> poids neutre
      if(w && w.total>=2){
        const acc = w.correct/w.total;
        catWeight = Math.max(0.6, 2.6*(1-acc)+0.4); // moins précis sur ce thème -> poids plus élevé
      }
      catWeight = Math.min(catWeight, 2.2); // on plafonne pour que ça reste une préférence, pas un verrouillage
      const posPenalty = Math.pow(0.6, posCounts[t.heroPosition]||0); // pénalité qui grandit à chaque répétition récente
      return catWeight * posPenalty;
    });
    const totalW = weighted.reduce((a,b)=>a+b,0);
    let r = Math.random()*totalW;
    for(let i=0;i<pool.length;i++){ r -= weighted[i]; if(r<=0){ template = pool[i]; break; } }
  }
  const flop = template.flop.map(parseCard);
  const hole = chooseHole(template.handClass, flop);
  const future = shuffle(cardsRemaining([...flop, ...hole])).slice(0,2);
  const spot = { ...template, table, hole, runout: [...flop, ...future] };
  return applyVillainProfile(spot, villainProfileMode);
}
const MATRIX_LABELS = Array.from({length:169}, (_,index)=>{
  const row = Math.floor(index/13), column = index%13;
  const high = RANKS[12 - Math.min(row,column)];
  const low = RANKS[12 - Math.max(row,column)];
  if(row===column) return `${high}${low}`;
  return row<column ? `${high}${low}s` : `${high}${low}o`;
});
function combinations(n,k){ if(k===0) return 1; if(k>n) return 0; let result=1; for(let i=1;i<=k;i++) result=(result*(n-k+i))/i; return result; }
function hasFlush(cards){ return SUITS.some(suit => cards.filter(c=>c.suit===suit).length>=5); }
function hasTrips(cards){ return RANKS.some(rank => cards.filter(c=>c.rank===rank).length>=3); }
function hasStraight(cards){
  const unique = new Set(cards.map(c=>c.rank));
  if(unique.has('A')) unique.add('1');
  // 9 fenêtres valides de 5 rangs consécutifs : 2-3-4-5-6 … T-J-Q-K-A (RANKS a 13 éléments, indices 0..12).
  // BUG CORRIGÉ : la borne était `start<=9`, ce qui produisait une 10e fenêtre tronquée à 4 cartes
  // (J-Q-K-A, indices 9..12) et déclenchait un faux positif dès que ces 4 rangs étaient présents,
  // même sans le 10 pour compléter la quinte.
  for(let start=0; start<=8; start++){ const window=RANKS.slice(start,start+5); if(window.every(r=>unique.has(r))) return true; }
  const wheel=['A','2','3','4','5'];
  return wheel.every(r=>unique.has(r));
}
function drawProbability(hole, board, target){
  const visible=[...hole,...board];
  const remaining = cardsRemaining(visible);
  const current = target(visible);
  const oneCardHits = remaining.filter(card => target([...visible,card])).length;
  const oneCardChance = current ? 100 : (oneCardHits/remaining.length)*100;
  const cardsToCome = Math.max(0, 5-board.length);
  let byRiver = oneCardChance;
  if(!current && cardsToCome>=2){
    let hits=0;
    for(let i=0;i<remaining.length;i++) for(let j=i+1;j<remaining.length;j++) if(target([...visible,remaining[i],remaining[j]])) hits++;
    byRiver = (hits/combinations(remaining.length,2))*100;
  }
  return { outs: current?0:oneCardHits, next: oneCardChance, river: current?100:byRiver };
}
function hasFullHouseOrBetter(cards){
  const counts = Object.values(rankCounts(cards));
  if(counts.some(c=>c>=4)) return true; // carré
  return counts.some(c=>c>=3) && counts.filter(c=>c>=2).length>=2; // brelan + une autre paire = full
}
function numericRank(r){ return RANKS.indexOf(r)+2; } // '2'->2 ... 'A'->14
function hasFourConsecutiveRanks(numSet){
  const nums = new Set(numSet);
  if(nums.has(14)) nums.add(1); // l'As peut aussi jouer bas (roue)
  for(let start=1; start<=10; start++){
    let ok=true;
    for(let k=0;k<4;k++){ if(!nums.has(start+k)){ ok=false; break; } }
    if(ok) return true;
  }
  return false;
}
// BUG CORRIGÉ : la classification se faisait uniquement sur le NOMBRE d'outs (8 = OESD, 4 = gutshot),
// ce qui confond un vrai OESD avec une double quinte ventrale (double gutshot) — les deux ont 8 outs
// mais sont des structures différentes. On analyse maintenant les rangs qui complètent réellement la
// quinte et on vérifie s'ils forment les deux extrémités d'une suite de 4 cartes déjà consécutives.
function classifyStraightDraw(hole, board){
  const cards=[...hole,...board];
  if(hasStraight(cards)) return null;
  const remaining = cardsRemaining(cards);
  const connectingRanks = new Set();
  remaining.forEach(c => { if(hasStraight([...cards, c])) connectingRanks.add(c.rank); });
  if(connectingRanks.size===0) return null;
  const knownNums = new Set(cards.map(c=>numericRank(c.rank)));
  const openEnded = connectingRanks.size>=2 && hasFourConsecutiveRanks(knownNums);
  if(connectingRanks.size===1){
    return { label:'Quinte par un bout (gutshot)', detail:'Une seule carte complète la quinte : un tirage ventral classique.' };
  }
  if(openEnded){
    return { label:'Quinte par les deux bouts', detail:'Quatre rangs déjà consécutifs : les deux extrémités complètent la quinte.' };
  }
  return { label:'Double quinte ventrale (double gutshot)', detail:'Deux tirages ventraux distincts en même temps : deux rangs différents complètent chacun une quinte, sans suite de 4 cartes déjà formée.' };
}
function calculateDrawStats(hole, board){
  const cards=[...hole,...board];
  const stats=[];
  const suitCount = Math.max(...SUITS.map(suit => cards.filter(c=>c.suit===suit).length));
  if(suitCount>=3 && !hasFlush(cards)){
    const result = drawProbability(hole,board,hasFlush);
    const backdoor = suitCount===3;
    stats.push({name: backdoor ? 'Couleur (backdoor)' : 'Couleur', ...result, detail: backdoor ? '3 cartes de la même couleur seulement : il faut toucher deux fois d\u2019ici la river (runner-runner), pas un tirage classique.' : '4 cartes de la même couleur : 9 outs classiques.'});
  }
  // BUG CORRIGÉ : l'ancienne version déclenchait « Brelan / set » dès qu'une paire existait
  // N'IMPORTE OÙ dans les cartes combinées (y compris une simple top paire, ex. A♠K♦ sur A♥7♣2♠,
  // qui n'est PAS un tirage de set). On ne calcule ce tirage que pour une VRAIE paire servie en main.
  const heroPocketPair = hole.length===2 && hole[0].rank===hole[1].rank;
  if(heroPocketPair && !hasTrips(cards)){
    const pairRank = hole[0].rank;
    const result = drawProbability(hole, board, visible => visible.filter(c=>c.rank===pairRank).length>=3);
    stats.push({name:'Brelan / set', ...result, detail:'Ta paire servie peut retomber sur l\u2019un de ses 2 outs restants pour former un brelan (set).'});
  }
  // Nouveau : deux paires (ou brelan + paire) qui cherchent un full house / carré.
  const pairRanks = RANKS.filter(rank => cards.filter(c=>c.rank===rank).length>=2);
  const heroContributesPair = hole.some(hc => cards.filter(c=>c.rank===hc.rank).length>=2);
  if(heroContributesPair && pairRanks.length>=2 && !hasFullHouseOrBetter(cards)){
    const result = drawProbability(hole, board, hasFullHouseOrBetter);
    if(result.river>0){
      stats.push({name:'Full house ou mieux', ...result, detail:'Deux paires (ou un brelan + une paire) deviennent full house si l\u2019un des rangs pairés retouche — ou carré si c\u2019est ton brelan qui retouche.'});
    }
  }
  if(!hasStraight(cards)){
    const result = drawProbability(hole,board,hasStraight);
    if(result.river>0){
      if(result.outs===0){
        stats.push({name:'Quinte (backdoor)', ...result, detail:'Pas de tirage direct : il faut deux cartes précises d\u2019affilée (runner-runner) pour compléter la quinte.'});
      } else {
        const classification = classifyStraightDraw(hole, board);
        stats.push({name: classification ? classification.label : 'Tirage quinte', ...result, detail: classification ? classification.detail : 'Les cartes manquantes sont comptées sans doublon.'});
      }
    }
  }
  return stats;
}
function visibleBoard(spot, street){ return spot.runout.slice(0, street==='FLOP'?3 : street==='TURN'?4:5); }
function formatPercent(value){ if(value===0) return '0%'; if(value>=99.95) return '100%'; return `${value.toFixed(value<10?1:0)}%`; }

// ============================================================
// MOTEUR QCM — deux modules strictement séparés :
//  - PROBA_GENERATORS  : « quelle est ma chance de toucher / améliorer ? »
//  - COTE_GENERATORS   : « est-ce que le prix demandé me permet de payer ? »
// Aucun des deux modules ne conclut automatiquement à un call/fold.

// -- Probabilité exacte « flop from scratch » : on énumère les C(50,3) flops
// possibles (cartes restantes après les 2 cartes en main) et on compte ceux
// qui vérifient la cible. C'est lent à l'échelle d'un moteur temps réel mais
// instantané pour générer UNE question (≈19 600 combinaisons).
function enumerateFlops(hole){
  const remaining = cardsRemaining(hole);
  const combos = [];
  for(let i=0;i<remaining.length;i++)
    for(let j=i+1;j<remaining.length;j++)
      for(let k=j+1;k<remaining.length;k++)
        combos.push([remaining[i],remaining[j],remaining[k]]);
  return combos;
}
function flopProbability(hole, targetFn){
  const combos = enumerateFlops(hole);
  let hits = 0;
  for(const flop of combos){ if(targetFn(hole, flop)) hits++; }
  return (hits/combos.length)*100;
}
function rankCounts(cards){ const c={}; cards.forEach(card=>{ c[card.rank]=(c[card.rank]||0)+1; }); return c; }

function shuffle2(arr){ return shuffle(arr); }
function buildOptions(correctLabel, distractorLabels){
  const seen = new Set([correctLabel]);
  const uniques = [];
  for(const label of distractorLabels){ if(!seen.has(label)){ seen.add(label); uniques.push(label); } }
  const opts = [{label:correctLabel, isCorrect:true}, ...uniques.slice(0,3).map(l=>({label:l, isCorrect:false}))];
  return shuffle(opts);
}
function makeMcqPercent(correctPct){
  const fmt = v => formatPercent(Math.max(0,v));
  const correctLabel = fmt(correctPct);
  // Écart minimal entre deux options pour éviter des distracteurs trop proches ou identiques après arrondi.
  const minGap = Math.max(1.5, correctPct*0.18);
  const usedValues = [correctPct];
  const distractors = [];
  const baseFactors = shuffle([0.35,0.5,1.6,1.9,2.3,2.7,3.2,0.2]);
  let idx = 0, guard = 0;
  while(distractors.length<3 && guard<60){
    guard++;
    const f = baseFactors[idx % baseFactors.length]; idx++;
    const jitter = 1 + (Math.random()*0.3-0.15);
    const candidate = Math.max(0.1, correctPct*f*jitter);
    const label = fmt(candidate);
    const tooClose = usedValues.some(v => Math.abs(v-candidate) < minGap) || label===correctLabel;
    if(!tooClose){ distractors.push(label); usedValues.push(candidate); }
  }
  // Filet de sécurité (cas extrêmes, ex. probabilité très proche de 0 ou de 100) :
  // on force un écart croissant si le tirage aléatoire n'a pas suffi.
  let step = 1;
  while(distractors.length<3){
    const candidate = Math.max(0.1, Math.min(100, correctPct + step*minGap*(distractors.length%2===0?1:-1)));
    const label = fmt(candidate);
    if(label!==correctLabel && !distractors.includes(label)) distractors.push(label);
    step++;
    if(step>20) break;
  }
  return buildOptions(correctLabel, distractors);
}
function makeMcqInt(correctInt, poolCandidates){
  const correctLabel = String(correctInt);
  let candidates = (poolCandidates||[]).filter(v=>v!==correctInt && v>0);
  if(candidates.length<3){
    const deltas = shuffle([-4,-3,-2,2,3,4,5,-5]);
    for(const d of deltas){ const v=correctInt+d; if(v>0 && !candidates.includes(v)) candidates.push(v); if(candidates.length>=5) break; }
  }
  const distractors = shuffle(candidates).slice(0,3).map(String);
  return buildOptions(correctLabel, distractors);
}

      const promptHtml = `Le pot est de <span class="hl">${pot} bb</span> avant la mise adverse. L'adversaire mise <span class="hl">${bet} bb</span>. Quelle est la cote directe (ratio pot : call) qu'on te propose ?`;
      const explanationHtml = `<p>Pot après la mise adverse = ${pot} + ${bet} = ${potAfterBet} bb. Ton call coûte ${bet} bb.</p><p>Cote directe = ${potAfterBet} : ${bet} ≈ <span class="formula">${correctLabel}</span>.</p>`;
      return { promptHtml, options, explanationHtml, freeAnswer:ratio, tolerance:0.3, freeUnit:':1' };
    } },
  { category:'equity_oneinx', categoryLabel:'Equity ↔ « 1 fois sur X »', level:1,
    generate(){
      const equity = [20,25,30,33,40,50][Math.floor(Math.random()*6)];
      const correctX = Math.round(100/equity);
      const candidates = new Set([correctX]);
      let guard=0;
      while(candidates.size<4 && guard<20){ const delta=[1,-1,2,-2][Math.floor(Math.random()*4)]; candidates.add(Math.max(1,correctX+delta)); guard++; }
      const options = shuffle([...candidates]).map(v=>({label:`1 fois sur ${v}`, isCorrect:v===correctX}));
      const promptHtml = `Tu as besoin de <span class="hl">${equity}%</span> d'equity pour payer. Cela correspond à peu près à :`;
      const explanationHtml = `<p>100 ÷ ${equity} ≈ <span class="formula">${correctX}</span>, donc il faut gagner environ 1 fois sur ${correctX} pour que le call soit rentable à long terme.</p>`;
      return { promptHtml, options, explanationHtml, freeAnswer:correctX, tolerance:0, freeUnit:'(X)' };
    } },
  { category:'concept', categoryLabel:'Concepts (implied odds, outs sales…)', level:2,
    generate(){
      const q = CONCEPT_QUESTIONS[Math.floor(Math.random()*CONCEPT_QUESTIONS.length)];
      const options = shuffle(q.options.map(o=>({...o})));
      return { promptHtml:q.prompt, options, explanationHtml:q.explanation, freeAnswer:null, tolerance:0, freeUnit:'' };
    } },
];

function pickWeightedGenerator(pool, statsStore){
  if(pool.length===0) return null;
  const weights = pool.map(g => {
    const s = statsStore[g.category];
    if(!s || s.total<3) return 3;
    const acc = s.correct/s.total;
    return Math.max(0.6, 3*(1-acc)+0.4);
  });
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for(let i=0;i<pool.length;i++){ r -= weights[i]; if(r<=0) return pool[i]; }
  return pool[pool.length-1];
}
function qcmState(mod){ return mod==='proba' ? state.qcmProba : state.qcmCote; }
function qcmGenerators(mod){ return mod==='proba' ? PROBA_GENERATORS : COTE_GENERATORS; }
function qcmStorageKey(mod){ return mod==='proba' ? QCM_PROBA_KEY : QCM_COTE_KEY; }
function newQcmQuestion(mod){
  const st = qcmState(mod);
  const pool = qcmGenerators(mod).filter(g => g.level<=levelNumFromLabel(st.level));
  const chosen = pickWeightedGenerator(pool.length?pool:qcmGenerators(mod), st.stats);
  const q = chosen.generate();
  q.category = chosen.category; q.categoryLabel = chosen.categoryLabel; q.level = chosen.level;
  st.question = q; st.selected = null; st.freeInput = ''; st.revealed = false; st.lastFreeCorrect = false;
}
function recordQcmAnswer(mod, correct){
  const st = qcmState(mod);
  const cat = st.question.category;
  if(!st.stats[cat]) st.stats[cat] = { correct:0, total:0, label:st.question.categoryLabel };
  st.stats[cat].total++; if(correct) st.stats[cat].correct++;
  st.stats[cat].label = st.question.categoryLabel;
  saveQcmStats(qcmStorageKey(mod), st.stats);
  st.totalCount++; if(correct) st.correctCount++;
}
function answerQcmOption(mod, idx){
  const st = qcmState(mod);
  if(st.revealed) return;
  st.selected = idx; st.revealed = true;
  recordQcmAnswer(mod, !!st.question.options[idx].isCorrect);
  render();
}
function answerQcmFree(mod){
  const st = qcmState(mod);
  if(st.revealed || st.question.freeAnswer===null) return;
  const val = parseFloat(String(st.freeInput).replace(',','.'));
  if(Number.isNaN(val)) return;
  const tol = st.question.tolerance ?? 1;
  const correct = Math.abs(val - st.question.freeAnswer) <= tol;
  st.revealed = true; st.lastFreeCorrect = correct;
  recordQcmAnswer(mod, correct);
  render();
}

// Résumé texte court de la situation, pour l'historique (ex. "BTN open 2.3 bb").
function situationSummary(spot){
  if(spot.villainPosition==='—') return 'Premier à parler';
  const lastAct = (spot.actions||[]).slice(-1)[0];
  return lastAct ? `${spot.villainPosition} ${actionPhrase(lastAct.action, lastAct.amount)}` : `Face à ${spot.villainPosition}`;
}
function log(decision, recommended, tier, currentStreet){
  const item = {
    id:`${Date.now()}-${Math.random()}`, hand:handLabel(state.spot.hole), position:state.spot.heroPosition,
    street:currentStreet, tier, correct: tier!=='error', decision, recommended, category:state.spot.category,

function nextHand(){

  state.phase='preflop'; state.selected=null; state.postAction=null; state.street='FLOP';
  state.preflopOutcome=null; state.postflopOutcome=null; state.facingSurprise=null; state.facingPreflopRaise=null; state.streetLog=[];
  state.awaitingOpenSize=false; state.openSize=null; state.openSizeTier=null; state.awaitingFollowupReveal=false; state.allInRunout=false;
  state.handLog=[]; state.handOver=false;

}
// Au lieu de sauter directement à une nouvelle main quand le coup se termine (fold, adversaire qui se
// couche, tapis atteint...), on affiche d'abord un résumé complet de la main — plus besoin de lire un
// paragraphe à chaque street, tout arrive en un seul écran de bilan à la fin.
function pushHandLog(entry){ state.handLog.push(entry); }
function endHand(){ state.handOver = true; render(); }
// Certains spots représentaient "vous avez déjà open, vous vous êtes déjà fait 3-bet" comme un fait
// pré-scripté, sans jamais vous laisser décider cette première action vous-même. `followup` transforme
// ça en vraie séquence vécue : vous décidez d'abord (open/3-bet, noté), PUIS l'adversaire applique la
// pression scriptée du spot (ou fold, selon son profil) — et seulement là arrive la vraie décision notée.
function willVillainApplyFollowup(spot, profileKey){
  let foldProb;
  if(spot.followup.triggerAction==='OPEN'){
    foldProb = PREFLOP_FOLD_TO_RAISE[profileKey] ?? PREFLOP_FOLD_TO_RAISE.reg;
  } else {
    const t = PREFLOP_3BET_REACTION[profileKey] ?? PREFLOP_3BET_REACTION.reg;
    foldProb = t.fold;
  }
  return Math.random() >= foldProb;
}
// BUG CORRIGÉ : quand héros CALL un open (au lieu de relancer), les blindes qui n'avaient pas encore
// parlé étaient toujours silencieusement passives — jamais de squeeze. On leur donne une vraie chance
// de relancer, comme à une table réelle.
function blindsBehindHero(spot, tableSize){
  const order = tableSize===6 ? SIX_MAX : NINE_MAX;
  const heroIdx = order.indexOf(spot.heroPosition);
  if(heroIdx===-1) return [];
  return ['SB','BB'].filter(b => order.indexOf(b) > heroIdx && b!==spot.heroPosition && b!==spot.villainPosition);
}
const BLIND_SQUEEZE_PROB = { nit:0.06, reg:0.11, lag:0.18, fish:0.06 };
function simulateBlindSqueeze(spot, profileKey){
  const behind = blindsBehindHero(spot, spot.table);
  if(behind.length===0) return null;
  const p = BLIND_SQUEEZE_PROB[profileKey] ?? BLIND_SQUEEZE_PROB.reg;
  return Math.random() < p ? behind[Math.floor(Math.random()*behind.length)] : null;
}
function choosePreflop(action){
  state.selected = action;
  const tier = preflopTier(state.spot, action);
  log(action, state.spot.preflop.action, tier, 'Préflop');
  pushHandLog({ phase:'Préflop', label:actionName(action)+(state.openSize?` (${state.openSize==='ALLIN'?'all-in':state.openSize+' bb'})`:''), tier, explanation:state.spot.preflop.explanation, solution:`${state.spot.preflop.frequency}% ${actionName(state.spot.preflop.action)}` });
  state.preflopOutcome = null;
  state.facingPreflopRaise = null;
  if(state.spot.followup && state.spot.followup.triggerAction===action){
    // BUG CORRIGÉ : on basculait directement sur la 2e décision sans jamais logger ni afficher de
    // feedback pour ce premier choix — ça donnait l'impression que la décision n'avait pas compté.
    // On affiche maintenant le feedback normal (JUSTE/MIX/ERREUR sur ce premier choix), et c'est un
    // clic explicite qui révèle la réaction de l'adversaire.
    state.awaitingFollowupReveal = true;
    render();
    return;
  }
  if(['3BET','4BET','SHOVE'].includes(action) && state.spot.villainPosition!=='—'){
    state.preflopOutcome = simulatePreflopRaiseReaction(state.spot.villainProfile, action);
    if(state.preflopOutcome==='raise'){
      state.facingPreflopRaise = { response:null, size: estimatePreflopReraiseSize(state.spot), squeezer: state.spot.villainPosition };
    }
  } else if(action==='CALL' && state.spot.villainPosition!=='—'){
    const squeezerProfile = pickVillainProfileKey(state.villainProfileMode);
    const squeezer = simulateBlindSqueeze(state.spot, squeezerProfile);
    if(squeezer){
      state.facingPreflopRaise = { response:null, size: estimatePreflopReraiseSize(state.spot), squeezer, squeezerProfile };
    }
  }
  render();
}
function revealFollowupOutcome(){
  const fu = state.spot.followup;
  if(!fu) return;
  state.awaitingFollowupReveal = false;
  const profileKey = state.spot.villainProfile || pickVillainProfileKey(state.villainProfileMode);
  if(!willVillainApplyFollowup(state.spot, profileKey)){
    // L'adversaire abandonne directement face à votre ouverture/3-bet : la main s'arrête ici.
    state.preflopOutcome = 'fold';
    render();
    return;
  }
  // L'adversaire applique la pression scriptée : on construit la vraie séquence d'action vécue,
  // on lui assigne un profil (ce spot démarrait "premier à parler", donc sans adversaire désigné),
  // puis on bascule sur la seconde décision (avec ses propres fréquences réelles).
  const action = state.selected;
  const heroAmount = (action==='OPEN' && state.openSize && state.openSize!=='ALLIN') ? state.openSize : undefined;
  const newActions = [
    ...(state.spot.actions||[]),
    { pos: state.spot.heroPosition, action: action==='OPEN' ? 'open' : '3bet', amount: heroAmount },
    { pos: fu.villainPosition || state.spot.villainPosition, action: fu.villainAction, amount: fu.villainAmount },
  ];
  const villainStack = state.spot.villainStack ?? (state.spot.effectiveStack + Math.round(Math.random()*60));
  state.spot = { ...state.spot, villainPosition: fu.villainPosition || state.spot.villainPosition, villainProfile: profileKey, villainStack, actions:newActions, preflop: fu.preflop, pot: fu.pot ?? state.spot.pot, category: fu.category ?? state.spot.category, followup:null, impliedCaller:null };
  state.selected = null; state.preflopOutcome = null; state.facingPreflopRaise = null; state.awaitingOpenSize = false;
  render();
}
function respondToPreflopRaise(choice){
  if(!state.facingPreflopRaise || state.facingPreflopRaise.response) return;
  state.facingPreflopRaise.response = choice;
  if(choice==='CALL' && state.facingPreflopRaise.squeezer && state.facingPreflopRaise.squeezer!==state.spot.villainPosition){
    // Un squeeze payé rend le coup réellement multiway : on l'ajoute à l'historique d'action pour que
    // le reste de la main (résumé, ordre de parole postflop) le prenne en compte correctement.
    state.spot = { ...state.spot, actions:[...(state.spot.actions||[]), { pos: state.facingPreflopRaise.squeezer, action:'3bet', amount: state.facingPreflopRaise.size }] };
  }
  render();
}
function respondToSurprise(choice){
  if(!state.facingSurprise || state.facingSurprise.response) return;
  state.facingSurprise.response = choice;
  render();
}
// Suivi (approximatif) du pot et des stacks en direct, pour que la table ne reste pas figée sur les
// montants préflop une fois le flop arrivé — c'est une estimation pédagogique dérivée des tailles en
// % pot déjà utilisées partout dans l'app, pas un calcul de solveur au centime près.
function parseBetPercent(label){
  const m = String(label).match(/(\d+(\.\d+)?)%/);
  return m ? parseFloat(m[1])/100 : null;
}
function parseMultiplier(label){
  const m = String(label).match(/(\d+(\.\d+)?)x/);
  return m ? parseFloat(m[1]) : null;
}
function computeStreetPotDelta(action, outcome, facingSurprise, potBefore){
  const pct = parseBetPercent(action);
  if(!pct) return 0; // check/fold n'ajoute rien de confirmé au pot
  const betBB = Math.round(potBefore*pct*10)/10;
  if(facingSurprise && facingSurprise.response==='CALL'){
    const mult = facingSurprise.type==='raise' ? parseMultiplier(facingSurprise.size) : parseBetPercent(facingSurprise.size);
    if(mult){
      const raiseBB = facingSurprise.type==='raise' ? betBB*mult : potBefore*mult;
      return Math.round(raiseBB*2*10)/10;
    }
  }
  if(outcome==='call') return Math.round(betBB*2*10)/10;
  return 0;
}
function computeLiveTableState(s){
  const spot = s.spot;
  let pot = spot.pot;
  (s.streetLog||[]).forEach(entry => { pot += (entry.delta||0); });
  if(s.phase==='postflop' && s.postAction){
    pot += computeStreetPotDelta(s.postAction, s.postflopOutcome, s.facingSurprise, pot);
  }
  const grown = Math.max(0, pot - spot.pot);
  const startingRemaining = computeRemainingStackBB(spot); // tient déjà compte de l'engagement préflop
  const preflopCommitted = spot.effectiveStack - startingRemaining;
  const heroRemaining = Math.max(0, Math.round((startingRemaining - grown/2)*10)/10);
  const villainBase = (spot.villainStack || spot.effectiveStack) - preflopCommitted;
  const villainRemaining = Math.max(0, Math.round((villainBase - grown/2)*10)/10);
  return { pot: Math.round(pot*10)/10, heroRemaining, villainRemaining };
}
// Enregistre ce qui s'est réellement passé sur la street qu'on vient de terminer, pour que le résumé
// sous la table reste juste une fois qu'on avance sur la street suivante (au lieu de ne montrer que
// l'ouverture préflop pour toujours).
function pushStreetLogEntry(){
  const oppNames = activeNonHeroPositions(state.spot, state.table).join(' et ') || (state.spot.villainPosition!=='—' ? state.spot.villainPosition : '');
  let heroLabel = postActionLabel(state.postAction);
  let oppLabel;
  if(state.facingSurprise && state.facingSurprise.response){
    oppLabel = (state.facingSurprise.type==='raise' ? 'Raise' : 'Bet') + (state.facingSurprise.size ? ` (${state.facingSurprise.size})` : '');
    heroLabel += state.facingSurprise.response==='CALL' ? ' → Call' : ' → Fold';
  } else if(state.postflopOutcome==='check'){
    oppLabel = 'Check';
  } else {
    oppLabel = 'Call';
  }
  const potBefore = computeLiveTableState(state).pot;
  const delta = computeStreetPotDelta(state.postAction, state.postflopOutcome, state.facingSurprise, potBefore);
  state.streetLog.push({ street: state.street, heroLabel, oppLabel, oppNames, delta });
}
function rollMultiwayBetReaction(profile, n){
  let anyRaise=false, allFold=true;
  for(let i=0;i<n;i++){
    const r = simulatePostflopBetReaction(profile);
    if(r==='raise') anyRaise = true;
    if(r!=='fold') allFold = false;
  }
  if(anyRaise) return 'raise';
  if(allFold) return 'fold';
  return 'call';
}
function rollMultiwayCheckReaction(profile, n){
  for(let i=0;i<n;i++){ if(simulatePostflopCheckReaction(profile)==='bet') return 'bet'; }
  return 'check';
}
function advanceAllInRunout(){
  if(state.street==='FLOP') state.street='TURN';
  else if(state.street==='TURN') state.street='RIVER';
  else { nextHand(); return; }
  render();
}
function choosePostflop(action){
  if(action==='NEXT'){
    // Cas où la main s'arrête ici : héros a foldé, l'adversaire a foldé, ou héros a foldé face à sa relance surprise.
    const heroFoldedToSurprise = state.facingSurprise && state.facingSurprise.response==='FOLD';
    if(state.postAction==='FOLD' || state.postflopOutcome==='fold' || heroFoldedToSurprise){ endHand(); return; }
    pushStreetLogEntry();
    if(state.street==='FLOP') state.street='TURN';
    else if(state.street==='TURN') state.street='RIVER';
    else { endHand(); return; }
    state.postAction=null; state.postflopOutcome=null; state.facingSurprise=null; render(); return;
  }
  state.postAction = action;
  const tier = postflopTier(state.spot.post[state.street], action);
  log(action, state.spot.post[state.street].action, tier, state.street);
  pushHandLog({ phase:state.street, label:postActionLabel(action), tier, explanation:state.spot.post[state.street].reason, solution:`${state.spot.post[state.street].frequency}% ${postActionLabel(state.spot.post[state.street].action)}` });
  state.postflopOutcome = null; state.facingSurprise = null;
  const profile = state.spot.villainProfile;
  // BUG CORRIGÉ : un seul tirage au sort était fait quelle que soit la taille du pot — un pot à 3
  // joueurs avait donc autant de chances de voir une relance qu'un pot à 2, ce qui n'est pas réaliste
  // (plus il y a d'adversaires, plus la probabilité qu'AU MOINS L'UN d'eux relance doit augmenter).
  const nOpp = Math.max(1, activeNonHeroPositions(state.spot, state.table).length);
  if(action==='CHECK'){
    const reaction = rollMultiwayCheckReaction(profile, nOpp);
    state.postflopOutcome = reaction;
    if(reaction==='bet') state.facingSurprise = { type:'bet', response:null, size: pickSurpriseSize(profile,'bet') };
  } else if(action!=='FOLD'){
    const reaction = rollMultiwayBetReaction(profile, nOpp);
    state.postflopOutcome = reaction;
    if(reaction==='raise') state.facingSurprise = { type:'raise', response:null, size: pickSurpriseSize(profile,'raise') };
  }
  render();
}

function PlayingCard(card, large){

}
