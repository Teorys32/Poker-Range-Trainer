function hasTrips(cards){ return RANKS.some(rank => cards.filter(c=>c.rank===rank).length>=3); }
function hasStraight(cards){
 const unique = new Set(cards.map(c=>c.rank));
 if(unique.has('A')) unique.add('1');
 // 9 fenêtres valides de 5 rangs consécutifs : 2-3-4-5-6 … T-J-Q-K-A (RANKS a 13 éléments, indices 0..12).
 // BUG CORRIGÉ : la borne était `start<=9`, ce qui produisait une 10e fenêtre tronquée à 4 cartes
 // (J-Q-K-A, indices 9..12) et déclenchait un faux positif dès que ces 4 rangs étaient présents,
 // même sans le 10 pour compléter la quinte.
 for(let start=0; start<=8; start++){ const window=RANKS.slice(start,start+5); if(window.every(r=>unique.has(r))) return true; }
 const wheel=['A','2','3','4','5'];
 return wheel.every(r=>unique.has(r));
}
function drawProbability(hole, board, target){
 const visible=[...hole,...board];
 const remaining = cardsRemaining(visible);
 const current = target(visible);
 const oneCardHits = remaining.filter(card => target([...visible,card])).length;
 const oneCardChance = current ? 100 : (oneCardHits/remaining.length)*100;
 const cardsToCome = Math.max(0, 5-board.length);
 let byRiver = oneCardChance;
 if(!current && cardsToCome>=2){
 let hits=0;
 for(let i=0;i<remaining.length;i++) for(let j=i+1;j<remaining.length;j++) if(target([...visible,remaining[i],remaining[j]])) hits++;
 byRiver = (hits/combinations(remaining.length,2))*100;
 }
 return { outs: current?0:oneCardHits, next: oneCardChance, river: current?100:byRiver };
}
function hasFullHouseOrBetter(cards){
 const counts = Object.values(rankCounts(cards));
 if(counts.some(c=>c>=4)) return true; // carré
 return counts.some(c=>c>=3) && counts.filter(c=>c>=2).length>=2; // brelan + une autre paire = full
}
function numericRank(r){ return RANKS.indexOf(r)+2; } // '2'->2... 'A'->14
function hasFourConsecutiveRanks(numSet){
 const nums = new Set(numSet);
 if(nums.has(14)) nums.add(1); // l'As peut aussi jouer bas (roue)
 for(let start=1; start<=10; start++){
 let ok=true;
 for(let k=0;k<4;k++){ if(!nums.has(start+k)){ ok=false; break; } }
 if(ok) return true;
 }
 return false;
}
// BUG CORRIGÉ : la classification se faisait uniquement sur le NOMBRE d'outs (8 = OESD, 4 = gutshot),
// ce qui confond un vrai OESD avec une double quinte ventrale (double gutshot) — les deux ont 8 outs
// mais sont des structures différentes. On analyse maintenant les rangs qui complètent réellement la
// quinte et on vérifie s'ils forment les deux extrémités d'une suite de 4 cartes déjà consécutives.
function classifyStraightDraw(hole, board){
 const cards=[...hole,...board];
 if(hasStraight(cards)) return null;
 const remaining = cardsRemaining(cards);
 const connectingRanks = new Set();
 remaining.forEach(c => { if(hasStraight([...cards, c])) connectingRanks.add(c.rank); });
 if(connectingRanks.size===0) return null;
 const knownNums = new Set(cards.map(c=>numericRank(c.rank)));
 const openEnded = connectingRanks.size>=2 && hasFourConsecutiveRanks(knownNums);
 if(connectingRanks.size===1){
 return { label:'Quinte par un bout (gutshot)', detail:'Une seule carte complète la quinte : un tirage ventral classique.' };
 }
 if(openEnded){
 return { label:'Quinte par les deux bouts', detail:'Quatre rangs déjà consécutifs : les deux extrémités complètent la quinte.' };
 }
 return { label:'Double quinte ventrale (double gutshot)', detail:'Deux tirages ventraux distincts en même temps : deux rangs différents complètent chacun une quinte, sans suite de 4 cartes déjà formée.' };
}
function calculateDrawStats(hole, board){
 const cards=[...hole,...board];
 const stats=[];
 const suitCount = Math.max(...SUITS.map(suit => cards.filter(c=>c.suit===suit).length));
 if(suitCount>=3 && !hasFlush(cards)){
 const result = drawProbability(hole,board,hasFlush);
 const backdoor = suitCount===3;
 stats.push({name: backdoor ? 'Couleur (backdoor)' : 'Couleur',...result, detail: backdoor ? '3 cartes de la même couleur seulement : il faut toucher deux fois d\u2019ici la river (runner-runner), pas un tirage classique.' : '4 cartes de la même couleur : 9 outs classiques.'});
 }
 // BUG CORRIGÉ : l'ancienne version déclenchait « Brelan / set » dès qu'une paire existait
 // N'IMPORTE OÙ dans les cartes combinées (y compris une simple top paire, ex. A♠K♦ sur A♥7♣2♠,
 // qui n'est PAS un tirage de set). On ne calcule ce tirage que pour une VRAIE paire servie en main.
 const heroPocketPair = hole.length===2 && hole[0].rank===hole[1].rank;
 if(heroPocketPair && !hasTrips(cards)){
 const pairRank = hole[0].rank;
 const result = drawProbability(hole, board, visible => visible.filter(c=>c.rank===pairRank).length>=3);
 stats.push({name:'Brelan / set',...result, detail:'Ta paire servie peut retomber sur l\u2019un de ses 2 outs restants pour former un brelan (set).'});
 }
 // Nouveau : deux paires (ou brelan + paire) qui cherchent un full house / carré.
 const pairRanks = RANKS.filter(rank => cards.filter(c=>c.rank===rank).length>=2);
 const heroContributesPair = hole.some(hc => cards.filter(c=>c.rank===hc.rank).length>=2);
 if(heroContributesPair && pairRanks.length>=2 && !hasFullHouseOrBetter(cards)){
 const result = drawProbability(hole, board, hasFullHouseOrBetter);
 if(result.river>0){
 stats.push({name:'Full house ou mieux',...result, detail:'Deux paires (ou un brelan + une paire) deviennent full house si l\u2019un des rangs pairés retouche — ou carré si c\u2019est ton brelan qui retouche.'});
 }
 }
 if(!hasStraight(cards)){
 const result = drawProbability(hole,board,hasStraight);
 if(result.river>0){
 if(result.outs===0){
 stats.push({name:'Quinte (backdoor)',...result, detail:'Pas de tirage direct : il faut deux cartes précises d\u2019affilée (runner-runner) pour compléter la quinte.'});
 } else {
 const classification = classifyStraightDraw(hole, board);
 stats.push({name: classification ? classification.label : 'Tirage quinte',...result, detail: classification ? classification.detail : 'Les cartes manquantes sont comptées sans doublon.'});
 }
 }
 }
 return stats;
}
// ============================================================
// ÉTAPE 2/3 DE LA DEMANDE — classifyPostflopHand(hole, board[, priorDraw]) : source centrale unique de
// classification d'une main postflop, réutilisée par le moteur (computeDynamicStreetPost) ET par le
// futur générateur de situations (POSTFLOP_PATTERNS). Elle ne réinvente rien : elle appelle les
// fonctions déjà existantes (hasFlush, hasStraight, hasTrips, hasFullHouseOrBetter, rankCounts,
// classifyStraightDraw, heroBenefitsFromCard) plutôt que de dupliquer leur logique.
//
// - madeHand : la main faite de Hero, du plus fort au plus faible (voir MADE_HAND_RANK ci-dessous).
// - draw : le tirage actif de Hero (NONE si aucun). NUT_FLUSH_DRAW seulement si Hero tient la carte la
// plus haute encore disponible de la couleur concernée (souvent l'As, sauf si l'As est déjà au board).
// - kicker : le rang de la carte non appariée de Hero quand madeHand est une paire simple — sert à
// distinguer TOP_PAIR_TOP_KICKER de TOP_PAIR_WEAK_KICKER dans les patterns, pas une catégorie à part.
// - strength : résumé grossier (AIR/WEAK/MEDIUM/STRONG/VERY_STRONG) dérivé de madeHand et du draw.
// - drawStatus : NONE par défaut. Si `priorDraw` (le résultat.draw d'un appel précédent, sur un board
// plus court) est fourni ET que le board est maintenant complet (5 cartes), renvoie COMPLETED si la
// main faite finale correspond au tirage d'origine, MISSED sinon. Sur un board non terminal avec un
// tirage actif, renvoie ACTIVE. Toujours une heuristique pédagogique : pas un solveur.
const MADE_HAND_RANK = {
 QUADS:10, FULL_HOUSE:9, FLUSH:8, STRAIGHT:7, SET:6, TWO_PAIR:5, OVERPAIR:5,
 TOP_PAIR:4, SECOND_PAIR:3, MIDDLE_PAIR:3, BOTTOM_PAIR:2, UNDERPAIR:2, OVERCARDS:1, AIR:0,
};
const ACTIVE_DRAWS = new Set(['FLUSH_DRAW','NUT_FLUSH_DRAW','OESD','GUTSHOT','DOUBLE_GUTSHOT','COMBO_DRAW']);
function classifyPostflopHand(hole, board, priorDraw){
 const all = [...hole,...board];
 const rc = rankCounts(all);
 const boardRanksDesc = [...new Set(board.map(c=>c.rank))].sort((a,b)=>numericRank(b)-numericRank(a));
 const heroRanks = hole.map(c=>c.rank);
 const heroPocketPair = hole.length===2 && hole[0].rank===hole[1].rank;

 // -- madeHand --------------------------------------------------------------
 let madeHand = 'AIR', kicker = null;
 if(hasFullHouseOrBetter(all)){
 // Le spec ne distingue pas "trips" (brelan via une seule carte de Hero + paire au board) d'un "set"
 // (paire servie qui devient brelan) — les deux tombent sous SET, comme demandé (liste fournie sans
 // catégorie TRIPS séparée).
 madeHand = Object.values(rc).some(c=>c>=4) ? 'QUADS' : 'FULL_HOUSE';
 } else if(hasFlush(all)){
 madeHand = 'FLUSH';
 } else if(hasStraight(all)){
 madeHand = 'STRAIGHT';
 } else if(heroPocketPair && rc[hole[0].rank]>=3){
 madeHand = 'SET';
 } else if(heroPocketPair){
 const boardMax = boardRanksDesc.length ? numericRank(boardRanksDesc[0]) : 0;
 madeHand = numericRank(hole[0].rank) > boardMax ? 'OVERPAIR' : 'UNDERPAIR';
 } else {
 const pairedRanks = heroRanks.filter(r => board.some(b=>b.rank===r));
 // BUG TROUVÉ EN VÉRIFIANT LA COHÉRENCE (point 8 de la demande / point 1 unification) : si Hero ne
 // pair personnellement qu'UN rang du board, mais que le board a par ailleurs SA PROPRE paire sur un
 // AUTRE rang (ex. K72 -> K772 : Hero pair le Roi, le board paire lui-même le 7 tout seul), la
 // meilleure main de 5 cartes de Hero est réellement deux paires (Rois et 7, en jouant le 7 du board)
 // — pas une simple top/second/bottom paire. Sans ce correctif, ce cas retombait à tort sur une
 // simple paire, ce qui sous-évaluait la main ET aurait contredit heroBenefitsFromCard une fois ce
 // dernier unifié sur classifyPostflopHand (voir plus haut) : le board qui se paire aurait été
 // reconnu par l'un mais pas par l'autre. Ne s'applique jamais en même temps qu'un brelan/full réel :
 // hasFullHouseOrBetter(all) a déjà intercepté ces cas plus haut.
 const boardOwnPairRank = pairedRanks.length===1
 ? RANKS.find(r => r!==pairedRanks[0] && board.filter(b=>b.rank===r).length>=2)
 : null;
 if(pairedRanks.length>=2 || (pairedRanks.length===1 && boardOwnPairRank)){
 madeHand = 'TWO_PAIR';
 } else if(pairedRanks.length===1 && rc[pairedRanks[0]]>=3){
 madeHand = 'SET'; // brelan via une carte de Hero + paire au board ("trips") — voir note ci-dessus
 } else if(pairedRanks.length===1){
 const idx = boardRanksDesc.indexOf(pairedRanks[0]);
 kicker = hole.find(c=>c.rank!==pairedRanks[0])?.rank ?? null;
 if(idx===0) madeHand = 'TOP_PAIR';
 else if(board.length<=3) madeHand = idx===1 ? 'MIDDLE_PAIR' : 'BOTTOM_PAIR';
 else madeHand = idx===1 ? 'SECOND_PAIR' : 'BOTTOM_PAIR';
 } else {
 const boardMax = boardRanksDesc.length ? numericRank(boardRanksDesc[0]) : 0;
 madeHand = hole.every(c=>numericRank(c.rank)>boardMax) ? 'OVERCARDS' : 'AIR';
 }
 }

 // -- draw --------------------------------------------------------------
 let draw = 'NONE';
 const suitCounts = {};
 all.forEach(c=>{ suitCounts[c.suit]=(suitCounts[c.suit]||0)+1; });
 const heroFlushSuit = Object.entries(suitCounts).find(([suit,count]) => count===4 && hole.some(c=>c.suit===suit));
 let hasFlushDraw = false, isNutFlushDraw = false;
 if(heroFlushSuit && !hasFlush(all)){
 hasFlushDraw = true;
 const [suit] = heroFlushSuit;
 // BUG TROUVÉ EN TESTANT : cherchait le rang le plus haut "pas encore vu" (hole+board), ce qui exclut
 // à tort l'As dès que Hero le tient lui-même — alors que c'est justement le cas qui définit un tirage
 // à la couleur maximale. Le bon test : le rang le plus haut de cette couleur qui n'est pas SUR LE
 // BOARD (peu importe si Hero le tient), puis vérifier si Hero tient précisément cette carte.
 const outstandingHighest = RANKS.slice().reverse().find(r => !board.some(c=>c.rank===r && c.suit===suit));
 isNutFlushDraw = hole.some(c=>c.suit===suit && c.rank===outstandingHighest);
 }
 const straightInfo = !hasStraight(all) ? classifyStraightDraw(hole, board) : null;
 let straightDrawType = null;
 if(straightInfo){
 if(straightInfo.label.includes('deux bouts')) straightDrawType='OESD';
 else if(straightInfo.label.includes('double quinte')) straightDrawType='DOUBLE_GUTSHOT';
 else if(straightInfo.label.includes('gutshot')) straightDrawType='GUTSHOT';
 }
 if(hasFlushDraw && straightDrawType) draw='COMBO_DRAW';
 else if(isNutFlushDraw) draw='NUT_FLUSH_DRAW';
 else if(hasFlushDraw) draw='FLUSH_DRAW';
 else if(straightDrawType) draw=straightDrawType;
 else {
 const suitMaxNoFlushDraw = Math.max(...SUITS.map(s=>all.filter(c=>c.suit===s).length));
 const backdoorFlush = suitMaxNoFlushDraw===3 && hole.some(c=>SUITS.includes(c.suit) && all.filter(x=>x.suit===c.suit).length===3);
 if(backdoorFlush) draw='BACKDOOR_DRAW';
 }

 // -- strength --------------------------------------------------------------
 const rank = MADE_HAND_RANK[madeHand] ?? 0;
 let strength;
 if(rank>=6) strength='VERY_STRONG';
 else if(rank===5) strength='STRONG';
 else if(rank>=3) strength='MEDIUM';
 else if(rank>=1 || ACTIVE_DRAWS.has(draw)) strength='WEAK';
 else strength='AIR';

 // -- drawStatus --------------------------------------------------------------
 let drawStatus = 'NONE';
 if(priorDraw && ACTIVE_DRAWS.has(priorDraw)){
 if(board.length>=5){
 const completesFlush = (priorDraw==='FLUSH_DRAW'||priorDraw==='NUT_FLUSH_DRAW') && madeHand==='FLUSH';
 const completesStraight = ['OESD','GUTSHOT','DOUBLE_GUTSHOT'].includes(priorDraw) && madeHand==='STRAIGHT';
 const completesCombo = priorDraw==='COMBO_DRAW' && (madeHand==='FLUSH'||madeHand==='STRAIGHT');
 drawStatus = (completesFlush||completesStraight||completesCombo) ? 'COMPLETED' : 'MISSED';
 } else {
 drawStatus = 'ACTIVE';
 }
 } else if(ACTIVE_DRAWS.has(draw) && board.length<5){
 drawStatus = 'ACTIVE';
 }

 return { madeHand, draw, kicker, strength, drawStatus };
}
// ============================================================
// AVANTAGE DE RANGE — extension demandée par l'utilisateur (priorité 2, après ICM) : classifyPostflopHand
// répond à "qu'est-ce que MOI je tiens sur ce board", jamais à "qui, de moi ou de l'adversaire, a en
// moyenne la range la plus forte sur ce board" — le raisonnement que la théorie moderne encourage
// AVANT même de regarder sa propre main. Toujours une heuristique de TEXTURE (pas un calcul d'équité
// de range réel, qui demanderait un solveur) : un board avec un As ou un Roi sec favorise plutôt la
// range de l'agresseur préflop (plus de mains à As/Roi) ; un board bas, paire, ou resserré favorise
// plutôt la range du calleur/défenseur (plus de petites paires et de connecteurs qui y touchent mieux
// que la range, plus polarisée vers les grosses cartes, de l'agresseur). Ne remplace jamais
// classifyPostflopHand — les deux se complètent (ma main / la bataille de ranges).
function classifyRangeAdvantage(board){
 if(!board || board.length<3) return { favors:'NEUTRAL', label:'à peu près équilibré entre les deux ranges', notes:[] };
 const ranksDesc = [...board].map(c=>numericRank(c.rank)).sort((a,b)=>b-a);
 const top = ranksDesc[0], bottom = ranksDesc[ranksDesc.length-1];
 const counts = rankCounts(board);
 const paired = Object.values(counts).some(c=>c>=2);
 const connected = (top-bottom) <= board.length+1; // écart resserré entre la plus haute et la plus basse carte
 let score = 0;
 const notes = [];
 if(top>=14){ score+=2; notes.push('carte maîtresse (As) au board'); }
 else if(top===13){ score+=1; notes.push('board avec un Roi, sans As'); }
 else if(top<=8){ score-=2; notes.push('board bas, sans grosse carte'); }
 else if(top<=10){ score-=1; notes.push('board moyen, sans grosse carte dominante'); }
 if(paired){ score-=1; notes.push('board paire'); }
 // Un board connecté ne favorise le calleur/défenseur que s'il reste BAS à MOYEN (proche des
 // connecteurs suités qu'on trouve plus dans une range de call que d'ouverture) : un board connecté
 // mais tout en broadways (ex. K♠Q♥J♦) reste au contraire très favorable à l'agresseur préflop, dont
 // la range est saturée de mains à AK/AQ/KQ qui touchent ce genre de texture au moins aussi bien.
 if(connected && top<=11){ score-=1; notes.push('cartes resserrées/connectées'); }
 let favors, label;
 if(score>=1){ favors='AGGRESSOR'; label='plutôt la range de l\u2019agresseur préflop'; }
 else if(score<=-1){ favors='CALLER'; label='plutôt la range du calleur/défenseur préflop'; }
 else { favors='NEUTRAL'; label='à peu près équilibré entre les deux ranges'; }
 return { favors, label, notes };
}
// ============================================================
// SECTION 1 DE LA DEMANDE — OBJECTIF IMPLICITE DE HERO. Jusqu'ici le moteur décidait CHECK/BET sans
// jamais se demander explicitement "dans quel but ?" : deux mains qui aboutissaient à la même action
// (ex. BET 33%) pouvaient avoir des raisons totalement différentes (value fine vs semi-bluff), ce qui
// rendait le sizing et le feedback interchangeables entre situations pourtant très différentes. Cette
// fonction identifie l'objectif le plus probable à PARTIR des informations déjà calculées par
// classifyPostflopHand (force réelle, tirage, statut du tirage) et de la texture du board — jamais un
// nouveau système de classification de mains, seulement une lecture supplémentaire de ce qui existe
// déjà. Reste volontairement une heuristique pédagogique (pas un calcul GTO d'EV par objectif).
function determineHeroObjective(cls, board, context){
 context = context || {};
 const { madeHand, draw, strength, drawStatus } = cls;
 const tex = boardTextureBefore(board);
 const wet = tex.suitMax>=3 || tex.straightPossible || tex.maxRankCount>=2;
 const madeTop = ['FLUSH','STRAIGHT','FULL_HOUSE','QUADS'].includes(madeHand);
 const hasLiveDraw = ACTIVE_DRAWS.has(draw) && drawStatus!=='MISSED' && drawStatus!=='COMPLETED';
 const bluffCatcherHands = ['TOP_PAIR','SECOND_PAIR','MIDDLE_PAIR','BOTTOM_PAIR','UNDERPAIR','TWO_PAIR'];

 if(strength==='VERY_STRONG' || strength==='STRONG'){
 // Une main très forte sur un board humide protège autant qu'elle valorise (tirages encore vivants à
 // faire payer cher) ; sur board sec, la protection n'a plus de sens, seule la value compte.
 return (wet && !madeTop) ? 'PROTECTION' : 'VALUE';
 }
 if(hasLiveDraw){
 // Un tirage encore actif qui mise/relance le fait pour deux raisons à la fois (fold equity +
 // équité résiduelle) : c'est la définition même du semi-bluff, jamais un pur bluff.
 return 'SEMI-BLUFF';
 }
 if(context.facingBet && bluffCatcherHands.includes(madeHand) && strength!=='VERY_STRONG'){
 // Une main moyenne qui NE MISE PAS mais qui DOIT DÉCIDER face à une mise adverse : elle ne bat que
 // les bluffs, jamais les vraies value bets adverses.
 return 'BLUFF_CATCHER';
 }
 if((strength==='WEAK'||strength==='AIR') && drawStatus==='MISSED'){
 // Un tirage raté qui continue à miser le fait en pur bluff (plus aucune équité résiduelle) ; s'il
 // n'a jamais pris l'initiative, il n'a pas de raison de représenter quoi que ce soit : direction
 // showdown value par défaut (rarement gagnante, mais pas un bluff cohérent non plus).
 return context.wasAggressor ? 'BLUFF' : 'SHOWDOWN_VALUE';
 }
 if(bluffCatcherHands.includes(madeHand)){
 // Main moyenne avec un peu de valeur à showdown, mais pas assez pour se transformer en value bet
 // franche : typiquement une main de contrôle du pot.
 return 'SHOWDOWN_VALUE';
 }
 return 'SHOWDOWN_VALUE';
}
const OBJECTIVE_LABELS = { VALUE:'value', PROTECTION:'protection', 'SEMI-BLUFF':'semi-bluff', BLUFF:'bluff', SHOWDOWN_VALUE:'showdown value', BLUFF_CATCHER:'bluff-catcher' };
// ============================================================
// SECTION 4 DE LA DEMANDE — FEEDBACK STRUCTURÉ. Compose la structure DÉCISION / Pourquoi ? (facteurs
// classés par importance, 2 à 4 maximum) / POINT À RETENIR demandée, à partir des morceaux de
// raisonnement déjà produits par le moteur (jamais un pavé de 15 informations). Le rendu HTML affiche
// désormais les retours à la ligne (voir.hs-text{white-space:pre-line}), donc ce texte reste lisible
// tel quel dans le résumé de main.
function formatPedagogicalReason(decisionLabel, factors, takeaway){
 const numbered = factors.filter(Boolean).slice(0,4).map((f,i)=>`${i+1}. ${f}`).join('\n');
 return `DÉCISION : ${decisionLabel}\n\nPourquoi ?\n${numbered}${takeaway ? `\n\nPOINT À RETENIR\n\u2192 ${takeaway}` : ''}`;
}
// Qui a été le dernier à relancer préflop dans CETTE main (pas juste spot.villainPosition, qui ne
// distingue pas si c'est finalement le héros ou l'adversaire qui a fini agresseur après un 3-bet/4-bet).
function preflopAggressorPosition(spot){
 const acts = spot.actions || [];
 const raises = acts.filter(a => ['open','3bet','4bet','5bet','shove'].includes(a.action));
 if(raises.length===0) return spot.heroPosition; // personne d'autre n'a ouvert : le héros ouvre, il est agresseur
 return raises[raises.length-1].pos;
}
// ============================================================
// MAIN ADVERSAIRE RÉVÉLÉE — extension demandée par l'utilisateur : montrer une main plausible pour
// l'adversaire à l'issue du coup (tapis, showdown, fin de main), tirée de sa range d'ouverture AJUSTÉE
// PAR SON PROFIL (réutilise OPEN_RANGES et CHEN_RANKED_HANDS déjà existants, pas un nouveau système de
// ranges) : Nit resserre, LAG élargit, Fish élargit ET mélange des mains hors de toute logique
// positionnelle normale (ex. JTo en UTG, explicitement demandé). Toujours un TIRAGE PLAUSIBLE, jamais
// prétendu être "la vraie main cachée" — clairement présenté comme une simulation dans l'interface.
function villainRangePool(villainPosition, profileKey, actionType){
 actionType = actionType || 'open';
 const base = OPEN_RANGES[villainPosition] || CHEN_RANKED_HANDS.slice(0, 25); // BB (pas de range d'open) ou position inconnue -> pool générique large
 const K = base.length || 25;
 const topK = k => CHEN_RANKED_HANDS.slice(0, Math.min(169, Math.max(1, Math.round(k))));
 // BUG CORRIGÉ (préparation de la lecture de range du coach) : jusqu'ici, un simple OPEN et un 3-BET/
 // 4-BET partageaient la même largeur de range — un 3-bet depuis UTG ressortait donc aussi large qu'un
 // open, ce qui est faux : relancer une relance resserre TOUJOURS la range, quelle que soit la
 // position. Un 3-bet ne garde qu'une fraction de la range d'ouverture (paires premium/AK-type), un
 // 4-bet une fraction encore plus petite.
 const raiseWidth = { open:1, '3bet':0.35, '4bet':0.15, '5bet':0.08 }[actionType] ?? 1;
 if(profileKey==='nit') return topK(K*raiseWidth*0.6);
 if(profileKey==='lag') return topK(K*raiseWidth*1.5);
 if(profileKey==='fish'){
 // Un fish ne joue pas une range structurée par position : au-delà d'être plus large, sa range
 // mélange des mains hétérogènes qui n'ont rien à voir avec la logique positionnelle habituelle —
 // exactement l'exemple donné (JTo en UTG, une main qu'aucune range structurée n'ouvrirait ici).
 // Les mains hors norme restent réservées à l'OPEN : même un fish qui va jusqu'à 3-bet/4-bet a
 // généralement quelque chose (pas garanti, juste plus probable), sinon la "cohérence de range"
 // n'aurait plus aucun sens à enseigner.
 const wide = topK(K*Math.max(raiseWidth*1.6, raiseWidth));
 const oddballs = actionType==='open' ? ['J9o','JTo','T9o','98o','87o','K9o','Q8o','J8s','T8o','96s'] : [];
 return [...new Set([...wide,...oddballs])];
 }
 return topK(K*raiseWidth); // 'reg' (ou profil non reconnu)
}
// Détermine la DERNIÈRE relance réelle de l'adversaire dans cette main (open/3bet/4bet/5bet), pour
// nourrir villainRangePool avec le bon resserrement — pas juste supposer "open" par défaut.
function villainLastRaiseAction(spot, villainPosition){
 const acts = spot.actions || [];
 const raises = acts.filter(a => a.pos===villainPosition && ['open','3bet','4bet','5bet','shove'].includes(a.action));
 return raises.length ? raises[raises.length-1].action : 'open';
}
// Combien de streets postflop l'adversaire a-t-il pris l'INITIATIVE (bet ou raise, pas juste callé) —
// calculé depuis state.streetLog (voir le flag villainInitiated ajouté à pushStreetLogEntry). Sert à
// juger si une main faible/de l'air resterait cohérente avec 2-3 barrels d'affilée.
function villainAggressionStreets(streetLog){
 return (streetLog||[]).filter(entry => entry.villainInitiated).length;
}
// Tire une main plausible pour l'adversaire : rejet-échantillonnage (même principe que
// generatePostflopSituation) jusqu'à obtenir une main cohérente avec son niveau d'agressivité réel
// dans CETTE main précise — pas juste une main aléatoire de sa range qui pourrait sembler absurde
// après 3 barrels sur un board qui ne le concernait apparemment pas. Une vraie part de bluff reste
// toujours possible (BLUFF_FREQUENCY) : ce n'est jamais un verdict "il ment forcément".
const VILLAIN_HAND_BLUFF_FREQUENCY = 0.18;
function dealVillainHand(villainPosition, profileKey, hole, board, aggressionStreets, maxAttempts, actionType){
 const pool = villainRangePool(villainPosition, profileKey, actionType);
 const excluded = [...hole,...board];
 for(let attempt=0; attempt<(maxAttempts||300); attempt++){
 const handClass = pool[Math.floor(Math.random()*pool.length)];
 const villainHole = chooseHole(handClass, excluded);
 if(!villainHole || villainHole.length<2) continue;
 const overlap = villainHole.some(c => excluded.some(e=>e.rank===c.rank && e.suit===c.suit));
 if(overlap) continue;
 if(board.length<3 || aggressionStreets<2) return villainHole; // rien à vérifier avant le flop, ou pas assez d'agressivité pour exiger une vraie main
 const cl = classifyPostflopHand(villainHole, board);
 const isCredible = cl.strength==='MEDIUM' || cl.strength==='STRONG' || cl.strength==='VERY_STRONG' || ACTIVE_DRAWS.has(cl.draw);
 if(isCredible || Math.random()<VILLAIN_HAND_BLUFF_FREQUENCY) return villainHole;
 // Sinon : 2-3 barrels avec de l'air pur hors bluff assumé serait trop souvent bizarre -> on recommence.
 }
 return chooseHole(pool[0], excluded) || [{rank:'2',suit:'♠'},{rank:'7',suit:'♥'}]; // filet de sécurité
}
// RETOUR D'USAGE DIRECT — "pourquoi je ne vois pas la main de l'adversaire SUR LA TABLE quand ça part
// tapis préflop, il faut peut-être d'abord voir tout le runout pour lui attribuer une main ?" Vérifié :
// NON, ce n'est pas nécessaire. dealVillainHand() n'a besoin du board complet QUE pour sa vérification
// de cohérence (aggressionStreets>=2, board.length>=3) — un tapis PRÉFLOP a par définition zéro street
// postflop jouée, donc cette vérification ne s'applique de toute façon pas (board.length<3 suffit à
// retourner immédiatement). On peut donc révéler la main dès l'instant où l'on sait que la main part
// tapis, avant même le flop, et la garder mémorisée pour le reste du runout. Fonction partagée pour ne
// jamais tirer deux mains différentes pour la même main (ici et dans HandSummaryScreen).
function ensureVillainHandRevealed(spot, boardSoFar, aggressionStreets){
 if(spot.villainPosition==='—') return null;
 if(!spot._revealedVillainHand){
 const villainActionType = villainLastRaiseAction(spot, spot.villainPosition);
 spot._revealedVillainHand = dealVillainHand(spot.villainPosition, spot.villainProfile||'reg', spot.hole, boardSoFar||[], aggressionStreets||0, null, villainActionType);
 }
 return spot._revealedVillainHand;
}
// ============================================================
// LECTURE DE RANGE DU COACH — extension demandée : "quand il 3-bet UTG il représente AA/KK/AK, donc
// au flop avec un As il est censé toucher, je ne suis pas censé payer avec KQ" / "river A + donk bet,
// c'est cohérent avec sa main, attention". Ne remplace pas classifyRangeAdvantage (texture générique) :
// vient AU-DESSUS quand on sait précisément que la range est resserrée (3-bet/4-bet depuis une position
// tôt), pour donner une lecture plus spécifique que "board plutôt favorable à l'agresseur en général".
function villainPreflopRangeTier(spot){
 const aggressorPos = preflopAggressorPosition(spot);
 if(aggressorPos===spot.heroPosition) return null; // on ne commente pas la range du héros lui-même
 const actionType = villainLastRaiseAction(spot, aggressorPos);
 const profile = spot.villainProfile || 'reg';
 const earlyPositions = ['UTG','UTG+1','MP','LJ'];
 const isReraise = ['3bet','4bet','5bet'].includes(actionType);
 let tier, description;
 if(isReraise && earlyPositions.includes(aggressorPos) && (profile==='reg' || profile==='nit')){
 tier = 'TIGHT';
 description = `${aggressorPos} a ${actionType==='4bet'?'4-bet':actionType==='5bet'?'re-relancé':'3-bet'} depuis une position resserrée : sa range est probablement concentrée sur les paires premium (QQ+) et AK — assez étroite.`;
 } else if(isReraise && (profile==='lag' || profile==='fish')){
 tier = 'WIDE';
 description = `${aggressorPos} a ${actionType==='4bet'?'4-bet':'3-bet'} avec un profil ${profile==='lag'?'agressif':'imprévisible'} : sa range reste plus large qu\u2019une relance resserrée classique, avec de vrais bluffs dedans.`;
 } else if(isReraise){
 tier = 'MEDIUM';
 description = `${aggressorPos} a ${actionType==='4bet'?'4-bet':'3-bet'} : range probablement moyenne à large (paires moyennes+, bons Ax, quelques bluffs), pas aussi resserrée qu\u2019une relance depuis UTG.`;
 } else {
 tier = 'WIDE';
 description = `${aggressorPos} a seulement ouvert ou callé : range large par nature, beaucoup de mains moyennes et spéculatives.`;
 }
 return { tier, description, aggressorPos, actionType };
}
// Le board (ou la dernière carte tombée) est-il COHÉRENT avec une range resserrée (AA/KK/QQ/AK-type) ?
// Toujours une heuristique de texture (As/Roi = "touche" une range à grosses paires/AK), jamais un
// calcul d'équité exact — même principe et mêmes limites que classifyRangeAdvantage.
function villainRangeCoherenceNote(rangeTier, board){
 if(!rangeTier || rangeTier.tier!=='TIGHT' || !board || board.length<3) return null;
 const hasAceOrKing = board.some(c=>c.rank==='A'||c.rank==='K');
 if(hasAceOrKing){
 return `${rangeTier.description} Un board avec un As ou un Roi touche particulièrement bien ce type de range (top paire ou mieux pour beaucoup de ses combos) : une mise ici reste cohérente avec sa main annoncée — méfiez-vous d\u2019un top paire/overpair moyen qui a l\u2019air fort mais qui reste souvent dominé.`;
 }
 return `${rangeTier.description} Ce board n\u2019a ni As ni Roi : sa range resserrée ne "touche" pas au sens propre (pas de top paire), mais ses grosses paires déjà servies (QQ, JJ...) restent fortes — une mise reste plausible en value ou en continuation, pas nécessairement en trips.`;
}
// ============================================================
// BIBLIOTHÈQUE D'ANALYSES DE FIN DE MAIN — extension demandée : le "mot du coach" ne regardait jusqu'ici
// que les tiers JUSTE/MIX/ERREUR décision par décision, jamais la ligne DANS SON ENSEMBLE au regard de
// la range adverse (préflop) et de son comportement (postflop) — "j'ai gagné" et "j'ai bien joué" sont
// deux choses différentes, et un résultat gagnant peut cacher une ligne risquée compte tenu de la range
// et du board. Chaque pattern ci-dessous est INDÉPENDANT (comme POSTFLOP_PATTERNS, mais pour l'analyse
// rétrospective plutôt que la génération) : il vérifie une condition précise sur la main réellement
// jouée et renvoie un texte quand elle s'applique, ou null sinon. On en sélectionne plusieurs par main
// (jamais tous), pour varier l'analyse d'une main à l'autre plutôt que répéter toujours les mêmes
// phrases. Toujours des heuristiques pédagogiques assumées, jamais un verdict GTO exact.
const HAND_ANALYSIS_PATTERNS = [
 // 1) Exemple donné par l'utilisateur : value bet répété (plusieurs streets) avec une main seulement
 // MOYENNE sur un board qui favorise plutôt la range de l'adversaire (le calleur ici) — risqué même
 // si la main a fini par gagner. BUG ÉVITÉ EN TESTANT : la première version de ce pattern utilisait
 // villainPreflopRangeTier(), qui refuse justement de décrire la range du HÉROS lui-même — combinée à
 // la condition "Hero est l'agresseur", ce pattern ne pouvait alors littéralement jamais se déclencher.
 // classifyRangeAdvantage() n'a pas cette restriction de rôle : il compare les deux ranges sans se
 // soucier de qui est hero/villain.
 function thinValueMultiStreetRisk(spot, s){
 if(preflopAggressorPosition(spot)!==spot.heroPosition) return null; // concerne Hero qui value-bet, pas qui défend
 const heroBarrels = (s.streetLog||[]).filter(e=>e.heroInitiated).length;
 if(heroBarrels<2) return null;
 const board = spot.runout.slice(0,5);
 const cl = classifyPostflopHand(spot.hole, board);
 if(cl.strength!=='MEDIUM') return null;
 const adv = classifyRangeAdvantage(board);
 if(adv.favors!=='CALLER') return null; // le board doit favoriser la range du calleur/défenseur (l'adversaire ici), pas la vôtre
 return `Vous avez misé ${heroBarrels} streets avec une main seulement moyenne (${cl.madeHand.toLowerCase().replace(/_/g,' ')}) sur un board qui favorise plutôt la range de votre adversaire, en tant que calleur/défenseur (${adv.notes.join(', ')}). Le coup a pu se gagner, mais en respectant sa range et ce que le board propose, cette ligne reste risquée : vous vous exposez à payer une main qui vous bat plus souvent qu\u2019elle ne fold, ou à vous faire relancer. Le résultat d\u2019UNE main ne dit rien sur la qualité de la décision.`;
 },
 // 2) Board qui favorise clairement l'agresseur, mais Hero (calleur/défenseur) a quand même payé
 // plusieurs streets sans avoir de main forte identifiée.
 function callingIntoRangeDisadvantage(spot, s){
 if(preflopAggressorPosition(spot)===spot.heroPosition) return null; // concerne Hero qui défend, pas qui attaque
 const board = spot.runout.slice(0,5);
 const adv = classifyRangeAdvantage(board);
 if(adv.favors!=='AGGRESSOR') return null;
 const heroCalls = (s.streetLog||[]).filter(e=>!e.heroInitiated && e.heroAdd>0).length;
 if(heroCalls<2) return null;
 const cl = classifyPostflopHand(spot.hole, board);
 if(['STRONG','VERY_STRONG'].includes(cl.strength)) return null; // une vraie main forte justifie déjà le call, pas de mise en garde utile ici
 return `Ce board favorise plutôt la range de l\u2019agresseur (${adv.notes.join(', ')}), et vous avez pourtant payé ${heroCalls} streets sans main forte identifiée (${cl.madeHand.toLowerCase().replace(/_/g,' ')}). Payer plusieurs fois sur un board qui avantage structurellement l\u2019autre range demande une raison précise (bluff-catch réfléchi, cote/tirage) — pas juste "je ne voulais pas abandonner le pot".`;
 },
 // 3) Bluff-catch qui se justifie PAR le profil (LAG/Fish bluffent/surmisent plus) — reconnaît une
 // bonne lecture plutôt que de toujours pointer des erreurs.
 function bluffCatchJustifiedByProfile(spot, s){
 if(preflopAggressorPosition(spot)===spot.heroPosition) return null;
 const profile = spot.villainProfile;
 if(profile!=='lag' && profile!=='fish') return null;
 const heroCalls = (s.streetLog||[]).filter(e=>!e.heroInitiated && e.heroAdd>0).length;
 if(heroCalls<2) return null;
 const cl = classifyPostflopHand(spot.hole, spot.runout.slice(0,5));
 if(!['MEDIUM','WEAK'].includes(cl.strength)) return null;
 return `Vous avez payé plusieurs streets avec une main pas franchement forte (${cl.madeHand.toLowerCase().replace(/_/g,' ')}) face à un profil ${profile==='lag'?'agressif':'imprévisible'} : c\u2019est justement le genre d\u2019adversaire dont la range de mise contient davantage de bluffs et de mains surjouées qu\u2019un régulier. Contre CE profil précis, ce genre de call se justifie mieux que contre un joueur solide.`;
 },
 // 4) La main révélée (v4.0/v4.1) confirme ou contredit la lecture de range annoncée — boucle la
 // lecture préflop avec ce qui a "vraiment" été montré (toujours une simulation, jamais une certitude).
 function revealedHandVsRangeRead(spot, s){
 const tier = villainPreflopRangeTier(spot);
 if(!tier || !spot._revealedVillainHand) return null;
 const vClass = classifyPostflopHand(spot._revealedVillainHand, spot.runout.slice(0,5));
 const vHandLabel = rangeToClass(spot._revealedVillainHand);
 if(tier.tier==='TIGHT'){
 const matches = ['STRONG','VERY_STRONG'].includes(vClass.strength) || vHandLabel.length===2; // paire servie type QQ+
 return matches
 ? `Sa main simulée (${vHandLabel}) confirme bien la lecture "range resserrée" de son ${tier.actionType==='4bet'?'4-bet':'3-bet'} depuis ${tier.aggressorPos}.`
 : `Sa main simulée (${vHandLabel}) est plus faible que ce que sa relance depuis ${tier.aggressorPos} laissait supposer — même une range resserrée garde une petite marge de bluff ou de main surjouée : ne soyez jamais certain à 100% de sa lecture.`;
 }
 return null;
 },
 // 5) Hero a barrelé plusieurs streets sans main forte NI tirage actif : encourage à se demander si
 // c'était un vrai bluff réfléchi (bons blockers, range adverse capée) ou juste "je continue de miser".
 function barrelingWithoutEquity(spot, s){
 if(preflopAggressorPosition(spot)!==spot.heroPosition) return null;
 const heroBarrels = (s.streetLog||[]).filter(e=>e.heroInitiated).length;
 if(heroBarrels<2) return null;
 const board = spot.runout.slice(0,5);
 const cl = classifyPostflopHand(spot.hole, board);
 if(cl.strength!=='AIR' && cl.strength!=='WEAK') return null;
 if(ACTIVE_DRAWS.has(cl.draw)) return null; // un tirage actif est déjà une raison de continuer, pas concerné ici
 return `Vous avez misé ${heroBarrels} streets sans main faite ni tirage actif (${cl.madeHand.toLowerCase().replace(/_/g,' ')}). Ce n\u2019est pas forcément une erreur — un bluff pur peut être la bonne ligne — mais ça vaut la peine de se demander AVANT de miser : "est-ce que je bloque ses mains de call, est-ce que sa range peut vraiment se coucher ici ?" plutôt que de continuer par habitude.`;
 },
 // 6) Renforcement positif : Hero a respecté une range resserrée identifiée en se couchant/limitant
 // son engagement — pas la peine de pointer QUE des erreurs, la lecture correcte mérite d'être nommée.
 function respectedTightRangeRead(spot, s){
 if(preflopAggressorPosition(spot)===spot.heroPosition) return null;
 const tier = villainPreflopRangeTier(spot);
 if(!tier || tier.tier!=='TIGHT') return null;
 const heroCalls = (s.streetLog||[]).filter(e=>!e.heroInitiated && e.heroAdd>0).length;
 const foldedAtSomePoint = s.postflopOutcome!=='fold' && (s.facingSurprise ? s.facingSurprise.response==='FOLD' : heroCalls===0);
 if(!foldedAtSomePoint) return null;
 return `Vous vous êtes couché face à ${tier.aggressorPos} sans forcer le coup contre une range que vous saviez resserrée (${tier.description.toLowerCase().includes('paires premium') ? 'paires premium/AK-type' : 'plus large que la relance seule ne le suggère'}). C\u2019est exactement le genre de lecture qui évite de payer une main qui vous bat trop souvent.`;
 },
 // 7) ANALYSE RÉTROSPECTIVE RIVER (portée depuis l'ancien PostflopPanel, mort) : la river est la street
 // qui a le plus souvent une carte qui rebat les cartes (couleur/quinte qui se complète, board qui se
 // paire) — on vérifie ici, après coup, si la décision RIVER réellement jouée a tenu compte de ce
 // changement de texture, ou si elle a juste prolongé le plan de la turn par automatisme. Ne se
 // déclenche que si la main est allée jusqu'à la river ET qu'une décision river a bien été notée
 // (pas de tapis avant, pas de fold plus tôt).
 function riverTextureRetrospective(spot, s){
 if(!spot.runout || spot.runout.length<5) return null;
 const flopCards = spot.runout.slice(0,3);
 const turnCard = spot.runout[3];
 const riverCard = spot.runout[4];
 const notes = describeNewCard(riverCard, [...flopCards, turnCard]);
 if(!notes.length) return null; // river neutre : rien de spécial à souligner rétrospectivement
 const riverEntry = (s.handLog||[]).find(i => i.phase==='RIVER' && i.tier);
 if(!riverEntry) return null; // pas de décision river notée sur cette main
 const noteText = notes[0].charAt(0).toLowerCase() + notes[0].slice(1);
 if(isMistakeTier(riverEntry.tier)){
 return `La river a changé le board (${noteText}) et votre décision (${riverEntry.label.toLowerCase()}) ne semble pas en avoir tenu compte : cette carte méritait de remettre en question le plan pris à la turn, pas de le prolonger par automatisme.`;
 }
 return `La river a changé le board (${noteText}) et votre décision (${riverEntry.label.toLowerCase()}) en a bien tenu compte, plutôt que de prolonger le plan de la turn sans y repenser.`;
 },
];
// Sélectionne jusqu'à 3 analyses applicables, mélangées pour varier d'une main à l'autre plutôt que de
// toujours afficher les mêmes en premier quand plusieurs patterns matchent en même temps.
function buildRangeBasedAnalysis(spot, s){
 // Les analyses secondaires doivent servir l'étude, pas remplir l'écran.
 // Priorité fixe : erreur concrète > adaptation de street > lecture de range > renforcement positif.
 const weights = {
   thinValueMultiStreetRisk: 100,
   callingIntoRangeDisadvantage: 95,
   bluffCatchJustifiedByProfile: 82,
   revealedHandVsRangeRead: 78,
   barrelingWithoutEquity: 90,
   respectedTightRangeRead: 55,
   riverTextureRetrospective: 88
 };
 const ranked = HAND_ANALYSIS_PATTERNS.map((fn, index) => {
   try {
     const text = fn(spot, s);
     if(!text) return null;
     const lower = String(text).toLowerCase();
     let priority = weights[fn.name] || 50;
     if(/erreur|trop cher|mauvais|ne devait|ne fallait|par automatisme/.test(lower)) priority += 20;
     if(/river/.test(lower)) priority += 7;
     if(/range|tirage|bloque|bloqueur|value|bluff/.test(lower)) priority += 3;
     return {text, priority, index, key:fn.name};
   } catch(e){ return null; }
 }).filter(Boolean);
 ranked.sort((a,b)=>b.priority-a.priority || a.index-b.index);
 // Deux remarques maximum : la première doit apporter un axe d'étude différent de la leçon principale.
 const out=[];
 const seen=new Set();
 for(const item of ranked){
   const normalized=item.text.toLowerCase().replace(/[^a-zà-ÿ0-9 ]/g,' ').replace(/\s+/g,' ').trim();
   const duplicate=[...seen].some(x=>normalized.includes(x) || x.includes(normalized.slice(0,90)));
   if(duplicate) continue;
   out.push(item.text); seen.add(normalized.slice(0,120));
   if(out.length===2) break;
 }
 return out;
}

// ============================================================
// ÉTAPE 4/5/8 DE LA DEMANDE — bibliothèque de PATTERNS (contraintes), pas des templates écrits à la
// main. Chaque pattern décrit une CONTRAINTE vérifiable via classifyPostflopHand (le "generationIntent"
// demandé), pas une carte ou une main précise. Le générateur ci-dessous (generatePostflopSituation)
// distribue une main + un board au hasard depuis un vrai paquet mélangé (donc jamais de carte
// dupliquée ni de carte Hero sur le board, par construction), les classe, et RECOMMENCE tant que le
// résultat ne correspond pas réellement à l'intention — jamais un simple étiquetage a posteriori (voir
// point 8 : validation réelle des cartes, pas une étiquette de confiance).
// Quotas ci-dessous = poids relatifs (somme informative ≈ 200), pas un nombre de templates écrits à la
// main. `street` fixe la longueur du board généré (FLOP=3, TURN=4, RIVER=5), donnant la répartition
// approximative 50/30/20 demandée une fois les poids appliqués.
const POSTFLOP_PATTERNS = {
 TOP_PAIR_TOP_KICKER: { weight:25, street:'FLOP', match:(cl)=>cl.madeHand==='TOP_PAIR' && ['A','K'].includes(cl.kicker) },
 TOP_PAIR_WEAK_KICKER: { weight:15, street:'FLOP', match:(cl)=>cl.madeHand==='TOP_PAIR' && !['A','K','Q'].includes(cl.kicker) },
 OVERPAIR:  { weight:20, street:'FLOP', match:(cl)=>cl.madeHand==='OVERPAIR' },
 SECOND_PAIR:  { weight:15, street:'TURN', match:(cl)=>cl.madeHand==='SECOND_PAIR' },
 MIDDLE_OR_BOTTOM_PAIR: { weight:10, street:'FLOP', match:(cl)=>cl.madeHand==='MIDDLE_PAIR' || cl.madeHand==='BOTTOM_PAIR' },
 TWO_PAIR:  { weight:12, street:'TURN', match:(cl)=>cl.madeHand==='TWO_PAIR' },
 SET:   { weight:15, street:'FLOP', match:(cl)=>cl.madeHand==='SET' },
 OVERCARDS:  { weight:10, street:'FLOP', match:(cl)=>cl.madeHand==='OVERCARDS' },
 FLUSH_DRAW:  { weight:15, street:'FLOP', match:(cl)=>cl.draw==='FLUSH_DRAW' },
 NUT_FLUSH_DRAW: { weight:10, street:'FLOP', match:(cl)=>cl.draw==='NUT_FLUSH_DRAW' },
 OESD:   { weight:10, street:'TURN', match:(cl)=>cl.draw==='OESD' },
 GUTSHOT:  { weight:8, street:'FLOP', match:(cl)=>cl.draw==='GUTSHOT' || cl.draw==='DOUBLE_GUTSHOT' },
 COMBO_DRAW:  { weight:8, street:'TURN', match:(cl)=>cl.draw==='COMBO_DRAW' },
 BLUFF_CATCHER:  { weight:7, street:'RIVER', match:(cl)=>['TOP_PAIR','SECOND_PAIR','MIDDLE_PAIR','BOTTOM_PAIR','UNDERPAIR'].includes(cl.madeHand) && (cl.strength==='WEAK'||cl.strength==='MEDIUM') },
 AIR_OR_BACKDOOR: { weight:5, street:'FLOP', match:(cl)=>cl.madeHand==='AIR' && (cl.draw==='NONE'||cl.draw==='BACKDOOR_DRAW') },
 MISSED_FLUSH_DRAW: { weight:5, street:'RIVER', requiresFlopDraw:d=>d==='FLUSH_DRAW'||d==='NUT_FLUSH_DRAW', match:(cl)=>cl.drawStatus==='MISSED' && cl.madeHand!=='FLUSH' },
 MISSED_STRAIGHT_DRAW: { weight:5, street:'RIVER', requiresFlopDraw:d=>d==='OESD'||d==='GUTSHOT'||d==='DOUBLE_GUTSHOT', match:(cl)=>cl.drawStatus==='MISSED' && cl.madeHand!=='STRAIGHT' },
 THIN_VALUE_RIVER: { weight:5, street:'RIVER', match:(cl)=>['TOP_PAIR','SECOND_PAIR'].includes(cl.madeHand) && cl.strength==='MEDIUM' },
 SPECIAL_BOARD_PAIRED: { weight:5, street:'TURN', match:(cl,board)=>Object.values(rankCounts(board)).some(n=>n>=2) },
};
// Réutilise le paquet et le mélange déjà existants (deck(), shuffle()) — aucune nouvelle source
// aléatoire créée. `attempts` borné pour ne jamais boucler indéfiniment sur un pattern trop contraint
// (ex. NUT_FLUSH_DRAW exige une carte précise en main : rejet-échantillonnage, pas une construction
// dirigée — plus simple, et le nombre de tentatives reste négligeable à cette échelle de jeu).
function generatePostflopSituation(patternKey, maxAttempts){
 const pattern = POSTFLOP_PATTERNS[patternKey];
 if(!pattern) return null;
 const boardLen = pattern.street==='FLOP' ? 3 : pattern.street==='TURN' ? 4 : 5;
 for(let attempt=0; attempt<(maxAttempts||800); attempt++){
 const d = shuffle(deck());
 const hole = [d[0], d[1]];
 const flop = d.slice(2,5);
 const flopClass = classifyPostflopHand(hole, flop);
 if(pattern.requiresFlopDraw && !pattern.requiresFlopDraw(flopClass.draw)) continue;
 // runout complet (5 cartes) tiré du MÊME paquet mélangé, jamais reshuffle séparément : le template
 // final a toujours besoin d'un board flop+turn+river, même quand le pattern lui-même ne contraint
 // que le flop (les rues suivantes restent alors "neutres", non forcées par le pattern).
 const runout = d.slice(2,7);
 if(boardLen===3){
 if(pattern.match(flopClass, flop, hole)) return { hole, board:flop, runout, classification:flopClass, pattern:patternKey };
 continue;
 }
 const turnBoard = [...flop, d[5]];
 const turnClass = classifyPostflopHand(hole, turnBoard, flopClass.draw);
 if(boardLen===4){
 if(pattern.match(turnClass, turnBoard, hole)) return { hole, board:turnBoard, runout, classification:turnClass, pattern:patternKey };
 continue;
 }
 const riverBoard = [...turnBoard, d[6]];

// -- Probabilité exacte « flop from scratch » : on énumère les C(50,3) flops
// possibles (cartes restantes après les 2 cartes en main) et on compte ceux
// qui vérifient la cible. C'est lent à l'échelle d'un moteur temps réel mais
// instantané pour générer UNE question (≈19 600 combinaisons).
function enumerateFlops(hole){
 const remaining = cardsRemaining(hole);
 const combos = [];
 for(let i=0;i<remaining.length;i++)
 for(let j=i+1;j<remaining.length;j++)
 for(let k=j+1;k<remaining.length;k++)
 combos.push([remaining[i],remaining[j],remaining[k]]);
 return combos;
}
function flopProbability(hole, targetFn){
 const combos = enumerateFlops(hole);
 let hits = 0;
 for(const flop of combos){ if(targetFn(hole, flop)) hits++; }
 return (hits/combos.length)*100;
}
function rankCounts(cards){ const c={}; cards.forEach(card=>{ c[card.rank]=(c[card.rank]||0)+1; }); return c; }

function shuffle2(arr){ return shuffle(arr); }
function buildOptions(correctLabel, distractorLabels){
 const seen = new Set([correctLabel]);
 const uniques = [];
 for(const label of distractorLabels){ if(!seen.has(label)){ seen.add(label); uniques.push(label); } }
 const opts = [{label:correctLabel, isCorrect:true},...uniques.slice(0,3).map(l=>({label:l, isCorrect:false}))];
 return shuffle(opts);
}
function makeMcqPercent(correctPct){
 const fmt = v => formatPercent(Math.max(0,v));
 const correctLabel = fmt(correctPct);
 // Écart minimal entre deux options pour éviter des distracteurs trop proches ou identiques après arrondi.
 const minGap = Math.max(1.5, correctPct*0.18);
 const usedValues = [correctPct];
 const distractors = [];
 const baseFactors = shuffle([0.35,0.5,1.6,1.9,2.3,2.7,3.2,0.2]);
 let idx = 0, guard = 0;
 while(distractors.length<3 && guard<60){
 guard++;
 const f = baseFactors[idx % baseFactors.length]; idx++;
 const jitter = 1 + (Math.random()*0.3-0.15);
 const candidate = Math.max(0.1, correctPct*f*jitter);
 const label = fmt(candidate);
 const tooClose = usedValues.some(v => Math.abs(v-candidate) < minGap) || label===correctLabel;
 if(!tooClose){ distractors.push(label); usedValues.push(candidate); }
 }
 // Filet de sécurité (cas extrêmes, ex. probabilité très proche de 0 ou de 100) :
 // on force un écart croissant si le tirage aléatoire n'a pas suffi.
 let step = 1;
 while(distractors.length<3){
 const candidate = Math.max(0.1, Math.min(100, correctPct + step*minGap*(distractors.length%2===0?1:-1)));
 const label = fmt(candidate);
 if(label!==correctLabel && !distractors.includes(label)) distractors.push(label);
 step++;
 if(step>20) break;
 }
 return buildOptions(correctLabel, distractors);
}
function makeMcqInt(correctInt, poolCandidates){
 const correctLabel = String(correctInt);
 let candidates = (poolCandidates||[]).filter(v=>v!==correctInt && v>0);
 if(candidates.length<3){
 const deltas = shuffle([-4,-3,-2,2,3,4,5,-5]);
 for(const d of deltas){ const v=correctInt+d; if(v>0 && !candidates.includes(v)) candidates.push(v); if(candidates.length>=5) break; }
 }
 const distractors = shuffle(candidates).slice(0,3).map(String);
 return buildOptions(correctLabel, distractors);
}

// Compte exact des combos restants d'une main donnée compte tenu des cartes déjà vues (blockers) —

 const seenSet = new Set(seenCards.map(cardKey));
 if(handClass.length===2 && handClass[0]===handClass[1]){
 const rank = handClass[0];
 const availableSuits = SUITS.filter(s => !seenSet.has(`${rank}${s}`));
 return combinations(availableSuits.length, 2);
 }
 const suited = handClass.endsWith('s');
 const hi = handClass[0], lo = handClass[1];
 if(suited){
 return SUITS.filter(s => !seenSet.has(`${hi}${s}`) && !seenSet.has(`${lo}${s}`)).length;
 }
 let count=0;
 for(const sHi of SUITS){
 if(seenSet.has(`${hi}${sHi}`)) continue;
 for(const sLo of SUITS){
 if(sHi===sLo) continue;
 if(seenSet.has(`${lo}${sLo}`)) continue;
 count++;
 }
 }
 return count;
}

function pickWeightedGenerator(pool, statsStore){
 if(pool.length===0) return null;
 const weights = pool.map(g => {
 const s = statsStore[g.category];
 if(!s || s.total<3) return 3;
 const acc = s.correct/s.total;
 return Math.max(0.6, 3*(1-acc)+0.4);
 });
 const total = weights.reduce((a,b)=>a+b,0);
 let r = Math.random()*total;
 for(let i=0;i<pool.length;i++){ r -= weights[i]; if(r<=0) return pool[i]; }
 return pool[pool.length-1];
}
function qcmState(mod){ return mod==='proba' ? state.qcmProba : state.qcmCote; }
function qcmGenerators(mod){ return mod==='proba' ? PROBA_GENERATORS : COTE_GENERATORS; }
function qcmStorageKey(mod){ return mod==='proba' ? QCM_PROBA_KEY : QCM_COTE_KEY; }
function newQcmQuestion(mod){
 const st = qcmState(mod);
 const pool = qcmGenerators(mod).filter(g => g.level<=levelNumFromLabel(st.level));
 const chosen = pickWeightedGenerator(pool.length?pool:qcmGenerators(mod), st.stats);
 const q = chosen.generate();
 q.category = chosen.category; q.categoryLabel = chosen.categoryLabel; q.level = chosen.level;
 st.question = q; st.selected = null; st.freeInput = ''; st.revealed = false; st.lastFreeCorrect = false;
}
function recordQcmAnswer(mod, correct){
 const st = qcmState(mod);
 const cat = st.question.category;
 if(!st.stats[cat]) st.stats[cat] = { correct:0, total:0, label:st.question.categoryLabel };
 st.stats[cat].total++; if(correct) st.stats[cat].correct++;
 st.stats[cat].label = st.question.categoryLabel;
 saveQcmStats(qcmStorageKey(mod), st.stats);
 st.totalCount++; if(correct) st.correctCount++;
}
function answerQcmOption(mod, idx){
 const st = qcmState(mod);
 if(st.revealed) return;
 st.selected = idx; st.revealed = true;
 recordQcmAnswer(mod, !!st.question.options[idx].isCorrect);
 render();
}
function answerQcmFree(mod){
 const st = qcmState(mod);
 if(st.revealed || st.question.freeAnswer===null) return;
 const val = parseFloat(String(st.freeInput).replace(',','.'));
 if(Number.isNaN(val)) return;
 const tol = st.question.tolerance ?? 1;
 const correct = Math.abs(val - st.question.freeAnswer) <= tol;
 st.revealed = true; st.lastFreeCorrect = correct;
 recordQcmAnswer(mod, correct);
 render();
}

// BUG CORRIGÉ : l'ordre des boutons préflop (Fold/Call/3-bet, etc.) suivait l'ordre écrit dans
// chaque template — tantôt ['OPEN','FOLD'], tantôt ['FOLD','CALL','3BET'], tantôt ['CALL','3BET','FOLD'].
// Résultat : le bouton Fold changeait de côté d'un spot à l'autre, ce qui est déstabilisant. On trie
// maintenant systématiquement du plus passif (Fold) au plus agressif (Shove), quel que soit l'ordre
// d'origine dans les données.
const PREFLOP_ACTION_PRIORITY = { FOLD:0, CALL:1, OPEN:2, '3BET':2, '4BET':2, SHOVE:3 };
function sortPreflopOptions(options){
 return [...options].sort((a,b) => (PREFLOP_ACTION_PRIORITY[a] ?? 2) - (PREFLOP_ACTION_PRIORITY[b] ?? 2));
}
function actionName(action){
 if(action==='3BET') return '3-bet'; if(action==='4BET') return '4-bet';
 if(action==='5BET') return '5-bet';
 if(action==='SHOVE') return 'Tapis (5-bet)';
 if(action==='OPEN') return 'Ouvrir'; if(action==='FOLD') return 'Se coucher'; if(action==='CALL') return 'Suivre';
 if(action==='CHECK') return 'Checker';
 if(/^BET\s*\d+(?:\.\d+)?%?$/i.test(String(action||''))) return postActionLabel(String(action).toUpperCase());
 return action;
}

// Résumé texte court de la situation, pour l'historique (ex. "BTN open 2.3 bb").
function situationSummary(spot){
 if(spot.villainPosition==='—') return 'Premier à parler';
 const lastAct = (spot.actions||[]).slice(-1)[0];
 return lastAct ? `${spot.villainPosition} ${actionPhrase(lastAct.action, lastAct.amount)}` : `Face à ${spot.villainPosition}`;
}
function log(decision, recommended, tier, currentStreet, explanation){
 const item = {
 id:`${Date.now()}-${Math.random()}`, hand:handLabel(state.spot.hole), position:state.spot.heroPosition,
 street:currentStreet, tier, correct: tierScore(tier), decision, recommended, category:state.spot.category,
 situation: situationSummary(state.spot), explanation: explanation||'',
 difficulty:state.spot.difficulty, stack:state.spot.effectiveStack, format: state.anteMode==='mtt'?'MTT':'Cash', timestamp:Date.now(),
 junkExample: !!state.spot.junkExample,
 };
 state.history.push(item);
 try{ saveHistory(state.history); }catch(e){ console.error('Sauvegarde historique impossible :', e); }
 state.streak = isMistakeTier(tier) ? 0 : state.streak+1;
}
function nextHand(){
 state.spot = pickSpot(state.table, state.spot.id, state.difficulty, state.villainProfileMode);
 state.phase='preflop'; state.selected=null; state.postAction=null; state.street='FLOP';
 state.preflopOutcome=null; state.postflopOutcome=null; state.facingSurprise=null; state.facingPreflopRaise=null; state.streetLog=[];
 state.awaitingOpenSize=false; state.openSize=null; state.openSizeTier=null; state.awaitingRaiseSize=false; state.raiseSize=null; state.raiseSizeTier=null; state.pendingRaiseAction=null; state.awaitingFollowupReveal=false; state.allInRunout=false;
 state.handLog=[]; state.handOver=false; state.summaryAnalysisOpen=false;
 render();
}
// Au lieu de sauter directement à une nouvelle main quand le coup se termine (fold, adversaire qui se
// couche, tapis atteint...), on affiche d'abord un résumé complet de la main — plus besoin de lire un
// paragraphe à chaque street, tout arrive en un seul écran de bilan à la fin.
function pushHandLog(entry){ state.handLog.push(entry); }
function endHand(){ state.handOver = true; render(); }
// Certains spots représentaient "vous avez déjà open, vous vous êtes déjà fait 3-bet" comme un fait
// pré-scripté, sans jamais vous laisser décider cette première action vous-même. `followup` transforme
// ça en vraie séquence vécue : vous décidez d'abord (open/3-bet, noté), PUIS l'adversaire applique la
// pression scriptée du spot (ou fold, selon son profil) — et seulement là arrive la vraie décision notée.
function willVillainApplyFollowup(spot, profileKey){
 let foldProb;
 if(spot.followup.triggerAction==='OPEN'){
 foldProb = PREFLOP_FOLD_TO_RAISE[profileKey] ?? PREFLOP_FOLD_TO_RAISE.reg;
 } else {
 const t = PREFLOP_3BET_REACTION[profileKey] ?? PREFLOP_3BET_REACTION.reg;
 foldProb = t.fold;
 }
 return Math.random() >= foldProb;
}
// BUG CORRIGÉ : quand héros CALL un open (au lieu de relancer), les blindes qui n'avaient pas encore
// parlé étaient toujours silencieusement passives — jamais de squeeze. On leur donne une vraie chance
// de relancer, comme à une table réelle.
function blindsBehindHero(spot, tableSize){
 const order = tableSize===6 ? SIX_MAX : NINE_MAX;
 const heroIdx = order.indexOf(spot.heroPosition);
 if(heroIdx===-1) return [];
 return ['SB','BB'].filter(b => order.indexOf(b) > heroIdx && b!==spot.heroPosition && b!==spot.villainPosition);
}
const BLIND_SQUEEZE_PROB = { nit:0.06, reg:0.11, lag:0.18, fish:0.06 };
function simulateBlindSqueeze(spot, profileKey){
 const behind = blindsBehindHero(spot, spot.table);
 if(behind.length===0) return null;
 const p = BLIND_SQUEEZE_PROB[profileKey] ?? BLIND_SQUEEZE_PROB.reg;
 return Math.random() < p ? behind[Math.floor(Math.random()*behind.length)] : null;
}
function choosePreflop(action){
 state.selected = action;
 const tier = preflopTier(state.spot, action);
 log(action, state.spot.preflop.action, tier, 'Préflop', state.spot.preflop.explanation);
 // Feedback de sizing (porté depuis l'ancien FeedbackPreflop, mort) : la direction (Open/Fold/3-bet...)
 // et le sizing choisi sont deux décisions distinctes — on ajoute une phrase courte sur le sizing à la
 // rationale déjà loguée, sans jamais changer le tier JUSTE/MIX/ERREUR de la direction elle-même.
 let sizingExplanation = '';
 if(action==='OPEN' && state.openSize!=null){
 sizingExplanation = ' ' + openSizingFeedback(state.openSize, state.spot.effectiveStack, state.openSizeTier);
 } else if((action==='3BET' || action==='4BET') && state.raiseSize!=null){
 sizingExplanation = ' ' + raiseSizingFeedback(state.raiseSize, state.spot, state.raiseSizeTier);
 }
 pushHandLog({ phase:'Préflop', label:actionName(action)+(state.openSize?` (${state.openSize==='ALLIN'?'all-in':state.openSize+' bb'})`:''), tier, explanation:state.spot.preflop.explanation+sizingExplanation, solution:`${state.spot.preflop.frequency}% ${actionName(state.spot.preflop.action)}` });
 state.preflopOutcome = null;
 state.facingPreflopRaise = null;
 if(state.spot.followup && state.spot.followup.triggerAction===action){
 // BUG CORRIGÉ : on basculait directement sur la 2e décision sans jamais logger ni afficher de
 // feedback pour ce premier choix — ça donnait l'impression que la décision n'avait pas compté.
 // On affiche maintenant le feedback normal (JUSTE/MIX/ERREUR sur ce premier choix), et c'est un
 // clic explicite qui révèle la réaction de l'adversaire.
 state.awaitingFollowupReveal = true;
 render();
 return;
 }
 if(['3BET','4BET','SHOVE'].includes(action) && state.spot.villainPosition!=='—'){
 state.preflopOutcome = simulatePreflopRaiseReaction(state.spot.villainProfile, action);
 if(state.preflopOutcome==='raise'){
 state.facingPreflopRaise = { response:null, size: estimatePreflopReraiseSize(state.spot), squeezer: state.spot.villainPosition };
 }
 } else if(action==='CALL' && state.spot.villainPosition!=='—'){
 const squeezerProfile = pickVillainProfileKey(state.villainProfileMode);
 const squeezer = simulateBlindSqueeze(state.spot, squeezerProfile);
 if(squeezer){
 state.facingPreflopRaise = { response:null, size: estimatePreflopReraiseSize(state.spot), squeezer, squeezerProfile };
 }
 }
 render();
}
function revealFollowupOutcome(){
 const fu = state.spot.followup;
 if(!fu) return;
 state.awaitingFollowupReveal = false;
 const profileKey = state.spot.villainProfile || pickVillainProfileKey(state.villainProfileMode);
 if(!willVillainApplyFollowup(state.spot, profileKey)){
 // L'adversaire abandonne directement face à votre ouverture/3-bet : la main s'arrête ici.
 state.preflopOutcome = 'fold';
 render();
 return;
 }
 // L'adversaire applique la pression scriptée : on construit la vraie séquence d'action vécue,
 // on lui assigne un profil (ce spot démarrait "premier à parler", donc sans adversaire désigné),
 // puis on bascule sur la seconde décision (avec ses propres fréquences réelles).
 const action = state.selected;
 // BUG CORRIGÉ : un SHOVE, ou un OPEN choisi en tapis (ALLIN), enregistrait un montant `undefined` —
 // la détection "stacks engagés" (qui dépend de ce montant) ne se déclenchait donc jamais correctement.
 const heroAmount = action==='SHOVE' ? state.spot.effectiveStack
 : (action==='OPEN' && state.openSize) ? (state.openSize==='ALLIN' ? state.spot.effectiveStack : state.openSize)
 : ((action==='3BET' || action==='4BET') && state.raiseSize) ? (state.raiseSize==='ALLIN' ? state.spot.effectiveStack : state.raiseSize)
 : undefined;
 const newActions = [
...(state.spot.actions||[]),
 { pos: state.spot.heroPosition, action: action==='OPEN' ? 'open' : '3bet', amount: heroAmount },
 { pos: fu.villainPosition || state.spot.villainPosition, action: fu.villainAction, amount: fu.villainAmount },

 return { kind:'continue', label:'Continuer', action:()=>goToPostflop() };
 }
 if(s.allInRunout) return { kind:'continue', label:'Continuer', action:()=>advanceAllInRunout() };
 if(s.facingSurprise && !s.facingSurprise.response){
 return { kind:'foldcall', note:facingActionLine(s), onFold:()=>respondToSurprise('FOLD'), onCall:()=>respondToSurprise('CALL') };
 }
 if(s.postAction===null) return { kind:'postflopMain' };
 return { kind:'continue', label:'Continuer', action:()=>choosePostflop('NEXT') };
}
// Une ligne courte au lieu d'un paragraphe : tout le détail (explication, fréquence, mix) est
// désormais réservé au résumé de fin de main.
// Phrase "qui mise/relance quoi" quand on attend une réponse — réutilisée à la fois dans la barre
// d'action ET dans le panneau de situation (qui, sinon, affiche à ce moment-là "position · stack du
// héros", une info redondante puisque le stack du héros est déjà visible au-dessus de ses cartes).
function facingActionLine(s){
 const spot = s.spot;
 if(s.phase==='preflop' && s.facingPreflopRaise && !s.facingPreflopRaise.response){
 const isSqueeze = s.facingPreflopRaise.squeezer && s.facingPreflopRaise.squeezer!==spot.villainPosition;
 const who = s.facingPreflopRaise.squeezer || spot.villainPosition;
 return `${who} ${isSqueeze?'squeeze':'relance'}${s.facingPreflopRaise.size?` à ${s.facingPreflopRaise.size} bb`:''}`;
 }
 if(s.phase==='postflop' && s.facingSurprise && !s.facingSurprise.response){
 const oppNames = activeNonHeroPositions(spot, s.table).join(' et ') || (spot.villainPosition!=='—'?spot.villainPosition:'L\u2019adversaire');
 const isRaise = s.facingSurprise.type==='raise';
 const bb = computeLiveTableState(s).villainBetBB;
 const sizePart = isRaise ? s.facingSurprise.size : `${s.facingSurprise.size} du pot`;
 return `${oppNames} ${isRaise?'relance':'mise'} ${sizePart}${bb?` - ${bb} bb`:''}`;
 }
 return null;
}
function computeLiveStatusLine(s){
 const spot = s.spot;
 if(s.phase==='preflop'){
 if(s.awaitingOpenSize) return 'Choisissez votre sizing.';
 if(s.awaitingFollowupReveal) return `Vous avez ${actionName(s.selected).toLowerCase()}${s.openSize?` à ${s.openSize} bb`:''}.`;
 if(s.facingPreflopRaise && !s.facingPreflopRaise.response) return '';
 if(s.selected===null) return positionContextText(spot);
 if(s.preflopOutcome==='fold'){

 return `&#127942; ${lastActorPos||'L\u2019adversaire'} se couche : vous remportez le pot.`;
 }

 if(s.facingPreflopRaise && s.facingPreflopRaise.response==='CALL') return `Vous payez.`;
 if(s.preflopOutcome==='call') return `${spot.villainPosition} paie votre ${actionName(s.selected).toLowerCase()}.`;
 return `Vous avez ${actionName(s.selected).toLowerCase()}${s.openSize?` à ${s.openSize} bb`:''}.`;
 }
 if(s.allInRunout) return `Stacks quasiment engagés — cartes distribuées.`;
 if(s.facingSurprise && !s.facingSurprise.response) return '';
 if(s.postAction===null) return s.street==='FLOP' ? preflopRecapText(spot, s.selected, s.openSize) : 'À vous de jouer.';
 const opponents = activeNonHeroPositions(spot, s.table);
 const oppNames = opponents.length ? opponents.join(' et ') : (spot.villainPosition!=='—'?spot.villainPosition:'L\u2019adversaire');
 if(s.postflopOutcome==='fold') return `&#127942; ${oppNames} se couche : vous remportez le pot.`;

 if(s.postAction==='CHECK') return `${oppNames} checke${opponents.length>1?'nt':''} aussi.`;

}
