// Flux de données (rien de nouveau, juste rendu explicite) :
//   GAME STATE (state.spot / liveState) → ACTION/EVENT (le joueur clique,
//   une street avance...) → TABLE RENDER (TableViz(), rappelé à CHAQUE
//   render()) → TABLE FX (ici) : TableViz() décrit l'état actuel de la table
//   à TableFX à chaque appel ; TableFX seul décide, en comparant à ce qu'il a
//   déjà vu POUR CETTE MAIN, s'il s'agit d'un vrai événement neuf (à animer)
//   ou d'un simple rerender (affichage statique, inchangé). TableViz ne fait
//   plus lui-même ce suivi : il délègue.
//
// Ce n'est PAS un bus d'événements générique ni un framework : juste un objet
// avec une méthode par événement, un état interne privé, et les fonctions de
// dessin (keyframes + SVG) qui vont avec. Aucune règle de jeu, aucun calcul
// de pot/stack/range ne vit ici — uniquement de la détection de changement et
// du markup SVG/CSS décoratif, purement additif par rapport à l'affichage
// normal (qui reste calculé comme avant dans TableViz).
const TableFX = (() => {
 // --- état interne : un seul endroit pour tout le suivi anti-rejeu ---
 let holeRef = null;       // référence de spot.hole = identité de la main en cours
 let dealtHero = false;    // cartes hero déjà distribuées pour cette main ?
 let knownBoardCount = 0;  // nb de cartes de board déjà "vues" pour cette main
 let betStreetKey = null;  // dernière street vue (0/3/4/5 = board.length)
 let seenBets = {};        // { pos: dernier montant vu } pour la street en cours
 let seenFolds = {};       // { pos: true } déjà vus foldés pour cette main
 let lastPot = null;       // dernière valeur de pot vue pour cette main
 let seq = 0;              // compteur d'ids uniques pour les noms de @keyframes
 const nextId = () => ++seq;
 // Petit décalage déterministe par position (pas aléatoire — un `pos` donné doit toujours retomber
 // au même endroit, sinon la pile "saute" à chaque render) : évite que plusieurs jetons (multiway)
 // atterrissent exactement au même pixel, et donne une légère variation de position/rotation à
 // l'arrivée, plus crédible qu'un empilement parfaitement centré.
 function jitterFor(pos){
 let h=0; for(let i=0;i<pos.length;i++) h=(h*31+pos.charCodeAt(i))|0;
 h = Math.abs(h);
 return { jx: (h%7-3)*1.6, jy: (Math.floor(h/7)%5-2)*1.4, jr: (Math.floor(h/35)%9-4) };
 }

 // Remet à zéro tout le suivi dès qu'on change de main (nouvelle référence
 // `hole` = pickSpot() a tiré une nouvelle main, cf. commentaire détaillé
 // plus bas sur la stabilité de cette référence).
 function syncHand(hole){
 if(hole !== holeRef){
 holeRef = hole; dealtHero = false; knownBoardCount = 0;
 betStreetKey = null; seenBets = {}; seenFolds = {}; lastPot = null;
 }
 }

 // ---- dealHeroCards --------------------------------------------------
 // `spot.hole` est un tableau créé une seule fois par pickSpot() pour toute
 // la main (les mises à jour intra-main font `{...state.spot, ...}` sans
 // jamais toucher `hole`) : sa RÉFÉRENCE reste identique d'un rerender à
 // l'autre tant qu'on est sur la même main, et ne change que sur une
 // nouvelle main — c'est ce qui permet de distinguer simplement les deux cas.
 function dealHeroCards(heroSeat, targetY, hole, cx, cy){
 if(!heroSeat || !hole || !hole.length) return '';
 syncHand(hole);
 const isNewDeal = !dealtHero;
 dealtHero = true;
 const w=24, h=33, gap=4;
 if(!isNewDeal){
 // Simple rerender de la même main : cartes déjà "arrivées", affichage tel quel.
 return svgCardRow(heroSeat.x, targetY, hole, w, h, gap);
 }
 // Nouvelle distribution : chaque carte part d'un point proche du centre/haut de la table
 // (juste au-dessus du pot, où le board apparaîtra plus tard) vers sa position au siège du héros.
 // Point de départ légèrement DIFFÉRENT pour chaque carte (offsets ci-dessous) plutôt qu'un point
 // unique partagé : donne l'impression que les deux cartes sont distribuées séparément depuis le
 // sabot, pas dupliquées depuis un seul endroit.
 const n = hole.length;
 const totalW = n*w + (n-1)*gap;
 const x0 = heroSeat.x - totalW/2 + w/2;
 const startXOffsets = [-7, 7], startYOffsets = [-2, 3];
 const tilts = [-9, 8];
 const id = nextId();
 let styles = '', cards = '';
 hole.forEach((c,i)=>{
 const fx = x0 + i*(w+gap), fy = targetY;
 const startX = cx + startXOffsets[i % startXOffsets.length];
 const startY = cy - 18 + startYOffsets[i % startYOffsets.length];
 const dx = (startX - fx).toFixed(1), dy = (startY - fy).toFixed(1);
 const rot = tilts[i % tilts.length];
 const name = `dealHero${id}_${i}`;
 const delay = i*130; // léger décalage entre les 2 cartes pour un effet de distribution réaliste
 styles += `@keyframes ${name}{0%{transform:translate(${dx}px,${dy}px) rotate(${rot}deg) scale(.55);opacity:.85}100%{transform:translate(0,0) rotate(0) scale(1);opacity:1}}`;
 cards += `<g style="transform-box:fill-box;transform-origin:center;animation:${name} 520ms cubic-bezier(.22,.68,0,1.25) ${delay}ms both;">${svgCard(fx, fy, c, w, h)}</g>`;
 });
 return `<style>${styles}</style>${cards}`;
 }

 // ---- dealFlop / dealTurn / dealRiver --------------------------------
 // `board` est un NOUVEAU tableau à chaque appel (visibleBoard() fait un
 // .slice()), donc contrairement à `hole` sa référence ne peut pas servir de
 // signal — on compare sa LONGUEUR au nombre de cartes déjà vues pour cette
 // main. Préflop→flop (0→3) anime les 3 nouvelles cartes, flop→turn (3→4)
 // anime uniquement la 4e, turn→river (4→5) uniquement la 5e ; un simple
 // rerender à longueur inchangée (ex. changement de mise) n'anime rien. Les
 // trois noms d'événement demandés partagent volontairement cette seule
 // implémentation : la street concernée se déduit déjà de `board.length`,
 // pas besoin de trois fois la même logique de diff.
 function dealBoard(hole, board, cx, cy){
 const w=29, h=40, gap=4;
 syncHand(hole);
 if(!board || !board.length) return '';
 const n = board.length;
 const totalW = n*w + (n-1)*gap;
 const x0 = cx - totalW/2 + w/2;
 const newCount = Math.max(0, n - knownBoardCount);
 knownBoardCount = n;
 if(newCount===0){
 // Aucune carte réellement nouvelle depuis le dernier rendu (ex. simple mise) : affichage statique.
 return board.map((c,i)=>svgCard(x0+i*(w+gap), cy, c, w, h)).join('');
 }
 const firstNewIdx = n - newCount;
 // Turn/river (1 seule nouvelle carte) : ~450ms. Flop (3 nouvelles cartes, effet successif) : ~150ms
 // de décalage entre chacune + 450ms de durée propre ⇒ dernière carte termine vers 2*150+450=750ms,
 // bien dans la fourchette 600–800ms demandée pour l'ensemble du flop.
 const id = nextId();
 let styles = '', cards = '';
 board.forEach((c,i)=>{
 const fx = x0 + i*(w+gap), fy = cy;
 if(i < firstNewIdx){
 cards += svgCard(fx, fy, c, w, h); // carte déjà révélée lors d'un rendu précédent : pas d'animation
 return;
 }
 const localIdx = i - firstNewIdx;
 const name = `dealBoard${id}_${i}`;
 const delay = localIdx*150;
 // Apparition progressive + léger déplacement vertical + léger scale + retournement (scaleX qui se
 // referme puis se rouvre, technique 2D robuste en SVG sans perspective) + retour à la position normale.
 styles += `@keyframes ${name}{0%{opacity:0;transform:translateY(-8px) scale(.85) scaleX(.15)}55%{opacity:1;transform:translateY(2px) scale(1.04) scaleX(1.08)}100%{opacity:1;transform:translateY(0) scale(1) scaleX(1)}}`;
 cards += `<g style="transform-box:fill-box;transform-origin:center;animation:${name} 450ms ease-out ${delay}ms both;">${svgCard(fx, fy, c, w, h)}</g>`;
 });
 return `<style>${styles}</style>${cards}`;
 }

 // ---- playerBet / playerCall / playerRaise ---------------------------
 // Trois noms d'événement pour trois actions poker distinctes, une seule
 // détection/rendu (le jeton visuel est identique pour les trois) : on
 // mémorise, PAR SIÈGE et pour la street en cours, le dernier montant déjà
 // vu, et on n'anime que si ce montant vient réellement d'augmenter
 // (première mise du siège sur cette street, ou relance par-dessus sa
 // propre mise précédente). `streetKey` (0/3/4/5, dérivé de board.length,
 // jamais recalculé ici) remet le suivi à zéro à chaque nouvelle street (les
 // jetons sont ramassés au centre). Ne modifie aucun montant, aucun stack,
 // aucun pot — ne fait que lire ce que TableViz a déjà calculé.
 // Nombre de jetons dessinés pour un montant (partagé avec TableViz, qui en a besoin pour dégager les piles des sièges).
 function chipCountFor(amount){ return amount<5 ? 2 : amount<15 ? 3 : amount<40 ? 4 : 5; }
 function betFlight(hole, streetKey, pos, amount, fromX, fromY, toX, toY, label, delayMs){
 syncHand(hole);
 if(streetKey !== betStreetKey){ betStreetKey = streetKey; seenBets = {}; }
 if(amount==null) return '';
 const prev = seenBets[pos];
 const isNew = prev==null || amount>prev;
 seenBets[pos] = amount;
 // Petite variation de position/rotation par siège (déterministe, cf. jitterFor) : la pile de CE
 // siège atterrit toujours au même endroit légèrement décalé du point central théorique, jamais
 // exactement sur celle d'un autre joueur (multiway).
 const j = jitterFor(pos);
 const px = toX + j.jx, py = toY + j.jy;
 // CORRECTIF (signalé par un utilisateur, capture à l'appui) : le montant du héros était un simple texte
 // 9px posé à py+14 — c'est-à-dire pile là où le siège du héros commence (le siège est à 46px de la pile) :
 // l'étiquette passait à moitié SOUS le rond doré, en doré sur doré, et se confondait avec la ligne de
 // stack juste en dessous. Elle devient une pastille (même style que la boîte de mise des adversaires),
 // centrée sur le point d'atterrissage THÉORIQUE (toX/toY, sans le jitter de la pile) et posée juste sous
 // les jetons ; l'appelant réserve la place (pile à 46px du siège → la pastille tient entre les deux).
 const labelW = label ? Math.max(34, String(label).length*6.3 + 12) : 0;
 const labelHtml = label ? `<rect x="${(toX-labelW/2).toFixed(1)}" y="${(toY+11).toFixed(1)}" width="${labelW.toFixed(1)}" height="14" rx="7" fill="#0d2a1f" stroke="#e0954a" stroke-width="1"/><text x="${toX.toFixed(1)}" y="${(toY+21.5).toFixed(1)}" text-anchor="middle" font-family="'Space Mono',monospace" font-size="10" font-weight="700" fill="#f0c98a">${label}</text>` : '';
 // Nombre de jetons graphiques : représentation légère (2 à 5, jamais un par bb réel) qui donne
 // juste une impression de grosseur de mise — pas une simulation physique. Léger décalage vertical
 // + horizontal alterné par jeton pour un empilement irrégulier plutôt que des cercles parfaitement
 // concentriques, ombre discrète sous la pile pour la détacher visuellement du tapis.
 const chipCount = chipCountFor(amount);
 let stackSvg = '';
 for(let k=0;k<chipCount;k++){
 const oy = py - k*2.3;
 const ox = px + (k%2===0 ? 0 : 0.9);
 stackSvg += `<circle cx="${ox.toFixed(1)}" cy="${oy.toFixed(1)}" r="6" fill="#c96a54" stroke="#f0c98a" stroke-width="1" opacity="${k===0?1:0.9}"/>`;
 }
 const pileSvg = `<g transform="rotate(${j.jr} ${px.toFixed(1)} ${py.toFixed(1)})">
 <ellipse cx="${px.toFixed(1)}" cy="${(py+3.5).toFixed(1)}" rx="7" ry="2.2" fill="#04120c" opacity="0.35"/>
 ${stackSvg}
 </g>${labelHtml}`;
 // ÉTAT FINAL PERSISTANT — une mise déjà posée (détectée, mais pas nouvelle CE render) reste
 // affichée telle quelle : avant ce correctif, betFlight() ne renvoyait un jeton QUE sur le render
 // qui détectait la hausse, et plus rien ensuite (le jeton "disparaissait" dès le render suivant,
 // sans jamais constituer une vraie pile). Séparé ici en deux couches : la pile statique ci-dessus
 // (toujours affichée tant que ce siège a une mise active sur cette street) + l'animation de
 // déplacement ci-dessous (ajoutée PAR-DESSUS, seulement sur le render qui détecte la nouveauté).
 if(!isNew) return pileSvg;
 // Jeton(s) qui partent du siège vers une zone entre le siège et le centre de la table (comme une
 // vraie pile de jetons poussée devant soi). L'affichage normal du montant (géré séparément dans
 // TableViz) n'est jamais touché : ceci est une couche purement décorative ajoutée par-dessus.
 // `label` (optionnel) ajoute le montant en bb à côté des jetons eux-mêmes — utilisé pour le héros,
 // dont la mise "au centre" n'affichait jusqu'ici que les jetons, sans le chiffre.
 const id = nextId();
 const dx = (fromX-px).toFixed(1), dy = (fromY-py).toFixed(1);
 const name = `chipFly${id}`;
 // Petit effet de "settling" à l'arrivée (léger dépassement à 70% puis retour), + la rotation jr
 // ci-dessus reste appliquée au groupe entier pendant tout le vol (baked dans le SVG, pas dans la
 // keyframe) pour une trajectoire qui ne soit pas parfaitement rectiligne/mécanique.
 const style = `<style>@keyframes ${name}{0%{transform:translate(${dx}px,${dy}px) scale(.4);opacity:.5}70%{transform:translate(${(dx*0.06).toFixed(1)}px,${(dy*0.06).toFixed(1)}px) scale(1.12);opacity:1}100%{transform:translate(0,0) scale(1);opacity:1}}</style>`;
 // BUG CORRIGÉ (LOT 1 #5) : `delayMs` (optionnel, 0 par défaut) laisse l'appelant retarder ce vol de
 // jeton — utilisé pour que le jeton de l'ouverture n'arrive qu'APRÈS la séquence de folds en début de
 // main plutôt que de partir exactement au même instant (voir le calcul de foldBurstEndMs dans TableViz).
 const chip = `<g style="transform-box:fill-box;transform-origin:center;animation:${name} 420ms cubic-bezier(.25,.7,.3,1) ${delayMs||0}ms both;">${pileSvg}</g>`;
 return style+chip;
 }

 // ---- collectToPot ---------------------------------------------------
 // LOT 4 — jusqu'ici, les jetons d'une street qui se termine disparaissaient sèchement d'un render à
 // l'autre (la street suivante démarre avec seenBets vidé, cf. betFlight) : rien ne montrait le
 // ramassage. Appelée PENDANT la pause de transition existante (state._forcePotPulse, cf.
 // choosePostflop) — donc pendant que la pile est encore affichée à sa place normale — pour la faire
 // glisser vers le pot et s'effacer, juste avant que le render suivant ne la fasse disparaître pour de
 // bon. Aucun dédoublonnage nécessaire ici (contrairement à betFlight/playerFold) : forcePotPulse ne
 // reste vrai que le temps d'un seul render par transition, l'appelant ne peut donc pas la redéclencher
 // par erreur sur un simple rerender.
 function collectToPot(fromX, fromY, toX, toY){
 const id = nextId();
 const dx = (toX-fromX).toFixed(1), dy = (toY-fromY).toFixed(1);
 const name = `collect${id}`;
 const style = `<style>@keyframes ${name}{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(${dx}px,${dy}px) scale(.4);opacity:0}}</style>`;
 return { style, animName: name };
 }

 // ---- playerFold -------------------------------------------------------
 // Un siège folded le reste sur tous les renders suivants de la main (les
 // autres joueurs continuent d'agir, le pot change...) : sans ce suivi,
 // l'animation rejouerait à chaque render d'un siège déjà couché. On ne
 // renvoie `true` que la toute première fois qu'une position bascule à
 // isFolded=true (transition ACTIVE→FOLDED réelle) pour cette main. Le
 // markup (fondu du siège, repli des cartes, apparition du texte "fold")
 // reste composé dans TableViz, qui construit déjà le reste du siège
 // (couleurs, jauge, textes) — seule la DÉCISION "est-ce nouveau ?" est
 // centralisée ici, avec un id de keyframe partagé via nextId().
 function playerFold(hole, pos, isFolded){
 syncHand(hole);
 const wasFolded = !!seenFolds[pos];
 if(isFolded) seenFolds[pos] = true;
 return isFolded && !wasFolded;
 }
 // Lecture SEULE (aucune écriture dans seenFolds) : permet à l'appelant de savoir COMBIEN de sièges
 // vont être déclarés "nouvellement foldés" sur ce render AVANT de les traiter un par un (nécessaire
 // pour échelonner leurs animations — cf. LOT 1 #5 — puisque playerFold() lui-même consomme l'état dès
 // le premier appel et ne peut donc pas servir deux fois pour le même siège sur le même render).
 function previewFold(pos){ return !seenFolds[pos]; }

 // ---- potIncrease --------------------------------------------------------
 // Compare à la dernière valeur de pot vue POUR CETTE MAIN (remise à zéro au
 // changement de main) : ne déclenche que sur une VRAIE hausse, jamais à
 // chaque render affichant la même valeur. Ne modifie jamais potValue.
 function potIncrease(hole, potValue){
 syncHand(hole);
 const increased = lastPot!=null && potValue>lastPot;
 lastPot = potValue;
 return increased ? nextId() : null;
 }
 // Déclenchement manuel du même pulse, sans condition sur la valeur — utilisé UNIQUEMENT pour le
 // petit "impact" du pot au moment où les mises d'une street sont ramassées avant de passer à la
 // suivante (cf. Turn/River dans choosePostflop), où il n'y a pas forcément de hausse de potValue
 // à cet instant précis (le montant a déjà été intégré pendant la street qui se termine).
 // BUG CORRIGÉ (LOT 1 #7) : quand ce déclenchement manuel était utilisé, `potIncrease()` n'était jamais
 // appelé du tout sur ce render (cf. appelant, ligne du potPulseId) — `lastPot` restait donc à sa
 // valeur d'AVANT ce render. Au render SUIVANT (forcePotPulse retombé à false), potIncrease() comparait
 // alors potValue à ce `lastPot` périmé et le trouvait "augmenté" une seconde fois, même si potValue
 // n'avait pas vraiment bougé depuis le pulse manuel — d'où le double pulse. `pulse()` ne met donc plus
 // à jour `lastPot` lui-même : c'est à l'appelant de continuer à appeler potIncrease() dans tous les
 // cas pour que `lastPot` reste synchronisé, et de ne choisir que l'ID renvoyé (forcé ou naturel).
 function pulse(){ return nextId(); }

 return {
 dealHeroCards,
 dealFlop: dealBoard, dealTurn: dealBoard, dealRiver: dealBoard,
 // CODE MORT SUPPRIMÉ (audit) — playerCall/playerRaise étaient deux noms publics supplémentaires pour
 // EXACTEMENT la même fonction que playerBet (betFlight) — jamais appelés : tout le fichier utilise
 // TableFX.playerBet(...), y compris pour un call ou une relance, jamais TableFX.playerCall/playerRaise.
 playerBet: betFlight,
 playerFold,
 previewFold,
 potIncrease,
 pulse,
 collectToPot,
 chipCountFor,
 nextId,
 // BUG CORRIGÉ (LOT 1 #8) : le lien "tests" de la sidebar (runPokerTests) appelle TableViz() avec des
 // spots construits à la main pour valider le rendu de la table — ça consomme et modifie le MÊME état
 // interne partagé (holeRef, dealtHero, seenBets, seenFolds, lastPot...) que la vraie partie en cours.
 // Lancé en pleine main réelle, ça fait croire à TableFX qu'une "nouvelle main" (les hole cards des
 // spots de test) vient d'arriver, et rejoue un deal de cartes + des folds sur la table réelle au
 // prochain render. `withIsolatedState` sauvegarde l'état actuel, laisse le callback (les tests)
 // manipuler TableFX librement dans un état vierge, puis restaure l'état d'avant — la partie en cours
 // ne voit jamais passer l'état des tests.
 withIsolatedState(fn){
 const snapshot = { holeRef, dealtHero, knownBoardCount, betStreetKey, seenBets:{...seenBets}, seenFolds:{...seenFolds}, lastPot, seq };
 holeRef = null; dealtHero = false; knownBoardCount = 0; betStreetKey = null; seenBets = {}; seenFolds = {}; lastPot = null;
 try{
 return fn();
 } finally {
 holeRef = snapshot.holeRef; dealtHero = snapshot.dealtHero; knownBoardCount = snapshot.knownBoardCount;
 betStreetKey = snapshot.betStreetKey; seenBets = snapshot.seenBets; seenFolds = snapshot.seenFolds;
 lastPot = snapshot.lastPot; seq = snapshot.seq;
 }
 },
 };
})();
// Table dynamique façon GTOWizard : vos cartes sont directement à votre siège, le board au centre,
// et chaque action (fold/mise/relance) s'affiche à même la table — plus de liste texte à lire en dessous.
function TableViz(spot, tableSize, postflopCtx, board, liveState, pendingRaise, forcePotPulse, heroPendingAmt, potPushWinner){
 board = board || [];
 const isPostflop = board.length>0;
 const streetKey = board.length; // 0=préflop, 3/4/5=flop/turn/river — clé de remise à zéro des jetons de mise déjà vus (cf. shouldAnimateBet)
 const order = tableSize===6 ? SIX_MAX : NINE_MAX;
 const n = order.length;
 const heroIdx = order.indexOf(spot.heroPosition);
 if(heroIdx===-1) return '';
 // BUG CORRIGÉ (signalé par un utilisateur, capture d'écran à l'appui) : les positions APRÈS le héros
 // (ex. SB/BB quand le héros est CO) n'étaient jamais marquées "fold" tant qu'on restait au préflop,
 // même quand le héros est visiblement sur sa DEUXIÈME décision (il fait face à une relance/4-bet) —
 // ce qui ne peut arriver que si tout le monde entre les deux a déjà agi (et donc forcément couché,
 // puisque l'action est revenue au héros). Résultat : SB/BB restaient affichés avec leurs cartes
 // visibles et sans aucune mention "fold", comme s'ils étaient encore en train de réfléchir. La règle
 // "ne pas fold trop tôt" ne s'applique qu'à la état TOUTE PREMIÈRE décision du héros (villainPosition
 // encore à '—', personne n'a encore ouvert) — dès que le héros fait face à quelqu'un (villainPosition
 // fixé) ou répond à une relance, tout ce qui n'est ni lui ni l'adversaire courant est forcément couché.
 // BUG CORRIGÉ (LOT 1 #6) : `spot.villainPosition!=='—'` était vrai dès la TOUTE PREMIÈRE décision du
 // héros face à un simple open (HJ face à un open UTG, par ex.) — pas seulement face à une relance sur
 // sa propre mise. Ça marquait CO/BTN/SB/BB couchés dès le premier rendu, alors qu'ils n'ont pas encore
 // eu la parole (et simulateBlindSqueeze peut très bien les faire relancer ensuite). Le bon signal pour
 // "le héros est sur sa DEUXIÈME décision" (celle où tout le monde entre-temps est forcément déjà
 // couché) est : le héros a-t-il DÉJÀ une action enregistrée dans spot.actions ? Ça n'arrive que via
 // revealFollowupOutcome() (spot suivi scripté) ou respondToPreflopRaise() (relance sur sa propre mise),
 // jamais lors de la toute première décision.
 const heroAlreadyActedPreflop = (spot.actions||[]).some(a => a.pos===spot.heroPosition);
 const assumeRestFold = isPostflop || heroAlreadyActedPreflop || !!pendingRaise;
 const log = buildActionLog(spot, tableSize, assumeRestFold);
 const stateByPos = {};
 (log||[]).forEach(step => { stateByPos[step.pos] = step; });
 // JETONS D'UN JOUEUR QUI A MISÉ PUIS FOLDÉ (ex. CO open 2.3bb, subit un 4-bet, CO fold : `spot.actions`
 // contient alors DEUX entrées pour CO, {action:'open',amount:2.3} PUIS {action:'fold'}) — stateByPos
 // ci-dessus ne garde que la DERNIÈRE (donc juste "fold", sans montant), ce qui faisait disparaître son
 // jeton dès qu'il passait folded. `log` (l'array complet, pas le dédoublonné) garde les deux entrées
 // dans l'ordre : on retrouve ici, par position, le dernier montant RÉELLEMENT engagé (dernière entrée
 // avec un `amount`, qu'une entrée fold sans montant la suive ou non) — utilisé plus bas pour continuer
 // à afficher son jeton après le fold, comme sur une vraie table (l'argent déjà au milieu n'est pas repris).
 const lastAmountByPos = {};

function chooseOpenSize(sz){

const TIER_META = {

 error: { icon:'✕', cls:'bad', tag:'ERREUR', score:0.15, color:'#e6a093' },

function preflopTier(spot, selected){

 // confirmé, ne plus compter comme une erreur si fold" : les 49 spots "pattern-generated" (voir
 // buildEndHandCoachingHtml plus bas) forcent volontairement une main hors de toute range réelle
 // (ex. 93o en BB vs open UTG) pour amener un board précis à étudier au postflop — ce n'est jamais
 // une vraie main à jouer. Un fold y est désormais TOUJOURS noté comme le bon choix, jamais une
 // erreur, même si la fiche demande techniquement CALL/OPEN pour dérouler sa leçon postflop.
 if(spot.source==='pattern-generated' && selected==='FOLD') return 'optimal';
 if(selected === spot.preflop.action) return 'optimal';

 if(mix){

// ADJACENT à la recommandation (ex. BET 25% au lieu de BET 33%) est une variation de sizing acceptable, pas
// une erreur — direction opposée (CHECK/FOLD vs BET, ou l'inverse) reste tranchée en JUSTE/ERREUR.

// ============================================================

function buildEndHandAnalysis(spot, s){
  const graded=(s.handLog||[]).filter(i=>i.tier);
  if(!graded.length) return {mistakes:[],mixes:[],strengths:[],timeline:[],focus:null,situation:''};
  const mistakes=graded.filter(i=>isMistakeTier(i.tier));
  const mixes=graded.filter(i=>i.tier==='acceptable');
  const strengths=graded.filter(i=>i.tier==='optimal'||i.tier==='good');
  const phaseOrder=['Préflop','FLOP','TURN','RIVER'];
  const timeline=phaseOrder.map(phase=>graded.find(i=>i.phase===phase)).filter(Boolean);
  // On choisit la première erreur importante dans l'ordre de la main.
  // Si aucune erreur n'existe, on met en avant un mix à affiner, puis un vrai point fort.
  const focus=mistakes[0]||mixes[0]||strengths[0]||null;
  const situationParts=[];
  if(spot.heroPosition) situationParts.push(spot.heroPosition);
  if(spot.villainPosition && spot.villainPosition!=='—') situationParts.push(`vs ${spot.villainPosition}`);
  if(spot.effectiveStack!=null) situationParts.push(`${spot.effectiveStack} BB`);
  return {mistakes,mixes,strengths,timeline,focus,situation:situationParts.join(' · ')};

function coachingVerdict(item, spot){
  if(!item) return {icon:'•',tag:'',cls:'neutral'};
  const label=String(item.label||'').toLowerCase();
  if(item.tier==='optimal'){
    const trivialFold=item.phase==='Préflop' && label.includes('se coucher') &&
      ['Open first in','Facing 3-bet','Facing 4-bet','Flat / 3-bet'].includes(spot.category||'');
    const automaticCheck=item.phase!=='Préflop' && label.includes('check') && !label.includes('raise');
    if(trivialFold || automaticCheck) return {icon:'⚪',tag:'STANDARD',cls:'neutral'};
    return {icon:'🟢',tag:'BON CHOIX',cls:'ok'};
  }
  if(item.tier==='good') return {icon:'🟢',tag:'TRÈS BON',cls:'ok'};
  if(item.tier==='acceptable') return {icon:'🟡',tag:'À AFFINER',cls:'mix'};
  if(item.tier==='bigerror') return {icon:'🔴',tag:'GROSSE ERREUR',cls:'bad'};

function recommendedActionForItem(item){

    if(actionCode==='CALL') return `Tu es en BB face à un open de ${opener} : ${hero} fait partie de ta défense. Tu peux suivre ici.`;
    if(actionCode==='FOLD') return `Tu es en BB face à un open de ${opener} : ${hero} est trop faible pour défendre ici. Tu dois te coucher.`;
    if(actionCode==='3BET') return `Tu es en BB face à un open de ${opener} : ${hero} se défend mieux en 3-bet qu’en simple call ici.`;
    if(action) return `Tu es en BB face à un open de ${opener}. La décision préflop recommandée est ${action}.`;
  }
  if(spot.category==='Facing 3-bet'){
    return `Tu as ouvert puis reçu une 3-bet : ici, la décision porte sur la façon dont ${hero} réagit à cette relance, pas sur le flop à venir. La ligne recommandée est ${action||'celle indiquée'}.`;
  }
  if(spot.category==='Facing 4-bet'){
    return `Tu as reçu une 4-bet : ${hero} doit être évaluée contre cette relance préflop. La ligne recommandée est ${action||'celle indiquée'}.`;
  }
  if(spot.category==='Flat / 3-bet'){
    if(flatOr3betIsGenuineMix(spot)){
      return `Face à l’open adverse, la décision préflop est de choisir entre défendre en call et 3-bet avec ${hero}. Ici, la ligne recommandée est ${action||'celle indiquée'}.`;
    }
    if(actionCode==='CALL') return `Face à l’open adverse, ${hero} défend en simple call ici : le 3-bet n’apporte pas assez de valeur ou de fold equity pour justifier de sur-relancer cette main.`;
    if(actionCode==='3BET') return `Face à l’open adverse, ${hero} joue en 3-bet ici plutôt qu’en simple call : cette main gagne plus à mettre l’adversaire sous pression qu’à seulement suivre.`;
    if(actionCode==='FOLD') return `Face à l’open adverse, ${hero} n’est pas assez forte pour continuer : la ligne recommandée est de se coucher.`;
    if(action) return `Face à l’open adverse, la ligne recommandée avec ${hero} est ${action}.`;
  }
  if(action) return `La décision se joue d’abord sur l’action préflop et ta range. Ici, la ligne recommandée est ${action}.`;
  return '';
}

function coachingConcept(item, spot){
  const text=String((item&&item.explanation)||'').toLowerCase();
  if(item && item.phase==='Préflop'){
    if(spot.category==='Open first in') return 'Range d’open';
    if(spot.category==='BB defend') return 'Défense de blindes';
    if(spot.category==='Facing 3-bet') return 'Réponse à une 3-bet';
    if(spot.category==='Facing 4-bet') return 'Réponse à une 4-bet';
    if(spot.category==='Flat / 3-bet') return flatOr3betIsGenuineMix(spot) ? 'Call ou 3-bet' : 'Défense contre un open';
    if(text.includes('position')) return 'Position';
    return 'Décision préflop';
  }
  // BUG CORRIGÉ (retour d'usage) : .includes('value') matchait à tort des mots français comme
  // "évaluer" (qui contient "valuer" -> "value"), taguant des spots de lecture de board comme
  // "Value" sans rapport. Mots entiers uniquement, via \b (fonctionne car les lettres accentuées
  // comme é/è ne sont pas \w, donc une frontière de mot existe bien avant "valuer" dans "évaluer" —
  // mais pas après, ce qui bloque le faux positif).
  const hasWord = w => new RegExp('\\b'+w+'\\b').test(text);
  if(hasWord('range')) return 'Avantage de range';
  if(hasWord('tirage') || hasWord('draw')) return 'Équité et tirages';
  if(hasWord('value')) return 'Value';
  if(hasWord('bluff')) return 'Bluff';
  if(hasWord('board') || hasWord('texture')) return 'Lecture du board';
  if(item && item.phase==='RIVER') return 'Décision river';
  if(item && item.phase==='TURN') return 'Adaptation turn';
  return 'Décision postflop';
}
function conciseExplanation(text){
  let t=String(text||'').trim();
  // BUG CORRIGÉ (retour d'usage — la décision affichée deux fois, dans deux formats différents, juste
  // l'une sous l'autre) : ce texte est toujours affiché sous un titre/badge qui montre déjà phase +
  // verdict + action recommandée — la ligne "DÉCISION : ..." de tête ne fait que répéter ça, parfois
  // avec une taille de mise différente si un profil adverse a changé l'action entre-temps.
  t=stripDecisionPrefix(t);
  // Évite les phrases qui décrivent le moteur plutôt que le poker.
  t=t.replace(/Décision issue de données réellement solvées[^:]*:\s*/i,'');
  t=t.replace(/Le jeu de données ne fournit[^.]*\.?\s*/i,'');
  t=t.replace(/selon le solveur/gi,'');
  t=t.replace(/PokerBench[^:]*\.?\s*/gi,'');
  t=t.replace(/traité ici comme une référence forte[^.]*\.?/gi,'');
  // BUG CORRIGÉ : ceci collapsait AUSSI les doubles retours à la ligne entre "Pourquoi ?" et
  // "POINT À RETENIR" (mis en place spécifiquement pour aérer ce texte, cf. formatPedagogicalReason)
  // en un simple espace — tout retombait en un seul bloc de prose continu malgré le CSS pre-line prévu
  // pour les afficher comme des paragraphes distincts. On ne compacte plus que les espaces/tabulations
  // répétés, jamais les retours à la ligne intentionnels.
  t=t.replace(/[ \t]{2,}/g,' ');
  t=t.replace(/\n{3,}/g,'\n\n');
  t=t.trim();
  return t;
}
function coachActionLabel(action){
  const raw=String(action||'').trim();
  if(!raw) return '';
  const key=raw.toUpperCase().replace(/\s+/g,'');
  const map={
    'FOLD':'Se coucher','CHECK':'Checker','CALL':'Suivre','OPEN':'Ouvrir','LIMP':'Limp',
    'SHOVE':'Tapis','ALLIN':'Tapis','3BET':'3-bet','4BET':'4-bet','5BET':'5-bet'
  };
  if(map[key]) return map[key];
  let m=raw.match(/^bet\s*(\d+(?:\.\d+)?)%?$/i);
  if(m){
    const n=Number(m[1]);
    if(typeof sizingVocabLabel==='function') return 'Miser '+sizingVocabLabel(n);
    return 'Miser '+n+'% du pot';
  }
  return raw.replace(/\bBET\s+([1-9]\d*)%?\b/gi,(m,n)=>coachActionLabel('BET'+n));
}

function coachText(text){
  return String(text||'').replace(/\bbet\s*([1-9]\d*)\b/gi,(m,n)=>coachActionLabel('BET'+n));
}

function buildEndHandCoachingHtml(spot, s){
  const a=buildEndHandAnalysis(spot,s);
  if(!a.timeline.length) return '';
  const mistakes=[...a.mistakes].sort((x,y)=>{
    const rank={bigerror:0,error:1,acceptable:2,good:3,optimal:4};
    return (rank[x.tier]??9)-(rank[y.tier]??9);
  });
  const mixes=a.mixes;
  // Une erreur préflop de type open first-in doit toujours passer avant une erreur postflop :
  // c'est la décision qui a déterminé si le coup devait même être joué.
  const preflopOpenMistake=mistakes.find(i=>openRangeMistake(spot,i));
  const focus=preflopOpenMistake||mistakes[0]||mixes[0]||null;
  const openMistake=!!preflopOpenMistake;

  let mainLesson='';
  if(openMistake){
    mainLesson=`<div class="coach-main coach-main-error">
      <div class="coach-main-title">Leçon principale</div>
      <div class="coach-main-text"><b>Révise tes ranges d’open !</b> ${esc(spot.handClass)} est dans la range d’open de ${esc(spot.heroPosition)} à ${esc(String(spot.effectiveStack))} BB. Personne n’a parlé avant toi : ici, tu dois ouvrir. Le fold est l’erreur à corriger.</div>
    </div>`;
  }else if(focus){
    const action=recommendedActionForItem(focus);
    let explanation=conciseExplanation(focus.explanation||'');
    // Les templates génériques ne doivent jamais masquer la vraie raison de la décision.
    if(focus.phase==='Préflop'){
      explanation=preflopCoachingExplanation(focus,spot)||explanation;
    }else if(/^Décision préflop standard pour ce contexte/i.test(explanation)){
      explanation='';
    }
    const concept=coachingConcept(focus,spot);
    const verdict=coachingVerdict(focus,spot);
    // BUG CORRIGÉ (retour d'usage : "Flop — ERREUR → Miser 75% pot. ... c'est quoi miser 75%, c'est la
    // réponse ? C'est mon erreur ?") : cette ligne n'affichait QUE la ligne recommandée, jamais ce que
    // le joueur avait réellement joué — impossible de savoir si "Miser 75% pot" décrivait l'erreur ou
    // la bonne réponse. Les deux sont maintenant explicitement nommés et distingués.
    const playedLabel = focus.label || null;
    const headerLine = (playedLabel && action && playedLabel.toLowerCase()!==action.toLowerCase())
      ? `Vous avez joué <b>${esc(playedLabel)}</b>, la ligne recommandée est <b>${esc(action)}</b>.`
      : (action ? `La ligne recommandée est <b>${esc(action)}</b>.` : '');
    mainLesson=`<div class="coach-main coach-main-error">
      <div class="coach-main-title">Leçon principale</div>
      <div class="coach-main-text"><b>${esc(phaseLabel(focus.phase))} — ${esc(verdict.tag)}</b>. ${headerLine} ${esc(explanation || 'Cette décision mérite d’être retravaillée.')}</div>
      <div class="coach-main-concept">À travailler : <b>${esc(concept)}</b></div>
    </div>`;
  }else{
    // BUG CORRIGÉ (audit) : la classe appliquée était "coach-ok", mais la règle CSS définie est
 // ".coach-main-ok" (voir <style>) — sans ce "-main-", aucune règle CSS ne correspondait, et cet encart
 // "aucune erreur importante" retombait sur le style nu de .coach-main, sans jamais recevoir la mise en
 // forme "positive" (bordure/fond distincts) prévue pour ce cas, contrairement à coach-main-error.
 mainLesson=`<div class="coach-main coach-main-ok">
      <div class="coach-main-title">Leçon principale</div>
      <div class="coach-main-text">Aucune erreur importante. Garde surtout en tête les décisions qui étaient réellement proches ; les folds automatiques ne demandent pas de mémorisation supplémentaire.</div>
    </div>`;
  }

  const otherMistakes=mistakes.filter(i=>i!==focus).slice(0,2);
  const otherHtml=otherMistakes.length ? `<div class="coach-section">
    <div class="coach-section-title">Autres points à corriger</div>
    ${otherMistakes.map(item=>{
      const v=coachingVerdict(item,spot); const act=recommendedActionForItem(item); let exp=conciseExplanation(item.explanation||''); if(item.phase==='Préflop') exp=preflopCoachingExplanation(item,spot)||exp;
      return `<div class="coach-item"><div class="coach-item-head"><span>${esc(phaseLabel(item.phase))}</span><span class="coach-tag ${v.cls}">${v.icon} ${v.tag}</span></div><div class="coach-item-label">${esc(item.label||'Décision')}</div><div class="coach-item-text">${esc(exp)}${act?` <b>À faire : ${esc(act)}.</b>`:''}</div></div>`;
    }).join('')}
  </div>` : '';

  const mixHtml=mixes.length && !mistakes.length ? `<div class="coach-section coach-mix-section">
    <div class="coach-section-title">À affiner</div>
    ${mixes.slice(0,2).map(item=>{
      let exp=conciseExplanation(item.explanation||''); if(item.phase==='Préflop') exp=preflopCoachingExplanation(item,spot)||exp; const act=recommendedActionForItem(item);
      return `<div class="coach-item"><div class="coach-item-head"><span>${esc(phaseLabel(item.phase))}</span><span class="coach-tag mix">🟡 À AFFINER</span></div><div class="coach-item-label">${esc(item.label||'Décision')}</div><div class="coach-item-text">${esc(exp)}${act?` <b>Référence : ${esc(act)}.</b>`:''}</div></div>`;
    }).join('')}
  </div>` : '';

  const timelineHtml=a.timeline.map(item=>{
    const v=coachingVerdict(item,spot);
    const act=recommendedActionForItem(item);
    let exp=conciseExplanation(item.explanation||'');
    if(item.phase==='Préflop'){
      exp=preflopCoachingExplanation(item,spot)||exp;
    }
    const correction=(isMistakeTier(item.tier) && act && String(item.label||'').toLowerCase()!==act.toLowerCase()) ? ` <span class="coach-correction">À faire : ${esc(act)}</span>` : '';
    return `<div class="coach-timeline-row"><div class="coach-timeline-phase">${esc(phaseLabel(item.phase))}</div><div class="coach-timeline-verdict ${v.cls}">${v.icon}</div><div><div class="coach-timeline-label">${esc(item.label||'—')} <span class="coach-small-tag ${v.cls}">${v.tag}</span></div><div class="coach-timeline-text">${esc(exp)}${correction}</div></div></div>`;
  }).join('');

  const counts={
    error:mistakes.filter(i=>isMistakeTier(i.tier)).length,
    mix:mixes.length,
    standard:a.timeline.filter(i=>coachingVerdict(i,spot).tag==='STANDARD').length,
    good:a.timeline.filter(i=>['BON CHOIX','TRÈS BON'].includes(coachingVerdict(i,spot).tag)).length
  };
  const recapParts=[];
  if(counts.error) recapParts.push(`${counts.error} erreur${counts.error>1?'s':''}`);
  if(counts.mix) recapParts.push(`${counts.mix} à affiner`);
  if(counts.good) recapParts.push(`${counts.good} bon${counts.good>1?'s':''} choix`);
  if(counts.standard) recapParts.push(`${counts.standard} standard${counts.standard>1?'s':''}`);
  const recap=recapParts.join(' · ') || 'Aucune décision notée';

  // BUG CORRIGÉ (retour d'usage — "on me copie-colle ce qu'on me dit dans l'analyse préflop, alors que
  // l'action c'est fini préflop") : quand la main s'arrête après une seule décision (ex. fold préflop),
  // le détail "street par street" ne contenait qu'UNE ligne, quasi identique à la leçon principale
  // juste au-dessus — un bloc entier pour répéter la même phrase. On ne l'affiche plus que s'il y a
  // vraiment plusieurs décisions à détailler.
  return `<div class="coach-analysis">
    <div class="coach-header"><div><div class="coach-kicker">Analyse de la main</div><div class="coach-recap">${esc(recap)}</div></div>${a.situation?`<div class="coach-situation">${esc(a.situation)}</div>`:''}</div>
    ${mainLesson}
    ${otherHtml}
    ${mixHtml}
    ${a.timeline.length>1 ? `<details class="coach-details"><summary>Voir le détail street par street</summary><div class="coach-timeline">${timelineHtml}</div></details>` : ''}
  </div>`;
}

function HandSummaryScreen(spot, s){

 const anyoneFolded = s.selected==='FOLD' || s.preflopOutcome==='fold'

 || s.postflopOutcome==='fold'
 || (s.facingSurprise && s.facingSurprise.response==='FOLD');

 const vh = ensureVillainHandRevealed(spot, board, aggro);

 </div>`;

 const items = s.handLog.map(item => {
 if(!item.tier){
 return `<div class="hand-summary-item">
 <div class="hs-top"><span class="hs-phase">${esc(item.phase)}</span><span class="hs-tag neutral">Complication</span></div>
 <p class="hs-label">${esc(item.label)}</p>
 <p class="hs-text">${esc(item.explanation||'')}</p>
 </div>`;
 }
 const meta = TIER_META[item.tier] || TIER_META.error;
 const v = coachingVerdict(item, spot);
 const act = recommendedActionForItem(item);
 let exp = conciseExplanation(item.explanation||'');
 if(item.phase==='Préflop') exp=preflopCoachingExplanation(item,spot)||exp;
 return `<div class="hand-summary-item">
 <div class="hs-top"><span class="hs-phase">${esc(item.phase)}</span><span class="hs-tag ${v.cls}">${v.icon} ${v.tag}</span></div>
 <p class="hs-label">Vous avez joué : ${esc(item.label)}</p>
 <p class="hs-text">${esc(exp)}${isMistakeTier(item.tier)&&act?` <b>À faire : ${esc(act)}.</b>`:''}</p>

 const rangeAnalyses = buildRangeBasedAnalysis(spot, s);

function bestStreakFromHistory(history){
 let best=0, cur=0;
 history.forEach(item => { if(item.correct){ cur++; best=Math.max(best,cur); } else cur=0; });
 return best;
}
function statsComputed(){
 const s = state;
 const history = s.history;
 const total = history.length;
 const correct = history.reduce((s,i)=>s+i.correct,0);
 const accuracy = total ? Math.round((correct/total)*100) : 0;
 const topCount = history.filter(i=>i.tier==='optimal' || i.tier==='good').length;
 const mixedCount = history.filter(i=>i.tier==='acceptable').length;
 const errorCount = history.filter(i=>isMistakeTier(i.tier)).length;
 const preflop = history.filter(i=>i.street==='Préflop');
 const postflop = history.filter(i=>i.street!=='Préflop');
 const streetList = ['Préflop','FLOP','TURN','RIVER'];
 const streetStats = streetList.map(street => {
 const items = history.filter(i=>i.street===street);
 const ok = items.reduce((s,i)=>s+i.correct,0);
 return { street, total:items.length, correct:ok, mistakes:items.length-ok, accuracy: items.length? Math.round((ok/items.length)*100) : null };
 });
 const positions = Array.from(new Set(history.map(i=>i.position)));
 const positionStats = (positions.length?positions:SIX_MAX).map(pos => {
 const items = history.filter(i=>i.position===pos);
 const ok = items.reduce((s,i)=>s+i.correct,0);
 return { position:pos, total:items.length, correct:ok, mistakes:items.length-ok, accuracy: items.length? Math.round((ok/items.length)*100) : null };
 });
 const categories = Array.from(new Set(history.map(i=>i.category)));
 const playedStreets = streetStats.filter(x=>x.total>0);
 const playedPositions = positionStats.filter(x=>x.total>0);
 const worstStreet = playedStreets.length ? playedStreets.reduce((a,b)=> b.accuracy<a.accuracy ? b : a) : null;
 const bestStreet = playedStreets.length ? playedStreets.reduce((a,b)=> b.accuracy>a.accuracy ? b : a) : null;
 const worstPosition = playedPositions.length ? playedPositions.reduce((a,b)=> b.accuracy<a.accuracy ? b : a) : null;
 const streak = bestStreakFromHistory(history);
 return { total, correct, accuracy, topCount, mixedCount, errorCount, preflop, postflop, streetStats, positionStats, categories, worstStreet, bestStreet, worstPosition, streak };
}

function timeAgoLabel(ts){
 const days = Math.floor((Date.now()-ts)/86400000);
 if(days<1) return 'aujourd\u2019hui';

}
function spotSignatureStats(history, item){
 const matches = history.filter(h => h.position===item.position && h.category===item.category);
 const errors = matches.filter(h=>isMistakeTier(h.tier));
 const lastError = errors.slice().sort((a,b)=>b.timestamp-a.timestamp)[0];
 return { total: matches.length, errors: errors.length, lastErrorAgo: lastError ? timeAgoLabel(lastError.timestamp) : null };
}

function renderCoteCalculator(){
 const { pot, bet } = state.coteCalc;
 const call = bet;
 const potFinal = pot + bet + call;
 const potAfterBet = pot + bet;
 const equity = potFinal>0 ? (call/potFinal)*100 : 0;
 const ratio = call>0 ? potAfterBet/call : 0;
 const ratioLabel = ratio ? `${ratio<10 ? (Math.round(ratio*10)/10) : Math.round(ratio)}:1` : '—';
 return `
 <div class="felt-card felt-grid">
 <div class="felt-head"><div class="felt-head-left"><span class="phase-dot" style="background:#d5a850"></span><span class="stat-label">Calculateur de cote (pot odds)</span></div><span class="cat">COTES</span></div>
 <div class="cote-calc">
 <div class="cote-field"><label>Pot avant la mise adverse (bb)</label><input type="number" min="0" step="0.5" id="coteCalcPot" value="${pot}"></div>
 <div class="cote-field"><label>Mise de l\u2019adversaire (bb)</label><input type="number" min="0" step="0.5" id="coteCalcBet" value="${bet}"></div>
 </div>
 <div class="cote-result">
 <div class="row"><span>Montant à payer (call)</span><b>${call.toFixed(1)} bb</b></div>
 <div class="row"><span>Pot final si tu payes</span><b>${potFinal.toFixed(1)} bb</b></div>
 <div class="row"><span>Cote directe (ratio pot : call)</span><b>${ratioLabel}</b></div>
 <div class="row"><span>Equity minimale nécessaire</span><b>${formatPercent(equity)}</b></div>
 </div>
 <div class="link-note">Ce seuil d\u2019equity indique le minimum pour que le call soit rentable sur cette seule street, en supposant plus aucune action derrière. Il ne remplace pas un vrai calcul d\u2019equity contre une range, ni la prise en compte des implied et reverse implied odds — le module Probabilités calcule tes outs, celui-ci calcule le prix demandé ; à toi de relier les deux.</div>
 </div>
 `;
}

 // Révélation RÉELLE (fin de main / tapis) : doit réutiliser EXACTEMENT la même main que le moteur avait

 const revealedAtEnd = ensureVillainHandRevealed(spot, boardRiver, 2);
 assert('ensureVillainHandRevealed (fin de main) : réutilise EXACTEMENT la main déjà distribuée par le moteur, pas une nouvelle', JSON.stringify(revealedAtEnd)===JSON.stringify(dealtByEngine));

 }

 {
 // --- BUG CORRIGÉ (audit) : la main de l'adversaire, distribuée dès le flop pour piloter le moteur de

 const c = (r,s) => ({rank:r, suit:s});
 let dup = 0;
 for(let i=0;i<150;i++){
 const spot = { id:'test-dup-'+i, heroPosition:'HJ', villainPosition:'BB', villainProfile:'reg', hole:[{rank:'J',suit:'♣'},{rank:'6',suit:'♠'}], runout:[c('T','♣'),c('7','♦'),c('2','♥'),c('9','♦'),c('T','♠')] };
 const dealt = ensureVillainHandForPlay(spot);

 if(boardKeys.includes(dealt[0].rank+dealt[0].suit) || boardKeys.includes(dealt[1].rank+dealt[1].suit)) dup++;

 assert('ensureVillainHandForPlay : jamais de carte en double avec le TURN/la RIVER déjà fixés dans spot.runout (150 tirages)', dup===0);
 }

 {

 spot._referenceLine.forEach(entry=>{
 if(entry.skipped) return;
 if(!entry.street || !entry.heroAction) lineShapeOk=false;
 if(entry.villainReaction){

 });
 }
 assert('generatePostflopSpot : spot.heroIsIP toujours cohérent avec spot._heroActsFirstPostflop (étape 3)', ipConsistent);
 assert('generatePostflopSpot : spot._referenceLine a une forme valide sur 80 tirages (étapes 6/9/11)', lineShapeOk);
 assert('generatePostflopSpot : spot._referenceLine contient bien de vraies réactions Villain (getVillainReaction réellement appelé pendant la construction)', sawVillainReaction);
 // La ligne de référence ne doit JAMAIS influencer le jeu réel : elle n'est lue nulle part ailleurs
 // dans le fichier que dans generatePostflopSpot/simulateReferenceLine elles-mêmes (vérifié par grep
 // lors de l'implémentation ; ce test vérifie seulement qu'elle existe et a un contenu exploitable).
 }

 {

 // pickOpenHandClass (plutôt que via generatePostflopSpot, qui ne donne qu'1/6 de tirages BTN et ajoute
 // du bruit d'échantillonnage inutile ici) pour une mesure stable sur un grand nombre de tirages.
 const isPairOrAx = hc => (hc.length===2 && hc[0]===hc[1]) || hc[0]==='A';
 let btnPairAx=0; const N=800;
 for(let i=0;i<N;i++){ if(isPairOrAx(pickOpenHandClass('BTN',6))) btnPairAx++; }
 assert('pickOpenHandClass(BTN) : paire+Ax reste sous 45% des tirages (large éventail, pas seulement paires/Ax)', btnPairAx/N < 0.45);

 for(let i=0;i<N;i++){ const pool=CHEN_RANKED_HANDS.slice(0,140); if(isPairOrAx(pool[Math.floor(Math.random()*pool.length)])) defPairAx++; }

 const distinctOverall = new Set();

}

 'heroBenefitsFromCard() unifiée sur classifyPostflopHand() : reconnaît maintenant qu\u2019une carte améliore réellement Hero même si elle n\u2019est pas dans sa main (ex. un set qui devient full parce que le board se paire sur un rang étranger à la main de Hero) — ne contredit plus jamais la classification de force réelle.',
 'Nouvelle fonction computeBoardTexture() : sépare la texture du board en catégories indépendantes qui se cumulent (paired, flushHeavy, straightHeavy, drawHeavy, dry) au lieu d\u2019un seul "wet" générique — préparation des informations de texture uniquement, le sizing sur board pairé déjà en cours ailleurs n\u2019a pas été touché.',
 'Bug corrigé (signalé) : une carte plus haute que tout le board n\u2019est plus automatiquement traitée comme une "scare card". Nouvelle fonction assessCardDanger() à 4 niveaux (aucun/léger/important/majeur) basés sur ce qui change réellement (couleur faite, quinte faite, board qui se paire, board qui se resserre) — computeDynamicStreetPost() utilise ce niveau réel au lieu de la simple présence d\u2019une note de describeNewCard().',
 '26 nouveaux tests ciblant précisément les incohérences possibles : classification sur K72 (dont le cas piège turn), unification heroBenefitsFromCard, textures indépendantes (KK2, 876 mono/rainbow, A72, AK7), scary cards (carte haute non-dangereuse, couleur/quinte réellement complétée, board pairé), et décisions (main très forte sur board sec/humide, main moyenne face à une vraie scare card, bluff avec tirage raté, bluff catcher). 210 tests au total.',
 ]},
 { version:'v4.4', items:[
 'Fonctionnalité demandée : la main probable de l\u2019adversaire s\u2019affiche maintenant DIRECTEMENT SUR LA TABLE dès l\u2019instant où la main part tapis — plus besoin d\u2019attendre le résumé de fin de main. Vérifié que ce n\u2019était pas nécessaire d\u2019attendre le flop/turn/river pour l\u2019attribuer : la main est révélée dès le tapis (souvent préflop), avant même que la première carte du board ne tombe, et reste la même tout le long du runout (mémorisée une seule fois).',
 'Nouvelle fonction partagée ensureVillainHandRevealed(), utilisée à la fois par la table en direct et par l\u2019écran de résumé — la même main révélée partout, jamais deux tirages différents pour la même main.',
 'Bug de test corrigé en le testant : mon propre test de cette fonctionnalité comparait le rang seul (">Q<") alors que la table affiche rang+couleur ensemble (">Q♠<") — trouvé et corrigé avant livraison, pas après.',
 '4 nouveaux tests. 184 tests au total.',
 ]},
 { version:'v4.3', items:[
 'Bug corrigé (signalé par un utilisateur, exemple à l\u2019appui) : "l\u2019analyse du flop n\u2019a aucun sens" — un template disait "checker reste tout aussi défendable" mais la réponse était notée OPTIMAL et CHECK aurait été noté comme une erreur. Cause trouvée en auditant TOUT le catalogue : 28 templates (dont 27 de mes propres lots générés) avaient une action à faible confiance (42-55%) sans champ.mix pour représenter équitablement l\u2019alternative. Les 28 sont corrigés — CHECK est maintenant noté "bon" sur ces spots, pas "erreur".',
 'Bug corrigé (signalé par un utilisateur) : "j\u2019ai l\u2019impression que 100% du temps la bonne réponse est 33% flop/turn et 50% river". Confirmé en auditant le code : toutes les branches "miser" de computeDynamicStreetPost (qui gère TURN/RIVER pour TOUS les templates) utilisaient le même 50% fixe, peu importe la force de la main ou l\u2019humidité du board. Nouvelle fonction pickBetSizeLabel() : une main très forte sur un board humide (tirage possible) mise gros (75%, protection) ; une main moyenne sur un board sec mise petit (25%, pot-control) — plus de variété réelle liée au contexte, pas un chiffre fixe.',
 '6 nouveaux tests : vérifient la variété de sizing sur des cas concrets, et l\u2019absence de tout autre template à faible confiance sans.mix dans le catalogue entier.',
 '180 tests au total.',
 ]},
 { version:'v4.2', items:[
 'Bug corrigé (signalé par un utilisateur) : sur une main TAPIS, l\u2019app sautait directement à la main suivante une fois la river atteinte — sans jamais passer par l\u2019écran de résumé. Ni l\u2019analyse ni la main adverse révélée (v4.0/v4.1) ne s\u2019affichaient JAMAIS après un tapis, alors que c\u2019est exactement le cas d\u2019usage demandé pour voir la main de l\u2019adversaire. Corrigé.',
 'Nouveau : bouton "Voir l\u2019analyse détaillée" séparé de "Main suivante", comme demandé. Le score et la main adverse révélée restent toujours visibles immédiatement ; le détail (mot du coach, nouvelles analyses de range, décision par décision) est maintenant derrière un simple clic optionnel.',
 'BIBLIOTHÈQUE D\u2019ANALYSES DE FIN DE MAIN (6 patterns) : va au-delà du "top paire top kicker, j\u2019ai fait payer 3 streets" pour dire QUAND c\u2019est risqué malgré la victoire (value bet répété sur un board qui favorise la range adverse), reconnaître les bonnes lectures (fold cohérent avec une range resserrée, call justifié par un profil agressif), comparer la main révélée à la lecture de range annoncée, et signaler un bluff sans équité réelle. 2-3 analyses sélectionnées et mélangées à chaque fin de main pour varier, jamais toujours les deux mêmes phrases.',
 'Bug de conception corrigé EN TESTANT (avant livraison) : le premier pattern écrit combinait deux conditions mutuellement exclusives (Hero agresseur + lecture de la range de Hero lui-même) et ne pouvait donc jamais se déclencher — récrit pour comparer le board à la range du CALLEUR plutôt qu\u2019à une lecture d\u2019agresseur qui n\u2019a pas de sens pour son propre camp.',
 '4 nouveaux tests sur les patterns d\u2019analyse. 173 tests au total.',
 ]},
 { version:'v4.1', items:[
 'Nouvelle fonctionnalité demandée : LECTURE DE RANGE DU COACH. Reproduit exactement l\u2019exemple donné : "3-bet UTG = AA/KK/AK, un board avec un As le touche particulièrement bien, méfiez-vous d\u2019un top paire/overpair moyen" — et l\u2019inverse ("river A + mise de l\u2019adversaire = cohérent avec sa main annoncée, attention"). Affiché avant la décision, uniquement quand la range identifiée est réellement resserrée (3-bet/4-bet depuis une position tôt avec un profil régulier/nit) — sinon le raccourci serait trop peu fiable pour être énoncé avec cette confiance.',
 'Bug corrigé au passage (trouvé en construisant cette fonctionnalité) : la main adverse révélée (v4.0) utilisait la même largeur de range pour un simple OPEN et pour un 3-BET/4-BET — un 3-bet UTG ressortait donc aussi large qu\u2019un open, ce qui est faux. Une relance resserre maintenant toujours la range (3-bet ≈ 35% de la range d\u2019ouverture, 4-bet ≈ 15%, 5-bet ≈ 8%), avant même l\u2019ajustement de profil.',
 'Test flaky corrigé (trouvé en testant cette fonctionnalité) : le test statistique sur la cohérence des barrels (v4.0) échouait occasionnellement par hasard sur un petit échantillon (60 tirages) — passé à 300 pour que la comparaison ne soit plus sensible au bruit. Revérifié stable sur plusieurs exécutions consécutives.',
 '6 nouveaux tests : identification correcte d\u2019une range resserrée vs large, cohérence du board avec/sans As, un profil agressif jamais lu comme resserré même en 3-bet UTG.',
 '169 tests au total.',
 ]},
 { version:'v4.0', items:[
 'Nouvelle fonctionnalité demandée : MAIN ADVERSAIRE RÉVÉLÉE en fin de coup (showdown/tapis, jamais quand quelqu\u2019un s\u2019est couché). Tirée de sa range d\u2019ouverture (réutilise OPEN_RANGES) ajustée par son PROFIL : Nit resserre, LAG élargit, Fish élargit ET mélange des mains hors norme (ex. JTo en UTG, explicitement demandé) — un fish ne joue pas une range structurée par position.',
 'Cohérence narrative demandée : la main révélée passe par un rejet-échantillonnage (même principe que generatePostflopSituation) qui exige une vraie main crédible quand l\u2019adversaire a misé/relancé sur au moins 2 streets — fini le "il barrelle 3 fois avec de l\u2019air" systématique. Une vraie part de bluff (18%) reste toujours possible : jamais un verdict "il ment forcément".',
 'Nouvelle fonction villainAggressionStreets() qui compte, depuis l\u2019historique réel de la main, combien de streets l\u2019adversaire a pris l\u2019initiative (bet/raise, pas juste call) — pas une estimation, un vrai décompte.',
 '9 nouveaux tests : ajustement de range par profil, mains hors norme du Fish, cohérence renforcée après plusieurs barrels (vérifiée statistiquement sur 60 tirages), aucune carte dupliquée.',
 '163 tests au total.',
 ]},
 { version:'v3.9', items:[
 'Nouvelle notion : AVANTAGE DE RANGE. classifyPostflopHand() répondait déjà à "qu\u2019est-ce que je tiens sur ce board", jamais à "qui, de l\u2019agresseur préflop ou du calleur/défenseur, a en moyenne la range la plus forte sur ce board" — le raisonnement à avoir AVANT même de regarder sa propre main. Nouvelle fonction classifyRangeAdvantage() (heuristique de texture : As/Roi sec favorise l\u2019agresseur ; board bas, paire ou connecté bas-moyen favorise le calleur ; les boards broadway connectés comme K♠Q♥J♦ restent favorables à l\u2019agresseur malgré la connectivité, contrairement aux connecteurs bas). Affichée avant la décision (purement descriptive de la texture, ne révèle jamais quoi faire).',
 'Nouvelle fonction preflopAggressorPosition() : suit le VRAI dernier relanceur de la main (utile après un 3-bet/4-bet où l\u2019agresseur change de camp), pas seulement spot.villainPosition.',
 '7 nouveaux tests vérifiés contre des textures de référence bien établies (As sec, board bas, board bas pairé, broadway connecté vs connecté bas-moyen).',
 '157 tests au total.',
 ]},
 { version:'v3.8', items:[
 'Bug corrigé (signalé par un utilisateur, capture d\u2019écran à l\u2019appui) : sur un spot où le héros fait face à une relance (ex. CO vs 4-bet de BTN), les positions restantes (ex. SB/BB) n\u2019étaient jamais marquées "fold" tant qu\u2019on restait au préflop — alors qu\u2019arriver à cette décision implique forcément qu\u2019elles se sont déjà couchées. Elles restaient donc affichées avec leurs cartes visibles et sans aucune indication, comme si elles réfléchissaient encore. Corrigé : dès que le héros fait face à un adversaire connu ou répond à une relance, tout le reste de la table est traité comme couché.',
 'Bug corrigé dans la même capture : les jetons SB et BB affichaient le texte "SB"/"BB" en plus du siège qui porte déjà ce nom — deux cercles superposés avec exactement le même texte, ce qui ressemblait à un doublon d\u2019affichage. Retirés (le jeton du bouton "B" reste, lui affiche une information différente du nom du siège).',
 '5 nouveaux tests reproduisant le spot exact de la capture d\u2019écran (Hero CO face au 4-bet de BTN, table 9-max), vérifiant avant/après les deux correctifs.',
 '150 tests au total.',
 ]},
 { version:'v3.7', items:[
 'Bug corrigé (vérification demandée par un utilisateur) : après avoir payé une RELANCE (pas juste un call simple), le jeton affiché devant Hero restait figé au montant de sa mise D\u2019AVANT la relance au lieu du montant réellement payé pour suivre. Vérifié en simulant une séquence complète bet → relance → call.',
 'Vérifié et confirmé correct par simulation complète (mise à 0 propre à chaque nouvelle street, aucune mise qui traîne d\u2019une street à l\u2019autre) — rien à corriger sur ce point précis, déjà en place.',
 'Retour d\u2019usage : "j\u2019ai enchaîné 5 mains poubelle, c\u2019était désagréable". Plafond DUR ajouté (pas juste une pondération plus faible) : une catégorie ne peut plus sortir plus de 2 fois de suite, une main-poubelle (junkExample) ne peut plus sortir juste après une autre — vérifié par simulation sur 150 tirages (aucune série de plus de 2 ni de 2 mains-poubelle consécutives). Poids de base des mains-poubelle réduit une nouvelle fois (0,3 → 0,15).',
 'Retour d\u2019usage : "utilise plus de mains à la limite du hors range plutôt que des 72o". 8 nouveaux templates "Open first in" à la frontière réelle de OPEN_RANGES (ex. K9o hors range UTG vs ATo dans la range, QJo dans la range BTN vs J9o hors range) pour équilibrer les mains-poubelle évidentes déjà présentes.',
 '244 templates au total, 145 tests, tous vérifiés par exécution complète du fichier avant livraison.',
 ]},
 { version:'v3.6', items:[
 'Bug corrigé (signalé par un utilisateur) : "après le 3-bet de BB, je ne vois ni sa mise ni celle de UTG sur la table". Cause : une relance/squeeze EN ATTENTE de réponse (avant de cliquer Call/Fold) n\u2019existe que dans state.facingPreflopRaise — jamais encore dans spot.actions, qui n\u2019est mis à jour qu\u2019une fois la réponse donnée. La table (TableViz) n\u2019avait donc aucun moyen de savoir qu\u2019un squeeze était en cours tant que le joueur n\u2019avait pas répondu : ni siège mis en évidence, ni jeton de mise pour le squeezeur, même si le texte à côté en parlait déjà.',
 'TableViz reçoit maintenant l\u2019état de la relance en attente et l\u2019affiche comme les autres jetons (siège mis en évidence en rouge, jeton avec le montant) — sans toucher à spot.actions lui-même, qui continue de n\u2019être mis à jour qu\u2019à la résolution.',
 'Nouveau processus de vérification : les corrections précédentes (v3.5.1) étaient revérifiées à la main dans des scripts séparés, ce qui avait produit une erreur de calcul dans un test. Cette fois, le correctif est vérifié en comparant le rendu réel AVEC et SANS le correctif sur le même spot, via la même exécution complète du fichier que celle qui tourne dans le navigateur.',
 '3 nouveaux tests. 142 tests au total, tous vérifiés en conditions réelles avant livraison.',
 ]},
 { version:'v3.5.1', items:[
 'Bug de test corrigé (signalé par un utilisateur au chargement : "1/139 test(s) en échec") : le test ajouté en v3.4 pour le squeeze à 3 joueurs avait une erreur d\u2019arithmétique dans sa propre valeur attendue (24,5 au lieu de 26,5 — HJ qui paie l\u2019open de UTG committe aussi 2, pas 0, donc 2+2=4 et non 2). La fonction computeCallPot() elle-même était déjà correcte ; seul le test se trompait. Corrigé et revérifié.',
 'Changement de méthode pour éviter de reproduire ce genre d\u2019erreur : les 139 tests internes sont maintenant exécutés pour de vrai dans un bac à sable Node (au lieu d\u2019être recalculés à la main un par un avant chaque livraison), donnant le même verdict que ce que l\u2019app affiche réellement au chargement.',
 ]},
 { version:'v3.5', items:[
 '2e lot de templates générés via POSTFLOP_PATTERNS : 29 de plus (48 au total, contre 19 avant), avec les poids concentrés sur les catégories les plus fréquentes de l\u2019audit (TOP_PAIR_TOP_KICKER, OVERPAIR, SET, FLUSH_DRAW, TWO_PAIR reçoivent 2-3 exemplaires) plutôt qu\u2019une répartition uniforme. Même pipeline testé (generatePostflopSituation + classifyPostflopHand), contextes préflop variés et différents du 1er lot.',
 '236 templates au total dans le catalogue.',
 ]},
 { version:'v3.4', items:[
 'Bug corrigé (signalé par un utilisateur, 2e round sur le même sujet) : "UTG open 2,3 / 3-bet à 7 / il 4-bet à 20 / je paie" affichait toujours un pot minuscule au flop au lieu de ~41-42 bb. Cause : respondToPreflopRaise() — le chemin utilisé quand le MÊME adversaire re-relance votre 3-bet/4-bet — n\u2019enregistrait ni votre propre relance ni ne recalculait jamais le pot, contrairement aux deux autres chemins déjà corrigés (goToPostflop, revealFollowupOutcome). C\u2019était le troisième et dernier endroit où une taille de relance choisie par le joueur ne se répercutait nulle part.',
 'Bug corrigé au passage dans le même chemin : le verbe de la relance adverse était toujours codé en dur "4bet", même quand Hero avait déjà lui-même 4-bet (l\u2019adversaire re-relance alors en 5-bet).',
 'computeCallPot() généralisée : elle sait maintenant compter l\u2019argent réellement engagé par un troisième joueur resté dans le coup (squeeze, multiway) via la nouvelle fonction sumOtherCommitted(), pas seulement les blindes mortes comme avant — un ouvreur qui se couche à une relance suivante laisse son argent dans le pot, ce qui n\u2019était pas compté.',
 'Nouveaux tests : le scénario exact signalé (pot = 41,5bb, pas ~6bb), et un cas de squeeze à 3 joueurs où l\u2019argent de l\u2019ouvreur et du calleur reste bien compté.',
 ]},
 { version:'v3.3', items:[
 'Intégration des 720 lignes postflop réelles de PokerBench, enfin faite. Résultat honnête : sur 17 lignes candidates sélectionnées, seules 4 templates ont survécu à la validation. 2 rejetées pour carte dupliquée (Hero aurait tenu une carte déjà sur le board — détecté, pas propagé). 10 rejetées parce qu\u2019elles répondaient à une relance déjà en cours (check-raise) — un cas que le schéma statique FLOP de cette app ne modélise pas volontairement (Check/Bet uniquement comme première décision de street, jamais Fold/Call/Raise face à une relance déjà là, cf. villainActsFirstNote qui documentait déjà cette simplification).',
 'Bug trouvé et corrigé PENDANT la conversion (avant intégration) : les décisions "Call"/"Raise X" de ces lignes complexes étaient silencieusement réétiquetées "Check" faute de correspondance avec le schéma — corrigé en rejetant la ligne plutôt qu\u2019en la mal étiqueter. Deuxième bug corrigé dans la même passe : les templates "hero est le 3-bettor" recevaient des options ne contenant pas 3BET (le bouton de leur propre décision aurait été absent).',
 '4 templates ajoutés (source `pokerbench-postflop`), avec un vrai board flop/décision solvés (QQ value bet 80% sur board sec, AKs petite mise sur board pairé, AKo value bet top paire top kicker, AJo check sur board raté).',
 ]},
 { version:'v3.2', items:[
 'ÉTAPES 6/7 (demandées) : nouvelle fonction getEffectiveRange(context), source unique pour "quelle range d\u2019ouverture à ce stack". Bug trouvé et corrigé : la Range Matrix lisait OPEN_RANGES brut (toujours la référence 100bb) alors que le moteur de décision (applyOpenTierRange) appliquait déjà un ajustement par palier de stack — les deux pouvaient afficher des ranges différentes pour le même spot. Les deux passent maintenant par la même fonction. OPEN_RANGES reste la référence de base, jamais supprimée.',
 'ÉTAPE 8 : familles de sizing nommées (SIZING_FAMILIES : PREFLOP_OPEN, SMALL/LARGE_3BET, FOUR_BET, FLOP_SMALL/MEDIUM/LARGE, TURN_SMALL/LARGE, RIVER_VALUE/BLUFF) — mêmes bornes qu\u2019avant, centralisées à un seul endroit plutôt que dupliquées en dur dans plusieurs fonctions.',
 'ÉTAPE 10 : l\u2019ajustement d\u2019ante ne vaut plus une constante +3 fixe — il diminue maintenant selon le nombre de joueurs déjà engagés dans le coup (une ante partagée entre plus de callers pèse proportionnellement moins), toujours une heuristique assumée.',
 'Nouveaux tests : 20bb/100bb produisent des ranges différentes pour la même position, la Range Matrix et le moteur restent cohérents, l\u2019ajustement d\u2019ante varie bien avec le nombre de callers.',
 ]},
 { version:'v3.1', items:[
 'ÉTAPES 4/5 (demandées) : bibliothèque POSTFLOP_PATTERNS (19 patterns : TOP_PAIR_TOP_KICKER, OVERPAIR, SET, FLUSH_DRAW, MISSED_FLUSH_DRAW, etc.) avec quotas relatifs, et generatePostflopSituation(pattern) qui distribue une vraie main depuis un paquet mélangé et RECOMMENCE tant que classifyPostflopHand() ne confirme pas l\u2019intention (jamais un étiquetage a posteriori).',
 'Découverte en creusant l\u2019architecture existante : le moteur savait déjà faire varier procéduralement flop/suits/main à l\u2019exécution (buildRuntimeFlop, chooseHole) — plutôt que de créer un second moteur de génération parallèle, POSTFLOP_PATTERNS sert d\u2019outil de sélection/validation en amont, et les 19 templates qui en sortent utilisent le même schéma que tous les autres (flop/flopAlt/handClass), rejouant la variété existante à chaque tirage.',
 '19 nouveaux templates (un par pattern défini), tracés avec `source:\'pattern-generated\'` et `pattern:\'...\'`. Contextes préflop choisis pour atteindre le flop de façon fiable (open first-in ou simple call — jamais un 3-bet dont l\u2019issue est simulée aléatoirement, ce qui gâcherait un board spécifiquement filtré).',
 'Nouveaux tests : chaque pattern produit une situation valide sans carte dupliquée, les 19 templates générés sont tous tracés et cohérents avec le catalogue existant.',
 ]},
 { version:'v3.0', items:[
 'ÉTAPE 1 (demandée) : le suivi des stacks ne divise plus la croissance du pot par deux ("grown/2") — nouvelle fonction computeStreetContributions() qui sépare heroAdd/fieldAdd. Résultat identique aux cas heads-up déjà supportés (bet/call, check-bet-call, bet-raise-call — mathématiquement équivalent), mais corrige le multiway : plusieurs adversaires actifs qui paient font maintenant grossir le pot plus qu\u2019un simple call à un seul, ce que l\u2019ancien calcul ne pouvait pas représenter.',
 'ÉTAPE 2/3 (demandées) : nouvelle fonction centrale classifyPostflopHand(hole, board, priorDraw) — réutilise les fonctions déjà existantes (hasFlush, hasStraight, hasTrips, hasFullHouseOrBetter, classifyStraightDraw) plutôt que de les dupliquer. Renvoie madeHand/draw/kicker/strength/drawStatus. Bug trouvé et corrigé en la testant : la détection de "tirage couleur maximale" (nut flush draw) excluait à tort l\u2019As dès que Hero le tenait lui-même.',
 'classifyPostflopHand() branchée dans computeDynamicStreetPost() (le moteur postflop) : une main très forte SOUTENUE depuis le flop (set, quinte, couleur, full, carré) est maintenant reconnue et valorisée même quand le flop était passif et qu\u2019une carte suivante fait peur sans rapport avec la main de Hero — avant, seule "la dernière carte a-t-elle aidé ?" comptait.',
 '~20 tests stratégiques ajoutés, correspondant exactement aux exemples donnés : KQ/K72=TOP_PAIR, QJ/K72≠TOP_PAIR, 77/K72=SET, K7/K72=TWO_PAIR, A♠5♠/K♠8♠2♦=tirage couleur maximale, OESD et gutshot valides, TOP_PAIR_TOP_KICKER vs TOP_PAIR_WEAK_KICKER, tirage complété/raté réellement vérifié (pas juste étiqueté), aucune carte dupliquée.',
 ]},
 { version:'v2.9', items:[
 '36 nouveaux templates préflop importés de PokerBench (huggingface.co/datasets/RZ412/PokerBench, licence Apache-2.0, papier AAAI 2025) — de vraies décisions calculées par solveur (100 BB, 6-max), pas une estimation heuristique. Chaque situation est étiquetée `source:\'pokerbench\'` et le dit explicitement dans son explication.',
 'Honnêteté préservée : ce jeu de données ne fournit qu\u2019une seule décision "optimale" par situation, pas une fréquence de mix complète — aucun de ces templates n\u2019invente de pourcentage de mix, contrairement aux templates écrits à la main qui en ont un quand c\u2019est pertinent.',
 'Nouveau test : présence d\u2019au moins 30 templates PokerBench, options toujours cohérentes avec la décision correcte, aucun champ.mix inventé, source toujours mentionnée dans le texte.',
 ]},
 { version:'v2.8.1', items:[
 'Bug corrigé (signalé par un utilisateur) : quand vous 3-bet ou 4-bet avec une taille personnalisée et que l\u2019adversaire paie, le pot affiché au flop ignorait complètement cette taille et restait figé à la valeur d\u2019origine du spot (ex. "UTG open 2,1bb, 3-bet à 7bb, il paie" affichait un pot de 6bb au lieu de 15,5bb). Le sizing choisi est maintenant réinjecté dans l\u2019historique d\u2019actions ET dans le pot avant de passer au flop, aussi bien pour les spots simples que pour les spots à followup scripté (où le même problème existait avec une valeur de pot figée par le template).',
 'Nouvelle fonction partagée computeCallPot(), testée sur 3 cas (dont le scénario exact signalé), pour éviter que les deux chemins de code dupliquent (et un jour désynchronisent) le même calcul.',
 ]},
 { version:'v2.8', items:[
 'Retour d\u2019usage corrigé : quand l\u2019adversaire mise après un check et que vous répondez fold/call, l\u2019analyse s\u2019arrêtait net sans jamais dire si votre main tenait réellement la texture qui venait de faire peur (ex. une 3e carte de couleur à la river). Ajout d\u2019une lecture de contexte (non notée, clairement étiquetée comme telle) qui réutilise le même calcul que la recommandation check/bet de la street : "vous n\u2019aviez vous-même aucune carte de la couleur" ou, à l\u2019inverse, "vous aviez vous-même la couleur/la quinte".',
 ]},
 { version:'v2.7', items:[
 'Point 9 (postflop contextuel) : la même carte "dangereuse" (couleur/quinte/paire au board) produit maintenant un verdict différent selon qu\u2019elle améliore vraiment la main de Hero ou non — avant, "board dangereux" menait toujours à un check, même quand cette carte donnait un brelan, une couleur ou une quinte à Hero lui-même. Nouvelle fonction heroBenefitsFromCard, vérifiée sur 4 cas calculés à la main.',
 'Point 13 (table/design) : audité, rien changé — la hiérarchie visuelle (cartes Hero > board > pot en évidence, infos secondaires réduites, rien listé sous la table) était déjà en place suite à des passes précédentes. Pas de modification à l\u2019aveugle sur le SVG sans pouvoir vérifier le rendu.',

 resetHand(pickSpotWithGenerator(state.table, undefined, state.difficulty, state.villainProfileMode));
 closePanel(); render();
 });
 document.getElementById('anteSeg').querySelectorAll('button').forEach(b => b.onclick = () => {
 state.anteMode = b.dataset.ante;
 storage.setItem('poker-ante-mode', state.anteMode);
 resetHand(pickSpotWithGenerator(state.table, undefined, state.difficulty, state.villainProfileMode));
 closePanel(); render();
 });

 resetHand(pickSpotWithGenerator(state.table, undefined, state.difficulty, state.villainProfileMode));
 closePanel(); render();
 });
 document.getElementById('stackModeGrid').querySelectorAll('button').forEach(b => b.onclick = () => {
 state.stackMode = b.dataset.stackMode;
 storage.setItem('poker-stack-mode', state.stackMode);
 resetHand(pickSpotWithGenerator(state.table, undefined, state.difficulty, state.villainProfileMode));
 closePanel(); render();
 });
 document.getElementById('difficultySelect').onchange = (e) => {

 };

document.addEventListener('keydown', (e) => {

 const key = e.key.toLowerCase();
 if(key!=='f' && key!=='c' && key!=='r') return;
 let btn = null;
 if(key==='f') btn = document.getElementById('fabFold') || document.querySelector('[data-preflop-action="FOLD"]') || document.querySelector('[data-post-action="FOLD"]');
 else if(key==='c') btn = document.getElementById('fabCall') || document.querySelector('[data-preflop-action="CALL"]') || document.querySelector('[data-post-action="CHECK"]') || document.querySelector('[data-post-action="CALL"]');
 else if(key==='r') btn = document.querySelector('[data-preflop-action="OPEN"]') || document.querySelector('[data-preflop-action="3BET"]') || document.querySelector('[data-preflop-action="4BET"]') || document.querySelector('[data-preflop-action="SHOVE"]') || document.querySelector('[data-post-action]:not([data-post-action="FOLD"]):not([data-post-action="CHECK"])');
 if(btn){ e.preventDefault(); btn.click(); }
});
// BUG CORRIGÉ (LOT 2 #16) : les 210 tests tournaient à CHAQUE ouverture de l'app, pour tout le monde
// (pas seulement en développement), et le bouton "tests" de la sidebar — qui expose des détails internes
// (noms de fonctions, cas testés) sans aucun intérêt pour l'utilisation normale du trainer — restait
// toujours visible. Les deux ne sont plus actifs que si l'URL contient explicitement `?test` (ex.
// `index.html?test`), un simple paramètre de requête, jamais activé par défaut.
const isTestMode = new URLSearchParams(location.search).has('test');
const devTestTriggerBtn = document.getElementById('devTestTrigger');
if(devTestTriggerBtn) devTestTriggerBtn.style.display = isTestMode ? '' : 'none';
if(isTestMode){
 try{
 const bootResults = runPokerTests();
 const bootFailed = bootResults.filter(r=>!r.pass);
 if(bootFailed.length){ console.warn(`[poker-tests] ${bootFailed.length}/${bootResults.length} test(s) en échec :`, bootFailed.map(r=>r.name)); }
 else { console.log(`[poker-tests] ${bootResults.length}/${bootResults.length} tests OK`); }
 }catch(e){ console.error('[poker-tests] erreur pendant l\u2019exécution des tests', e); }
}

render();
</script>
