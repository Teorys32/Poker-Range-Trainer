function ellipsePoint(cx,cy,rx,ry,angleDeg){
  const rad = angleDeg*Math.PI/180;
  return { x: cx + rx*Math.cos(rad), y: cy + ry*Math.sin(rad) };
}
const ACTION_VERBS = { open:'Open', '3bet':'3-bet', '4bet':'4-bet', fold:'Fold', call:'Call', limp:'Limp' };
function actionVerb(action){ return ACTION_VERBS[action] || action; }

// Construit la séquence d'action complète (qui a foldé, qui a ouvert/relancé, avec quel montant)
// à partir de la liste compacte spot.actions, en tenant compte du VRAI nombre de sièges
// (6-max ou 9-max) : les positions qui n'existent qu'en 9-max (UTG+1/MP/LJ) sont donc
// correctement insérées comme "fold" quand elles se trouvent avant l'action concernée.
function buildActionLog(spot, tableSize){
  const order = tableSize===6 ? SIX_MAX : NINE_MAX;
  if(!order.includes(spot.heroPosition)) return null;
  const actions = spot.actions || [];
  const heroIdx = order.indexOf(spot.heroPosition);
  if(actions.length===0){
    return Array.from({length:heroIdx}, (_,i)=>({pos:order[i], action:'fold'}));
  }
  const log = [];
  const resolved = new Set();
  const fillFoldsBetween = (fromIdx, toIdx) => {
    for(let i=fromIdx; i<toIdx; i++){
      if(order[i]===spot.heroPosition || resolved.has(i)) continue;
      resolved.add(i);
      log.push({ pos:order[i], action:'fold' });
    }
  };
  let cursor = 0;
  for(const act of actions){
    const idx = order.indexOf(act.pos);
    if(idx<0) continue; // position absente à cette taille de table (garde-fou)
    fillFoldsBetween(cursor, idx);
    resolved.add(idx);
    log.push({ pos:act.pos, action:act.action, amount:act.amount, isHero: act.pos===spot.heroPosition });
    cursor = Math.max(cursor, idx+1);
  }
  const lastIdx = order.indexOf(actions[actions.length-1].pos);
  if(heroIdx > lastIdx) fillFoldsBetween(cursor, heroIdx);
  else fillFoldsBetween(cursor, order.length);
  return log;
}
function actionPhrase(action, amount){
  const amt = amount ? ` à ${amount} bb` : '';
  if(action==='open') return `open${amt}`;
  if(action==='3bet') return `3-bet${amt}`;
  if(action==='4bet') return `4-bet${amt}`;
  if(action==='call') return `suit${amt}`;
  if(action==='limp') return `limp${amt}`;
  return action;
}
const ACTION_PAST_VERB = { open:'ouvert', '3bet':'3-bet', '4bet':'4-bet', call:'suivi', limp:'limpé', fold:'fold' };
function actionPastVerb(action, amount){
  const verb = ACTION_PAST_VERB[action] || action;
  const amt = amount ? (action==='call'||action==='limp' ? ` (${amount} bb)` : ` à ${amount} bb`) : '';
  return `${verb}${amt}`;
}
// BUG CORRIGÉ : ces deux fonctions supposaient qu'un seul adversaire agit avant héros (spot.villainPosition).
// Sur un spot multiway (ex. squeeze : CO open, BTN suit), la dernière action n'est pas forcément celle de
// spot.villainPosition — ça attribuait par erreur l'action du dernier joueur à un autre. On énumère
// maintenant TOUS les acteurs de la séquence, quel que soit leur nombre.
// Décrit la situation en clair, SANS jamais révéler la fréquence/solution avant la décision du joueur.
function positionContextText(spot){
  if(spot.villainPosition==='—'){
    return `Vous êtes <b>${spot.heroPosition}</b>. Personne n\u2019a encore parlé : c\u2019est à vous d\u2019ouvrir ou de vous coucher.`;
  }
  const acts = spot.actions||[];
  const nonHeroActs = acts.filter(a=>a.pos!==spot.heroPosition);
  const heroActs = acts.filter(a=>a.pos===spot.heroPosition);
  if(nonHeroActs.length===0){
    return `Vous êtes <b>${spot.heroPosition}</b>, face à <b>${spot.villainPosition}</b>.`;
  }
  const facingParts = nonHeroActs.map(a => `<b>${a.pos}</b> qui ${actionPhrase(a.action,a.amount)}`).join(' et ');
  const recap = heroActs.length ? ` Vous aviez ${heroActs.map(a=>actionPhrase(a.action,a.amount)).join(' puis ')}.` : '';
  return `Vous êtes <b>${spot.heroPosition}</b>, face à ${facingParts}.${recap}`;
}
// Récap PRÉFLOP uniquement, explicitement étiqueté et au passé, pour ne jamais le confondre avec
// l'action de la street en cours (ex. postflop, "UTG open 2.3bb" ne doit jamais donner l'impression
// qu'UTG relance À NOUVEAU sur le flop : c'est un rappel de ce qui s'est passé avant le flop).
const HERO_CHOICE_PAST_VERB = { OPEN:'ouvert', CALL:'suivi', '3BET':'3-bet', '4BET':'4-bet', SHOVE:'tout tapis', FOLD:'fold' };
function preflopRecapText(spot, heroChoice, heroAmount){
  const amountTxt = heroAmount ? ` à ${heroAmount} bb` : '';
  if(spot.villainPosition==='—'){
    if(!heroChoice) return `Préflop : personne n\u2019avait ouvert, vous étiez le premier à parler.`;
    const verb = HERO_CHOICE_PAST_VERB[heroChoice] || heroChoice.toLowerCase();
    if(heroChoice==='OPEN'){
      // BUG CORRIGÉ : on disait "l'action a été payée" sans jamais dire QUI payait.
      const callerTxt = spot.impliedCaller ? `${spot.impliedCaller} paie pour voir le flop` : `l\u2019action a été payée pour voir le flop`;
      return `Préflop : personne n\u2019avait ouvert, vous avez ${verb}${amountTxt}, ${callerTxt}.`;
    }
    return `Préflop : personne n\u2019avait ouvert, vous avez ${verb}.`;
  }
  const acts = spot.actions||[];
  const parts = acts.length ? acts.map(a => a.pos===spot.heroPosition ? `vous avez ${actionPastVerb(a.action,a.amount)}` : `${a.pos} a ${actionPastVerb(a.action,a.amount)}`) : [`face à ${spot.villainPosition}`];
  // BUG CORRIGÉ : cette fonction ne racontait que la situation JUSQU'AU moment de la décision de héros,
  // jamais la décision elle-même ni comment on est arrivé au flop (ex. héros 4-bet, payé par BTN).
  if(heroChoice){
    const verb = HERO_CHOICE_PAST_VERB[heroChoice] || heroChoice.toLowerCase();
    if(heroChoice!=='FOLD'){
      parts.push(`vous avez ${verb}${amountTxt}`);
      if(['OPEN','3BET','4BET','SHOVE'].includes(heroChoice)){
        if(state.facingPreflopRaise){
          const sizeTxt = state.facingPreflopRaise.size ? ` à ${state.facingPreflopRaise.size} bb` : '';
          parts.push(`${spot.villainPosition} a re-relancé${sizeTxt}`);
          if(state.facingPreflopRaise.response==='CALL') parts.push('vous avez payé');
          else if(state.facingPreflopRaise.response==='FOLD') parts.push('vous vous êtes couché');
        } else {
          parts.push(`l\u2019action a été payée pour voir le flop`);
        }
      }
    } else {
      parts.push(`vous avez fold`);
    }
  }
  const sentence = parts.join(', ');
  return `Préflop : ${sentence.charAt(0).toUpperCase()}${sentence.slice(1)}.`;
}
// BUG CORRIGÉ : postflop, l'ordre de parole n'est PAS le même qu'au préflop — ça part toujours de
// SB/BB puis reprend UTG...BTN, le bouton parlant toujours en dernier. Un joueur peut donc être hors
// position postflop (ex. MP qui a callé l'open d'UTG parle APRÈS lui sur chaque street) même s'il a
// parlé après lui au préflop. Avant, le panneau postflop demandait systématiquement une décision à
// héros sans jamais vérifier ni signaler qui doit réellement parler en premier.
const POSTFLOP_ORDER = ['SB','BB','UTG','UTG+1','MP','LJ','HJ','CO','BTN'];
// Qui reste réellement dans le coup à part héros (pot multiway compris) : on relit le log d'action déjà
// construit, qui sait déjà qui a foldé — un joueur explicitement présent dans spot.actions (ex. BTN qui
// suit dans un squeeze) est actif, même s'il n'est pas spot.villainPosition.
function activeNonHeroPositions(spot, tableSize){
  const log = buildActionLog(spot, tableSize||6);
  if(!log) return spot.villainPosition!=='—' ? [spot.villainPosition] : [];
  const folded = new Set(log.filter(s=>s.action==='fold').map(s=>s.pos));
  const acted = new Set(log.filter(s=>s.pos!==spot.heroPosition).map(s=>s.pos));
  return [...acted].filter(p=>!folded.has(p));
}
function heroActsFirstPostflop(spot, tableSize){
  if(spot.villainPosition==='—') return true;
  const heroIdx = POSTFLOP_ORDER.indexOf(spot.heroPosition);
  const otherIdx = activeNonHeroPositions(spot, tableSize).map(p=>POSTFLOP_ORDER.indexOf(p)).filter(i=>i!==-1);
  if(heroIdx===-1 || otherIdx.length===0) return true;
  return heroIdx < Math.min(...otherIdx);
}
function ActionFeed(log, heroPosition, postflopCtx, villainPosition, profileIcon){
  const posLabel = (pos) => (profileIcon && pos===villainPosition) ? `${profileIcon} ${pos}` : pos;
  if(log===null) return '';
  if(log.length===0 && !postflopCtx){
    return `<div class="action-feed"><p class="action-feed-empty">Personne n\u2019a encore parlé — vous êtes le premier à agir.</p></div>`;
  }
  const preflopRows = log.map(step => {
    const isFold = step.action==='fold';
    const cls = isFold ? 'fold' : (step.isHero ? 'hero' : 'raise');
    const amountTxt = step.amount ? ` ${step.amount} bb` : '';
    return `<div class="action-feed-row ${cls}"><span class="pos">${step.isHero?heroPosition+' (vous)':posLabel(step.pos)}</span><span class="verb">${actionVerb(step.action)}${amountTxt}</span></div>`;
  }).join('');
  if(!postflopCtx){
    return `<div class="action-feed">${preflopRows}<div class="action-feed-row now"><span class="pos">${heroPosition} (vous)</span><span class="verb">À vous de jouer</span></div></div>`;
  }
  // BUG CORRIGÉ : ce résumé réaffichait toujours l'ouverture préflop, quelle que soit la street en
  // cours — on ajoute maintenant le vrai historique street par street (flop, turn, river).
  const streetRows = (postflopCtx.streetLog||[]).map(entry => `
    <div class="action-feed-row hero"><span class="pos">${heroPosition} (vous)</span><span class="verb">${entry.heroLabel} · ${entry.street}</span></div>
    <div class="action-feed-row"><span class="pos">${entry.oppNames ? entry.oppNames.split(' et ').map(posLabel).join(' et ') : '—'}</span><span class="verb">${entry.oppLabel}</span></div>`).join('');
  const currentRow = postflopCtx.currentAction
    ? `<div class="action-feed-row hero now"><span class="pos">${heroPosition} (vous)</span><span class="verb">${postActionLabel(postflopCtx.currentAction)} · ${postflopCtx.currentStreet}</span></div>`
    : `<div class="action-feed-row now"><span class="pos">${heroPosition} (vous)</span><span class="verb">À vous de jouer · ${postflopCtx.currentStreet}</span></div>`;
  return `<div class="action-feed">${preflopRows}${streetRows}${currentRow}</div>`;
}
function svgCard(x, y, card, w, h){
  const color = cardColor(card);
  const fs = Math.round(h*0.4);
  return `<rect x="${(x-w/2).toFixed(1)}" y="${(y-h/2).toFixed(1)}" width="${w}" height="${h}" rx="3" fill="#f3ecd9" stroke="#d7bd83" stroke-width="1"/><text x="${x}" y="${(y+fs*0.32).toFixed(1)}" text-anchor="middle" font-family="'Space Mono',monospace" font-size="${fs}" font-weight="700" fill="${color}">${card.rank}${card.suit}</text>`;
}
function svgCardBack(x, y, w, h){
  return `<rect x="${(x-w/2).toFixed(1)}" y="${(y-h/2).toFixed(1)}" width="${w}" height="${h}" rx="2.5" fill="#7a2323" stroke="#e69b8e" stroke-width="1"/><rect x="${(x-w/2+2).toFixed(1)}" y="${(y-h/2+2).toFixed(1)}" width="${w-4}" height="${h-4}" rx="1.5" fill="none" stroke="#c96a54" stroke-width="0.75"/>`;
}
function svgCardRow(cx, cy, cards, w, h, gap){
  const n = cards.length;
  if(n===0) return '';
  const totalW = n*w + (n-1)*gap;
  const x0 = cx - totalW/2 + w/2;
  return cards.map((c,i)=>svgCard(x0+i*(w+gap), cy, c, w, h)).join('');
}
// Table dynamique façon GTOWizard : vos cartes sont directement à votre siège, le board au centre,
// et chaque action (fold/mise/relance) s'affiche à même la table — plus de liste texte à lire en dessous.
function TableViz(spot, tableSize, postflopCtx, board, liveState){
  board = board || [];
  const isPostflop = board.length>0;
  const order = tableSize===6 ? SIX_MAX : NINE_MAX;
  const n = order.length;
  const heroIdx = order.indexOf(spot.heroPosition);
  if(heroIdx===-1) return '';
  const log = buildActionLog(spot, tableSize);
  const stateByPos = {};
  (log||[]).forEach(step => { stateByPos[step.pos] = step; });
  // Le dernier relanceur (open/3bet/4bet) le plus récent, hors héros, est celui que l'on affronte.
  const lastAggressor = (log||[]).filter(s=>s.action!=='fold' && !s.isHero).slice(-1)[0];

  // On repart de la position du héros pour que VOUS soyez toujours en bas, au centre.
  const rotated = order.slice(heroIdx).concat(order.slice(0, heroIdx));
  const cx=160, cy=126, rx=116, ry=90;
  const seats = rotated.map((pos, i) => {
    const angle = 90 + i*(360/n); // siège 0 (héros) = 90° = bas centre, puis on tourne autour de la table
    const pt = ellipsePoint(cx,cy,rx,ry,angle);
    const step = stateByPos[pos];
    return {
      pos, x:pt.x, y:pt.y,
      isHero: pos===spot.heroPosition,
      isFacing: !!lastAggressor && pos===lastAggressor.pos,
      isFolded: !!step && step.action==='fold',
      hasActed: !!step && step.action!=='fold',
      amount: step && step.amount,
      isVillain: pos===spot.villainPosition,
      isBTN: pos==='BTN', isSB: pos==='SB', isBB: pos==='BB',
    };
  });

  const felt = `<ellipse cx="${cx}" cy="${cy}" rx="${rx+32}" ry="${ry+28}" fill="#0d2a1f" stroke="#2a4e3e" stroke-width="2"/><ellipse cx="${cx}" cy="${cy}" rx="${rx-4}" ry="${ry-4}" fill="none" stroke="#1d3b31" stroke-width="1" stroke-dasharray="3 5"/>`;

  const seatsHtml = seats.map(s => {
    const r = s.isHero ? 25 : 19;
    let fill = '#132118', stroke = '#3a5d4b', textColor = '#cfe0d5', opacity = 1;
    if(s.isHero){ fill='#d5a850'; stroke='#f0c46f'; textColor='#182419'; }
    else if(s.isFacing && !isPostflop){ fill='#c96a54'; stroke='#e69b8e'; textColor='#2a1310'; }
    else if(s.isFolded){ fill='#0f1f18'; stroke='#25392f'; textColor='#4c6459'; opacity=0.55; }
    else if(s.hasActed && !isPostflop){ fill='#2a2114'; stroke='#e0954a'; textColor='#f0c98a'; }
    const label = s.isHero ? 'VOUS' : s.pos;
    const fontSize = s.isHero ? 10.5 : (s.pos.length>=4 ? 8 : 10);
    // BUG CORRIGÉ : les jetons de mise préflop restaient affichés indéfiniment, même une fois la
    // street préflop terminée — comme si BTN avait encore 2.3bb devant lui pendant tout le flop. Une
    // fois postflop, les mises précédentes sont ramassées dans le pot : on n'affiche plus ces jetons.
    const amountTag = (!isPostflop && s.hasActed && s.amount) ? `<rect x="${s.x-19}" y="${s.y+r+2}" width="38" height="15" rx="7" fill="#0d2a1f" stroke="#e0954a" stroke-width="1"/><text x="${s.x}" y="${s.y+r+12.5}" text-anchor="middle" font-family="'Space Mono',monospace" font-size="10" font-weight="700" fill="#f0c98a">${s.amount}bb</text>` : '';
    const foldTag = (s.isFolded && !amountTag) ? `<rect x="${s.x-18}" y="${s.y+r+3}" width="36" height="14" rx="7" fill="#2a1310" stroke="#c96a54" stroke-width="1"/><text x="${s.x}" y="${s.y+r+13}" text-anchor="middle" font-family="'Space Mono',monospace" font-size="8" font-weight="700" letter-spacing="1" fill="#e69b8e">FOLD</text>` : '';
    // "Ressembler à une vraie table de poker" : chaque siège (pas seulement héros/adversaire désigné)
    // affiche son stack, sous sa position — héros a déjà le sien dans l'en-tête, à côté de ses cartes.
    const stackTag = !s.isHero ? (() => {
      const val = s.isVillain ? (liveState ? liveState.villainRemaining : (spot.villainStack || spot.effectiveStack)) : spot.effectiveStack;
      return `<text x="${s.x}" y="${s.y+r+(amountTag||s.isFolded?23:12)}" text-anchor="middle" font-family="'Space Mono',monospace" font-size="8" font-weight="700" fill="#e4c98a">${Math.round(val)}bb</text>`;
    })() : '';
    const profileBadge = (s.isVillain && spot.villainProfile) ? `<circle cx="${s.x+r-6}" cy="${s.y-r+6}" r="9" fill="#0c2119" stroke="#3a5d4b" stroke-width="1"/><text x="${s.x+r-6}" y="${s.y-r+9.5}" text-anchor="middle" font-size="10">${VILLAIN_PROFILES[spot.villainProfile].icon}</text>` : '';
    // Cartes retournées pour tout adversaire encore dans le coup, pour identifier au premier coup
    // d'œil qui est encore actif sans avoir à lire le texte.
    const cardBacksHtml = (!s.isHero && !s.isFolded) ? (() => {
      const dx = s.x-cx, dy = s.y-cy;
      const dist = Math.hypot(dx,dy)||1;
      const ux = dx/dist, uy = dy/dist;
      const px = -uy, py = ux;
      const bx = s.x + ux*(r+13), by = s.y + uy*(r+13);
      return svgCardBack(bx-px*6.5, by-py*6.5, 11, 15) + svgCardBack(bx+px*6.5, by+py*6.5, 11, 15);
    })() : '';
    return `<g opacity="${opacity}">
      <circle cx="${s.x}" cy="${s.y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>
      <text x="${s.x}" y="${s.y+3.6}" text-anchor="middle" font-family="'Space Mono',monospace" font-size="${fontSize}" font-weight="700" fill="${textColor}">${label}</text>
      ${amountTag}${foldTag}${stackTag}${profileBadge}${cardBacksHtml}
    </g>`;
  }).join('');

  // jeton distributeur (D) en avant du siège BTN, vers le centre de la table
  const chipTowardCenter = (seat, r, label, fill, stroke, textFill) => {
    if(!seat) return '';
    const dx = cx - seat.x, dy = cy - seat.y;
    const dist = Math.hypot(dx,dy) || 1;
    const ox = seat.x + dx/dist*20, oy = seat.y + dy/dist*20;
    return `<circle cx="${ox}" cy="${oy}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/><text x="${ox}" y="${oy+3.2}" text-anchor="middle" font-family="'Space Mono',monospace" font-size="8" font-weight="700" fill="${textFill}">${label}</text>`;
  };
  const btnSeat = seats.find(s=>s.isBTN);
  const sbSeat = seats.find(s=>s.isSB);
  const bbSeat = seats.find(s=>s.isBB);
  const markers = (!isPostflop) ? [
    chipTowardCenter(btnSeat, 10, 'D', '#f3e9ce', '#c99b48', '#8a6a28'),
    chipTowardCenter(sbSeat, 9, 'SB', '#3f6152', 'rgba(255,255,255,.35)', '#e6f0ea'),
    chipTowardCenter(bbSeat, 9, 'BB', '#345847', 'rgba(255,255,255,.35)', '#e6f0ea'),
  ].join('') : ''; // les jetons D/SB/BB n'ont plus de sens visuel une fois les mises ramassées au flop

  const heroSeat = seats.find(s=>s.isHero);
  const heroCardsHtml = heroSeat ? svgCardRow(heroSeat.x, heroSeat.y + 25 + 22, spot.hole, 24, 33, 4) : '';
  const boardCardsHtml = svgCardRow(cx, cy, board, 20, 28, 3);
  const potValue = liveState ? liveState.pot : spot.pot;
  const potLabel = `<rect x="${cx-38}" y="${cy-38}" width="76" height="16" rx="8" fill="#0c2119" stroke="#2a4e3e" stroke-width="1"/><text x="${cx}" y="${cy-26.5}" text-anchor="middle" font-family="'Space Mono',monospace" font-size="10" font-weight="700" fill="#e4b65e">Pot ${potValue.toFixed(1)} bb</text>`;

  return `<div style="margin:16px 0;">
    <svg viewBox="0 0 320 300" style="width:100%;max-width:380px;height:auto;display:block;margin:0 auto;">${felt}${seatsHtml}${markers}${boardCardsHtml}${heroCardsHtml}${potLabel}</svg>
  </div>`;
}

function RangeMatrix(spot){
  const range = OPEN_RANGES[spot.heroPosition] || [];
  const freq = spot.preflop.frequency;
  const cells = MATRIX_LABELS.map(cell => {
    const active = range.includes(cell);
    const current = cell === spot.handClass;
    const mixed = current && !active && freq > 0 && freq < 100;
    let bg, color;
    if(mixed){ bg='rgba(213,168,80,.4)'; color='#f1e2b8'; }
    else if(active){ bg='rgba(213,168,80,.86)'; color='#182419'; }
    else { bg='rgba(117,147,134,.12)'; color='#6d8b7d'; }
    return `<div class="cell ${current?'current':''}" title="${cell}" style="background:${bg};color:${color}">${cell}</div>`;
  }).join('');
  return `<div class="matrix-wrap">
    <div class="m-head"><span class="m-title">Range de référence · ${spot.heroPosition}</span>
      <div class="m-legend"><span><i style="background:#d5a850"></i>Action</span><span><i style="background:rgba(213,168,80,.4)"></i>Mixte</span><span><i style="background:#315846"></i>Hors range</span></div>
    </div>
    <div class="matrix">${cells}</div>
    <div class="matrix-foot"><span>${spot.preflop.rangeLabel}</span><span>169 combinaisons · lecture simplifiée</span></div>
  </div>`;
}
function RangeNote(spot){
  return `<div class="matrix-wrap">
    <div class="m-head"><span class="m-title">Contexte du spot</span></div>
    <p style="font-size:13px;line-height:1.55;color:#a5b8a5;margin:0;">
      Face à l'action de ${spot.villainPosition} (${spot.line}), la bonne décision dépend aussi de la range d'ouverture ou de 3-bet adverse, pas seulement de la vôtre —
      un tableau 169 cases par position n'a de sens que pour une décision d'ouverture "first in". Ici, la fréquence cible (${spot.preflop.frequency}%) est la donnée qui compte.
    </p>
  </div>`;
}

function OddsPanel(hole, board, compact){
  const stats = calculateDrawStats(hole, board);
  const headRight = board.length===3 ? 'flop · 2 cartes à venir' : board.length===4 ? 'turn · 1 carte à venir' : 'river · terminée';
  const body = stats.length===0
    ? `<p class="odds-empty">Aucun tirage direct détecté sur cette texture. Les pourcentages sont calculés sur les cartes restantes, sans doublon.</p>`
    : stats.map(stat => `
      <div class="odds-stat">
        <div class="odds-stat-top"><p class="name">${stat.name}</p><span class="outs">${stat.outs} outs</span></div>
        <div class="odds-stat-grid">
          <div><p class="l">Prochaine carte</p><p class="v">${formatPercent(stat.next)}</p></div>
          <div><p class="l">D\u2019ici la river</p><p class="v">${formatPercent(stat.river)}</p></div>
        </div>
        <p class="detail">${stat.detail}</p>
      </div>`).join('');
  return `<div class="odds-panel ${compact?'compact':''}">
    <div class="odds-head"><div class="odds-head-l">&#129518;<p>Calculateur de tirages</p></div><span class="odds-head-r">${headRight}</span></div>
    ${body}
    ${!compact ? `<p class="odds-footnote">Exemple : avec 4 cartes de la même couleur au flop, il reste 9 outs. Cela donne 9/47 au turn et environ 35% d\u2019ici la river.</p>` : ''}
  </div>`;
}

// Sizing d'ouverture choisi par l'utilisateur (2 / 2.5 / 3 bb, ou tapis), au lieu d'un simple bouton
// "Open" figé. Heuristique pédagogique claire (pas un solveur) : sert à sensibiliser au bon ordre de
// grandeur du sizing selon la profondeur de stack, pas à remplacer un vrai travail de ranges.
const OPEN_SIZE_OPTIONS = [2, 2.5, 3, 'ALLIN'];
function gradeOpenSizing(sizeBB, effectiveStack){
  if(effectiveStack<=20){
    return sizeBB==='ALLIN' ? 'top' : 'error'; // sous 20 BB, la théorie push/fold recommande un vrai tapis
  }
  if(sizeBB==='ALLIN') return 'error'; // stack profond : un open all-in est une sur-mise évidente
  if(sizeBB===2.5) return 'top';
  if(sizeBB===2 || sizeBB===3) return 'mixed';
  return 'error';
}
function openSizingFeedback(sizeBB, effectiveStack, tier){
  const label = sizeBB==='ALLIN' ? 'un tapis' : `${sizeBB} bb`;
  if(effectiveStack<=20){
    return tier==='top'
      ? `À ${effectiveStack} BB, la théorie push/fold recommande un vrai tapis plutôt qu\u2019une relance standard : c\u2019est exactement votre choix.`
      : `À ${effectiveStack} BB, relancer à ${label} laisse trop de jetons derrière sans les protéger : sous 20 BB, on joue plutôt en push/fold (tapis ou fold), pas une taille intermédiaire.`;
  }
  if(tier==='top') return `${label} est la taille de référence la plus courante avec un stack profond (${effectiveStack} BB).`;
  if(tier==='mixed') return `${label} reste jouable, mais légèrement ${sizeBB<2.5?'petit':'grand'} par rapport à la référence (~2,5 bb) à ${effectiveStack} BB.`;
  return `${label} ${sizeBB==='ALLIN' ? 'est une sur-mise totalement disproportionnée' : 'est assez loin de la référence (~2,5 bb)'} pour un stack de ${effectiveStack} BB.`;
}
function chooseOpenSize(sz){
  const sizeBB = sz==='ALLIN' ? 'ALLIN' : parseFloat(sz);
  state.openSize = sizeBB;
  state.openSizeTier = gradeOpenSizing(sizeBB, state.spot.effectiveStack);
  state.awaitingOpenSize = false;
  choosePreflop('OPEN');
}
function preflopTier(spot, selected){
  if(selected === spot.preflop.action) return 'top';
  const mix = spot.preflop.mix;
  if(mix){
    const entry = mix.find(m=>m.action===selected);
    if(entry && entry.freq>=15) return 'mixed';
  }
  return 'error';
}
// Postflop : pas de données de fréquence par sizing (contrairement au préflop), donc on reste honnête
// et pragmatique plutôt que d'inventer des pourcentages. Règle simple et défendable : un sizing DIRECTEMENT
// ADJACENT à la recommandation (ex. BET 25% au lieu de BET 33%) est une variation de sizing acceptable, pas
// une erreur — direction opposée (CHECK/FOLD vs BET, ou l'inverse) reste tranchée en JUSTE/ERREUR.
const POST_BET_ORDER = ['BET 25%','BET 33%','BET 50%','BET 75%','BET 125%'];
function postflopTier(solution, selected){
  if(selected === solution.action) return 'top';
  const si = POST_BET_ORDER.indexOf(solution.action);
  const ci = POST_BET_ORDER.indexOf(selected);
  if(si!==-1 && ci!==-1 && Math.abs(si-ci)===1) return 'mixed';
  return 'error';
}
function remainingPositionsAfter(pos, tableSize){
  const order = tableSize===6 ? SIX_MAX : NINE_MAX;
  const idx = order.indexOf(pos);
  if(idx===-1) return [];
  return order.slice(idx+1);
}
function FeedbackPreflop(spot, selected){

  const raiserIsSqueeze = !!(state.facingPreflopRaise && state.facingPreflopRaise.squeezer && state.facingPreflopRaise.squeezer!==spot.villainPosition);
  let preflopResolutionNote = '';
  if(selected!=='FOLD'){
    if(pendingRaiseDecision){
      const sizeTxt = state.facingPreflopRaise.size ? ` à environ ${state.facingPreflopRaise.size} bb` : '';
      const verb = raiserIsSqueeze ? 'squeeze' : 're-relance';

          <button class="act-btn plain" id="preflopSurpriseFold"><span class="big" style="color:#e5ba60;">Fold</span><span class="small">Abandonner</span></button>
          <button class="act-btn plain" id="preflopSurpriseCall"><span class="big" style="color:#e5ba60;">Call</span><span class="small">Payer</span></button>

    } else if(foldedToRaise){

    } else if(state.facingPreflopRaise && state.facingPreflopRaise.response==='CALL'){
      preflopResolutionNote = `<p style="margin:0 0 12px;font-size:12px;color:#8ea699;">Vous payez ${raiserIsSqueeze?'le squeeze de':'la re-relance de'} ${raiserName}.${heuristicSuffix}</p>`;

  const profileNote = (spot.villainProfile && spot.villainPosition!=='—') ? (() => {
    const profile = VILLAIN_PROFILES[spot.villainProfile];
    return `<div class="profile-note">
      <p class="profile-note-head">${profile.icon} Lecture du joueur : <b>${profile.name}</b> <span class="profile-tag">${profile.tag}</span></p>
      <p class="profile-note-text">${profile.note(true)}</p>

  // Sizing d'ouverture choisi par l'utilisateur : feedback SÉPARÉ de la direction (Open vs Fold),

  const sizingNote = (selected==='OPEN' && state.openSize!==null) ? (() => {
    const sizeTierMeta = { top:{icon:'✓',cls:'ok',tag:'BON SIZING'}, mixed:{icon:'≈',cls:'mix',tag:'SIZING ACCEPTABLE'}, error:{icon:'✕',cls:'bad',tag:'SIZING À REVOIR'} }[state.openSizeTier];
    return `<div class="profile-note">

  return `<section class="feedback animate-rise ${tierMeta.cls}">

  </section>`;
}

const actionLabels = { CHECK:'Checker', FOLD:'Abandonner', CALL:'Payer', RAISE:'Relancer' };
function postActionLabel(action){ return actionLabels[action] || `Miser ${action.replace('BET ','')}`; }

// BUG CORRIGÉ / REFONTE : piloter l'interface à partir d'un état unique plutôt que d'empiler des
// panneaux de texte street par street — c'est ce qui permet une table dynamique façon GTOWizard
// avec une barre d'action fixe, sans avoir à faire défiler la page pour jouer.
function goToPostflop(){
  const remaining = computeRemainingStackBB(state.spot);
  state.allInRunout = remaining <= Math.max(8, state.spot.effectiveStack*0.25);
  state.phase='postflop'; state.street='FLOP';
  render();
}
function getPlayState(s){
  const spot = s.spot;
  if(s.handOver) return { kind:'summary' };
  if(s.phase==='preflop'){
    if(s.awaitingOpenSize) return { kind:'openSize' };
    if(s.awaitingFollowupReveal) return { kind:'continue', label:'Voir la réaction de l\u2019adversaire', action:()=>revealFollowupOutcome() };
    if(s.facingPreflopRaise && !s.facingPreflopRaise.response){
      const isSqueeze = s.facingPreflopRaise.squeezer && s.facingPreflopRaise.squeezer!==spot.villainPosition;
      const who = s.facingPreflopRaise.squeezer || spot.villainPosition;
      return { kind:'foldcall', note:`${who} ${isSqueeze?'squeeze':'relance'}${s.facingPreflopRaise.size?` ~${s.facingPreflopRaise.size}bb`:''}`, onFold:()=>respondToPreflopRaise('FOLD'), onCall:()=>respondToPreflopRaise('CALL') };
    }
    if(s.selected===null) return { kind:'preflopMain' };
    const villainFoldedPreflop = s.preflopOutcome==='fold';
    const foldedToRaise = s.facingPreflopRaise && s.facingPreflopRaise.response==='FOLD';
    if(s.selected==='FOLD' || villainFoldedPreflop || foldedToRaise) return { kind:'continue', label:'Voir le résumé', action:()=>endHand() };
    return { kind:'continue', label:'Continuer', action:()=>goToPostflop() };
  }
  if(s.allInRunout) return { kind:'continue', label:'Continuer', action:()=>advanceAllInRunout() };
  if(s.facingSurprise && !s.facingSurprise.response){
    const opponents = activeNonHeroPositions(spot, s.table);
    const oppNames = opponents.length ? opponents.join(' et ') : (spot.villainPosition!=='—'?spot.villainPosition:'L\u2019adversaire');
    return { kind:'foldcall', note:`${oppNames} ${s.facingSurprise.type==='raise'?'relance':'mise'}${s.facingSurprise.size?` (${s.facingSurprise.size})`:''}`, onFold:()=>respondToSurprise('FOLD'), onCall:()=>respondToSurprise('CALL') };
  }
  if(s.postAction===null) return { kind:'postflopMain' };
  return { kind:'continue', label:'Continuer', action:()=>choosePostflop('NEXT') };
}
// Une ligne courte au lieu d'un paragraphe : tout le détail (explication, fréquence, mix) est
// désormais réservé au résumé de fin de main.
function computeLiveStatusLine(s){
  const spot = s.spot;
  if(s.phase==='preflop'){
    if(s.awaitingOpenSize) return 'Choisissez votre sizing.';
    if(s.awaitingFollowupReveal) return `Vous avez ${actionName(s.selected).toLowerCase()}${s.openSize?` à ${s.openSize} bb`:''}.`;
    if(s.facingPreflopRaise && !s.facingPreflopRaise.response) return '';
    if(s.selected===null) return positionContextText(spot);
    if(s.preflopOutcome==='fold'){
      const lastActorPos = spot.villainPosition!=='—' ? spot.villainPosition : (spot.followup?spot.followup.villainPosition:null);
      return `&#127942; ${lastActorPos||'L\u2019adversaire'} se couche : vous remportez le pot.`;
    }
    if(s.facingPreflopRaise && s.facingPreflopRaise.response==='FOLD') return `Vous vous couchez.`;
    if(s.facingPreflopRaise && s.facingPreflopRaise.response==='CALL') return `Vous payez.`;
    if(s.preflopOutcome==='call') return `${spot.villainPosition} paie votre ${actionName(s.selected).toLowerCase()}.`;
    return `Vous avez ${actionName(s.selected).toLowerCase()}${s.openSize?` à ${s.openSize} bb`:''}.`;
  }
  if(s.allInRunout) return `Stacks quasiment engagés — cartes distribuées.`;
  if(s.facingSurprise && !s.facingSurprise.response) return '';
  if(s.postAction===null) return s.street==='FLOP' ? preflopRecapText(spot, s.selected, s.openSize) : 'À vous de jouer.';
  const opponents = activeNonHeroPositions(spot, s.table);
  const oppNames = opponents.length ? opponents.join(' et ') : (spot.villainPosition!=='—'?spot.villainPosition:'L\u2019adversaire');
  if(s.postflopOutcome==='fold') return `&#127942; ${oppNames} se couche : vous remportez le pot.`;
  if(s.facingSurprise && s.facingSurprise.response==='FOLD') return `Vous vous couchez.`;
  if(s.facingSurprise && s.facingSurprise.response==='CALL') return `Vous payez.`;
  if(s.postAction==='CHECK') return `${oppNames} checke${opponents.length>1?'nt':''} aussi.`;
  return `${oppNames} suit${opponents.length>1?'ent':''} votre mise.`;
}

function bestStreakFromHistory(history){
  let best=0, cur=0;
  history.forEach(item => { if(item.correct){ cur++; best=Math.max(best,cur); } else cur=0; });
  return best;
}
function statsComputed(){
  const s = state;
  const history = s.history;
  const total = history.length;
  const correct = history.filter(i=>i.correct).length;
  const accuracy = total ? Math.round((correct/total)*100) : 0;
  const topCount = history.filter(i=>i.tier==='top').length;
  const mixedCount = history.filter(i=>i.tier==='mixed').length;
  const errorCount = history.filter(i=>i.tier==='error').length;
  const preflop = history.filter(i=>i.street==='Préflop');
  const postflop = history.filter(i=>i.street!=='Préflop');
  const streetList = ['Préflop','FLOP','TURN','RIVER'];
  const streetStats = streetList.map(street => {
    const items = history.filter(i=>i.street===street);
    const ok = items.filter(i=>i.correct).length;
    return { street, total:items.length, correct:ok, mistakes:items.length-ok, accuracy: items.length? Math.round((ok/items.length)*100) : null };
  });
  const positions = Array.from(new Set(history.map(i=>i.position)));
  const positionStats = (positions.length?positions:SIX_MAX).map(pos => {
    const items = history.filter(i=>i.position===pos);
    const ok = items.filter(i=>i.correct).length;
    return { position:pos, total:items.length, correct:ok, mistakes:items.length-ok, accuracy: items.length? Math.round((ok/items.length)*100) : null };
  });
  const categories = Array.from(new Set(history.map(i=>i.category)));
  const playedStreets = streetStats.filter(x=>x.total>0);
  const playedPositions = positionStats.filter(x=>x.total>0);
  const worstStreet = playedStreets.length ? playedStreets.reduce((a,b)=> b.accuracy<a.accuracy ? b : a) : null;
  const bestStreet = playedStreets.length ? playedStreets.reduce((a,b)=> b.accuracy>a.accuracy ? b : a) : null;
  const worstPosition = playedPositions.length ? playedPositions.reduce((a,b)=> b.accuracy<a.accuracy ? b : a) : null;
  const streak = bestStreakFromHistory(history);
  return { total, correct, accuracy, topCount, mixedCount, errorCount, preflop, postflop, streetStats, positionStats, categories, worstStreet, bestStreet, worstPosition, streak };
}

function renderOddsCalculator(){
  const s = state;
  if(!s.oddsSpot) s.oddsSpot = randomProbaHand();
  if(!s.oddsCalc) s.oddsCalc = { stage:'guess' };
  const spot = s.oddsSpot;
  const board = visibleBoard(spot, s.oddsStreet);
  const revealed = s.oddsCalc.stage==='revealed';
  const stats = revealed ? calculateDrawStats(spot.hole, board) : [];
  const streetWord = s.oddsStreet==='FLOP' ? 'flop' : s.oddsStreet==='TURN' ? 'turn' : 'river';

  return `
    <div class="odds-lab-grid">
      <section class="felt-card felt-grid">
        <div class="odds-lab-head">
          <div><p style="font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#6e8b7d;">Main aléatoire</p></div>
          <div class="odds-street-toggle" id="oddsStreetToggle">
            ${['FLOP','TURN','RIVER'].map(v=>`<button data-street="${v}" class="${s.oddsStreet===v?'active':''}">${v}</button>`).join('')}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;padding:40px 0 32px;">
          ${HoleCards(spot.hole)}<p style="margin-top:12px;font-size:12px;color:#839d8e;">Ta main · ${spot.handClass}</p>
          <div style="margin-top:28px;">${revealed ? Board(board) : BoardBacks(board.length)}</div>
          <p style="margin-top:16px;font-size:12px;color:#839d8e;text-align:center;max-width:26rem;">
            ${revealed ? `${streetWord.charAt(0).toUpperCase()+streetWord.slice(1)} révélé\u2026 compare avec ce que tu avais estimé.` : `Le ${streetWord} est encore caché. Essaie de compter tes outs et d\u2019estimer ta probabilité avant de révéler.`}
          </p>
        </div>
        ${!revealed
          ? `<button class="btn-gold" id="revealBoardBtn" style="width:100%;">&#128064; Révéler le ${streetWord} et les probabilités</button>`
          : `<div class="odds-lab-stats">
              ${stats.length===0 ? `<p class="log-empty" style="grid-column:1/-1;">Aucun tirage direct sur cette texture.</p>` : stats.map(stat => `
                <div class="odds-lab-stat">
                  <p class="n">${stat.name}</p>
                  <p class="v">${formatPercent(stat.river)}</p>
                  <p class="u">d\u2019ici la river</p>
                  <div class="d"><b>${stat.outs} outs</b> · ${formatPercent(stat.next)} au prochain tirage</div>
                </div>`).join('')}
            </div>`}
      </section>
      <aside>
        ${revealed ? OddsPanel(spot.hole, board, false) : `
        <div class="aside-card">
          <div class="aside-title">&#129504;<p>À toi de jouer</p></div>
          <p class="aside-text">Regarde ta main et le nombre de cartes encore cachées. Quels tirages es-tu susceptible d\u2019avoir (couleur, quinte, brelan) ? Combien d\u2019outs, à peu près ? Clique sur « Révéler » une fois que tu as ta réponse en tête — c\u2019est en essayant d\u2019abord que le calcul rentre.</p>
        </div>`}
        <div class="aside-card">
          <div class="aside-title">&#10067;<p>La formule</p></div>
          <p class="aside-text">Au flop, le paquet comporte 47 cartes inconnues. Un tirage à 9 outs touche au turn dans 9/47 des cas, puis d\u2019ici la river dans 1 − (38/47 × 37/46) des cas.</p>
        </div>
      </aside>
    </div>
    <div style="margin-top:20px;display:flex;justify-content:flex-end;">
      <button class="btn-gold" id="newOddsSpot" style="width:fit-content;">&#10024; Nouvelle main</button>

            <button data-qcmmode="qcm" class="${effectiveMode==='qcm'?'active':''}">QCM</button>
            <button data-qcmmode="free" class="${effectiveMode==='free'?'active':''}">Réponse libre</button>

      <div class="qcm-scorebar"><span class="qcm-score">Session : <b>${st.correctCount}/${st.totalCount}</b>${st.totalCount?` (${accPct}%)`:''}</span></div>
      <div class="qcm-question">
        <p class="qcm-prompt">${q.promptHtml}</p>

      ${catEntries.length ? `
      <section class="section-card">
        <div class="section-head"><div><p class="m-title">Progression par thème</p><h3 style="font-size:14px;">Où tu progresses</h3></div></div>
        <div class="qcm-cat-grid">
          ${catEntries.map(([key,val])=>`<div class="qcm-cat-row"><span class="name">${esc(val.label||key)}</span><span class="pct">${val.total? Math.round((val.correct/val.total)*100):0}% · ${val.total}</span></div>`).join('')}

  const st = qcmState(mod);

// ============================================================
// ONGLET COTES — module strictement séparé : « est-ce que le prix
// demandé me permet de payer ? » (pot odds, equity, implied odds…)
// ============================================================
function renderCoteCalculator(){
  const { pot, bet } = state.coteCalc;
  const call = bet;
  const potFinal = pot + bet + call;
  const potAfterBet = pot + bet;
  const equity = potFinal>0 ? (call/potFinal)*100 : 0;
  const ratio = call>0 ? potAfterBet/call : 0;
  const ratioLabel = ratio ? `${ratio<10 ? (Math.round(ratio*10)/10) : Math.round(ratio)}:1` : '—';
  return `
    <div class="felt-card felt-grid">
      <div class="felt-head"><div class="felt-head-left"><span class="phase-dot" style="background:#d5a850"></span><span class="stat-label">Calculateur de cote (pot odds)</span></div><span class="cat">COTES</span></div>
      <div class="cote-calc">
        <div class="cote-field"><label>Pot avant la mise adverse (bb)</label><input type="number" min="0" step="0.5" id="coteCalcPot" value="${pot}"></div>
        <div class="cote-field"><label>Mise de l\u2019adversaire (bb)</label><input type="number" min="0" step="0.5" id="coteCalcBet" value="${bet}"></div>
      </div>
      <div class="cote-result">
        <div class="row"><span>Montant à payer (call)</span><b>${call.toFixed(1)} bb</b></div>
        <div class="row"><span>Pot final si tu payes</span><b>${potFinal.toFixed(1)} bb</b></div>
        <div class="row"><span>Cote directe (ratio pot : call)</span><b>${ratioLabel}</b></div>
        <div class="row"><span>Equity minimale nécessaire</span><b>${formatPercent(equity)}</b></div>
      </div>
      <div class="link-note">Ce seuil d\u2019equity indique le minimum pour que le call soit rentable sur cette seule street, en supposant plus aucune action derrière. Il ne remplace pas un vrai calcul d\u2019equity contre une range, ni la prise en compte des implied et reverse implied odds — le module Probabilités calcule tes outs, celui-ci calcule le prix demandé ; à toi de relier les deux.</div>
    </div>
  `;
}
function renderCotes(){
  const s = state;
  return `
    <div class="page-header">
      <div>
        <p class="eyebrow">Onglet Cotes</p>
        <h2 class="page-h2">Le prix demandé,<br><span class="accent">pas la décision.</span></h2>
        <p class="page-lede">« Est-ce que j\u2019ai la cote pour payer ? » — pot odds, equity minimale, cote directe et implicite. Ce module ne calcule jamais un call automatique : il donne les chiffres, à toi de raisonner avec ta range et celle de l\u2019adversaire.</p>
      </div>
      <div class="mode-toggle" id="coteTabToggle">
        <button data-cotetab="calc" class="${s.coteTab==='calc'?'active':''}">&#128176; Calculateur</button>
        <button data-cotetab="qcm" class="${s.coteTab==='qcm'?'active':''}">&#127919; QCM cotes</button>
      </div>
    </div>
    ${s.coteTab==='calc' ? renderCoteCalculator() : renderQcmPanel('cote')}
  `;
}
function wireCotes(){
  document.getElementById('coteTabToggle').querySelectorAll('button').forEach(b => b.onclick = () => { state.coteTab = b.dataset.cotetab; render(); });
  if(state.coteTab==='calc'){
    const potInput = document.getElementById('coteCalcPot');
    const betInput = document.getElementById('coteCalcBet');
    if(potInput) potInput.onchange = (e) => { state.coteCalc.pot = Math.max(0, parseFloat(e.target.value)||0); render(); };
    if(betInput) betInput.onchange = (e) => { state.coteCalc.bet = Math.max(0, parseFloat(e.target.value)||0); render(); };
  } else {
    wireQcmPanel('cote');
  }
}

function render(){
  try{ renderInner(); }
  catch(err){ showError(err); }
}
function renderInner(){
  const root = document.getElementById('pageRoot');
  document.querySelectorAll('.nav-link').forEach(a => {

    document.getElementById('tbEyebrow').textContent = 'Laboratoire de calcul';
    document.getElementById('tbTitle').textContent = 'Comprendre les outs';
    root.innerHTML = renderOdds();
    wireOdds();
  } else if(state.route==='/cotes'){
    document.getElementById('tbEyebrow').textContent = 'Pot odds & equity';
    document.getElementById('tbTitle').textContent = 'Est-ce que j\u2019ai la cote ?';
    root.innerHTML = renderCotes();
    wireCotes();

    document.getElementById('tbEyebrow').textContent = 'Table de travail';

function wireTrainer(){

    else choosePreflop(b.dataset.preflopAction);
  });
  document.querySelectorAll('[data-open-size]').forEach(b => b.onclick = () => chooseOpenSize(b.dataset.openSize));
  document.querySelectorAll('[data-post-action]').forEach(b => b.onclick = () => choosePostflop(b.dataset.postAction));
  // Barre d'action unifiée : chaque bouton relit l'état courant pour savoir quoi faire, ce qui évite
  // tout risque de désynchronisation avec ce qui a été affiché.
  const fabContinue = document.getElementById('fabContinue');
  if(fabContinue) fabContinue.onclick = () => { const ps = getPlayState(state); if(ps.action) ps.action(); };
  const fabFold = document.getElementById('fabFold');

  const fabCall = document.getElementById('fabCall');

  const btnSummaryNext = document.getElementById('btnSummaryNext');
  if(btnSummaryNext) btnSummaryNext.onclick = () => nextHand();
}

  window.scrollTo(0,0);

// ============================================================
// TESTS INTERNES — audit automatique de la logique poker/maths.
// N'affecte jamais le rendu normal : résultats en console + petit
// panneau développeur désactivable (lien "tests" dans la sidebar).
// ============================================================
function runPokerTests(){
  const results = [];
  const assert = (name, cond) => results.push({ name, pass: !!cond });

  const d = deck();
  assert('Deck = 52 cartes', d.length===52);
  assert('Aucune carte dupliquée dans le deck', new Set(d.map(cardKey)).size===52);

  const hole2 = [d[0], d[1]];
  assert('50 cartes restantes après 2 cartes en main', cardsRemaining(hole2).length===50);
  const flop3 = [d[2],d[3],d[4]];
  assert('47 cartes restantes au flop', cardsRemaining([...hole2,...flop3]).length===47);
  const turnCard = [d[5]];
  assert('46 cartes restantes au turn', cardsRemaining([...hole2,...flop3,...turnCard]).length===46);
  const riverCard = [d[6]];
  assert('45 cartes restantes à la river', cardsRemaining([...hole2,...flop3,...turnCard,...riverCard]).length===45);

  assert('C(50,3) = 19 600', combinations(50,3)===19600);
  assert('C(47,2) = 1 081', combinations(47,2)===1081);

  // Regression : bug d'off-by-one dans hasStraight (corrigé) — J-Q-K-A sans 10 n'est PAS une quinte.
  assert('J-Q-K-A sans le 10 n\u2019est PAS une quinte (régression off-by-one)', hasStraight([{rank:'K'},{rank:'Q'},{rank:'J'},{rank:'A'},{rank:'2'}])===false);
  assert('T-J-Q-K-A EST une quinte', hasStraight([{rank:'T'},{rank:'J'},{rank:'Q'},{rank:'K'},{rank:'A'}])===true);
  assert('A-2-3-4-5 (wheel) EST une quinte', hasStraight([{rank:'A'},{rank:'2'},{rank:'3'},{rank:'4'},{rank:'5'}])===true);

  {
    const hole=[{rank:'A',suit:'♠'},{rank:'K',suit:'♠'}], board=[{rank:'Q',suit:'♠'},{rank:'7',suit:'♠'},{rank:'2',suit:'♦'}];
    const s = calculateDrawStats(hole,board).find(x=>x.name==='Couleur');
    assert('Tirage couleur classique (4 cartes) = 9 outs', !!s && s.outs===9);
  }
  {
    const hole=[{rank:'9',suit:'♣'},{rank:'8',suit:'♦'}], board=[{rank:'7',suit:'♠'},{rank:'6',suit:'♥'},{rank:'2',suit:'♦'}];
    const s = calculateDrawStats(hole,board).find(x=>x.name==='Quinte par les deux bouts');
    assert('Open-ended (OESD) = 8 outs', !!s && s.outs===8);
  }
  {
    const hole=[{rank:'J',suit:'♣'},{rank:'T',suit:'♦'}], board=[{rank:'9',suit:'♠'},{rank:'7',suit:'♥'},{rank:'2',suit:'♦'}];
    const s = calculateDrawStats(hole,board).find(x=>x.name.includes('bout') && !x.name.includes('deux'));
    assert('Gutshot = 4 outs', !!s && s.outs===4);
  }
  {
    const hole=[{rank:'8',suit:'♠'},{rank:'8',suit:'♦'}], board=[{rank:'A',suit:'♣'},{rank:'7',suit:'♥'},{rank:'2',suit:'♠'}];
    const s = calculateDrawStats(hole,board).find(x=>x.name==='Brelan / set');
    assert('Paire servie → brelan/set = 2 outs', !!s && s.outs===2);
  }
  {
    // Régression : une TOP PAIRE (pas une paire servie) ne doit jamais déclencher "Brelan / set".
    const hole=[{rank:'A',suit:'♠'},{rank:'K',suit:'♦'}], board=[{rank:'A',suit:'♥'},{rank:'7',suit:'♣'},{rank:'2',suit:'♠'}];
    const s = calculateDrawStats(hole,board).find(x=>x.name==='Brelan / set');
    assert('Top paire (non paire servie) ne déclenche pas "Brelan / set" (régression)', !s);
  }

  {
    const pot=20, bet=10, potFinal=pot+bet+bet;
    assert('Pot odds 20/10 → 25% d\u2019equity', Math.abs((bet/potFinal)*100 - 25) < 0.01);
    assert('Cote 30:10 = 3:1', Math.abs(((pot+bet)/bet) - 3) < 0.01);
  }

  {
    const sixMaxHasForbidden = ['UTG+1','MP','LJ'].some(p => templates.some(t=>t.heroPosition===p && SIX_MAX.includes(p)));
    assert('6-max ne référence jamais UTG+1 / MP / LJ', !sixMaxHasForbidden);
    assert('9-max dispose d\u2019au moins un spot pour chaque position', NINE_MAX.every(p => templates.some(t=>t.heroPosition===p)));
  }

  {
    let ok = true;
    for(let i=0;i<12 && ok;i++){
      for(const gen of [...PROBA_GENERATORS, ...COTE_GENERATORS]){
        const q = gen.generate();
        const correctCount = q.options.filter(o=>o.isCorrect).length;
        const labels = q.options.map(o=>o.label);
        if(correctCount!==1 || new Set(labels).size!==labels.length || labels.length<2){ ok=false; break; }
      }
    }
    assert('QCM : toujours exactement 1 bonne réponse, options uniques (12 tirages × chaque générateur)', ok);
  }

  // --- V2.2 : système MIX à 3 états (JUSTE / ACCEPTABLE / INCORRECT) ---
  {
    const spot = templates.find(t=>t.id==='btn-flat-aqs'); // CALL 58% / 3BET 40% / FOLD 2%
    assert('MIX préflop : action principale = top', preflopTier(spot,'CALL')==='top');
    assert('MIX préflop : alternative mixée (≥15%) = mixed, pas error', preflopTier(spot,'3BET')==='mixed');
    assert('MIX préflop : action quasi nulle = error', preflopTier(spot,'FOLD')==='error');
  }
  {
    const solution = { action:'BET 33%' };
    assert('MIX postflop : action recommandée = top', postflopTier(solution,'BET 33%')==='top');
    assert('MIX postflop : sizing adjacent = mixed, pas error', postflopTier(solution,'BET 25%')==='mixed');
    assert('MIX postflop : direction opposée (CHECK) = error', postflopTier(solution,'CHECK')==='error');
  }
  {
    // Une réponse MIX ne doit pas casser la série ni compter comme une erreur dans les stats.
    const fakeHistory = [
      { correct:true, tier:'top' }, { correct:true, tier:'mixed' }, { correct:false, tier:'error' },
    ];
    const topAndMixedCountAsOk = fakeHistory.slice(0,2).every(i=>i.correct===true);
    assert('Une réponse MIX est comptée comme correcte (pas une erreur) dans les stats', topAndMixedCountAsOk);
  }

  // --- Boutons cohérents avec le contexte ---
  {
    const firstIn = templates.find(t=>t.villainPosition==='—' && (t.actions||[]).length===0);
    assert('Spot first-in : ne propose pas CALL inutilement', !!firstIn && !firstIn.preflop.options.includes('CALL'));
    const facingOpen = templates.find(t=>t.id==='bb-call-q9s');
    assert('Spot face à un open : propose FOLD/CALL/3BET', ['FOLD','CALL','3BET'].every(a=>facingOpen.preflop.options.includes(a)));
  }

  // --- Multiway : positions et séquence d'action affichées correctement ---
  {
    const spot = templates.find(t=>t.id==='bb-squeeze-a5s'); // CO open puis BTN call (squeeze)
    const log6 = buildActionLog(spot, 6);
    const hasCorrectSequence = log6.some(s=>s.pos==='CO' && s.action==='open') && log6.some(s=>s.pos==='BTN' && s.action==='call');
    assert('Séquence d\u2019action multiway : ouvreur et second joueur bien identifiés', hasCorrectSequence);
    const log9 = buildActionLog(spot, 9);
    assert('Séquence d\u2019action 9-max : les positions supplémentaires (UTG+1/MP/LJ) sont bien foldées avant l\u2019action', log9.some(s=>s.pos==='UTG+1'&&s.action==='fold') && log9.some(s=>s.pos==='LJ'&&s.action==='fold'));
  }

  // --- BUG CORRIGÉ : sur certains spots, l'ouverture/le 3-bet de héros était pré-scripté dans les
  // données, sans jamais lui laisser décider — désormais c'est une vraie décision, notée, et la
  // pression de l'adversaire (3-bet/4-bet) n'arrive dynamiquement que s'il ne fold pas. ---
  {
    const spot = templates.find(t=>t.id==='co-4bet-qq');
    assert('co-4bet-qq démarre "premier à parler" (pas de villain pré-scripté)', spot.villainPosition==='—' && (spot.actions||[]).length===0);
    assert('co-4bet-qq : l\u2019ouverture est une vraie décision (OPEN/FOLD)', spot.preflop.options.includes('OPEN') && spot.preflop.options.includes('FOLD'));
    assert('co-4bet-qq : la pression (3-bet de BTN) est décrite dans un followup, pas pré-scriptée', !!spot.followup && spot.followup.triggerAction==='OPEN' && spot.followup.villainAction==='3bet');
    const bbSpot = templates.find(t=>t.id==='bb-4bet-aks');
    assert('bb-4bet-aks : le 3-bet de héros est une vraie décision (FOLD/CALL/3BET)', ['FOLD','CALL','3BET'].every(a=>bbSpot.preflop.options.includes(a)));
    assert('bb-4bet-aks : la 4-bet de BTN est décrite dans un followup, pas pré-scriptée', !!bbSpot.followup && bbSpot.followup.triggerAction==='3BET' && bbSpot.followup.villainAction==='4bet');
  }

  // --- Historique : contient bien main, position, contexte, action, résultat ---
  {
    const sampleItem = { hand:'AQs', position:'BTN', situation:'CO open 2.3 bb', decision:'CALL', tier:'top' };
    const hasAllFields = ['hand','position','situation','decision','tier'].every(k=>sampleItem[k]!==undefined);
    assert('Historique : contient main, position, contexte, action et résultat', hasAllFields);
  }

  // --- Classification structurelle des tirages quinte (pas uniquement par nombre d'outs) ---
  {
    // OESD réel : 9-8-7-6 en main+board, ouvert des deux côtés (5 ou T)
    const hole=[{rank:'9',suit:'♣'},{rank:'8',suit:'♦'}], board=[{rank:'7',suit:'♠'},{rank:'6',suit:'♥'},{rank:'2',suit:'♦'}];
    const c = classifyStraightDraw(hole, board);
    assert('OESD structurel correctement identifié (pas double gutshot)', !!c && c.label==='Quinte par les deux bouts');
  }
  {
    // Double quinte ventrale réelle : Q8 sur T-9-6 (rangs connectants 7 et J, sans suite de 4 déjà formée)
    const hole=[{rank:'Q',suit:'♠'},{rank:'8',suit:'♦'}], board=[{rank:'T',suit:'♣'},{rank:'9',suit:'♥'},{rank:'6',suit:'♠'}];
    const c = classifyStraightDraw(hole, board);
    assert('Double gutshot distingué structurellement d\u2019un OESD (même 8 outs, structure différente)', !!c && c.label.includes('Double quinte ventrale'));
  }
  {
    const hole=[{rank:'J',suit:'♣'},{rank:'T',suit:'♦'}], board=[{rank:'9',suit:'♠'},{rank:'7',suit:'♥'},{rank:'2',suit:'♦'}];
    const c = classifyStraightDraw(hole, board);
    assert('Gutshot simple toujours correctement identifié', !!c && c.label.includes('gutshot') && !c.label.includes('Double'));
  }

  // --- Barre de progression : ne doit jamais afficher 0% juste après avoir complété un bloc de 10 ---
  {
    const sessionPosAt10 = ((10-1) % 10) + 1;
    const sessionPosAt11 = ((11-1) % 10) + 1;
    assert('Progression : 10 décisions → position 10/10 (pas 0%)', sessionPosAt10===10);
    assert('Progression : 11 décisions → repart à 1/10, pas une fausse valeur', sessionPosAt11===1);
  }

  // --- BUG CORRIGÉ : ordre de parole postflop (différent du préflop, part de SB/BB puis UTG...BTN) ---
  {
    const mpVsUtg = templates.find(t=>t.id==='mp-vs-utg-aqs'); // MP a callé l'open d'UTG
    assert('MP face à UTG : UTG (hors position) parle en premier postflop, pas MP', heroActsFirstPostflop(mpVsUtg)===false);
    const btnVsCo = templates.find(t=>t.id==='btn-flat-aqs'); // BTN a callé l'open de CO
    assert('BTN face à CO : CO (hors position) parle en premier postflop, pas BTN', heroActsFirstPostflop(btnVsCo)===false);
    const bbVsBtn = templates.find(t=>t.id==='bb-call-q9s'); // BB a callé l'open de BTN
    assert('BB face à BTN : BB (hors position) parle bien en premier postflop', heroActsFirstPostflop(bbVsBtn)===true);
    const coVsBtn4bet = templates.find(t=>t.id==='co-4bet-qq'); // CO a ouvert, s'est fait 3-bet par BTN
    assert('CO face à BTN (4-bet pot) : CO (hors position) parle en premier postflop', heroActsFirstPostflop(coVsBtn4bet)===true);
    const firstIn = templates.find(t=>t.villainPosition==='—');
    assert('Spot first-in (pas de villain) : héros parle en premier par défaut', heroActsFirstPostflop(firstIn)===true);
  }

  // --- Nouveaux spots multiway : limp + iso-raise, et squeeze (open + call) ---
  {
    const isoSpot = templates.find(t=>t.id==='btn-vs-limp-iso-kqs');
    const log6 = buildActionLog(isoSpot, 6);
    assert('Limp + iso-raise : le limp UTG apparaît bien dans la séquence', log6.some(s=>s.pos==='UTG' && s.action==='limp'));
    assert('Limp + iso-raise : le raise HJ apparaît bien dans la séquence', log6.some(s=>s.pos==='HJ' && s.action==='open'));
    assert('Limp + iso-raise : CO (entre HJ et BTN) est bien foldé automatiquement', log6.some(s=>s.pos==='CO' && s.action==='fold'));
    assert('Limp + iso-raise : options FOLD/CALL/3BET proposées à héros', ['FOLD','CALL','3BET'].every(a=>isoSpot.preflop.options.includes(a)));

    const squeezeSpot = templates.find(t=>t.id==='bb-squeeze-a5s');
    const log6b = buildActionLog(squeezeSpot, 6);
    assert('Squeeze : l\u2019open CO apparaît bien dans la séquence', log6b.some(s=>s.pos==='CO' && s.action==='open'));
    assert('Squeeze : le call BTN apparaît bien dans la séquence', log6b.some(s=>s.pos==='BTN' && s.action==='call'));
    assert('Squeeze : SB (entre BTN et BB) est bien foldé automatiquement', log6b.some(s=>s.pos==='SB' && s.action==='fold'));

    // Cohérence 9-max : les positions supplémentaires doivent aussi apparaître dans la séquence
    const log9 = buildActionLog(isoSpot, 9);
    assert('Limp + iso-raise en 9-max : UTG+1/MP/LJ correctement foldés avant HJ', ['UTG+1','MP','LJ'].every(p=>log9.some(s=>s.pos===p && s.action==='fold')));

    // BUG CORRIGÉ : la phrase de contexte attribuait à tort la DERNIÈRE action à spot.villainPosition,
    // ce qui mélangeait les acteurs sur un spot à plus d'un adversaire (ex. squeeze : CO open, BTN suit).
    const ctx = positionContextText(squeezeSpot);
    assert('Squeeze : la phrase mentionne CO comme celui qui a ouvert (pas "qui suit")', ctx.includes('CO</b> qui open'));
    assert('Squeeze : la phrase mentionne aussi BTN comme celui qui a suivi', ctx.includes('BTN</b> qui suit'));
    const recap = preflopRecapText(squeezeSpot);
    assert('Squeeze : le récap préflop distingue bien CO (open) et BTN (suivi)', recap.includes('CO a ouvert') && recap.includes('BTN a suivi'));
  }

  // --- Profils adverses : ne modifient JAMAIS la fréquence/action "correcte", seulement le sizing ---
  {
    const base = templates.find(t=>t.id==='bb-call-q9s');
    const regSpot = applyVillainProfile(base, 'reg');
    assert('Profil "reg" : aucune modification de sizing (mult = 1)', regSpot.actions[0].amount===base.actions[0].amount);
    assert('Profil : l\u2019action/fréquence correcte du spot n\u2019est jamais modifiée', regSpot.preflop.action===base.preflop.action && regSpot.preflop.frequency===base.preflop.frequency);
    const nitSpot = applyVillainProfile(base, 'nit');
    assert('Profil "nit" : sizing de l\u2019adversaire réduit', nitSpot.actions[0].amount < base.actions[0].amount);
    const lagSpot = applyVillainProfile(base, 'lag');
    assert('Profil "lag" : sizing de l\u2019adversaire augmenté', lagSpot.actions[0].amount > base.actions[0].amount);
    assert('Profil : le pot est recalculé proportionnellement au sizing', lagSpot.pot > base.pot);
    const firstIn = templates.find(t=>t.villainPosition==='—');
    const firstInProfiled = applyVillainProfile(firstIn, 'random');
    assert('Profil : jamais assigné sur un spot first-in (pas d\u2019adversaire à lire)', firstInProfiled.villainProfile===null);
  }
  {
    // Un spot à plusieurs actions adverses (squeeze) : chaque action NON-héros est mise à l'échelle,
    // l'action de héros (s'il y en a une) ne l'est jamais.
    const squeeze = templates.find(t=>t.id==='bb-squeeze-a5s');
    const scaled = applyVillainProfile(squeeze, 'lag');
    const co = scaled.actions.find(a=>a.pos==='CO'), btn = scaled.actions.find(a=>a.pos==='BTN');
    assert('Squeeze + profil : CO et BTN (tous deux adversaires) sont mis à l\u2019échelle', co.amount>squeeze.actions[0].amount && btn.amount>squeeze.actions[1].amount);
  }

  // --- Pots multiway : plus d'un adversaire reste actif postflop (ex. squeeze si héros call) ---
  {
    const squeeze = templates.find(t=>t.id==='bb-squeeze-a5s'); // BB vs (CO open, BTN call)
    const activeVsSqueeze = activeNonHeroPositions(squeeze, 6);
    assert('Squeeze : CO et BTN sont TOUS LES DEUX actifs postflop (pot multiway), pas un seul villain', activeVsSqueeze.includes('CO') && activeVsSqueeze.includes('BTN'));
    assert('Squeeze : héros (BB) parle bien en premier face à un pot multiway', heroActsFirstPostflop(squeeze, 6)===true);
    const single = templates.find(t=>t.id==='bb-call-q9s');
    assert('Spot à un seul adversaire : un seul joueur actif (pas de faux multiway)', activeNonHeroPositions(single, 6).length===1);
  }

  // --- Stack de l'adversaire : toujours cohérent avec le stack effectif (jamais contradictoire) ---
  {
    const base = templates.find(t=>t.id==='bb-call-q9s');
    let allConsistent = true;
    for(let i=0;i<10;i++){
      const spot = applyVillainProfile(base, 'random');
      if(spot.villainStack!==null && spot.villainStack < spot.effectiveStack) allConsistent = false;
    }
    assert('Stack adversaire toujours ≥ stack effectif (10 tirages vérifiés)', allConsistent);
  }

  // --- QCM "Identifiez l'adversaire" : toujours 1 bonne réponse, options uniques ---
  {
    let ok = true;
    for(let i=0;i<15 && ok;i++){
      const q = genVillainStatQuestion();
      const correctCount = q.options.filter(o=>o.isCorrect).length;
      const labels = q.options.map(o=>o.label);
      if(correctCount!==1 || new Set(labels).size!==labels.length || labels.length!==4){ ok=false; }
    }
    assert('QCM identification adversaire : toujours exactement 1 bonne réponse, 4 options uniques', ok);
  }

  // --- "Testez votre profil" : verdict bloqué avant le seuil minimum, cohérent ensuite ---
  {
    const savedHistory = state.history;
    state.history = new Array(10).fill({correct:true, decision:'CALL'});
    const tooFew = computeHeroProfile();
    assert('Profil héros : pas de verdict avant le minimum de mains', tooFew.ready===false);
    state.history = new Array(20).fill(0).map((_,i)=>({correct: i%2===0, decision: i%3===0?'FOLD':'CALL'}));
    const enough = computeHeroProfile();
    assert('Profil héros : verdict disponible après le minimum de mains, avec des taux cohérents (0-100%)', enough.ready===true && enough.foldRate>=0 && enough.foldRate<=100 && enough.accuracy>=0 && enough.accuracy<=100);
    state.history = savedHistory;
  }

  return results;
}
function showTestPanel(){
  const results = runPokerTests();
  const passed = results.filter(r=>r.pass).length;
  let panel = document.getElementById('devTestPanel');
  if(!panel){
    panel = document.createElement('div');
    panel.id = 'devTestPanel';
    panel.style.cssText = 'position:fixed;inset:0;z-index:999;background:rgba(2,11,7,.88);display:flex;align-items:center;justify-content:center;padding:20px;';
    document.body.appendChild(panel);
  }
  panel.innerHTML = `
    <div style="max-width:480px;width:100%;max-height:80vh;overflow:auto;background:#0c2119;border:1px solid #244538;border-radius:16px;padding:20px;font-family:'Space Mono',monospace;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;">
        <strong style="color:#e4b65e;font-size:13px;">Tests internes — ${passed}/${results.length} OK</strong>
        <button id="closeTestPanel" style="all:unset;cursor:pointer;color:#d87561;font-size:16px;">✕</button>
      </div>
      ${results.map(r=>`<div style="padding:6px 0;border-bottom:1px solid #1a382c;font-size:11px;color:${r.pass?'#d5a850':'#e69b8e'}">${r.pass?'✓':'✕'} ${esc(r.name)}</div>`).join('')}
    </div>`;
  document.getElementById('closeTestPanel').onclick = () => panel.remove();
}
document.getElementById('devTestTrigger').onclick = showTestPanel;

    'L\u2019ouverture ou le 3-bet de héros devient une vraie décision jouée (au lieu d\u2019être pré-scriptée) sur les spots facing-3-bet/4-bet.',
    'Choix du sizing d\u2019ouverture (2 / 2,5 / 3 bb / tapis) avec un feedback séparé de la décision principale.',
    'Bug corrigé : le bouton Réinitialiser ne dépend plus de la boîte de dialogue du navigateur (bloquée dans certains aperçus).',
    'Le rappel préflop reflète toute la séquence vécue, pas seulement ce qui précédait votre décision.',
    'Le résumé sous la table se met à jour street par street au lieu de rester figé sur le préflop.',
  ]},
  { version:'v2.0', items:[
    'Table interactive avec profils d\u2019adversaires (Nit / Régulier / Agressif / Débutant) et stacks affichés.',
    'Nouvelles rubriques : "Testez votre profil" et "Identifiez l\u2019adversaire".',
    'Pots multiway ajoutés (squeeze, limp + iso-raise).',
    'Statistiques détaillées par type de décision (call, 3-bet, 4-bet...).',
  ]},
];
// Tout ce qui n'est pas nécessaire pour jouer (taille de table, difficulté, profil adverse, stats,
// progression) est déplacé dans un panneau de réglages ouvert par l'icône ⚙️, plutôt que d'occuper
// en permanence l'écran principal.
function showSettingsPanel(){
  const s = state;
  const tableLabel = s.table===6 ? '6-max' : '9-max';
  const accuracy = s.history.length ? Math.round((s.history.filter(i=>i.correct).length/s.history.length)*100) : 0;
  const sessionPos = s.history.length===0 ? 0 : ((s.history.length-1) % 10) + 1;
  const progress = (sessionPos/10)*100;
  let panel = document.getElementById('settingsPanel');
  if(!panel){
    panel = document.createElement('div');
    panel.id = 'settingsPanel';
    panel.style.cssText = 'position:fixed;inset:0;z-index:999;background:rgba(2,11,7,.88);display:flex;align-items:center;justify-content:center;padding:20px;';
    document.body.appendChild(panel);
  }
  panel.innerHTML = `
    <div style="max-width:420px;width:100%;max-height:85vh;overflow:auto;background:#0c2119;border:1px solid #244538;border-radius:16px;padding:20px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
        <strong style="color:#e4b65e;font-size:14px;">&#9881; Réglages</strong>
        <button id="closeSettingsPanel" style="all:unset;cursor:pointer;color:#d87561;font-size:16px;">✕</button>
      </div>
      <div class="stats-grid trainer" style="margin-bottom:16px;">
        <div class="stat-card"><div class="stat-top"><span class="stat-label">Décisions</span></div><p class="stat-value">${String(s.history.length).padStart(2,'0')} <span class="cap">réponses</span></p></div>
        <div class="stat-card"><div class="stat-top"><span class="stat-label">Précision</span></div><p class="stat-value">${s.history.length?`${accuracy}%`:'—'} <span class="cap">cette session</span></p></div>
        <div class="stat-card"><div class="stat-top"><span class="stat-label">Série actuelle</span></div><p class="stat-value">${String(s.streak).padStart(2,'0')} <span class="cap">justes</span></p></div>
      </div>
      <div class="progress-row" style="margin-bottom:20px;">
        <div class="progress-track"><div class="progress-fill" style="width:${sessionPos?progress:4}%"></div></div>
        <span class="progress-note">Session ${sessionPos}/10 · ${tableLabel}</span>
      </div>
      <p class="m-title" style="margin-bottom:8px;">Taille de table</p>
      <div class="seg" id="tableSeg" style="margin-bottom:16px;">
        <button data-table="6" class="${s.table===6?'active':''}" style="flex:1;">6-max</button>
        <button data-table="9" class="${s.table===9?'active':''}" style="flex:1;">9-max</button>
      </div>
      <p class="m-title" style="margin-bottom:8px;">Difficulté</p>
      <select id="difficultySelect" class="filter-select" style="width:100%;margin-bottom:16px;">
        ${['Tous','Débutant','Intermédiaire','Avancé'].map(d=>`<option value="${d}" ${s.difficulty===d?'selected':''}>${d==='Tous'?'Tous niveaux':d}</option>`).join('')}
      </select>
      <p class="m-title" style="margin-bottom:8px;">Profil des adversaires</p>
      <select id="villainProfileSelect" class="filter-select" style="width:100%;margin-bottom:20px;">
        <option value="random" ${s.villainProfileMode==='random'?'selected':''}>Adversaires variés</option>
        ${VILLAIN_PROFILE_KEYS.map(k=>`<option value="${k}" ${s.villainProfileMode===k?'selected':''}>${VILLAIN_PROFILES[k].name}</option>`).join('')}
      </select>
      <button class="btn-outline" id="settingsRevueBtn" style="width:100%;">&#128200; Revue détaillée</button>
    </div>`;
  const closePanel = () => panel.remove();
  document.getElementById('closeSettingsPanel').onclick = closePanel;
  document.getElementById('tableSeg').querySelectorAll('button').forEach(b => b.onclick = () => {
    state.table = parseInt(b.dataset.table);
    storage.setItem('poker-table-size', String(state.table));
    state.spot = pickSpot(state.table, undefined, state.difficulty, state.villainProfileMode);
    state.phase='preflop'; state.selected=null; state.postAction=null; state.street='FLOP';
    state.preflopOutcome=null; state.postflopOutcome=null; state.facingSurprise=null; state.facingPreflopRaise=null; state.streetLog=[];
    state.awaitingOpenSize=false; state.openSize=null; state.openSizeTier=null; state.awaitingFollowupReveal=false; state.allInRunout=false;
    state.handLog=[]; state.handOver=false;
    closePanel(); render();
  });
  document.getElementById('difficultySelect').onchange = (e) => {
    state.difficulty = e.target.value;
    storage.setItem('poker-difficulty', state.difficulty);
    state.spot = pickSpot(state.table, undefined, state.difficulty, state.villainProfileMode);
    state.phase='preflop'; state.selected=null; state.postAction=null; state.street='FLOP';
    state.preflopOutcome=null; state.postflopOutcome=null; state.facingSurprise=null; state.facingPreflopRaise=null; state.streetLog=[];
    state.awaitingOpenSize=false; state.openSize=null; state.openSizeTier=null; state.awaitingFollowupReveal=false; state.allInRunout=false;
    state.handLog=[]; state.handOver=false;
    closePanel(); render();
  };
  document.getElementById('villainProfileSelect').onchange = (e) => {
    state.villainProfileMode = e.target.value;
    storage.setItem('poker-villain-profile', state.villainProfileMode);
    state.spot = pickSpot(state.table, undefined, state.difficulty, state.villainProfileMode);
    state.phase='preflop'; state.selected=null; state.postAction=null; state.street='FLOP';
    state.preflopOutcome=null; state.postflopOutcome=null; state.facingSurprise=null; state.facingPreflopRaise=null; state.streetLog=[];
    state.awaitingOpenSize=false; state.openSize=null; state.openSizeTier=null; state.awaitingFollowupReveal=false; state.allInRunout=false;
    state.handLog=[]; state.handOver=false;
    closePanel(); render();
  };
  document.getElementById('settingsRevueBtn').onclick = () => { closePanel(); goTo('/stats'); };
}
function showChangelogPanel(){
  let panel = document.getElementById('changelogPanel');
  if(!panel){
    panel = document.createElement('div');
    panel.id = 'changelogPanel';
    panel.style.cssText = 'position:fixed;inset:0;z-index:999;background:rgba(2,11,7,.88);display:flex;align-items:center;justify-content:center;padding:20px;';
    document.body.appendChild(panel);
  }
  panel.innerHTML = `
    <div style="max-width:480px;width:100%;max-height:80vh;overflow:auto;background:#0c2119;border:1px solid #244538;border-radius:16px;padding:20px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;">
        <strong style="color:#e4b65e;font-size:14px;">&#128220; Changelog</strong>
        <button id="closeChangelogPanel" style="all:unset;cursor:pointer;color:#d87561;font-size:16px;">✕</button>
      </div>
      ${CHANGELOG.map(v => `
        <div style="margin-bottom:18px;">
          <p style="margin:0 0 8px;font-family:'Space Mono',monospace;font-size:12px;color:#d5a850;">${v.version}</p>
          ${v.items.map(it=>`<p style="margin:0 0 6px;font-size:12px;line-height:1.5;color:#a5b8a5;">• ${it}</p>`).join('')}
        </div>`).join('')}
    </div>`;
  document.getElementById('closeChangelogPanel').onclick = () => panel.remove();
}
document.getElementById('changelogTrigger').onclick = showChangelogPanel;
try{
  const bootResults = runPokerTests();
  const bootFailed = bootResults.filter(r=>!r.pass);
  if(bootFailed.length){ console.warn(`[poker-tests] ${bootFailed.length}/${bootResults.length} test(s) en échec :`, bootFailed.map(r=>r.name)); }
  else { console.log(`[poker-tests] ${bootResults.length}/${bootResults.length} tests OK`); }
}catch(e){ console.error('[poker-tests] erreur pendant l\u2019exécution des tests', e); }

render();
</script>
</body>
</html>
