 return new Set(table ? table[tier] : (OPEN_RANGES[position] || []));
}
// N'override QUE quand le palier réel du stack tiré diffère du palier pour lequel le template a été
// écrit (stackStrategyTier(template.effectiveStack)) : si le stack reste dans le même palier que la
// conception d'origine, on garde sa décision telle quelle (texte, explication, sizing déjà cohérents),
// même si elle s'écarte légèrement du classement Chen — le template reste la référence pour SON propre
// palier. On ne recalcule que pour les paliers qu'il ne couvre pas nativement.
function applyOpenTierRange(spot, baselineStack){
 const table = OPEN_TIER_RANGE_BY_POSITION[spot.heroPosition];
 if(!table) return spot; // BB : pas de range d'ouverture à faire varier
 const baselineTier = stackStrategyTier(baselineStack);
 const strat = stackStrategyTier(spot.effectiveStack);
 if(baselineTier===strat) return spot; // même palier que le template d'origine : rien à changer
 // Passe par getEffectiveRange() plutôt que d'indexer OPEN_TIER_RANGE_BY_POSITION directement ici :
 // c'est la même fonction que la Range Matrix utilise pour l'affichage (voir plus bas) — une seule
 // source, jamais deux lectures qui pourraient un jour diverger.
 const inRange = getEffectiveRange({ position: spot.heroPosition, effectiveStack: spot.effectiveStack, table: spot.table }).includes(spot.handClass);
 const alreadyOpen = spot.preflop.action==='OPEN';
 if(inRange===alreadyOpen) return spot; // déjà cohérent avec ce palier, rien à changer
 const tierLabel = STACK_TIER_LABELS[strat];
 if(inRange){
 return {...spot, preflop: { action:'OPEN', frequency:100, options:['OPEN','FOLD'],
 explanation: `À ${spot.effectiveStack} BB (${tierLabel}), ${spot.handClass} entre dans la range d\u2019ouverture ${spot.heroPosition} à ce palier de stack${strat==='pushfold' ? ' : en dessous de 10 BB, le fold equity du tapis rend cette main rentable même si elle ne jouerait pas bien postflop.' : '.'}`,
 rangeLabel: `Open ${spot.heroPosition} ${tierLabel} · dans la range (estimation)` } };
 }
 return {...spot, preflop: { action:'FOLD', frequency:100, options:['OPEN','FOLD'],
 explanation: `À ${spot.effectiveStack} BB (${tierLabel}), ${spot.handClass} sort de la range d\u2019ouverture ${spot.heroPosition} : cette main a besoin de plusieurs rues pour réaliser son équité, ce qui vaut moins avec un stack ${strat==='mid'?'intermédiaire':'court'} en raise-fold.`,
 rangeLabel: `Open ${spot.heroPosition} ${tierLabel} · hors range (estimation)` },
 post: basePost('CHECK',100,'Spot arrêté avant le flop.','—') };
}
// ÉTAPE 6/7 DE LA DEMANDE — SOURCE UNIQUE de "quelle range d'ouverture est effectivement utilisée à ce
// stack". Avant : RangeMatrix() lisait OPEN_RANGES[position] BRUT (toujours la référence 100bb),
// tandis qu'applyOpenTierRange() ci-dessus appliquait déjà un ajustement par palier de stack au moteur
// de décision — les deux pouvaient donc afficher des ranges différentes pour le même spot. Cette
// fonction ne recrée rien : elle réutilise OPEN_TIER_RANGE_BY_POSITION (déjà construit plus haut) et
// devient le point d'accès commun pour le moteur ET pour l'affichage (Range Matrix), en gardant
// OPEN_RANGES comme la référence de base, jamais supprimée. `context.format`/`context.anteOn` sont
// acceptés pour l'API mais n'affectent pas ENCORE la composition de la range elle-même (seule
// contextRangeAdjustment, séparée, ajuste les décisions à fréquence mixte selon le format/l'ante) —
// pas d'invention d'un ajustement supplémentaire non demandé.
function getEffectiveRange(context){
 const { position, effectiveStack, table: tableSize } = context;
 const strat = stackStrategyTier(effectiveStack);
 // GTO réel 6-max 100bb (mpcaren/preflop-range-trainer) prime sur la liste resserrée à la main
 // UNIQUEMENT quand on sait qu'on est en 6-max ET à 100bb (palier 'deep') : aux autres paliers de
 // stack ou en 9-max, aucune donnée solveur n'existe, donc OPEN_RANGES/OPEN_TIER_RANGE_BY_POSITION
 // reste la référence (comportement strictement inchangé pour tout appelant qui ne précise pas `table`).
 // Les données réelles sont calées sur 100bb pile — le palier 'deep' couvre "40bb+" au sens large
 // (STACK_TIER_LABELS), donc on vérifie le stack exact plutôt que le palier seul pour ne jamais
 // appliquer des fréquences 100bb à un spot 45bb ou 200bb.
 if(tableSize===6 && strat==='deep' && Math.round(effectiveStack)===100){
 const real = gtoRfiRangeArray6Max(position);
 if(real) return real;
 }
 const table = OPEN_TIER_RANGE_BY_POSITION[position];
 if(!table) return OPEN_RANGES[position] || []; // ex. BB : pas de range d'ouverture, pas de palier à appliquer
 return table[strat] || OPEN_RANGES[position] || [];
}
// ============================================================
// DÉFENSE CONTRE UNE OUVERTURE — même mécanique que applyOpenTierRange, mais côté "je réponds à une
// ouverture adverse" (call/3-bet/fold) plutôt que "j'ouvre premier". Contrairement à l'open (où on a
// une vraie référence par position, OPEN_RANGES), on ne connaît ici que le mix propre à CHAQUE
// template (ex. "CALL 66% / 3BET 22% / FOLD 12%") — on en déduit une fraction "continue" (tout ce qui
// n'est pas fold), qu'on fait varier par palier avec le même classement Chen, plutôt que d'inventer une
// table de ranges de défense par position qu'on n'a pas.
// Restreint à une liste explicite de catégories qui représentent une vraie décision "je réponds à une
// action adverse" — pas les catégories où le héros est l'agresseur (Iso-raise, Facing check-raise, qui
// est en réalité un open déguisé suivi d'une relance POSTFLOP scriptée).
const DEFENSE_TIER_CATEGORIES = new Set([
 'BB defend', 'Flat / 3-bet', 'BB vs min-raise', 'BB vs SB steal',
 'Resteal', 'Squeeze', 'Squeeze multiway', 'Short stack resteal',
 'Short stack 4-bet', 'Facing aggression',
 // V3.0 : deux nouvelles catégories autonomes "je réponds à une relance adverse" (pas seulement via
 // followup) — elles suivent la même logique de palier de stack que le reste de cette liste.
 'Facing 3-bet', 'Facing 4-bet',
 // V3.1 : idem pour les deux patterns multiway "je subis une relance" plutôt que "je relance" —
 // le hero cold-caller/limper/ouvreur qui répond à un squeeze ou à un iso-raise.
 'Facing squeeze', 'Facing iso-raise',
]);
function chenContinueFraction(preflop){
 if(preflop.mix){
 const foldFreq = preflop.mix.filter(m=>m.action==='FOLD').reduce((a,m)=>a+m.freq,0);
 return 1 - foldFreq/100;
 }
 return preflop.action==='FOLD' ? 0 : 1;
}
// TIER_WIDTH_MULTIPLIER est défini une seule fois, plus haut (juste avant OPEN_TIER_RANGE_BY_POSITION),
// et réutilisé ici — les deux mécanismes d'extrapolation par palier partagent maintenant la même source.
function applyDefenseTierRange(spot, baselineStack){
 if(!DEFENSE_TIER_CATEGORIES.has(spot.category) || spot.villainPosition==='—' || !spot.handClass) return spot;
 const baselineTier = stackStrategyTier(baselineStack);
 const strat = stackStrategyTier(spot.effectiveStack);
 if(baselineTier===strat) return spot; // même palier que le template d'origine : on garde sa décision telle quelle
 const continueFraction = chenContinueFraction(spot.preflop);
 if(continueFraction<=0 || continueFraction>=1) return spot; // décision déjà tranchée à 0% ou 100% : rien à faire varier avec un classement
 const baselineK = Math.max(1, Math.round(169*continueFraction));
 const targetK = Math.min(169, Math.max(1, Math.round(baselineK * (TIER_WIDTH_MULTIPLIER[strat]/TIER_WIDTH_MULTIPLIER[baselineTier]))));
 const inRange = CHEN_RANKED_HANDS.slice(0, targetK).includes(spot.handClass);
 const wasContinuing = spot.preflop.action!=='FOLD';
 if(inRange===wasContinuing) return spot; // déjà cohérent avec ce palier, rien à changer
 const tierLabel = STACK_TIER_LABELS[strat];
 if(inRange){
 // Bascule fold -> continue : on reprend l'action non-fold dominante du mix d'origine s'il y en a
 // une (ex. 3BET), plutôt que d'inventer une action absente des options proposées par le spot.
 const fallback = (spot.preflop.mix||[]).filter(m=>m.action!=='FOLD').sort((a,b)=>b.freq-a.freq)[0];
 const action = fallback ? fallback.action : ((spot.preflop.options||[]).find(o=>o!=='FOLD') || 'CALL');
 return {...spot, preflop: { action, frequency:100, options: spot.preflop.options,
 explanation: `À ${spot.effectiveStack} BB (${tierLabel}), ${spot.handClass} continue face à cette ouverture à ce palier de stack${strat==='pushfold' ? ' : en dessous de 10 BB, le prix à payer et le fold equity changent la donne.' : '.'}`,
 rangeLabel: `${spot.category} ${tierLabel} · continue (estimation)` } };
 }
 return {...spot, preflop: { action:'FOLD', frequency:100, options: spot.preflop.options,
 explanation: `À ${spot.effectiveStack} BB (${tierLabel}), ${spot.handClass} devient un fold face à cette ouverture : cette main ne vaut plus la peine d\u2019être défendue à ce palier de stack.`,
 rangeLabel: `${spot.category} ${tierLabel} · fold (estimation)` },
 post: basePost('CHECK',100,'Spot arrêté avant le flop.','—') };
}
function applyStackTierRange(spot, baselineStack){
 if(spot.category==='Open first in') return applyOpenTierRange(spot, baselineStack);
 return applyDefenseTierRange(spot, baselineStack);
}
// Interpole {{BB}} par le vrai stack tiré dans les quelques textes qui le citent explicitement
// (sans effet sur les autres, où le token est simplement absent).
function interpolateStack(text, stackBB){
 return typeof text==='string' ? text.replace(/\{\{BB\}\}/g, stackBB) : text;
}
// ============================================================
// STACKS PAR SIÈGE — jusqu'ici, TOUS les autres joueurs à table affichaient le même nombre que le
// stack effectif du héros (100bb pour tout le monde, ou 20bb pour tout le monde) : en tournoi, chaque
// joueur a un stack différent. On tire maintenant un stack indépendant et réaliste pour chaque siège
// (UTG à 15bb, BTN à 30bb, SB à 100bb...), sans toucher au stack effectif héros/adversaire qui, lui,
// reste calibré par jitterStack() pour que le raisonnement du spot (push/fold, SPR, etc.) reste valable.
function generateTableStacks(order, heroPosition){
 const stacks = {};
 order.forEach(pos => {
 if(pos===heroPosition) return;
 const roll = Math.random();
 if(roll<0.15) stacks[pos] = Math.round(8 + Math.random()*12); // ~15% : short stack (8-20bb)
 else if(roll<0.75) stacks[pos] = Math.round(20 + Math.random()*50); // ~60% : stack moyen (20-70bb)
 else stacks[pos] = Math.round(70 + Math.random()*80);  // ~25% : stack profond (70-150bb)
 });
 return stacks;
}
// BUG CORRIGÉ : voir le commentaire détaillé dans pickSpot() — empêche deux révisions de file de
// répétition espacée de s'enchaîner sans main "normale" entre les deux.
let lastPickWasSrsReview = false;
function pickSpot(table, current, difficulty, villainProfileMode){
 difficulty = difficulty || 'Tous';
 const allowed = table===6 ? SIX_MAX : NINE_MAX;
 const maxDifficulty = difficulty==='Débutant'?1 : difficulty==='Intermédiaire'?2 : difficulty==='Avancé'?3 : 3;
 // requiresNineMax : certains spots référencent une position adverse (UTG+1/MP/LJ) qui n'existe pas
 // à une table 6-max même quand heroPosition, lui, y est valide (ex. BB face à un open de LJ) — sans
 // ce filtre, la narration citerait une position absente de la table affichée.
 let pool = templates.filter(t => allowed.includes(t.heroPosition) && t.difficulty<=maxDifficulty && t.id!==current && !(table===6 && t.requiresNineMax));
 // RETOUR D'USAGE DIRECT — plafond DUR (pas juste une pondération plus faible) : après 2 tirages
 // consécutifs de la même catégorie, on la retire carrément du pool pour ce tirage, et après une main
 // poubelle (junkExample), on retire toutes les mains poubelles du pool suivant. Toujours avec repli
 // sur le pool précédent si le filtre viderait tout (aucun autre spot possible à cette table/ce niveau).
 const repeatedCategory = lastNCategoriesAllSame(2);
 if(repeatedCategory){
 const varied = pool.filter(t => t.category!==repeatedCategory);
 if(varied.length) pool = varied;
 }
 if(lastDrawWasJunkExample()){
 const noJunk = pool.filter(t => !t.junkExample);
 if(noJunk.length) pool = noJunk;
 }

 // palier de stack), indépendante du mode "travailler mes erreurs" ci-dessous. Les deux peuvent se
 // cumuler : si le résultat est vide, on retombe sur le pool précédent plutôt que de bloquer le tirage.
 const df = state.drillFilter;
 // V2.3 : le filtre "profondeur de stack" se base maintenant sur le stack RÉELLEMENT tiré pour chaque
 // template candidat (via resolveEffectiveStack, qui respecte aussi un stack fixe choisi en réglages),
 // pas sur template.effectiveStack — sinon un template "deep" pouvait finir jitteré en "mid".
 // On mémorise le stack tiré par template (preRolledStack) pour le réutiliser plus bas sans re-tirer.
 const preRolledStack = new Map();
 if(df && (df.positions || (df.stackRange && df.stackRange!=='all'))){
 const stackOk = (t) => {
 if(!df.stackRange || df.stackRange==='all') return true;
 const rolled = resolveEffectiveStack(t, state.stackMode);
 preRolledStack.set(t.id, rolled);
 return stackTier(rolled)===df.stackRange;

 const drilled = pool.filter(t => (!df.positions || df.positions.includes(t.heroPosition)) && stackOk(t));
 if(drilled.length) pool = drilled;
 }
 // MODE "TRAVAILLER MES ERREURS" — au lieu d'une simple pondération (qui laisse quand même passer
 // d'autres spots), on restreint ici le tirage EXCLUSIVEMENT aux positions/catégories identifiées
 // comme leaks par le rapport de coach. Si aucun leak clair ne ressort encore (pas assez de données),
 // on retombe sur le pool normal plutôt que de renvoyer un tirage vide.
 if(state.errorFocusMode){
 const profile = computeHeroProfile();
 if(profile.ready && profile.topLeaks && profile.topLeaks.length){
 const leakPositions = new Set(profile.topLeaks.filter(l=>l.kind==='position').map(l=>l.label));
 const leakCategories = new Set(profile.topLeaks.filter(l=>{
 if(l.kind!=='category') return false;
 const share = pool.filter(t=>t.category===l.label).length / pool.length;
 return share < 0.35; // catégorie trop large (ex. "Open first in") -> inutile pour restreindre
 }).map(l=>l.label));

 // pondéré normal : c'est ce qui garantit qu'un spot raté REVIENT, plutôt que de simplement avoir un

 // BUG CORRIGÉ (retour d'usage : "il me rajoute encore des mains où je me trompe, que des mains à

 // deviennent tous "dus" à peu près en même temps et s'enchaînaient alors SANS RESPIRATION, un tirage
 // dû après l'autre — d'où l'impression d'un mur d'un seul type de spot. `lastPickWasSrsReview` impose

 // pouvait, dans les faits, coincer le tirage sur une position quasi tout le temps).
 const weights = trainerCategoryWeights();
 const posWeightsData = trainerPositionWeights();

 const catCounts = recentCategoryCounts();
 // LOT 6 — pré-calcul UNE fois par tirage (pas dans la boucle ci-dessous) : poids total actuellement

 // MOMENT (donc déjà après tous les filtres table/difficulté/drill/focus erreurs plus haut). C'est ce
 // qui permet de calculer, template par template, le multiplicateur exact nécessaire pour que la
 // position atteigne sa fréquence cible (OPEN_RFI_TARGET) — sans jamais toucher au baseWeight écrit sur
 // les templates eux-mêmes, et en s'adaptant automatiquement si des templates sont ajoutés/retirés.
 const openFirstInTotals = {};
 pool.forEach(t => {
 if(t.category==='Open first in' && t.villainPosition==='—' && OPEN_RFI_TARGET[t.heroPosition]!=null){

 // plus souvent — c'est exactement ce que dit le rapport de coach, maintenant traduit en pratique.
 let posAccWeight = 2;
 const pw = posWeightsData[t.heroPosition];

 posAccWeight = Math.min(posAccWeight, 2.2);

 const pedagogicalWeight = categoryPedagogicalWeight(t.category);

 const catPenalty = Math.pow(0.55, Math.max(0, (catCounts[t.category]||0) - 3));

 let openFirstInFactor = 1;
 const rfiTarget = OPEN_RFI_TARGET[t.heroPosition];
 if(t.category==='Open first in' && t.villainPosition==='—' && rfiTarget!=null){
 const totals = openFirstInTotals[t.heroPosition];
 if(totals && totals.OPEN>0 && totals.FOLD>0){
 const totalW = totals.OPEN + totals.FOLD;

 });
 const totalW = weighted.reduce((a,b)=>a+b,0);
 let r = Math.random()*totalW;
 for(let i=0;i<pool.length;i++){ r -= weighted[i]; if(r<=0){ template = pool[i]; break; } }

 // ne jamais re-tirer un second stack incohérent avec le palier qui a servi à le sélectionner.
 const effectiveStack = preRolledStack.has(template.id) ? preRolledStack.get(template.id) : resolveEffectiveStack(template, state.stackMode);
 const ante = resolveAnte(state);
 const spot = applyStackTierRange({...template, table, hole, runout: [...flop,...future], effectiveStack, ante, pot: template.pot + ante }, template.effectiveStack);
 const numCallers = (spot.actions||[]).filter(a=>a.action==='call').length;
 spot.preflop = contextRangeAdjustment(spot.preflop, effectiveStack, state.anteMode, !!ante, numCallers);
 spot.preflop = {...spot.preflop, explanation: interpolateStack(spot.preflop.explanation, effectiveStack), rangeLabel: interpolateStack(spot.preflop.rangeLabel, effectiveStack) };
 if(spot.followup){
 spot.followup = {...spot.followup, preflop: contextRangeAdjustment(spot.followup.preflop, effectiveStack, state.anteMode, !!ante, numCallers) };

// ============================================================
// GÉNÉRATEUR DYNAMIQUE DE SPOTS POSTFLOP — refonte demandée par l'utilisateur.
// ------------------------------------------------------------
// AVANT : toute la variété du trainer venait du pool `templates` juste au-dessus (fiches écrites à la
// main) : une nouvelle situation voulait dire une nouvelle fiche. Board, main de Hero et action FLOP
// étaient fixés à l'écriture ; seuls TURN/RIVER étaient déjà recalculés dynamiquement
// (computeDynamicStreetPost, plus haut) et les réactions de l'adversaire sont désormais tirées EN LIVE
// par getVillainReaction (plus bas dans ce fichier) plutôt que scriptées.
//
// APRÈS : generatePostflopSpot() CONSTRUIT un spot étape par étape — position (point 19), board par
// catégorie de texture explicite plutôt qu'un tirage uniforme (point 16-17), main de Hero tirée d'une
// vraie range pondérée (GTO_RFI_6MAX quand disponible), puis l'action FLOP elle-même via
// computeDynamicFlopPost qui réutilise EXACTEMENT les mêmes briques que le TURN/la RIVER
// (classifyPostflopHand, determineHeroObjective, classifyRangeAdvantage, pickBetSizeLabel,
// ensureBetOption...) avant de renvoyer au pipeline dynamique déjà existant (computeDynamicStreetPost,
// INCHANGÉE) pour TURN/RIVER — zéro duplication de cette logique. Le résultat a EXACTEMENT la même forme
// qu'un spot issu de `templates`, donc tout le reste de l'app (choosePostflop, TableViz,
// HandSummaryScreen, postflopTier, getVillainReaction...) fonctionne SANS AUCUNE MODIFICATION.
//
// Les réactions de l'adversaire (fold/call/raise/check/donk/check-raise) ne sont PAS pré-calculées ici :
// generatePostflopSpot() construit le SPOT (position, board, main, action de référence par street),
// exactement comme un spot issu de `templates`. La "ligne" réellement jouée reste tirée EN DIRECT par
// getVillainReaction à chaque partie, comme pour n'importe quel autre spot — la figer ici referait perdre
// la variété de rejeu que ce moteur apporte déjà. Le simulateur de statistiques plus bas (point 26)
// rejoue malgré tout une ligne plausible via getVillainReaction, mais uniquement pour ANALYSER la
// diversité produite — jamais pour la figer dans le spot livré au joueur.
//
// Les spots statiques (`templates`) restent intégralement en place : référence, scénarios forcés
// (check-raise/donk garantis via forcedReaction), couverture de cas précis. Le nouveau générateur
// s'ajoute EN PLUS (voir DYNAMIC_SPOT_SHARE, qui pilote la part de tirages qui lui sont envoyés), il ne
// les remplace pas (point 2 et 28 de la demande).
// ============================================================

// --- 1) BOARD GENERATOR — catégories de texture explicites (point 16) ---
const FLOP_TEXTURE_CATEGORIES = ['DRY','CONNECTED','TWO_TONE','MONOTONE','PAIRED'];
function boardMatchesFlopTexture(flop, category){
 const tex = computeBoardTexture(flop);
 const ranksDesc = [...flop].map(c=>numericRank(c.rank)).sort((a,b)=>b-a);
 const spread = ranksDesc[0]-ranksDesc[2];
 if(category==='MONOTONE') return tex.suitMax>=3;
 if(category==='TWO_TONE') return tex.suitMax===2 && !tex.paired;
 if(category==='PAIRED') return tex.paired;
 if(category==='CONNECTED') return !tex.paired && tex.suitMax<3 && spread<=4;
 return !tex.paired && tex.suitMax<3 && spread>4; // DRY
}
// Rejet-échantillonnage sur un deck complet (réutilise deck()/shuffle() déjà existants) plutôt qu'une
// construction carte par carte : plus simple, et se replie proprement (point 21 : jamais planter) si la
// catégorie demandée n'est jamais atteinte dans le budget de tentatives.
function generateFlopByTexture(category, maxAttempts){
 for(let i=0;i<(maxAttempts||250);i++){
 const flop = shuffle(deck()).slice(0,3);
 if(boardMatchesFlopTexture(flop, category)) return flop;
 }
 return shuffle(deck()).slice(0,3); // repli : un flop quelconque plutôt qu'échouer
}
// --- ÉVOLUTION DU BOARD (turn/river) — point 17 : la nouvelle carte est choisie pour produire un TYPE
// d'évolution reconnaissable (blank / overcard / carte qui paire / qui rapproche d'une couleur / qui
// resserre une quinte), pas un tirage uniforme dans le paquet restant.
// Compte le nombre de RANGS DISTINCTS qui forment une paire ou mieux — pas juste le max d'un seul rang
// (maxRankCount) : c'est ce qui manquait pour reconnaître un board DOUBLE-PAIRÉ (ex. K-K-8-8), où deux
// rangs différents ont chacun 2 occurrences, donc maxRankCount reste à 2 comme un simple board pairé une
// seule fois — la différence est le NOMBRE de rangs pairés, pas leur taille.
function boardPairRankCount(cards){
 const counts = {};
 cards.forEach(c => { counts[c.rank] = (counts[c.rank]||0)+1; });
 return Object.values(counts).filter(n => n>=2).length;
}
function cardMatchesEvolution(card, priorBoard, evolution){
 const before = computeBoardTexture(priorBoard);
 const after = computeBoardTexture([...priorBoard, card]);
 const topBefore = Math.max(...priorBoard.map(c=>numericRank(c.rank)));
 const pairRanksBefore = boardPairRankCount(priorBoard);
 const pairRanksAfter = boardPairRankCount([...priorBoard, card]);
 // BUG CORRIGÉ (audit) : un board qui se DOUBLE-paire (un second rang différent qui devient aussi une
 // paire, ex. K-8-5-8 + K -> K-K-8-5-8) ne faisait AUGMENTER ni maxRankCount (qui ne regarde que le plus
 // gros groupe, resté à 2) ni suitMax — cette carte satisfaisait donc à tort la condition BLANK
 // ci-dessous (qui ne vérifiait, elle aussi, que maxRankCount/suitMax). Elle est maintenant reconnue
 // explicitement, et exclue de BLANK/OVERCARD via pairRanksAfter===pairRanksBefore.
 if(evolution==='DOUBLE_PAIRED') return pairRanksAfter>=2 && pairRanksBefore<2;
 if(evolution==='PAIRING') return after.maxRankCount>before.maxRankCount;
 if(evolution==='FLUSH_HEAVY') return after.suitMax>before.suitMax && after.suitMax>=3;
 if(evolution==='STRAIGHT_HEAVY'){
 if(after.straightMade) return false; // "resserre" seulement — une quinte déjà faite est gérée par la force de main, pas la texture
 const numsBefore=[...new Set(priorBoard.map(c=>numericRank(c.rank)))];
 let heavyBefore=false;
 for(let i=0;i<numsBefore.length;i++) for(let j=i+1;j<numsBefore.length;j++) if(Math.abs(numsBefore[i]-numsBefore[j])<=4) heavyBefore=true;
 return after.straightHeavy && !heavyBefore;
 }
 if(evolution==='OVERCARD') return numericRank(card.rank)>topBefore && after.maxRankCount===before.maxRankCount && after.suitMax===before.suitMax && pairRanksAfter===pairRanksBefore;
 return numericRank(card.rank)<=topBefore && after.maxRankCount===before.maxRankCount && after.suitMax===before.suitMax && pairRanksAfter===pairRanksBefore; // BLANK
}
function generateEvolvedCard(priorBoard, excluded, evolution, maxAttempts){
 const avail = shuffle(cardsRemaining(excluded));
 const cap = Math.min(maxAttempts||avail.length, avail.length);
 for(let i=0;i<cap;i++){ if(cardMatchesEvolution(avail[i], priorBoard, evolution)) return avail[i]; }
 return avail[0]; // repli : n'importe quelle carte restante plutôt qu'échouer (jamais de main bloquée)
}
function pickWeighted(pairs){
 const total = pairs.reduce((s,[,w])=>s+w,0);
 let r = Math.random()*total;
 for(const [v,w] of pairs){ r-=w; if(r<=0) return v; }
 return pairs[0][0];
}
// Pondérations de départ (point 23) — un objet simple à ajuster, jamais imposé si la carte/le board exact
// n'est pas atteignable (cardMatchesEvolution/boardMatchesFlopTexture retombent proprement sur "n'importe
// quelle carte valide" plutôt que de forcer une situation artificielle).
const FLOP_TEXTURE_WEIGHTS = [['DRY',34],['CONNECTED',22],['TWO_TONE',22],['PAIRED',14],['MONOTONE',8]];
const EVOLUTION_WEIGHTS = [['BLANK',40],['OVERCARD',21],['PAIRING',15],['FLUSH_HEAVY',9],['STRAIGHT_HEAVY',9],['DOUBLE_PAIRED',6]];
// ------------------------------------------------------------
// POIDS DE FAMILLE — point 12 de l'audit : jusqu'ici seuls les poids de TEXTURE DE BOARD
// (FLOP_TEXTURE_WEIGHTS/EVOLUTION_WEIGHTS, juste au-dessus) étaient centralisés et réglables ; les
// probabilités qui déterminent concrètement les FAMILLES DE LIGNES (c-bet, semi-bluff, donk,
// check-raise...) étaient des nombres écrits en dur dans computeDynamicFlopPost et getVillainReaction.
// Extraction pure : mêmes valeurs qu'avant (aucun changement de comportement), seulement centralisées à
// un seul endroit pour être réglables facilement, comme demandé.
const FAMILY_TUNING = {
 // computeDynamicFlopPost — probabilité de miser (plutôt que checker) selon la catégorie de main au flop
 flopBetProbMedium: 0.55, // main faite correcte (top pair moyen, etc.) mais board pas franchement favorable
 flopBetProbDraw: 0.60, // tirage vivant (semi-bluff)
 flopBetProbAirWithRangeEdge: 0.42, // air total, mais avantage de range net
 // getVillainReaction — multiplicateurs appliqués aux probabilités de base par profil
 checkRaiseRaiseBoost: 1.15, // check-raise réel (l'adversaire avait déjà checké cette street)
 donkBoostValue: 1.35, // donk bet avec une vraie main (VALUE/PROTECTION)
 donkBoostSemiBluff: 1.15, // donk bet en semi-bluff
 donkBoostOther: 0.85, // donk bet avec le reste (air/showdown value)
};

// --- 2) SQUELETTE PRÉFLOP — position réaliste (point 19) + main de Hero tirée d'une VRAIE range pondérée
// (GTO_RFI_6MAX quand disponible, sinon OPEN_RANGES — jamais un nouveau système de ranges).
const DYNAMIC_OPEN_SIZES = [2, 2.2, 2.5, 3];
function pickDynamicSkeleton(table){
 const openerPositions = (table===6 ? SIX_MAX : NINE_MAX).filter(p=>p!=='BB');
 const heroIsAggressor = Math.random()<0.6; // légèrement plus fréquent, cohérent avec le pool statique existant
 if(heroIsAggressor){
 const heroPosition = openerPositions[Math.floor(Math.random()*openerPositions.length)];
 return { heroPosition, villainPosition:'BB', heroIsAggressor:true, openerPosition:heroPosition };
 }
 const villainPosition = openerPositions[Math.floor(Math.random()*openerPositions.length)];
 return { heroPosition:'BB', villainPosition, heroIsAggressor:false, openerPosition:villainPosition };
}
function pickOpenHandClass(openerPosition, table){
 if(table===6 && GTO_RFI_6MAX[openerPosition]){
 // BUG CORRIGÉ (retour d'usage : "toujours une pocket pair ou Ax, j'en peux plus") — un tirage pondéré
 // LINÉAIREMENT par la fréquence d'ouverture GTO donne un poids ~3x plus fort à une main ouverte à
 // 100% (la plupart des paires et mains à As) qu'à une main ouverte à 30% (beaucoup de suited
 // connectors/offsuit) — ça écrasait la diversité perçue même dans une range large comme BTN (mesuré :
 // ~40% paires+Ax même en BTN). Poids adouci (racine carrée) : garde le bon ORDRE (une main plus
 // fréquente reste tirée plus souvent) mais resserre l'écart entre les fréquences, sans jamais faire
 // apparaître une main à fréquence nulle (toujours filtrée avant).
 const entries = Object.entries(GTO_RFI_6MAX[openerPosition]).filter(([,w])=>w>0).map(([h,w])=>[h, Math.pow(w, 0.3)]);
 return pickWeighted(entries);
 }
 const pool = (OPEN_RANGES[openerPosition]&&OPEN_RANGES[openerPosition].length) ? OPEN_RANGES[openerPosition] : CHEN_RANKED_HANDS.slice(0,25);
 return pool[Math.floor(Math.random()*pool.length)];
}
// Heuristique légère de fréquence de défense BB (pas un calcul GTO exact — même statut que
// sizingRationale/pickBetSizeLabel ailleurs dans ce fichier) : une main mieux classée (chenScore, déjà
// utilisé pour trier CHEN_RANKED_HANDS) défend un peu plus souvent.
function estimateDefendFrequency(handClass){
 const idx = CHEN_RANKED_HANDS.indexOf(handClass);
 if(idx<0) return 45;
 const pct = 1 - idx/CHEN_RANKED_HANDS.length;
 return Math.round(35 + pct*55);
}
function synthesizePreflopSkeleton(table){
 const sk = pickDynamicSkeleton(table);
 const { heroPosition, villainPosition, heroIsAggressor, openerPosition } = sk;
 const openHandClass = pickOpenHandClass(openerPosition, table);
 const openSize = DYNAMIC_OPEN_SIZES[Math.floor(Math.random()*DYNAMIC_OPEN_SIZES.length)];
 // Calibré sur les spots existants (ex. 'bb-call-q9s' : open 2.3 bb -> pot 5.5) plutôt que recalculé
 // depuis zéro — même ordre de grandeur pour un open payé, agresseur ou défenseur BB.
 const pot = Math.round((openSize*2 + 0.9)*10)/10;
 let heroHandClass, actions, preflop;
 if(heroIsAggressor){
 heroHandClass = openHandClass;
 actions = [{ pos:villainPosition, action:'call', amount:openSize }];
 const freq = table===6 ? Math.round((gtoRfiFrequency6Max(heroPosition, heroHandClass) ?? 0.9)*100) : 92;
 preflop = { action:'OPEN', frequency:freq, explanation:`${heroHandClass} fait partie de la range d\u2019ouverture ${heroPosition} : ouverture standard à ${openSize} bb.`, options:['OPEN','FOLD'], rangeLabel:`Open ${heroPosition}` };
 } else {
 // La main de VILLAIN (l'ouvreur) suit sa propre range d'ouverture ; la main de HERO (qui décide
 // call/fold en BB) est tirée indépendamment sur un éventail large de mains défendables — exactement
 // la variété que le pool statique, limité à quelques mains écrites par position, n'offrait pas.
 // BUG CORRIGÉ (retour d'usage : "toujours une pocket pair ou Ax") — CHEN_RANKED_HANDS trie par score
 // Chen, qui entasse mécaniquement paires et mains à As en tête de classement (mesuré : slice(0,60)
 // donnait 43% paires+Ax, très au-dessus d'une vraie range de défense BB large). Élargi à slice(0,140) :
 // exclut seulement les ~29 mains les plus faibles du classement (offsuit déconnectées type 72o, 82o,
 // 93o...), garde une vraie diversité de suited connectors/gappers et d'offsuit jouables (mesuré :
 // ramène paires+Ax à ~27%, contre ~22% pour un tirage totalement uniforme sur les 169 mains).
 const defendPool = CHEN_RANKED_HANDS.slice(0, 140);
 heroHandClass = defendPool[Math.floor(Math.random()*defendPool.length)];
 actions = [{ pos:openerPosition, action:'open', amount:openSize }];
 preflop = { action:'CALL', frequency:estimateDefendFrequency(heroHandClass), explanation:`Défense du gros blind face à l\u2019open ${openerPosition} (${openSize} bb) : ${heroHandClass} reste jouable en call ici.`, options:['CALL','3BET','FOLD'], rangeLabel:`Défense BB vs ${openerPosition}` };
 }
 return { heroPosition, villainPosition, heroIsAggressor, heroHandClass, actions, preflop, pot, openSize };
}

// --- 3) DÉCISION FLOP DYNAMIQUE — même famille de logique que le TURN de computeDynamicStreetPost (force
// réelle > texture > avantage de range), jamais dupliquée pour TURN/RIVER : une fois posée ici,
// computeDynamicStreetPost() (INCHANGÉE, appelée depuis generatePostflopSpot comme depuis pickSpot) prend
// le relais pour la suite du spot.
function computeDynamicFlopPost(hole, flopCards, heroIsAggressor){
 const cls = classifyPostflopHand(hole, flopCards);
 const rangeAdv = classifyRangeAdvantage(flopCards);
 const objective = determineHeroObjective(cls, flopCards, { facingBet:false, wasAggressor:heroIsAggressor });
 const favorsHero = rangeAdv.favors==='NEUTRAL' ? null : (rangeAdv.favors==='AGGRESSOR')===heroIsAggressor;
 let action, frequency, reason;
 if(cls.strength==='VERY_STRONG' || cls.strength==='STRONG'){
 action = pickBetSizeLabel(cls.strength, flopCards); frequency = 80;
 reason = `Main déjà très forte au flop (${cls.madeHand.toLowerCase().replace('_',' ')}) : mise standard pour construire le pot dès maintenant.${sizingRationale(cls.strength, flopCards)}`;
 } else if(cls.strength==='MEDIUM'){
 const betsIt = favorsHero!==false || Math.random()<FAMILY_TUNING.flopBetProbMedium;
 if(betsIt){ action = pickBetSizeLabel(cls.strength, flopCards); frequency = 64; reason = `Main faite correcte sur ce flop : mise standard pour la value et un peu de protection.${sizingRationale(cls.strength, flopCards)}`; }
 else { action = 'CHECK'; frequency = 56; reason = `Main correcte, mais ce board avantage plutôt la range adverse : on préfère contrôler la taille du pot que de mettre de la pression sans avantage réel.`; }
 } else if(ACTIVE_DRAWS.has(cls.draw)){
 const betsIt = Math.random()<FAMILY_TUNING.flopBetProbDraw;
 if(betsIt){ action = pickBetSizeLabel('MEDIUM', flopCards); frequency = 58; reason = `Tirage vivant sur ce flop : semi-bluff standard pour prendre l\u2019initiative et faire payer cher les mains dominées qui pourraient suivre.`; }
 else { action = 'CHECK'; frequency = 50; reason = `Tirage réel, mais on peut aussi checker pour garder le pot petit et voir la carte suivante moins cher.`; }
 } else {
 const betsIt = favorsHero===true && Math.random()<FAMILY_TUNING.flopBetProbAirWithRangeEdge;
 if(betsIt){ action = 'BET 33%'; frequency = 46; reason = `Air sans tirage, mais ce board avantage nettement votre range : un petit c-bet de bluff reste défendable, la plupart des mains adverses ratent ce flop.`; }
 else { action = 'CHECK'; frequency = 62; reason = `Air sans tirage sur un board qui ne favorise pas franchement votre range : pas de plan de bluff clair, on checke plutôt que de miser à l\u2019aveugle.`; }
 }
 const rangeClause = `${rangeAdv.label}${rangeAdv.notes.length?` (${rangeAdv.notes.join(', ')})`:''}.`;
 reason = `${reason} ${rangeClause}`;
 return { action, frequency, reason, sizing:sizingLabelFor(action), objective, rangeAdvantage:rangeAdv.favors, options:ensureBetOption(STANDARD_BET_OPTIONS, action) };
}

// --- 4) SYSTÈME DE CONTRAINTES (point 21) — rejette un spot construit qui serait incohérent plutôt que
// de le laisser passer silencieusement. Vérifications MÉCANIQUES uniquement (cartes en double, positions
// valides, IP/OOP calculable...) — jamais un jugement de "qualité" du spot, qui reste piloté par les
// fonctions de force de main/texture déjà utilisées partout ailleurs dans ce fichier.
function validateGeneratedSpot(spot, table){
 const errors = [];
 const order = table===6 ? SIX_MAX : NINE_MAX;
 if(!order.includes(spot.heroPosition)) errors.push('heroPosition hors table');
 if(spot.villainPosition!=='—' && !order.includes(spot.villainPosition)) errors.push('villainPosition hors table');
 if(spot.heroPosition===spot.villainPosition) errors.push('Hero et Villain sur la même position');
 const allCards = [...spot.hole, ...spot.runout];
 const keys = allCards.map(cardKey);
 if(new Set(keys).size!==keys.length) errors.push('carte en double (hole+runout)');
 if(spot.runout.length!==5) errors.push('runout incomplet');
 if(spot.hole.length!==2) errors.push('main de Hero incomplète');
 if(!(spot.pot>0)) errors.push('pot invalide');
 if(!(spot.effectiveStack>0)) errors.push('stack effectif invalide');
 try{
 const first = heroActsFirstPostflop(spot, table);
 if(typeof first!=='boolean') errors.push('heroActsFirstPostflop n\u2019a pas renvoyé un booléen');
 }catch(e){ errors.push('heroActsFirstPostflop a levé une erreur : '+e.message); }
 try{
 classifyPostflopHand(spot.hole, spot.runout.slice(0,3));
 classifyPostflopHand(spot.hole, spot.runout.slice(0,4));
 classifyPostflopHand(spot.hole, spot.runout.slice(0,5));
 }catch(e){ errors.push('classifyPostflopHand a levé une erreur : '+e.message); }
 if(!spot.post || !spot.post.FLOP || !spot.post.TURN || !spot.post.RIVER) errors.push('post FLOP/TURN/RIVER manquant');
 // AJOUTÉ (audit, point 10) — manquait : aucune vérification que le sizing de référence FLOP reste
 // jouable compte tenu du stack effectif. Un sizing en % de pot peut légitimement dépasser le stack sur
 // un tapis court (il sera alors plafonné au moment du jeu par cappedStreetContribution, code
 // pré-existant non modifié) — ce n'est donc pas rejeté, mais SIGNALÉ, pour distinguer un spot "sizing
 // nominal peu réaliste vu la profondeur" d'un spot réellement invalide.
 if(spot.post && spot.post.FLOP && spot.pot>0 && spot.effectiveStack>0){
 const pct = parseBetPercent(spot.post.FLOP.action);
 if(pct!=null){
 const implied = spot.pot * pct/100;
 if(implied > spot.effectiveStack * 1.5) errors.push('sizing FLOP très supérieur au stack effectif (sera plafonné en jeu, spot peu réaliste)');
 }
 }
 return { ok: errors.length===0, errors };
}

// --- 5) ANTI-RÉPÉTITION DES SPOTS GÉNÉRÉS (point 24-25) — signature MULTI-DIMENSIONS (position, texture,
// main de Hero, action flop), pas un simple identifiant : deux spots avec la même ligne mais un board/une
// main/un sizing différents restent considérés comme différents (point 25 explicitement).
const GENERATED_SIGNATURE_WINDOW = 12;
// Signature COURTE — utilisée pour le rejet précoce, avant d'avoir calculé TURN/RIVER/stack/profil
// (évite du travail inutile). Conservée telle quelle pour rester bon marché.
function generatedSpotSignature(sk, flopCategory, heroFlopClass, flopAction){
 return `${sk.heroPosition}_${sk.villainPosition}_${flopCategory}_${heroFlopClass.madeHand}_${String(flopAction).split(' ')[0]}`;
}
// AJOUTÉ (audit, point 13) — la signature courte ci-dessus ne couvrait que 4 des ~10 dimensions
// demandées (position, texture, main, action flop). Signature COMPLÈTE, calculée une fois TURN/RIVER,
// stack et profil connus (voir generatePostflopSpot) : mêmes dimensions + action turn, action river,
// palier de stack, profil adverse. La ligne complète jouée par l'adversaire n'y figure volontairement
// PAS (voir la note en tête de section GÉNÉRATEUR DYNAMIQUE : elle n'existe qu'au moment où la main est
// réellement jouée, jamais figée dans le spot) — cette signature utilise à la place les actions de
// RÉFÉRENCE de Hero (FLOP/TURN/RIVER), qui elles sont bien connues dès la génération.
function stackTierOf(effectiveStack){
 if(effectiveStack==null) return '?';
 if(effectiveStack<40) return 'SHORT';
 if(effectiveStack<80) return 'MID';
 if(effectiveStack<130) return 'DEEP';
 return 'VDEEP';
}
function generatedSpotFullSignature(sk, flopCategory, heroFlopClass, flopAction, turnAction, riverAction, effectiveStack, profileKey){
 return [
 sk.heroPosition, sk.villainPosition, flopCategory, heroFlopClass.madeHand,
 String(flopAction).split(' ')[0], String(turnAction).split(' ')[0], String(riverAction).split(' ')[0],
 stackTierOf(effectiveStack), profileKey||'?',
 ].join('_');
}
function recentGeneratedSignatureCount(sig){ return (state._recentSpotSignatures||[]).filter(s=>s===sig).length; }
function recordGeneratedSpotSignature(sig){
 if(!state._recentSpotSignatures) state._recentSpotSignatures=[];
 state._recentSpotSignatures.push(sig);
 if(state._recentSpotSignatures.length>GENERATED_SIGNATURE_WINDOW) state._recentSpotSignatures.shift();
}
const GENERATED_FULL_SIGNATURE_WINDOW = 20;
function recentGeneratedFullSignatureCount(sig){ return (state._recentSpotFullSignatures||[]).filter(s=>s===sig).length; }
function recordGeneratedSpotFullSignature(sig){
 if(!state._recentSpotFullSignatures) state._recentSpotFullSignatures=[];
 state._recentSpotFullSignatures.push(sig);
 if(state._recentSpotFullSignatures.length>GENERATED_FULL_SIGNATURE_WINDOW) state._recentSpotFullSignatures.shift();
}

// --- 6) ORCHESTRATEUR (point 3) — construit un spot complet, étape par étape, en réutilisant
// SYSTÉMATIQUEMENT les briques déjà existantes (chooseHole, applyVillainProfile, generateTableStacks,
// resolveEffectiveStack, resolveAnte, computeDynamicStreetPost) plutôt que d\u2019en réécrire des variantes.
// Rejette et retire (point 21) jusqu\u2019à maxAttempts fois avant d\u2019abandonner (l\u2019appelant retombe alors
// sur le pool statique, jamais d\u2019erreur visible pour l\u2019utilisateur).
function generatePostflopSpot(table, difficulty, villainProfileMode, maxAttempts){
 table = table===9 ? 9 : 6;
 const attempts = maxAttempts||8;
 for(let attempt=0; attempt<attempts; attempt++){
 const sk = synthesizePreflopSkeleton(table);
 const flopCategory = pickWeighted(FLOP_TEXTURE_WEIGHTS);
 const flop = generateFlopByTexture(flopCategory);
 const hole = chooseHole(sk.heroHandClass, flop);
 const turnCard = generateEvolvedCard(flop, [...flop,...hole], pickWeighted(EVOLUTION_WEIGHTS));
 const riverCard = generateEvolvedCard([...flop,turnCard], [...flop,turnCard,...hole], pickWeighted(EVOLUTION_WEIGHTS));
 const runout = [...flop, turnCard, riverCard];
 const heroFlopClass = classifyPostflopHand(hole, flop);
 const flopPost = computeDynamicFlopPost(hole, flop, sk.heroIsAggressor);
 const sig = generatedSpotSignature(sk, flopCategory, heroFlopClass, flopPost.action);
 if(recentGeneratedSignatureCount(sig)>=2 && attempt<attempts-1) continue; // trop répétitif récemment -> on retire plutôt que de forcer
 const effectiveStack = resolveEffectiveStack({effectiveStack:100}, state.stackMode);
 const ante = resolveAnte(state);
 let spot = {
 id:`gen-${Date.now()}-${Math.floor(Math.random()*1e6)}`, generated:true,
 heroPosition:sk.heroPosition, villainPosition:sk.villainPosition,
